# `_helpers` — the RESERVED, `_`-prefixed helpers-only seed package (D2 Slice 5, ITEM-7).
#
# It is NOT a domain processor: it contributes NO datatype, converter, or view. Its sole
# job is to be a home ON DISK for the shared compute assets the sandbox runner stages into
# every job's `/code` — so they resolve FROM THE EXTRACTED FOLDER (`<data_root>/processors/
# _helpers/…`) at run time, exactly like every other package, instead of being baked into
# the binary via `include_str!`. It ships:
#   * `align.py` / `colsummary.py` — the shared Python sibling helpers the runner stages
#     alongside EVERY Python entry (`sandbox/processors::PY_HELPER_FILES`).
#   * `compute/demo-analysis.py` — the synthetic input-free demo analysis (its stable
#     `code_ref` = `compute/demo-analysis.py`, resolved through `_helpers`).
#
# ## Why `_`-prefixed + how the loader/validator treat it
# The leading underscore marks it RESERVED: the folder-scan registry
# (`ExtensionRegistry::build_from_dir`) SKIPS any `_`-prefixed dir the same way it skips a
# `.`-prefixed staging dir — so `_helpers` contributes NO datatype/converter to the
# registry and never appears in `GET /api/extensions`. But it DOES carry a `manifest.yaml`,
# so (a) the embedded-seed extractor (`embedded::embedded_seed`) treats it as a seed package
# and EXTRACTS its files to disk, and (b) the S1 manifest lint validates it (a reserved
# package must still be well-formed). Net: skipped from contribution, files still
# extractable + resolvable. A separate-repo contributor must NOT use a `_`-prefixed id for
# a real (contributing) package.
id: _helpers
name: Shared compute helpers
publisher: txr
version: 0.3.4
apiVersion: "1.0"
contributes: {}
