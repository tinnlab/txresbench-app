# Pytest runner wiring for the TxResBench sandbox processor scripts.
#
# Run from THIS directory (…/sandbox/processors/scripts):
#     python3 -m pytest tests/ -q
# or, with this ini as the rootdir anchor, from anywhere:
#     python3 -m pytest -q <path-to-scripts>
#
# `just`-style note (no CI YAML by request): a `just test-processors` recipe would be
#     cd src-app/server/src/modules/sandbox/processors/scripts && python3 -m pytest tests/ -q
# The suites are pure-stdlib + pandas/numpy (no server, no DB), so they run standalone.
[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q
