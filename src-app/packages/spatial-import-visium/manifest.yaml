version: 0.25.1
apiVersion: "1.0"
contributes:
  analyses:
    - id: spatial.import-visium
      category: data-io
      title: Import Visium (Space Ranger)
      description: >-
        Read an uploaded 10x Visium Space Ranger `outs/` bundle and emit the expression
        matrix, the tissue map in full-resolution pixels, and the per-spot columns — so a
        spatial dataset becomes an ordinary, analysable dataset with a place on a slide.
      whenHint: >-
        the user uploaded a Space Ranger outs bundle (a filtered matrix, tissue positions,
        scale factors and a tissue image) and wants the tissue map and the counts imported
      examples:
        - import this Visium bundle
        - load the space ranger outs folder
        - bring in the tissue positions and the counts
      safety: read-run
      # WHICH ANALYSIS ENVIRONMENT these pins must be satisfiable in.
      #
      # Required since E3 landed a SECOND recipe (`single-cell-r`). The #80 build gate
      # resolves every declared dependency against every recipe on disk, so an undeclared
      # contribution would demand that numpy/pandas/scipy/h5py be installed in the
      # deliberately-narrower R env too. The gate's own doc-comment prescribes exactly this
      # fix: *"the right relaxation is for a contribution to DECLARE the env it targets, not
      # for this gate to guess"*.
      #
      # `single-cell` is the correct target and not merely the convenient one: DEC-2 still
      # declines `squidpy`, and every one of this importer's pins lives there — numpy
      # 2.4.6, scipy 1.17.1, pandas 2.3.3, h5py 3.16.0, and (since #155) tifffile 2026.3.3
      # and pillow 12.3.0.
      env: single-cell
      # ONE slot. The bundle is already ONE dataset by the time it reaches here —
      # `spatial/visium-bundle` declares `mtx-trio-target`, so the upload planner
      # auto-groups the four Space Ranger members into a single dataset (#152). Binding
      # the members individually here would re-open a grouping the container already did.
      appliesTo:
        - slot: bundle
          type_id: spatial/visium-bundle
          auto_bind_sole_candidate: true
      # `single-cell/counts`, not the abstract `single-cell/expression`: a Visium
      # `filtered_feature_bc_matrix.h5` holds INTEGER UMI COUNTS, which is what
      # `single-cell/counts` means and what `qc.10x` requires. It `extends:
      # single-cell/expression`, so every shipped `subtypes_of: single-cell/expression`
      # selector still resolves it — which is INV-7, and the whole basis of the
      # backwards-compatibility claim: nothing downstream needs to know it is spatial.
      produces:
        - single-cell/counts
        - spatial/coordinates
        # #155. One artifact per vendor image present, each placed into the SAME
        # coordinate space by its own INVERSE-scalefactor affine.
        - spatial/image
        - metadata-column
        - report/qc
        - report/html
      run:
        kind: sandbox
        runtime: python
        entry: compute/import_visium.py
        # `spatial_declarations.py` is VENDORED VERBATIM from `spatial-types` and staged
        # beside the entry. The platform confines `run.helpers` to a package's OWN tree,
        # so vendoring is the idiom (`embedding` vendors `cell-filter`'s predicate kernel
        # the same way), not an exception. `tests/test_vendored_contract.py` byte-compares
        # the copy against its source of truth — a vendored file that drifts is a second
        # implementation wearing the first one's name.
        helpers:
          - compute/spatial_declarations.py
          # The OME-TIFF writer (#155). This package's own, not vendored — it is domain
          # code nobody else has a copy of.
          - compute/ome_writer.py
          # The registration QC (#156). This package's own too, and staged for the same
          # reason: the entry imports it by bare name, and in `/code` a bare name resolves to
          # whatever `run.helpers` put beside the entry. An undeclared helper is an
          # ImportError inside a user's sandbox with no build-time signal at all.
          - compute/registration_qc.py
        dependencies:
          - { library: numpy, version: ">=2.0,<3" }
          - { library: pandas, version: ">=2.2,<3" }
          - { library: scipy, version: ">=1.14,<2" }
          - { library: h5py, version: ">=3.10,<4" }
          # #155's imaging pair. Ranges, not pins, because the HOST that runs
          # `just check-py` carries older builds than the rootfs (tifffile 2025.5.10 vs
          # 2026.3.3, pillow 12.2.0 vs 12.3.0) and BOTH must satisfy the declaration —
          # otherwise the gate that has to run this code cannot.
          #
          # `pillow` is here because `tifffile` CANNOT read a PNG (verified: it raises
          # `TiffFileError` on `tissue_hires_image.png`) and the vendor ships one.
          # `env-rootfs/single-cell/requirements.txt` predicted this exact declaration.
          #
          # `imagecodecs` is deliberately NOT declared: it is the LZW backend, and DEC-2
          # writes `deflate`, which tifffile serves from stdlib `zlib`. Declaring a
          # library no code path imports is the unconsumed-pin shape that file refuses.
          - { library: tifffile, version: ">=2024.1.1" }
          - { library: pillow, version: ">=10,<14" }
      schedule:
        class: normal
      arch: [x86_64, aarch64]
      methodsText: >-
        Imported the 10x Visium Space Ranger outputs: the filtered feature-barcode matrix
        was re-emitted as a cells x genes count matrix, and per-spot tissue positions were
        recorded as coordinates in the full-resolution pixel frame of the capture area,
        with the vendor's scale factors preserved as the physical scale of that frame.
