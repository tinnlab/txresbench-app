# 0.17.0 — #474/#478/#505/#506/#517: the `/matrix` content validation tightens on five
#          fronts. THE ALL-ZERO DECISION (#474): a matrix whose `nnz > 0` but whose every
#          `/matrix/data` value is exactly 0 is now REFUSED before the first writer. The
#          #445 empty-matrix reasoning extends verbatim, because it is agnostic to WHY the
#          matrix has no usable counts: `nnz == 0` and "every stored value is 0" are both
#          "downstream analysis runs on nothing usable", and an all-zero matrix is reported
#          as SUCCESS at exit 0 with no outcome REPORTED TO THE OPERATOR as anything other
