# 0.14.0 — #349: the `/matrix` counts arrays — `data`, `indices`, `indptr` — are validated
#          BEFORE the first writer, by `refuse_malformed_counts` in `compute/import_visium.py`.
#          Previously their content and shape were first touched INSIDE
#          `cyto_csc.write_csc_zarr`, i.e. after artifact bytes already existed on disk. The
#          consequence that made this P1: a bundle with `/matrix/indices` truncated below what
#          `indptr[-1]` declares imported at exit 0, wrote a manifest, and produced a store
#          holding 100 of 17,677 stored values with every count attributed to feature 0 — the
#          operator was told the import SUCCEEDED. That is now a named refusal, and it is ONE
#          of THREE silent-corruption classes this release closes. A VIRTUAL `/matrix` dataset
#          whose source file is missing imported the same way: h5py returns the fill value (0)
#          for every element with no error, so it reached exit 0 with every count attributed
#          to feature 0. And an `indptr[-1]` that UNDER-DECLARES while `data` and `indices`
#          agree with each other landed the store silently SHORT at exit 0, because `nnz` is
#          read from `indptr[-1]`. Eleven further
#          malformations — `data` or `indices` as a group, as a scalar, 2-D, or
#          length-mismatched; `indptr` decreasing, not starting at zero, of the wrong length,
#          or declaring a total that `indices` does not carry; `indices` values at or beyond
#          the declared feature count — previously escaped as raw Python tracebacks at exit 1,
#          seven of them leaving a five-path partial `expression.zarr` behind. All are now
#          refusals, restoring this package's INV-1 (refused by name, never a traceback and
#          never an exit-1) and INV-2 (the refusal fires before any artifact byte is written,
#          so nothing is left on disk). The `indices` range check is blockwise, so it stays
#          out-of-core — at the cost of a FULL EXTRA STREAMING PASS over `indices`, on top of
#          the counting pass and the write pass; in a package whose design story is staying
#          bounded by a block rather than by the matrix, an added pass is a fact an integrator
#          is entitled to. A `/matrix` member held in a VIRTUAL dataset or in HDF5 EXTERNAL
#          raw storage is now refused outright, because its values come from files outside the
#          bundle and an unresolvable source is FILLED rather than raised. This is the one
#          change most likely to affect a re-exported or repacked bundle: Space Ranger itself
#          never writes these, but a bundle round-tripped through another tool might, and it
#          will now refuse rather than import something unverifiable. A member that is present
#          but UNREADABLE — e.g. an `ExternalLink` to a file that does not exist — is refused
#          too, where it previously escaped as a raw `KeyError`. And `/matrix/data` with a
#          NON-NUMERIC dtype (a string, compound or vlen dtype) is refused: the allowed dtype
#          kinds are `i`, `u`, `f`, `b`, matching the `spatial-import-visium-hd` sibling
#          exactly. A compound dtype additionally used to put over 61,000 bytes of raw
#          non-ASCII on stderr through the traceback; the refusal is now bounded and ASCII.
#          A LEGITIMATE bundle is unaffected: the committed vendor fixture still imports at
#          exit 0.
# 0.15.0 — #345/#451/#445: the `/matrix`, `/matrix/shape` and `/matrix/features` reads that
#          surrounded #349's counts validation are now refusals by name. Nine failures
#          reachable from a hostile `.h5` escaped `main()`'s `except VisiumImportError` and
#          reached the operator as exit 1 and a raw Python traceback with absolute source
#          paths — deleting `/matrix/shape`; a one-element, byte-string, 2-D or scalar
#          `/matrix/shape`; deleting `/matrix/features`; a `/matrix` that is a Dataset rather
#          than a group; and a matrix file that is not HDF5 at all. Each is now a named
#          refusal at exit 2 with nothing left on disk, restoring INV-1 and INV-2 for the
#          whole seam.
#          THE `H5Lexists` HOLE, BY NAME. `/matrix` and `/matrix/shape` were read unguarded:
#          the presence test `"matrix" not in h5` is `H5Lexists`, which returns True for a
#          dangling SoftLink or ExternalLink — the link exists, its target does not — so the
#          presence refusal was skipped and `h5["matrix"]` raised a bare `KeyError`. A link
#          whose target is missing is now refused by name, like any other absent member.
#          THE EMPTY-MATRIX DECISION. An empty but internally consistent `/matrix` (`data`
#          and `indices` of length zero, `indptr` all zeros, `shape` unchanged) used to
#          import at exit 0, write a manifest and 117 paths, and produce an `expression.zarr`
#          with `nnz=0` — the operator was told the import SUCCEEDED and downstream analysis
#          ran on an empty matrix. It now REFUSES, before the first writer, together with the
#          zero-barcode case, rather than importing-and-disclosing: an import of an empty
#          matrix is reported as SUCCESS at exit 0, and there is no outcome REPORTED TO THE
#          OPERATOR as anything other than SUCCESS (the report's `image_warnings` and
#          `images_not_emitted` lists, the `registration_qc` block, the `scale_note` field
#          and every output entry's `meta` are PASSIVE channels that change nothing about the
#          exit code or stderr) — so for the `nnz == 0` shape the streamed progress and
#          the report do not distinguish it from a real one (the manifest's expression
#          entry differs in its machine-readable structure record (the stored-value
#          count, the shapes and the byte counts), which no note field restates), and
#          the operator is told SUCCESS and downstream analysis runs on nothing (the
#          zero-barcodes shape is the other case:
#          its stream and report show the zeros — measured and stated in 0.20.0). That
#          reason alone carries both refusals; it does not
#          depend on any claim about vendor internals. — the reason sentence is corrected
#          in 0.20.0 (#503/#489) rather than removed; its exact wording now lives in the
#          module constant `REASON_NO_USABLE_COUNTS`, which every copy states, and the
#          per-shape visibility differences are stated in the 0.20.0 entry.
#          THE `features/name` LENGTH, CROSS-CHECKED. `/matrix/features/name`'s length was
#          never cross-checked against the declared shape; it is consumed much later, at the
#          gene-symbol write, and `_lib` then raised a bare `ValueError` AFTER the first
#          writer — MEASURED: exit 1, a raw traceback, 39 paths left on disk. It is now a
#          named refusal before the first writer, with nothing left on disk.
#          THE `barcodes` MEMBER, GUARDED. `/matrix/barcodes` had no dangling-link,
#          wrong-kind or VIRTUAL/EXTERNAL guard; a VIRTUAL `/matrix/barcodes` was silently
#          accepted and yielded fill-value bytes — MEASURED: exit 2 for an unrelated
#          positions reason, 51 paths on disk. It now gets the same four-state treatment as
#          the features members, before the first writer.
#          THE UNDECODABLE CHUNK, NAMED. `decoded_h5_strings` did not catch `OSError`, so a
#          dataset whose metadata is fine but whose bytes are undecodable (an unavailable
#          filter, a truncated chunk, a checksum failure) escaped as a raw traceback. It is
#          now a named refusal, like the other unreadable-member cases.
#          A LEGITIMATE bundle is unaffected: the committed vendor fixture still imports at
#          exit 0.
#          THE FEATURES MEMBERS' VIRTUAL/EXTERNAL ARMS, DISCLOSED. `/matrix/features/id`
#          and `/matrix/features/name` also gained the VIRTUAL / EXTERNAL-raw-storage
#          refusal when the four-state check was hoisted into the shared helper — a
#          widening that is strictly more protective and is now pinned by tests.
# 0.16.0 — #462: an `h5py.ExternalLink` anywhere under `/matrix` — including `/matrix`
#          itself — is now refused BY NAME, closing the hole where a bare `group[member]`
