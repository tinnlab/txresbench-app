#          `h5py.check_string_dtype`, not a numpy-kind test: kind `O` is ALSO how h5py
#          spells every variable-length type, so a vlen-INT (`h5py.vlen_dtype(np.int32)`)
#          used to pass the `"SO"` kind check and be stringified as "[0 1]", "[1 2]", ...
