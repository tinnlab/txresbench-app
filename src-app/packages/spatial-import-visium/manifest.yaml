#          are PASSIVE channels that change nothing about the exit code or stderr) — so
#          in the streamed progress and the report the operator-visible signal does not
#          distinguish an all-zero matrix from a real one (measured in 0.20.0: the
#          streamed progress lines are byte-identical to a real import and nothing in
#          the report states the matrix's stored values or their count); the
#          machine-readable difference is the expression entry's byte count — measured
#          in 0.22.0 with the refusal set aside (a real all-zero/mixed run refuses
#          before the first writer; the probe stubs only `refuse_malformed_counts`)
#          against the full committed fixture, `data.stored_bytes` is
#          19,504 B for the real fixture vs 339 B for the all-zero variant and 362 B
#          for the mixed zero/NaN variant, while the stored-value count (`nnz`) and
#          the shape are unchanged for both variants and `data`'s dtype is float32 in
