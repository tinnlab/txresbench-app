#          cells axis ambiguous, and the digest self-check could not see it. THE
#          FULL-DECODABILITY SCAN (#505): the one-element `data[0:1]` probe is widened
#          into a full blockwise, out-of-core scan of the ENTIRE `/matrix/data` dataset,
#          so a corrupt chunk BEYOND element 0 (a truncated chunk, a fletcher32 checksum
