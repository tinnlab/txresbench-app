# 0.13.0 — #327: `coordinate_space` stops being a value two unrelated runs can share, and the
#          bundle-directory rung is GONE. Read this before re-importing.
#          WHAT CHANGED. A bundle whose matrix declares an identifying `library_ids` is UNTOUCHED
#          (`visium:<library_id>`, verbatim — all three committed real bundles are on that rung, and
#          a single stated identity cannot be framed non-injectively, so there was nothing to
#          escape). Everything else moves: the `library_id` rung now reads through the same
#          `vendor_statement` / `non_identifying_vendor_label` predicates
#          `spatial-import-xenium` has shipped since #320 — and "identifying" now means ONE TEXT
#          value: a NUMERIC `library_ids` (`[0]`, legal in the array shape every real bundle uses)
#          and a MULTI-VALUED one (`[b"LibA", b"LibB"]`, which `spaceranger aggr` writes) are BOTH
#          non-answers, because the identity predicates are blind to a number and because joining
#          several values with `", "` is not injective — `[b"LibA", b"LibB"]` and `[b"LibA, LibB"]`
#          are two different statements. `vendor_provenance` still records the raw decoded value
#          for both; only the IDENTITY path refuses them. The fallback is no longer
#          `Path(bundle_root).name` but `visium:unverified-space:<digest>` over the run's own
#          measurement — the matrix's barcodes and the positions joined to them — with
#          `coordinate_space_source` reading `unverified-space-non-identifying-labels` (the vendor
#          wrote something you can replace) or `unverified-space-no-vendor-statement` (it wrote
#          nothing). `section.sample_id` follows the same ladder and falls back to
#          `unverified-sample:<space_id>` instead of a raw library id or a bare frame id. This
#          package also RESERVES the sibling's `slide_id+region_name:` token even though it never
#          emits one: reserving is a different question from emitting, and without it a
#          `library_ids` opening with that token was emitted verbatim as a stated frame inside a
#          namespace the scheme writes itself.
#          WHY. MEASURED on 4b63a482, and every row is two unrelated experiments declared to share
#          one coordinate frame: `library_ids: "unknown"` -> BOTH `visium:unknown`;
#          `library_ids: "0000000_0000000"` -> BOTH `visium:0000000_0000000`; no `library_ids`, two
#          uploads that both kept Space Ranger's own `outs/` directory name -> BOTH `visium:outs`;
#          no `library_ids`, artifact-backed -> BOTH `visium:bundle`, for every Visium import in the
#          deployment, because that basename is the SANDBOX MOUNT NAME derived from the SLOT.
#          `resolveOverlayBinding` compares the frame VALUE by equality, so none of them errored —
#          each was one tissue's image registered against another's spots, with no warning and a
#          picture that looked right.
#          WHAT IT COSTS an integrator: a dataset imported through the old fallback will NOT bind to
#          its own re-import. That is the direction this module chose by name — a MISSED collision
#          is visible and recoverable, a FALSE one is silent wrong data — and the recovery is to
#          re-export with a real `library_ids`. `docs/design/xenium-declaration-residues.md` §3/§4.
