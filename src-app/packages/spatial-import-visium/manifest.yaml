#          not dtype (re-scoped and amended in place in 0.22.0, #615/#624/#625).
#          — the reason sentence is corrected in 0.20.0 (#503/#489) rather than removed.
#          The boundary is the only one that is not a guess: SOME stored zeros among
#          non-zeros is unremarkable (sparse formats permit explicit zeros) and still
#          imports; EVERY stored value zero is the same "nothing usable" as `nnz == 0`
#          and refuses. THE DUPLICATE-BARCODE REFUSAL (#478): a `/matrix/barcodes` that
