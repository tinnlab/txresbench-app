# spatial-import-visium — the Visium bundle importer (#154, epic #151).
#
# The first thing in this arm a USER can see. #152 declared the spatial kinds and the
# write-time contract; nothing produced one. This package produces the first ones.
#
# ── WHY THIS IS PURE DATA ────────────────────────────────────────────────────────────
#
# There is no package registry to edit. `extensions/embedded.rs` bakes the whole
# `src-app/packages` tree in with one `include_dir!`, extracts it to `<data_root>/
# processors/` on boot, and the loader SCANS the extracted folder. A directory that
# exists is a package that is registered. So this file plus `compute/` is the whole of
# the contribution, and the diff guard in `tests/test_zero_src_app_diff.py` is what holds
# that shut.
#
# ── WHAT IS DELIBERATELY NOT HERE ────────────────────────────────────────────────────
#
# * NO `trigger: on-ingest` (DEC-1). `import-h5ad` is on-ingest and this is modelled on
#   it in every other respect, so the divergence is stated rather than left to be noticed:
#   an import that silently REINTERPRETS an upload is not recoverable by undo, and a
#   Visium bundle is exactly the case where the reinterpretation is consequential — it
#   mints a coordinate space every later image and every later section places itself into.
#   A user confirms it by launching it.
# * The `spatial/image` half is NOW HERE (#155), which retires #154's DEC-10. Each vendor
#   image present in the bundle becomes its own `spatial/image` — a lossless, pyramidal
#   OME-TIFF — placed into the SAME coordinate space by the INVERSE of its own
#   scalefactor. `tifffile` and `pillow` are therefore declared below, and `pillow` gained
#   a pin in `env-rootfs/single-cell/requirements.txt` (which had predicted exactly that);
#   both libraries were ALREADY in the shipped image, so no rootfs republish is implied.
# * The DOWNSAMPLING is NOW HERE (#176), which retires #155's refusal. A `spatial/image` is
#   a DISPLAY DERIVATIVE: a source finer than the declared 0.5 um/pixel cap is downsampled
#   to meet it by an integer-factor BOX MEAN (every emitted pixel the real average of a real
#   block), the affine and the OME PhysicalSize both absorb the factor, and the recorded
#   `applied_resolution_um` is the ACHIEVED resolution rather than the cap. The
#   full-resolution ORIGINAL is not re-emitted — it stays in the retained
#   `spatial/visium-bundle` upload, and `spatial_declarations.require_original_reference` is
#   the consumer-side reach to it. Every standard Visium image is ~7x COARSER than the cap
#   and so still passes through untouched; the downsample path exists for Xenium (#162),
#   whose morphology image design §8.3 says must not be range-read at full size.
#   The writer itself MOVED in #162: `compute/ome_writer.py` is now a byte-identical
#   VENDORED COPY of `spatial-types/compute/ome_writer.py`, because a second importer needs
#   the identical code and a leaf importer should not be the source of truth for a sibling.
#   The one behavioural change is that `_reconcile_scale` resolves the space's scale through
#   `SD.require_micron_scale` instead of reading `microns_per_pixel` directly — identical
#   for every pixel space, and the only way a MICROMETRE space (Xenium) can carry
#   display-derivative provenance at all.
#   The registration overlay it used to defer is now #156's, below.
# * The REGISTRATION QC is NOW HERE (#156) — which retires the "Still NOT here: the
#   registration overlay" line this paragraph carried until now. It is the only check in this
#   package with a referent OUTSIDE the artifact. `compute/registration_qc.py` measures two
#   things:
#     - the SCALE, against the Visium slide's manufactured 100 um centre-to-centre spot
#       pitch, applied to the spot lattice measured off `tissue_positions.csv` — a file that
#       never touches `scalefactors_json.json`. This is the only thing that can see a wrong
#       `spot_diameter_fullres`, which `tests/test_image_downsample.py`'s TEST-11 asserts
#       passes every other check this system has;
#     - the REGISTRATION, per emitted image: the spots placed through the image's DECLARED
#       `to_space` — read back from the artifact's own OME-XML — and scored against the tissue
#       visible in that image's own pixels, with the vendor's `in_tissue` call as the
#       independent label. This is the check `tests/test_sandbox_reachability.py`'s TEST-9
#       says nothing else here has.
#   Plus a rendered OVERLAY per image, embedded in the report HTML above the facts table, with
#   spots drawn at their DECLARED physical diameter. It is a report output, never an artifact
#   (design §7.2), so this contribution's `produces` and its output COUNT are unchanged — and
#   NOTHING IN THIS APP RENDERS `report/html` (#223), so the verdict also rides in the report
#   artifacts' `meta`, which is the one channel a human actually sees.
#   What it does NOT do: refuse the import. A failing verdict is recorded loudly and every
#   artifact is still emitted, which is the posture a damaged image already gets.
# * NO `squidpy` dependency (DEC-2). Its `read.visium()` is the SEMANTIC reference — the
#   member names, the headerless-vs-headered `tissue_positions` split, the column names —
#   and the compute follows it, but importing it would put the reader behind a library
#   that is in the rootfs and NOT on the `just check-py` host, i.e. behind the one gate
#   that has to run this code. It would also return an `AnnData` we would immediately
#   decompose, forcing a full in-memory materialisation that `cyto_csc`'s streaming
#   transpose exists to avoid.
#
# ── EVERY DECLARED DEPENDENCY IS ALREADY PINNED ──────────────────────────────────────
#
# `server/build_helper/processor_manifest.rs` resolves each `run.dependencies[]` against
# `env-rootfs/single-cell/requirements.txt` AT BUILD TIME, so a library that is absent
# there — or a range the pin falls outside — fails `cargo check` rather than a user's
# sandbox job. Measured against the pins on this branch: numpy 2.4.6, scipy 1.17.1,
# pandas 2.3.3, h5py 3.16.0, tifffile 2026.3.3, pillow 12.3.0.
id: spatial-import-visium
name: Import Visium (Space Ranger)
publisher: cyto
# Bump on ANY file change in this package — the seed reconciliation keys on it.
# A VERSION COLLISION, resolved UPWARD rather than by taking a side — twice now, against two
# different mainline bumps (#214's 0.3.1 and #162's 0.3.2). This branch bumped 0.3.0 -> 0.4.0
# for #156's new compute helper. All three changes are IN this tree, so the version must be a
# bump relative to EVERY parent, which 0.4.0 is. Taking main's number would leave a version
# that does not move against this branch's own base, and the seed reconciliation keys on
# `version` — so a stale one keeps executing the pre-#156 kernel while the files have changed.
#  0.5.0 — #211: the spatial declarations are MIRRORED into the coordinates store's own
#          `attributes.cyto` (`structure['cyto_spatial']`), so a SANDBOXED consumer can
#          read the coordinate space, the micron scale (and its provenance), the
#          measured entity, the positioning and the section. `meta` never crossed into
#          the sandbox; the store's own bytes do. Reader side: `require_spatial_declarations`,
#          which REFUSES rather than defaulting. `coordinate_space()` gains optional
#          `microns_per_pixel_source` / `coordinate_space_source` so a scale's provenance
#          travels with the scale (#222). The coordinates entry's `meta` key set is
#          UNCHANGED; a `spatial/image` entry gains `microns_per_pixel_source` in
#          both its `meta` and its OME payload, because a scale without the record
#          of which leg produced it is a number no consumer can audit. Additive and
#          safe for an old decoder, but not "unchanged" — an integrator trusts a
#          changelog line instead of re-reading the diff.
#  0.6.0 — #222: THE MICRON SCALE MOVED. `microns_per_pixel` was derived as
#          `55.0 / spot_diameter_fullres` and is now `65.0 / spot_diameter_fullres`, so
#          every micron-denominated result from this importer changes by +18.2% (the old
#          number was 15.6% LOW). `spot_diameter_fullres` is the circle Space Ranger writes
#          for RENDERING, which is larger than the 55 um capture spot; dividing by the
#          capture spot measured the wrong circle. The one constant that spelled both is
#          split into `VISIUM_CAPTURE_SPOT_DIAMETER_UM` (55.0) and
#          `VISIUM_RENDERED_SPOT_DIAMETER_UM` (65.0).
#          `measured_entity.resolution_um` is UNCHANGED at 55.0 — the capture footprint is
#          the area transcripts came from, and that is a different question from the scale.
#          No meta key is added or removed; no artifact already produced is re-imported,
#          backfilled or flagged (fix-forward-only, #222's owner ruling), so two datasets
#          imported either side of this version disagree by that amount BY DESIGN.
#          TWO REPORT-VISIBLE CONSEQUENCES an integrator should not have to derive:
#          (a) `registration_qc`'s SCALE VERDICT on a standard Visium bundle flips
#              `fail` -> `pass` (relative error against the slide's 100 um spot pitch goes
#              15.573% -> 0.223% on the committed vendor bundle). The check was firing
#              correctly; this is the defect it was firing about.
#          (b) the registration OVERLAY draws a spot at 55 um / the NEW scale, so the drawn
#              circle shrinks (14.716 -> 12.458 px on that bundle) and no longer coincides
#              with the vendor's `spot_diameter_fullres`. That coincidence was the bug: the
#              overlay draws the 55 um CAPTURE footprint, which is a smaller circle than the
#              65 um one the vendor's field spans.
#          The exact figures: the constant change is worth 1 - 55/65 = 15.4% on every bundle;
#          15.6% (15.573%) is the committed bundle's error against the slide referent, which
#          differs because that bundle's own files imply a 65.145 um circle, not exactly 65.
#  0.7.0 — #227: the vendored `compute/ome_writer.py` becomes the byte-identical copy of the
#          promoted file, which now writes TILED OME-TIFFs (`tile=(512, 512)`) at every
#          pyramid level instead of full-image-width strips. This package's own compute,
#          manifest surface and tests are UNCHANGED; what changes is the bytes every
#          `spatial/image` it emits are packed into. Pixels, extents, OME-XML and the
#          display-derivative provenance are identical — the layout tags are not.
#  0.6.1 — #273: TESTS ONLY; no compute file, no emitted number and no declaration moved,
#          which is why this is a PATCH and not a minor — `check-processor-seed-versions.sh`
#          states the convention as "patch for a fix, minor for behavior".
#          `tests/test_producer_end_to_end.py` pinned this very field by EQUALITY to 0.6.0,
#          which contradicted that same gate: it REQUIRES a bump the moment any file here
#          changes (tests included — it diffs the whole package dir), and the pin REQUIRED
#          the field to stay 0.6.0, so the package could not be touched at all. The pin is
#          now the relation it always meant — the version is at or above the 0.6.0 that
#          #222's corrected micron scale shipped at — and this bump is what the gate compels
#          for the test edit that made it. An integrator should expect NOTHING to differ in
#          the output; the version moves because the package's bytes did, which is the whole
#          contract the seed reconciliation keys on.
#  0.9.1 — #243: TESTS AND FIXTURES ONLY, plus two corrected docstrings in
#          `compute/registration_qc.py`. The committed `tissue_hires_image.png` becomes 10x's
#          own 2000x2000 emission instead of a 200x200 downscale of it, so the bundle's own
#          spots finally land on its own image. No compute BEHAVIOUR changes and no emitted
#          number moves — but `check-processor-seed-versions.sh` diffs the whole package
#          directory, so the bytes moving is what compels this. PATCH, per the same
#          "patch for a fix, minor for behavior" convention recorded above; 0.9.0 arrived on
#          main while this branch was out (#292's dtype refusal), and this is a bump relative to it.
#
# 0.9.2 — #296/#297/#298: the three image-failure escapes #292's sweep found. `read_plane`'s
#          `_PROGRAMMING_ERRORS` deny-list is gone (it re-raised six types this module had
#          already measured arriving from DATA, aborting the whole import over one damaged
#          vendor file); `write_ome_tiff` converts its allocation and encode failures the way
#          `read_image` and `downsample` already did; and the four smaller escapes — an
#          unwrapped `tifffile` re-open, deferred imports outside their `try`,
#          `_reconcile_scale`'s unvalidated types, the visium handler's own `KeyError` — are
#          closed. PATCH, not minor: no input that emitted before emits anything different
#          (pinned byte-for-byte against `origin/main`'s own writer); what changed is which
#          failures cost ONE image instead of the matrix, the coordinates, the columns and
#          the report. The version moves at all because `check-processor-seed-versions.sh`
#          is base-relative over the whole package DIRECTORY, and because the vendored
#          `compute/ome_writer.py` changed in ALL THREE packages — bumping only the one that
#          "owns" the change is the exact miss that
#          `test_a_vendoring_package_whose_files_changed_also_moved_its_manifest_version` closes.
#
# 0.10.0 — #257: the micron scale's numerator is per SLIDE DESIGN, not one number for all of
#          Visium. 10x documents `spot_diameter_fullres` as varying "for different slide
#          designs, ranging from 60-70 um", and 24 real vendor bundles measure three designs:
#          65 um (6.5 mm, fiducial/spot 21/13), 70 um (6.5 mm CytAssist V4 — and pre-1.1
#          Space Ranger direct placement, 3/2) and 60 um (11 mm CytAssist V5, 7/4). The
#          design is read from the bundle's own fiducial/spot ratio, in which the pixel scale
#          cancels; the ASSAY is detected separately, from `regist_target_img_scalef`, and
#          NAMED in the report, because a CytAssist bundle used to import with nothing
#          anywhere saying it was one. `cytassist_image.tiff` is now explicitly reported as
#          not-emitted with the reason, instead of silently absent.
#
#          MINOR, not patch: a CytAssist or DLPFC-era bundle imported by 0.9.2 got a
#          `microns_per_pixel` that is 7-8% wrong, and 0.10.0 gives it a different number.
#          The committed `Visium_Mouse_Olfactory_Bulb` bundle is UNCHANGED — its ratio matches
#          the 65 um design, so the numerator resolved is the identical float 65.0 — but
#          "behaviour changed for some inputs" is a minor by this file's own convention, and
#          understating it as a patch would hide exactly the class of change a reader of this
#          log is looking for. Existing artifacts are left as-is, not re-imported and not
#          flagged, per #222's own ruling for the same situation.
#          See `docs/design/visium-slide-design-scale.md`.
# 0.11.0 — #330: the two parse boundaries where a vendor string this importer CANNOT WRITE was
#          accepted. `filtered_feature_bc_matrix.h5`'s ROOT ATTRIBUTES and
#          `scalefactors_json.json` are now walked by ONE predicate before the first artifact
#          byte is written, and a document carrying such a string is refused BY NAME
#          (`VisiumImportError` -> `main()` -> stderr + exit 2) instead of aborting a writer.
#          See `docs/design/vendor-text-encodability-refusal.md` §6. This is #329's rule, ported
#          from `spatial-import-xenium`, at this package's own boundaries.
#
#          MINOR, not patch: by this log's own convention (see 0.10.0) "behaviour changed for
#          some inputs" is a minor, and two classes of bundle that PRODUCED A SUCCESSFUL JOB
#          before now refuse. Understating it as a patch would hide exactly the class of change
#          a reader of this log is looking for.
#
#          AN INTEGRATOR SHOULD EXPECT:
#          * A bundle whose h5 root attribute (`software_version`, `chemistry_description`,
#            `library_ids`) holds bytes that are not valid UTF-8 no longer imports. In the
#            `utf-8` string dtype it used to die with an UNCAUGHT `UnicodeEncodeError`, exit 1
#            and a traceback, with 59-117 paths already under `/outputs` and NO `manifest.json`;
#            in the fixed-length `|S` dtype — the shape the real bundles use for `library_ids` —
#            it used to COMPLETE and ship a SANITISED identifier. MEASURED: `b"\xff\xfeSR"`,
#            `b"\xfe\xffSR"` and `b"\x80\x81SR"` all emitted the SAME
#            `provenance.library_id` and the SAME `coordinate_space` — three slides that are not
#            the same slide collapsing into one frame. It is refused, never repaired.
#          * A bundle whose `scalefactors_json.json` carries a lone-surrogate escape no longer
#            imports. `json.loads` accepts `"\ud800"` out of a PURE-ASCII file, and the whole
#            scale document is echoed into `visium-import-report.json`, which `serde_json` — the
#            crate the server parses it with — then refuses. Both doors are guarded; a fix at
#            one of them would not have been a fix.
#          * `read_scalefactors` KEEPS its degrade-to-`{}` contract for an UNPARSEABLE scale
#            file: such a bundle still imports and simply declares no micron scale. Only a file
#            that parses cleanly and carries unwritable text is refused. (An ABSENT scale file
#            is a different case and always was: `locate_members` refuses the bundle before this
#            function is reached. An earlier draft of this line said "ABSENT or UNPARSEABLE",
#            which was wrong about the absent half on 0.10.0 too.)
#          * A BUNDLE THAT IMPORTED BEFORE CAN NOW BE REFUSED, and not only the two hostile
#            classes above. The guard walks ALL of `dict(h5.attrs)`, but only three attributes
#            are ever read, so an h5 carrying an unreadable-by-us ROOT ATTRIBUTE — a checksum,
#            an opaque vendor blob, perfectly legal HDF5 — is refused for a value that could
#            never have reached an artifact. MEASURED on the committed fixture with
#            `vendor_blob = np.array([b"\x89PNG\xff\xfe"], dtype="|S10")`: exit 2, 0 paths. That
#            is the disclosed cost of guarding at the boundary instead of at each consumer —
#            which attributes are read onto an artifact is a property of THIS revision of the
#            module, and a rule scoped to today's readers silently stops covering one the day
#            someone reads one more (the #320 defect this importer has shipped once already).
#            What is NOT walked is stated as a DENY-list (bool, int, uint, float, complex,
#            datetime64, timedelta64) rather than as an allow-list, so an unknown dtype is
#            walked; and a text-dtype array past a 1 MiB cap is refused by name rather than
#            walked, because materialising it is a denial of service (the largest root attribute
#            on any committed real bundle is 27 bytes).
#          * A `/matrix/barcodes`, `/matrix/features/id` or `/matrix/features/name` entry that is
#            not valid UTF-8 now fails with a NAMED refusal saying which dataset and which ROW.
#            Before it was an uncaught `UnicodeDecodeError` traceback and exit 1. The decode
#            stays STRICT — those values are join keys and a loose decode would pair one spot's
#            position with another spot's counts — so no bundle that imports today stops
#            importing; only the failure MESSAGE changes, from a traceback to an instruction.
#          * A `scalefactors_json.json` too deeply nested for `json.loads` (>= 992 levels) now
#            degrades to "no scale declared" like any other unparseable scale file, instead of
#            escaping as a raw `RecursionError` traceback. `RecursionError` subclasses
#            `RuntimeError`, not `ValueError`, so it walked past the existing narrowing.
#          * WHAT DOES NOT MOVE: every bundle whose vendor text this importer can actually write
#            still imports, with byte-identical artifacts. All three committed real bundles are
#            pinned by the suite. Legitimate non-ASCII vendor text — including ASTRAL characters
#            — still imports and round-trips; the predicate tests the ENCODE, not a codepoint
#            range.
#          * A LOCALE FIX with no hostile input involved. The three text writes now name
#            `encoding="utf-8"` instead of taking the locale default. MEASURED on the ORDINARY
#            committed fixture under `LC_ALL=C`: `visium-import-summary.html` raised
#            `UnicodeEncodeError` on this module's OWN em dash, so EVERY import on a non-UTF-8
#            machine died with a traceback and exit 1 after 117 paths were on disk. Only that
#            write was load-bearing (the other two are `json.dumps` at `ensure_ascii=True` and
#            were pure ASCII by construction); all three are named for consistency.
#          * AND THE SAME FIX ON THE WAY IN, which is the half that changes RESULTS rather than
#            just failure messages. `tissue_positions.csv`, `scalefactors_json.json` and
#            `metrics_summary.csv` were all read at the LOCALE default. MEASURED on ORDINARY
#            bundles carrying LEGITIMATE UTF-8: under `LC_ALL=C` the scale file was swallowed
#            into "no scale declared" (`microns_per_pixel: null`, plus a `scale_note` making a
#            FALSE statement about the vendor's file), the metrics file's `Sample ID` was lost
#            so `spatial/coordinates.zarr` was stamped with a DIFFERENT `section.sample_id` than
#            the same bundle got under a UTF-8 locale, and the positions file died with an
#            uncaught traceback and 51 paths on disk. All three now name `encoding="utf-8"`, and
#            a positions table that is not valid UTF-8 gets a named refusal instead of a
#            traceback. `read_json` in the shared compute runtime block is deliberately NOT
#            touched: that block is byte-identical across every builtin's compute, so changing it
#            is a cross-package change. It is NOT harmless, and the measurement is on the record
#            rather than glossed: `inputs.json`'s `sandbox_path` carries a user-chosen mount name
#            that the server does not ASCII-escape, so under `LC_ALL=C` a COMPLETE ordinary
#            bundle whose directory name has one non-ASCII byte is refused with "the bundle has
#            no filtered feature-barcode matrix" -- a false statement about a complete bundle.
#            See `docs/design/vendor-text-encodability-refusal.md` §6.8 item 9.
#          * A `/matrix` member that is ABSENT, a rank-0 scalar, an `h5py.Empty` null dataspace
#            or a GROUP where a dataset belongs is now a named refusal instead of a raw
#            `KeyError`/`ValueError`/`TypeError` traceback.
#          * A COMPOUND or OPAQUE (`V`-dtype) root attribute is walked like any other. It is
#            called out because the first draft of this release skipped it: `V` is not only the
#            HDF5 opaque dtype, it is the STRUCTURED dtype whose fields can be text, and
#            `vendor_provenance` really does turn those into text. MEASURED, a `library_ids`
#            written as `np.array([(b"\xff\xfeSR",)], dtype=[("v","S8")])` imported cleanly and
#            shipped `coordinate_space = 'visium:<U+FFFD><U+FFFD>SR'` -- the false collision this
#            release exists to remove, by a shape the first draft's dtype check let through.
#          * A HEADERLESS `tissue_positions_list.csv` WITH A BOM now imports. The positions read
#            takes `utf-8-sig` (matching `spatial-import-xenium`'s `read_cells_csv`); before, the
#            BOM survived into the first barcode and the matrix join failed with "1 of the
#            matrix's N barcodes have no row". The headered spelling was never affected.
#          * `read_positions` now runs at the TOP of `run_import`, beside `read_scalefactors` and
#            for the same reason: its refusals used to fire after the expression store and both
#            axis stores were on disk (51 paths). Every refusal this release adds now leaves
#            NOTHING behind. The visible consequence is ORDERING -- a bundle that is bad in
#            several ways reports whichever of these reads refuses first, rather than the matrix
#            refusal.
#
# 0.10.1 — #321: the vendored `compute/ome_writer.py` re-vendored from the corrected
#          `spatial-types` copy — #158's TEN consecutive strips are NINE, with the
