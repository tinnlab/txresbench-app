#
# 0.12.0 — #336: EVERY refusal this module can emit is now safe to put in a log row, not just
#          the one #330 added. #330 built one escaping funnel (`_quoted_for_refusal`) and routed
#          ONE refusal through it; every other refusal interpolated attacker-chosen vendor text
#          RAW and UNBOUNDED, and a hostile bundle reaches several of them EARLIER than the
#          guarded one. That matters because `scheduler.rs::drain_logs` reads the compute's
#          stderr with `BufReader::lines()` and writes EACH LINE as its own `job_logs` row with
#          no per-line cap, and the UI renders the text HTML-safe but ANSI-unsafe. MEASURED on
#          `c34b3a1f` through the shipped entrypoint, stderr captured as BYTES:
#            - the ambiguous-member refusal put raw ESC/CR/BEL on stderr AND, through a raw `\n`
#              in a directory name, a FORGED `spatial.import-visium: import SUCCEEDED` line as
#              its OWN log row  ->  now 1 row, ASCII, control-free;
#            - a positions header of 60 fields x 120,000 characters produced a 7,200,587-byte
#              SINGLE stderr line  ->  now 1,630 B, and it no longer grows with the input;
#            - one h5 top-level member name produced 600,212 B of RAW non-ASCII (`list.__repr__`
#              escapes control characters but PASSES printable non-ASCII and bounds nothing)
#              ->  now 987 B;
#            - three unmatched barcodes produced 1,800,513 B  ->  now 2,816 B.
#          A SEQUENCE funnel is added beside the scalar one (`_quoted_list_for_refusal` /
#          `_REFUSAL_QUOTE_ITEMS = 8`) because bounding each element is not bounding the message.
#          ALSO CLOSED, found by reproducing the above rather than reported in it: a positions
#          field over `csv`'s own 131,072-character limit raised `_csv.Error`, which is not a
#          `VisiumImportError`, so `main()` did not catch it — rc=1 and a raw TRACEBACK. It is
#          now a named refusal, exit 2.
