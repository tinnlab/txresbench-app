#          THE GUARD-ORDERING TEST (#517): a
#          new structural test walks the module's own AST and proves every widened
#          `except (..., RuntimeError, ...)` is preceded by `except VisiumImportError:
#          raise` in the same `try` — `VisiumImportError` subclasses `RuntimeError`, so
