# cellranger processor — a PURE DATA package. The `cellranger.count` fastq→matrix
# ALIGNMENT analysis, registered by the generic `runtime/loadProcessors.ts` with NO
# app-code.
#
# UNLIKE the two on-ingest converters, cellranger is a LAUNCHABLE analysis (NO
# `trigger`) — it SHOWS in the launcher (`category: alignment`) and keeps its full
# launcher behaviour. `arch: [x86_64]` gates it: Cell Ranger ships no arm64 build, so on
# an aarch64 backend the launcher LISTS it DISABLED-with-a-reason, never emulated
# (DEC-29). The `run.runtime: bash` entry (`compute/cellranger.sh`) drives the
# `cellranger count` binary as a child process and writes the typed
# `/outputs/manifest.json` over its native `outs/`.
#
# Dual-parsed: the backend extensions loader also parses this file;
# `AnalysisContributionData` carries every FE key verbatim through `rest`, so the
# backend reads only `id` + `run` here (`cellranger.count` is dispatched via
# `api.compute.run` → `code_ref` = `run.entry`, NOT a backend converter/view).
id: cellranger
name: Cell Ranger count
publisher: cyto
# 0.3.0 — the manifest/UI separation: `when`/`accepts`/`params`/`defaults`/
# `schedule.resources`/`inStandardRecipe`/`recipeOrder` are GONE (each a LOAD ERROR now,
# DEC-3) and `appliesTo` replaces the applicability half of them. Seed reconciliation is
# version-keyed, so without this bump an already-provisioned deployment keeps a stale
# extracted manifest that now fails to load.
#
# 0.4.0 — the `ui:` half of that separation lands: `ui/cellranger.yaml` restores the
# tunables the removed `params.fields` used to render, and `compute/cellranger.sh` resolves
# its `fastqs` SLOT by name instead of pointing Cell Ranger at `/inputs` wholesale. Both the
# view and the compute changed, so the version has to move or an already-provisioned
# deployment keeps the old extracted kernel while the freshly-built frontend ships the new
# view (`scripts/check-processor-seed-versions.sh`).
version: 0.4.0
apiVersion: "1.0"
contributes:
  analyses:
    - id: cellranger.count
      category: alignment
      title: Cell Ranger count
      description: >-
        Align 10x scRNA-seq FASTQs with Cell Ranger count → a filtered feature-barcode
        expression matrix + the web summary report. (x86_64 backend only.)
      whenHint: >-
        the user has raw 10x FASTQ reads and wants a count matrix (alignment + demultiplexing)
      examples:
        - run cell ranger count
        - align these 10x fastqs to the human reference
      safety: read-run

      # ── APPLICABILITY ─────────────────────────────────────────────────────────
      #
      # Replaces `when: has:sequence/fastq` (a weaker restatement of the same selector),
      # the `accepts` list (+ its redundant `required: true` — everything here is
      # required by definition, DEC-5), and the `fastqs` artifact-ref field of
      # `params.fields`, which was a form wrapping a copy of the same selector. The slot
      # NAME survives as `slot:` — the key a caller sends and the key the compute
      # resolves out of `/inputs/`. `multiple: true` travels: a Cell Ranger run consumes
      # an R1/R2 × L00n LANE SET, not one file.
      appliesTo:
        - slot: fastqs
          multiple: true
          type_id: sequence/fastq

      # Registered concrete datatypes only (the native `outs/` BAM + metrics typing is a
      # P2 datatype addition out of scope here).
      produces:
        - single-cell/expression
        - report/html

      # The removed `params.fields` was a FORM SCHEMA — enum option lists, min/max/step,
      # titles and `doc:` help text, i.e. exactly what INV-1 says the manifest does not
      # carry and INV-2 says the view owns. It moved HERE, into a `ui/` view spec, which is
      # the half that was missing: for one release the keys were deleted and nothing
      # replaced them, so `reference` / `chemistry` / `expected_cells` / `include_introns`
      # / `create_bam` became unreachable from any surface. The run was unaffected (the
      # compute owns every fallback at the ONE boundary a value can be absent), and that is
      # what made the loss silent — every run used GRCh38 / auto / 3000 / introns-on / no
      # BAM whether or not that is what anyone wanted.
      #
      # `sample_names` did NOT come back. `compute/cellranger.sh` has never read it (no
      # `jqget sample_names`, no `--sample` flag), so a control for it would be a field the
      # user fills in that changes nothing about the run. See the header of
      # `ui/cellranger.yaml`.
      #
      # The `defaults` block stays gone. The view now carries the starting values a person
      # sees, the compute keeps the fallback for a `params.json` that omits a key, and
      # `core/runtime/cellrangerRunParams.test.ts` reads the `jqget` literals out of the
      # compute and fails if the two copies drift. A third copy here would decide nothing
      # either of them would not have decided identically.
      ui:
        - ui/cellranger.yaml

      run:
        kind: sandbox
        runtime: bash
        entry: compute/cellranger.sh
        # S7 — the NAMED host resource this entry needs bind-mounted read-only. The
        # server formerly carried the reference-genome concept itself (a
        # `needs_reference` boolean in a code table, a fixed `CYTO_SANDBOX_REFERENCE_ROOT`
        # env var, a fixed `/refdata` mount and an error message naming a genome). It
        # now understands only "this entry asked for the resource called `reference`";
        # the operator maps the NAME to a host path via
        # `CYTO_SANDBOX_RESOURCE_REFERENCE` (the legacy `CYTO_SANDBOX_REFERENCE_ROOT`
        # is still honored as an alias) and allowlists its root via
        # `CYTO_SANDBOX_SANDBOX_MOUNTS`' sibling `CYTO_SANDBOX_REFERENCE_MOUNTS`.
        # `compute/cellranger.sh` reads `CYTO_REFERENCE_ROOT:-/refdata`.
        host_resources:
          - { name: reference, mount_path: /refdata }
      # A long alignment job (heavy CPU/mem) → batch scheduling + long-job log paging.
      #
      # `resources: { cpu: 8, mem: 64Gi }` is GONE — nothing read it (`jobsCapability`
      # rebuilds the spec as `{ class }`), and real limits come from the singleton
      # sandbox settings row (deployment-wide, enforced by bwrap/cgroup). A per-analysis
      # constant could not have been right anyway: need scales with the DATA, not with
      # the analysis.
      schedule:
        class: batch
      # Cell Ranger has no arm64 build — the whole point of arch gating (DEC-29).
      arch: [x86_64]
      methodsText: >-
        Aligned 10x FASTQs with Cell Ranger count against $reference (chemistry $chemistry).
      # `inStandardRecipe: false` / `recipeOrder: 0` are GONE — zero consumers in either
      # language.
