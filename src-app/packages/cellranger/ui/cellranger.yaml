# Cell Ranger count declarative view_spec.
#
# No `analysis:` key — the MANIFEST declares `ui: [ui/cellranger.yaml]`, so the binding is
# owned by the registration file. No `layout:` — one analysis renders into ONE pane and
# widgets render in DECLARATION ORDER, so the order below IS the layout (INV-3).
#
# WHY THIS FILE EXISTS. `manifest.yaml` used to carry a `params:` FORM SCHEMA — the enum
# option lists, min/max/step, titles and `doc:` help text for reference / chemistry /
# expected_cells / include_introns / create_bam. That key was removed feature-wide, correctly:
# it is presentation, and INV-1 says the manifest does not carry it while INV-2 says the view
# does. Every other package moved its controls into a `ui/*.yaml`. Cellranger shipped no view,
# so the controls did not move — they vanished. The RUN was unchanged (`compute/cellranger.sh`
# reads the identical `jqget` fallbacks), which is precisely what made the loss invisible:
# every run silently aligns against GRCh38 with auto chemistry, and a user with mouse data has
# no way to say so. The launcher's fallback form is derived from `appliesTo` alone
# (`extensions/analysis/inputEconomy.ts::fallbackParamsFor`) and can only ever render one
# artifact-ref control per SLOT — there is no params escape hatch on that surface.
#
# WHAT IS NOT HERE: `sample_names`. The removed `params.fields` declared it (`type: array`,
# "FASTQ --sample prefixes to demultiplex (empty = all)") and `compute/cellranger.sh` has never
# read it — there is no `jqget sample_names`, and no `--sample` flag on the `cellranger count`
# invocation. Restoring that control would restore a lie: a field the user fills in that
# changes nothing about the run, at rc=0, with a green report. That is the exact defect class
# this round removes (qc's closed `modalityPicker`, cell-filter's silent keep-all mask), so it
# is deliberately absent. Wiring `--sample` through the compute is a real feature and belongs
# in its own change, with its own test.
id: cellranger.count.form
title: Cell Ranger count
# The datatype this view's input consumes.
# Reuse the EXISTING permission — cellranger introduces no new gate. The workbench dispatches
# compute jobs, so `jobs::use` (granted to Users, gates job create/run) is the gate.
permission: jobs::use

state:
  # ── the artifact INPUT ─────────────────────────────────────────────────────────────────
  #
  # A LIST, matching `appliesTo`'s `multiple: true`: a Cell Ranger run consumes an R1/R2 ×
  # L00n LANE SET, and `sequence/fastq` declares `file_layout: manifest` for exactly that
  # reason. `resolveInputs` deliberately does NOT auto-pick a `multiple` slot (an unset
  # multi-ref is a legitimate 0-or-more set), so this is the only way the fastqs get named.
  fastqs: { type: list, default: [] }

  # ── the TUNABLES ───────────────────────────────────────────────────────────────────────
  #
  # Field names are the PARAM KEYS verbatim (`expected_cells`, not `expectedCells`) — the same
  # choice qc makes for `qc_metrics`. The `params:` block below is then a legible
  # key→`$state.key` mapping with no translation layer to get wrong, and the defaults-parity
  # test in `core/runtime/cellrangerRunParams.test.ts` can compare the two files key-for-key.
  #
  # EVERY default here RESTATES the compute's own fallback, and that is deliberate rather than
  # sloppy. `run_processor.params` has no per-key `when` — every key is emitted on every
  # launch — and `jqget` resolves its fallback with jq's `//`, which substitutes only on JSON
  # `null` or `false`. An empty-string param therefore sails through VERBATIM: a blank
  # `reference` field would run `--transcriptome /refdata/`, which is a real directory, so the
  # run would not even fail. The view cannot omit a key and cannot send a blank one, so it must
  # hold the real value; the second copy is unavoidable. It is PINNED instead of trusted —
  # `the view's DEFAULTS ARE the compute's defaults` reads the `jqget` literals straight out of
  # `compute/cellranger.sh` and fails if either side moves alone.
  #
  # They are STRINGS, including the two booleans and the count, because that is what the
  # controls actually produce: `SelectRenderer`/`TextRenderer` both dispatch
  # `e.target.value`, a string, and the compute compares strings
  # (`[ "$INCLUDE_INTRONS" = "false" ]`, `--expect-cells "$EXPECTED_CELLS"`). A `type: boolean`
  # field would be a type that lies the moment the user touches the control — and worse, a
  # real JSON `false` reaching `jqget` is swallowed by `//` and replaced with the default, so
  # "Include introns: no" would silently mean yes.

  # The pre-built reference transcriptome, named as a DIRECTORY under the admin-allowlisted
  # read-only reference mount (`compute/cellranger.sh` reads `$CYTO_REFERENCE_ROOT/<this>`).
  reference: { type: string, default: "refdata-gex-GRCh38-2024-A" }
  chemistry: { type: string, default: "auto" }
  expected_cells: { type: string, default: "3000" }
  include_introns: { type: string, default: "true" }
  create_bam: { type: string, default: "false" }

const:
  # The assay chemistries the removed `params.fields` enumerated, carried over VERBATIM rather
  # than re-derived from a Cell Ranger release: this list is the repo's own prior declaration
  # and inventing entries would be guessing at a vocabulary this file cannot verify.
  #
  # A closed list is safe HERE in a way qc's deleted `modalityPicker` was not. That picker
  # offered three modalities against an importer that generates an OPEN set, so `hto` and
  # `crispr` were unnameable and the user was forced into a wrong answer that became a column
  # prefix. This list leads with `auto`, which is both the default and the escape hatch: a
  # chemistry not listed is detected rather than mis-declared. (A newer Cell Ranger chemistry
  # is still not TYPEABLE here — the honest limit of a closed list. `SelectRenderer` prepends
  # any bound value that is not in the option set, so an agent-set value at least renders.)
  chemistries: [auto, threeprime, fiveprime, SC3Pv3, SC5P-PE]
  # The core widget vocabulary ships no checkbox kind (`WIDGET_KINDS` — select / text /
  # multiselect / range_slider / list-editor / table / button / alert / stat / group /
  # dataset-picker / artifact_ref), so a boolean is a two-option select. The VALUES are the
  # strings the compute compares against; the LABELS are what the question reads as.
  yesNo:
    - { value: "true", label: "Yes" }
    - { value: "false", label: "No" }

widgets:
  # ── the INPUT, in the same form as everything else (INV-2/INV-4) ─────────────────────────
  #
  # Declares its OWN `source`; the manifest's `appliesTo` governs whether the analysis is
  # OFFERED at all, not what this control LISTS. `slot` is not a UI concept and is absent here
  # — it survives only as the wire key on `run_processor`'s `inputs`.
  - id: fastqsPicker
    kind: artifact_ref
    # ITEM-29e / DEC-15 — DECLARED, because it is the behaviour this surface has always
    # had. `auto_bind_sole_candidate` is opt-IN (absence means OFF, which is R2/INV-3 as
    # written); before it existed the sole-candidate bind was unconditional with no way to
    # turn it off. Stating it here keeps this control byte-identical for the user and makes
    # the affordance visible in the file, which is the entire point of the rule.
    auto_bind_sole_candidate: true
    label: FASTQ reads
    multiple: true
    source: { datatype: sequence/fastq }
    value: "$state.fastqs"
    onChange: cr.setFastqs
    # What the deleted `disabledWhen: "$state.fastqs.length == 0"` said, declared on the
    # control it is about. With no candidate in the project it reports nothing (DEC-6) and
    # `empty_text` speaks instead.
    #
    # CHOOSE, not UPLOAD: this is the sentence for a project that HAS lane sets and an answer
    # the user has not given yet.
    require:
      min_items: 1
      message: Choose the FASTQ lane set to align.
    # What `noInputAlert` used to say, moved onto the control that actually knows whether it
    # is true.
    #
    # The alert is DELETED, and it carried the same reported defect QC's and cell-filter's
    # did: its condition tested whether the user had SELECTED reads while its text asserted
    # the project CONTAINED none. This picker is `multiple`, and `resolveInputs` deliberately
    # never auto-picks a multi slot, so the two propositions came apart on EVERY project with
    # lane sets in it — the message read "none in this project yet" until the moment the user
    # picked some.
    empty_text: >-
      No FASTQ reads in this project yet. Upload a 10x lane set (R1/R2 × L00n) to align it.

  # ── the tunables ─────────────────────────────────────────────────────────────────────────
  #
  # `reference` is a TEXT field, not a select, and that is the one place this view refuses to
  # copy the removed schema. The old field was `type: enum` over exactly two names
  # (`refdata-gex-GRCh38-2024-A`, `refdata-gex-GRCm39-2024-A`). Which references EXIST is an
  # operator fact — whatever directories they mounted at `CYTO_SANDBOX_RESOURCE_REFERENCE` —
  # and no API exposes that set, so the view cannot enumerate it. A two-entry list is a
  # hardcoded spelling list that drops the third spelling: an operator who mounted
  # `refdata-gex-GRCh38-2020-A` or a custom build would find it unreachable, with the only
  # symptom a run that exits 3 saying the transcriptome was not found. Free text is honest
  # about an open set; the description says where the name comes from.
  - id: referenceInput
    kind: text
    label: Reference transcriptome
    value: "$state.reference"
    placeholder: "refdata-gex-GRCh38-2024-A"
    onChange: cr.setReference

  - id: chemistrySelect
    kind: select
    label: Chemistry
    options: "$const.chemistries"
    value: "$state.chemistry"
    onChange: cr.setChemistry

  # `expected_cells` goes straight into a shell argument, and nothing checked it.
  #
  # `jqget` resolves its fallback with jq's `//`, which substitutes only on JSON `null` or
  # `false`, so an empty or garbage string passes through VERBATIM to
  # `--expect-cells "$EXPECTED_CELLS"`. The view's own comment already documents that hazard
  # for `reference`; the same hole was open on the numeric field.
  #
  # `required` AND `number` — they answer different questions and this field needs both. An
  # empty value is not a `number` violation anywhere in this vocabulary (an omitted bound is a
  # legitimate answer for a criterion), so blank has to be refused by `required`; and a
  # PRESENT value still has to be a whole positive count, which is what `number` says. The
  # grammar is the shared decimal one, so what the form accepts is what every other reader of
  # a number in this app accepts.
  - id: expectedCellsInput
    kind: text
    label: Expected cells
    value: "$state.expected_cells"
    placeholder: "3000"
    onChange: cr.setExpectedCells
    require:
      required: true
      number: { min: 1, integer: true }
      message: Enter the expected recovered-cell count — a whole number of at least 1.

  - id: includeIntronsSelect
    kind: select
    label: Include introns (count pre-mRNA reads)
    options: "$const.yesNo"
    value: "$state.include_introns"
    onChange: cr.setIncludeIntrons

  - id: createBamSelect
    kind: select
    label: Create BAM (position-sorted alignments — large)
    options: "$const.yesNo"
    value: "$state.create_bam"
    onChange: cr.setCreateBam

  - id: runBtn
    kind: button
    label: Run Cell Ranger count
    variant: primary
    # Deliberately NOT `when:` — that HIDES the widget, and hiding the Run button is the
    # deadlock `DeclarativeRegion` documents (the "run the analysis that produces its input"
    # message with the Run button hidden behind it). Disabled-and-visible says why.
    #
    # NO `disabledWhen`: the input requirement is declared on the picker, the numeric one on
    # the count field, and this button DERIVES from both — so a second tunable added tomorrow
    # is gated by declaring its own requirement rather than by remembering to extend a string.
    onClick: cr.run

actions:
  - id: cr.setFastqs
    title: Set FASTQ reads
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: list }
    body:
      - set: { fastqs: "$params.value" }

  - id: cr.setReference
    title: Set reference transcriptome
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { reference: "$params.value" }

  - id: cr.setChemistry
    title: Set chemistry
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { chemistry: "$params.value" }

  - id: cr.setExpectedCells
    title: Set expected cells
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { expected_cells: "$params.value" }

  - id: cr.setIncludeIntrons
    title: Set include-introns
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { include_introns: "$params.value" }

  - id: cr.setCreateBam
    title: Set create-BAM
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { create_bam: "$params.value" }

  # Run — a DECLARED run_processor → wait_for.
  #
  # `inputs` and `params` are SEPARATE channels and must stay so (INV-4). `fastqs` names
  # ARTIFACTS, so it is mounted and resolved by slot; everything else is a plain value the
  # compute reads out of `/inputs/params.json`. Merging them makes a scalar param
  # indistinguishable from an artifact id at the launch site — a plain string binds as a
  # phantom artifact input, and an input declared only in `inputs` is dropped entirely.
  #
  # `inputs` is passed EXPLICITLY, from view state — what is launched is what was on screen.
  # It cannot be left to auto-resolution here even in principle: `resolveInputs` skips a
  # `multiple` slot, so an unpassed `fastqs` binds NOTHING and the run reaches the compute
  # with an empty `/inputs`.
  #
  # The param KEYS are the ones `compute/cellranger.sh` reads (`jqget reference …`,
  # `jqget chemistry …`, `jqget expected_cells …`, `jqget include_introns …`,
  # `jqget create_bam …`) and nothing else. A key with no `jqget` would be a control that
  # does nothing; a `jqget` with no key here would be a tunable that is still unreachable.
  - id: cr.run
    title: Run Cell Ranger count
    permission: jobs::use
    mutating: true
    params: {}
    body:
      - run_processor:
          id: cellranger.count
          inputs:
            fastqs: "$state.fastqs"
          params:
            reference: "$state.reference"
            chemistry: "$state.chemistry"
            expected_cells: "$state.expected_cells"
            include_introns: "$state.include_introns"
            create_bam: "$state.create_bam"
          into: crJob
      - wait_for: { job: "$crJob", until: completed }
      - toast: { success: "Cell Ranger count complete" }
