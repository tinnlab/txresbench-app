# spatial-import-visium-hd — the Visium HD bundle importer (#313, epic #151).
#
# THE HALF THAT WAS MISSING. #160 delivered `spatial/visium-hd-bundle` — the third vendor
# upload container, and the first whose members carry a path segment — so a Visium HD run
# has been UPLOADABLE and DECLARED since `spatial-types` 0.4.0. Nothing could import it.
# `spatial-import-visium` refused it by name and pointed the reader at #160, which is
# CLOSED, so the actual platform gap was tracked by nothing. This package closes it.
#
# ── WHY THIS IS PURE DATA ────────────────────────────────────────────────────────────
#
# There is no package registry to edit. `extensions/embedded.rs` bakes the whole
# `src-app/packages` tree in with one `include_dir!`, extracts it to `<data_root>/
# processors/` on boot, and the loader SCANS the extracted folder. A directory that
# exists is a package that is registered. So this file plus `compute/` is the whole of
# the contribution, and `tests/test_zero_src_app_diff.py` is what holds that shut — the
# fifth copy of that guard's basename in this tree, which `--import-mode=importlib`
# (`packages/pytest.ini`, #198) is what makes legal.
#
# ── WHAT VISIUM HD ACTUALLY IS, AND WHERE EACH FACT COMES FROM ───────────────────────
#
# Not from memory. Every claim below is a repo-internal citation, because the one thing
# this branch could NOT do is check itself against a real vendor bundle (see the fixture
# note at the bottom of this block).
#
# * THE LAYOUT. `outs/binned_outputs/square_002um|square_008um|square_016um/`, and "each
#   `square_XXXum/` mirrors a full Visium `outs/`"
#   (`docs/research/data-processing/01-file-formats.md:621-631`). That mirroring is the
#   whole reason #160 existed: under BASENAME member matching every declared member had
#   three candidates and the bundle would not group at all.
# * THE POSITIONS ARE PARQUET, not CSV — "Positions are **Parquet** (millions of
#   squares)" (`01-file-formats.md:629`). A different reader AND a different scale class
#   from the sibling, which reads a CSV with `csv.reader`.
# * THE SCALE IS STATED, NOT DERIVED. `scalefactors_json.json` carries `microns_per_pixel`
#   and `bin_size_um` on HD runs (`01-file-formats.md:602`), and
#   `import_visium.micron_scale`'s own docstring records that `microns_per_pixel` "is a
#   Visium HD / newer-Space-Ranger addition" taken VERBATIM as leg 1. So this importer
#   never divides a rendered-circle constant by `spot_diameter_fullres`, and #222's defect
#   class (the wrong numerator) and #257's (the wrong slide design) are both structurally
#   UNREACHABLE here — neither constant appears in this package's compute.
# * THE BINS ARE NESTED, 16:1 and 64:1. "8 µm bin = 16 native barcodes; 16 µm = 64"
#   (`01-file-formats.md:630`), from a native 2 µm capture grid that is "a **continuous
#   grid of 2×2 µm squares** (no gaps)" (`06-spatial-processing.md:120`). Because the grid
#   is contiguous, a bin's SIDE is also its centre-to-centre PITCH — which is why
#   `measured_entity.resolution_um` and the scale check's referent are the same number
#   here and are two different numbers on Visium (55 µm footprint vs 100 µm pitch, the
#   conflation that was #222).
#
# ── THE BIN CHOICE IS A DECLARED PARAMETER, AND ITS DEFAULT IS NOT YET OWNER-CONFIRMED ─
#
# One import produces ONE bin. Which one is `params.json`'s `bin_um`; with none supplied
# the run uses `DEFAULT_BIN_UM` (8 µm) and the report SAYS the default applied, which bins
# the bundle carried, and how to get another one.
#
# 8 µm is the most defensible default and three of this repo's own research documents say
# so — "8 µm (**recommended default for analysis**)"
# (`docs/research/data-processing/02-platforms.md:388`), "Native 2 µm is too sparse; **8
# µm** is 10x's recommended analysis bin" (`06-spatial-processing.md:582`), "the 2 µm
# matrix is enormous and very sparse; most analyses start at 8 µm"
# (`01-file-formats.md:630-631`). It is NOT an owner ruling. #313 records that its sibling
# issue never made one, and `spatial-import-visium`'s DEC-5 refusal says outright that
# "picking one bin here would hide the platform gap rather than close it". So the choice
# is shipped VISIBLE — one module constant, one derived report line, one run parameter —
# rather than absorbed, and `.lifecycle/visium-hd-import/DECISIONS.md` DEC-1 carries the
# full option table (per-bin / all-three / fixed) with what each costs. Confirm it before
# treating it as a contract.
#
# EMITTING ALL THREE BINS AT ONCE was considered and is not this item (DEC-1 option (b)).
# The container's own comment states the design position — "ONE DATASET, THREE
# RESOLUTIONS — and that is the design's answer, not a convenience" — and this package
# honours the half of it that is unrecoverable later: every artifact is stamped with
# `measured_entity`, so two imports of one run at two bins ARE the design's resolution
# group (`spatial-storage-layout.md` §15.1) and are told apart by a field a human reads
# rather than by row count. What is deferred is emitting them in ONE run, which would make
# every HD import pay for the 2 µm matrix's 11,222,500 rows.
#
# ── WHAT IS DELIBERATELY NOT HERE ────────────────────────────────────────────────────
#
# * NO `trigger: on-ingest`, for the reason the sibling states: an import that silently
#   REINTERPRETS an upload is not recoverable by undo, and a spatial bundle is exactly the
#   case where the reinterpretation is consequential — it mints a coordinate space every
#   later image and every later section places itself into. A user confirms it by
#   launching it.
# * THE `ui:` VIEW SPEC #361 WAS FILED FOR. This package now ships `ui/import-hd.yaml`,
#   the declarative form #361 was filed for (`Visium HD import has no UI control for the
#   bin -- the bin is a run parameter with no form`): a bundle picker, a bin picker whose
#   options are DERIVED from the container's declaration rather than enumerated, and a Run
#   button. The bin is no longer a run parameter with no form. The sibling spatial
#   importers still ship without one and are launched through the same generic path.
# * NO CHANGE TO `spatial-types`. The container is already correct and complete for this
#   importer. Declaring `barcode_mappings.parquet` and `feature_slice.h5` is the thing its
#   own comment says the HD importer owes "once it can check them against real bytes" —
#   and this branch has no real bundle, so the condition is unmet and declaring them on a
#   guess would make every HD upload ungroupable (DEC-8). The disclosed cost is unchanged:
#   `feature_slice.h5` carries HD's four named 3x3 registration transforms, so a run whose
#   registration must be preserved is uploaded through the ARCHIVE arm, which retains the
#   tree whole.
# * NO CORE CHANGE, and specifically NOT the sandbox-staging fix. `dataset/process.rs::
#   build_dataset_inputs` flattens a multi-file dataset to `{i}_{basename}`, so the
#   `square_NNNum/` segment reaches a compute only as that integer — which
#   `spatial-types/tests/test_hd_bundle_container.py::test_the_declared_member_ORDER_is_pinned`
#   freezes and calls "deliberately unpleasant to update", naming the real repair as
#   making staging carry the path. That repair changes the `/inputs` layout of EVERY
#   multi-file dataset in the product; doing it in the same change as the first consumer
#   of it is how a layout change ships untested against the other three consumers. So this
#   importer reads BOTH layouts (path-preserving first, ordinal second) and then VERIFIES
#   its answer against each bin's own `bin_size_um`, refusing a disagreement by name. When
#   staging does carry the path, leg (a) fires, leg (b) is dead, and the verification
#   stays. TRACKED AS #360 (`[shared] Sandbox staging flattens a multi-file dataset to
#   {i}_{basename}, so a Visium HD bin's identity survives only as an ordinal`), which is
#   OPEN. The issue number is written here rather than only in the lifecycle record
#   because that record is stripped before merge: #313 exists because a deferral pointer
#   went stale, and a deferral with NO pointer at all is the same defect one step
#   earlier -- the reader has nowhere to go and nobody planning work sees the item.
# * NO `squidpy` (the sibling's DEC-2, unchanged): it is in the rootfs and NOT on the
#   `just check-py` host, so importing it would put this reader behind the one gate that
#   has to run it, and its readers return an `AnnData` we would immediately decompose.
#
# ── EVERY DECLARED DEPENDENCY IS ALREADY PINNED ──────────────────────────────────────
#
# `server/build_helper/processor_manifest.rs` resolves each `run.dependencies[]` against
# `env-rootfs/single-cell/requirements.txt` AT BUILD TIME, so a library that is absent
# there — or a range the pin falls outside — fails `cargo check` rather than a user's
# sandbox job. Measured against the pins on this branch: numpy 2.4.6, scipy 1.17.1,
# pandas 2.3.3, h5py 3.16.0, tifffile 2026.3.3, pillow 12.3.0, pyarrow 25.0.0.
#
# `pyarrow` is the one this package adds to the spatial arm's declared surface, and it
# needs NO rootfs republish: #163 pinned it for `spatial-import-xenium`'s
# `cell_boundaries.parquet` reader after verifying it was ALREADY in the shipped image as
# a hard transitive of `spatialdata==0.7.3`. This package is its second consumer, and the
# reason that pin's comment gives — "a user's sandbox being the first place its absence
# would show up" — is why it is declared here rather than assumed.
#
# ── THE FIXTURE IS SYNTHESIZED, AND THIS IS THE DISCLOSURE ───────────────────────────
#
# No real Visium HD bundle was available. `tests/fixtures/visium-hd-outs/` is built by the
# committed, deterministic `tests/make_fixture.py`; every byte is in the vendor's own
# format, and every FORMAT CLAIM the generator encodes carries a repo-internal citation in
# `tests/fixtures/PROVENANCE.json`. This is the same disclosure
# `spatial-types/tests/README-hd-fixture.md` already makes for the HD layout fixture, and
# it bounds what this suite proves: claims about the DOCUMENTED format, not about vendor
# bytes (DEC-9).
#
id: spatial-import-visium-hd
name: Import Visium HD (Space Ranger binned_outputs)
publisher: txr
# Bump on ANY file change in this package — the seed reconciliation keys on it, and
# `scripts/check-processor-seed-versions.sh` enforces it base-relative over the whole package
# DIRECTORY. A package born on its introducing branch is EXEMPT from that gate (it has no
# earlier version to move from), which is why 0.1.0 ships with a changelog entry anyway: the
# next bump has to be read against something.
#
# ── CHANGELOG (newest immediately above `version:`) ──────────────────────────────────
#
# 0.1.0 — #313: the first release. Visium HD becomes importable: `spatial/visium-hd-bundle`
