version: 0.23.2
apiVersion: "1.0"
contributes:
  analyses:
    - id: spatial.import-visium-hd
      category: data-io
      title: Import Visium HD (Space Ranger binned_outputs)
      description: >-
        Read an uploaded 10x Visium HD Space Ranger `binned_outputs/` bundle at one square-bin
        resolution and emit the expression matrix, the tissue map in full-resolution pixels,
        the per-bin columns and the tissue image — so a Visium HD run becomes an ordinary,
        analysable dataset with a place on a slide. One run imports one bin; the bin is a
        declared parameter and defaults to 8 um, which is 10x's recommended analysis bin.
      whenHint: >-
        the user uploaded a Visium HD binned_outputs bundle (three square_NNNum bins, each with
        a filtered matrix, parquet tissue positions, scale factors and a tissue image) and
        wants one bin's tissue map and counts imported
      examples:
        - import this Visium HD bundle
        - load the 8 um bin from this HD run
        - bring in the binned_outputs at 16 um
      safety: read-run
      # WHICH ANALYSIS ENVIRONMENT these pins must be satisfiable in. Required since E3
      # landed a second recipe (`single-cell-r`): the #80 build gate resolves every declared
      # dependency against every recipe on disk, so an undeclared contribution would demand
      # that numpy/pandas/scipy/h5py/pyarrow be installed in the deliberately-narrower R env
      # too. `single-cell` is where every one of this importer's pins lives.
      env: single-cell
      # ONE slot. The bundle is already ONE dataset by the time it reaches here —
      # `spatial/visium-hd-bundle` declares `mtx-trio-target`, so the upload planner
      # auto-groups the twelve declared members into a single dataset (#160). Binding the
      # members individually here would re-open a grouping the container already did, which
      # is the thing the design says must NOT be worked around in the importer (§6.7).
      #
      # NOTE what this slot resolves to at run time. A MULTI-FILE dataset does not arrive as
      # one path: `dataset/process.rs::build_dataset_inputs` binds each file at `bundle_<i>`
      # with sandbox subpath `<i>_<basename>`. The compute therefore reads
      # `/inputs/inputs.json` and reconstructs the bins from the flat directory — see
      # `locate_bins`, which handles that layout AND a path-preserving one, and verifies
      # either answer against the data.
      appliesTo:
        - slot: bundle
          type_id: spatial/visium-hd-bundle
          auto_bind_sole_candidate: true
      # `single-cell/counts`, not the abstract `single-cell/expression`: a Space Ranger
      # `filtered_feature_bc_matrix.h5` holds INTEGER UMI COUNTS, which is what
      # `single-cell/counts` means and what `qc.10x` requires. It `extends:
      # single-cell/expression`, so every shipped `subtypes_of: single-cell/expression`
      # selector still resolves it — nothing downstream needs to know it is spatial.
      produces:
        - single-cell/counts
        - spatial/coordinates
        # One artifact per placeable vendor image of the SELECTED bin, each placed into the
        # coordinate space by the INVERSE of its own scalefactor.
        - spatial/image
        - metadata-column
        - report/qc
        - report/html
      run:
        kind: sandbox
        runtime: python
        entry: compute/import_visium_hd.py
        # `spatial_declarations.py` and `ome_writer.py` are VENDORED VERBATIM from
        # `spatial-types` and staged beside the entry. The platform confines `run.helpers`
        # to a package's OWN tree, so vendoring is the idiom (three packages already do it),
        # not an exception. `tests/test_vendored_contract.py` byte-compares both against
        # their source of truth — a vendored file that drifts is a second implementation
        # wearing the first one's name.
        helpers:
          - compute/spatial_declarations.py
          - compute/ome_writer.py
          # The registration QC. This package's OWN, and deliberately NOT vendored: the two
          # existing copies (`spatial-import-visium`'s 1236 lines and
          # `spatial-import-xenium`'s 1563) already differ from each other, because the
          # referent is per-platform. For HD it is the BIN LATTICE PITCH; the Visium copy
          # hardcodes the slide's 100 um spot pitch, which HD does not have. A byte-compare
          # here would assert an identity that is false by design (DEC-5).
          - compute/registration_qc.py
        dependencies:
          - { library: numpy, version: ">=2.0,<3" }
          - { library: pandas, version: ">=2.2,<3" }
          - { library: scipy, version: ">=1.14,<2" }
          - { library: h5py, version: ">=3.10,<4" }
          # THE HD-SPECIFIC ONE. Visium HD writes `tissue_positions.parquet` where standard
          # Visium writes a CSV (`01-file-formats.md:629`), so this importer needs a parquet
          # reader where the sibling needs none. Pinned at 25.0.0 in the recipe by #163 for
          # `spatial-import-xenium`'s boundaries reader, after verifying it was ALREADY in
          # the shipped image as a hard transitive of `spatialdata==0.7.3` — so this
          # declaration freezes what already ships and forces no republish. A RANGE, not a
          # pin, for the reason the imaging pair below gives.
          - { library: pyarrow, version: ">=14,<26" }
          # The imaging pair (#155's, unchanged). Ranges, not pins, because the HOST that
          # runs `just check-py` carries older builds than the rootfs and BOTH must satisfy
          # the declaration — otherwise the gate that has to run this code cannot.
          # `pillow` is here because `tifffile` CANNOT read a PNG and the vendor ships one.
          - { library: tifffile, version: ">=2024.1.1" }
          - { library: pillow, version: ">=10,<14" }

      # ── UI (#361) — the declarative view file this analysis renders ────────────────
      # The manifest names the FILE; it says nothing about what is in it (INV-16). Everything
      # the user sees + selects — labels, field order, the option sources — lives in the view
      # (INV-17). Package-relative + MUST exist: a `ui:` entry naming a file that is absent
      # (or fails to parse) is a LOAD ERROR for that analysis' whole pane — fail-CLOSED, not
      # a silently-shorter list — at `src-app/ui/src/modules/workbench/core/runtime/
      # loadProcessors.ts:181-211` ("A `ui:` entry naming a file that is absent (or failed to
      # parse) is an ERROR … and it takes its ANALYSIS' whole pane down with it"). An analysis
      # with NO `ui:` at all is unaffected — the key is optional. The view's bin options are
      # DERIVED from this container's own declaration via the generic `container_members`
      # data source, never a literal `[2,8,16]` (#313's coupling).
      ui:
        - ui/import-hd.yaml

      schedule:
        class: normal
      arch: [x86_64, aarch64]
      methodsText: >-
        Imported the 10x Visium HD Space Ranger binned outputs at one square-bin resolution:
        the filtered feature-barcode matrix of the selected bin was re-emitted as a bins x
        genes count matrix, and per-bin tissue positions were recorded as coordinates in the
        full-resolution pixel frame of the capture area, with the vendor's stated
        microns-per-pixel preserved as the physical scale of that frame. The bin size is a
        recorded operating parameter of the import, not a discovered property of the run.
      # KEPT + load-bearing: `server/.../provenance/export/methods.rs` reads
      # `contributes.analyses[<id>].methods` to narrate the exported `methods.md`.
      methods:
        subject: { singular: bin, plural: bins }
        action: imported
        # `{bin_um}` is SUBSTITUTED from the run's own params — see `methods.params` below.
        # Naming the bin in the exported `methods.md` is not decoration: which resolution a
        # result was computed at is the identity `spatial-storage-layout.md` §15.1 calls
        # "unrecoverable from the bytes once artifacts exist", and `methods.md` is the
        # out-of-app trust deliverable, so a methods section that said only "at one square
        # bin" would be the same omission one document over.
        commits: "one tissue map and one count matrix at the {bin_um} um square bin"
        # The narration when the run recorded NO `bin_um` — i.e. the default applied. The
        # note below then carries the fact that a default was used and which one, because a
        # methods section that silently omits an unconfirmed default (DEC-1) is exactly the
        # shape #313 was filed about.
        commits_unlabeled: a tissue map and a count matrix at this importer's default square bin
        note: >-
          Visium HD emits three square-bin resolutions from one run (2 um, 8 um and 16 um)
          and this import reads exactly one of them; the other two remain in the retained raw
          upload and are imported by re-running at another bin size. The physical scale is the
          vendor's stated microns-per-pixel, read from the selected bin's scale factors and
          not derived from the rendered spot diameter. Coordinates are stored in
          full-resolution pixels and each emitted image declares its own affine into that
          frame.
        # `bin_um` -> `narrated_value`: the narrator prints the value the run actually used,
        # which is what makes `commits`' `{bin_um}` substitutable. It is deliberately NOT
        # mapped to `output_label` — the bin is not a name the user gave an output, it is the
        # resolution the measurement was taken at, and mis-declaring the role would put it in
        # the wrong sentence of the exported document.
        params:
          bin_um: narrated_value
