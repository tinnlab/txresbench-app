#          owner-confirmed — DEC-1), emitting the counts matrix, the tissue map in
#          full-resolution pixels, the per-bin columns, one placed OME-TIFF and the
#          registration QC report. Three things are deliberately stronger here than in the
#          sibling this package mirrors, and each is a test rather than a claim: the micron
#          scale is the vendor's STATED `microns_per_pixel` so #222/#257's numerator defects
#          cannot occur; EVERY refusal is reachable before the first writer, so a refused
#          import leaves ZERO paths on disk (the general form
