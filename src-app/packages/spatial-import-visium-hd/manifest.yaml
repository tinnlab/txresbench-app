#          the sibling's barcode join still leaves at 51); and the staging ordinal this
#          importer must fall back on is VERIFIED against each bin's own `bin_size_um`
#          rather than trusted. What it does NOT do is change the core, the container or the
#          sibling package — the contribution is a package directory plus one `pytest.ini`
#          line, which `tests/test_zero_src_app_diff.py` asserts.
#
# 0.2.0 — #377: `coordinate_space` ID FORMAT CHANGED — each rung of the ladder now emits into
#          its OWN namespace. `visium-hd:<value>` becomes `visium-hd:library_id:<value>` when
#          the matrix's `library_ids` names the run, and `visium-hd:metrics-sample-id:<value>`
#          when `metrics_summary.csv`'s `Sample ID` does. The token is the
#          `coordinate_space_source` string itself, so the id says which rung answered it; the
#          vendor's own string follows it whole and unaltered.
#
#          WHY: 0.1.0's two rungs emitted into ONE undelimited space, so a run whose
#          `library_ids` equalled an UNRELATED run's metrics `Sample ID` was declared to share
#          that run's coordinate frame — one tissue's image placed against another's bins, with
#          nothing able to detect it, because `resolveOverlayBinding` compares the frame value
#          by equality and by nothing else (`coordinate_space_source` differed and is read by
#          no one). That is the CROSS-RUNG half of #328, which `spatial-import-xenium` closed
#          three hours before this package merged; 0.1.0 vendored that fix's reserved-prefix
#          refusal without its injective framing, and reserved the sibling's
#          `slide_id+region_name:` — a namespace it never wrote, in a vocabulary this platform
#          has no nouns for. The reserved set now names the two namespaces this package
#          actually emits.
#
#          A CORRECTION BEFORE FIRST USE, NOT A BREAK. #328's DEC-2 had to accept that an
#          already-imported dataset would stop binding to its own re-import. Re-measured here
#          on `3445bc502`: no committed artifact, fixture or baked OME `Description` anywhere
#          in the tree carries a `visium-hd:` id, because this processor shipped in that same
#          commit and had imported nothing. So the id moves at zero data cost. An integrator
#          reading `coordinate_space` must still expect the new shape; the two rungs' values
#          are unchanged after the token.
#
# 0.3.0 — #361: the bin gets a FORM. `spatial.import-visium-hd` now ships `ui/import-hd.yaml`,
#          the declarative view #361 was filed for — a bundle picker, a bin picker and a Run
#          button — so a human can choose the square-bin resolution instead of only ever
#          getting the 8 um default. The bin OPTIONS are DERIVED from the container's own
#          declaration (`spatial/visium-hd-bundle`'s `input_requirements.members`) through
#          the new generic `container_members` data source, never a literal `[2,8,16]` in
#          the view: #313's BIN_DIR_RE couples "which bins exist" to the container, and a
#          literal copy would drift the moment the declaration changed. The chosen bin
#          reaches the compute as a STRING (`params.bin_um`): the declarative select is
#          string-valued at the kit level, so the view passes "8" rather than 8, and
#          `select_bin` was widened to parse an exact-integer string, held to an
#          ASCII-scoped grammar — a fullwidth or Arabic-Indic digit, or an NBSP-padded
#          spelling, is refused by name rather than silently read as 8. An untouched form
#          sends NO bin, so the compute takes its own default and records
#          `chose_by == "default"` — the form never fabricates a deliberate choice. The
#          honest limitation is stated in the view: a partial bundle uploaded through the
#          archive arm can lack a bin the form still offers, and the compute then refuses
#          it by name — the form does not make an invalid bin unsubmittable.
#
# 0.4.0 — #450: no value in the store may come from OUTSIDE this bundle. Every object
#          reachable under `/matrix` whose values live in another file — a VIRTUAL dataset
#          or an EXTERNAL-storage dataset — is refused by name, because both can carry
#          values that are not in the bundle at all. An h5py VDS over a missing source
#          file, and a dataset whose raw storage is EXTERNAL over a missing .bin, each
#          pass every shape/length/dtype/monotonicity/ range check this importer already
#          had — the bytes are simply not there to check. MEASURED on the committed 8 µm
#          fixture through the shipped entrypoint,
#          BEFORE the fix: a VIRTUAL `/matrix/indices` imported at rc=0 with 120 output
#          paths and every count attributed to gene 0 (indptr [0, 627, 627, …]); a VIRTUAL
#          `/matrix/data` imported at rc=0 with an all-zero expression matrix. Silent
#          wrong data, no traceback. The EXTERNAL cases were not silent but died with an
#          OSError traceback at rc=1, and the `data` case left a five-path PARTIAL STORE
#          under expression.zarr — violating INV-8. Virtuality cannot be resolved, only
#          refused: h5py gives no signal when a VDS source is missing or mis-shaped, it
#          silently substitutes the fill value, so no content check can catch it (the
#          reasoning recorded on #450 is that Space Ranger never writes a VDS into a
#          filtered_feature_bc_matrix.h5). All four are now named refusals through the
#          existing funnel, raised before the first writer, leaving an empty outputs tree.
#          The check is vendored from the visium sibling's `refuse_malformed_counts`
#          (#349, commit 90e18f7d6), kept inline because HD's matrix validation is inline.
#          HD is now STRONGER than the sibling it was vendored from: the sibling still has
#          only the enumerated form with no link inspection and remains bypassable by an
#          ExternalLink (#462). The member loop's own doors are named too: a missing
#          member, a member that cannot be read (a broken ExternalLink/SoftLink), and a
#          member that is an ExternalLink to another file are refused by name rather than
#          escaping as a raw KeyError traceback.
#
#          FIX_ROUND-2 made the outside-the-bundle check STRUCTURAL. The first cut
#          enumerated the CSC triple and inspected each member's OWN link, so a SoftLink
#          CHAIN walked straight through it: `/matrix/data` -> SoftLink("/matrix/zzz") ->
#          ExternalLink(outside.h5:/data) imported at rc=0 with a full store built from
#          the outside file's all-7s values, and `/matrix` -> SoftLink("/matrix2") ->
#          ExternalLink(outside.h5:/matrix) imported the ENTIRE matrix group from outside
#          the bundle. And the enumeration could not see a non-CSC member: `/matrix/
#          barcodes` as an ExternalLink to an outside file holding the bundle's own
#          barcodes REVERSED imported at rc=0 with the store's barcode axis reversed while
#          the counts columns stayed in the bundle's original order — a silently
#          MISLABELED matrix. So the rule is now structural: every object reachable under
#          `/matrix` must resolve to this bundle's own matrix file, inline — a realpath
#          comparison catches an ExternalLink at ANY depth through ANY number of SoftLink
#          hops for ANY member name, and no dataset may be VIRTUAL or use EXTERNAL raw
#          storage. The known remaining gaps are #461 and its hard-link sibling: a
#          `/matrix` member ALIASING another member in the SAME file — a SoftLink to a
#          different dataset (for example `/matrix/data` -> SoftLink("/matrix/indices")),
#          or an HDF5 HARD LINK to one (MEASURED: `del h5["matrix/data"]; h5["matrix"]
#          ["data"] = h5["matrix/indices"]` imports at rc 0 with the store's `data`
#          holding the INDICES values) — still imports at rc=0 with wrong values. Both
#          are SELF-CONTAINED, so they are a different rule from the outside-the-bundle
#          one, filed separately as #461 and still OPEN; the robust check is that the
#          three CSC members resolve to three DISTINCT `obj.id`s.
#
#          FIX_ROUND-3 closed the structural walk's own crash doors. A COMMITTED (named)
#          HDF5 DATATYPE under `/matrix` has no `.keys()`: MEASURED on the committed 8 µm
#          fixture through the shipped entrypoint, base d010b2cdb -> rc 0, 120 output
#          paths, clean import; HEAD before the refusal -> rc 1, 0 paths, a raw
#          `AttributeError: 'Datatype' object has no attribute 'keys'` traceback. It is
#          now refused by name as "neither a dataset nor a group" (rc 2, 0 paths). GROUP
#          NESTING deeper than 64 levels under `/matrix` is refused by the
#          `MAX_MATRIX_DEPTH = 64` cap: base d010b2cdb -> rc 0, 120 paths; HEAD before
#          the cap and the iterative rewrite -> rc 1, 0 paths, a raw `RecursionError` at
#          3000 levels. The boundary is exact: 64 levels import, 65 refuse.
#
#          THE CAP'S REAL JUSTIFICATION. The walk is ITERATIVE now, so the stack cannot
#          blow, and the `seen` set already bounds total work — the cap is NOT needed for
#          termination or stack safety. What it actually buys is bounding the QUADRATIC
#          PATH-STRING CONSTRUCTION: the walk builds `f"{path}/{key}"` per object, so a
#          1,000,000-deep nesting is on the order of 10^12 character copies plus
#          1,000,000 `realpath` syscalls, in a guard that runs before the first writer,
#          on a VENDOR-CONTROLLED file — a real hang. What the cap does NOT bound is the
#          WIDE case: a million siblings at depth 1 is still a million `realpath` calls,
#          which is linear and deliberately not capped.
#
