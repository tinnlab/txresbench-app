#          and the positions join, so a refusal names the actual defect rather than an
#          innocent bystander file. The whole storage-check block — the member loop over
#          the CSC triple, the structural walk (`_refuse_outside_matrix_objects`) and the
#          seven-consumed-members alias check (`_refuse_aliased_matrix_members`) — moved
#          from after the join to immediately after `group = h5["matrix"]`, before the
#          attrs read, the `/matrix/shape` read, the barcode/feature reads and the join.
#          MEASURED pre-fix through the shipped entrypoint: `/matrix/barcodes` as an
#          ExternalLink to an outside file holding a DIFFERENT barcode set (same length,
#          so the length cross-check passes) was refused with "52 of the matrix's 52
#          barcodes have no row in 'tissue_positions.parquet'" — a wrong diagnosis that
#          sent the operator to the positions file for a defect that is really the
#          ExternalLink. Post-fix the same bundle is refused by name: "'/matrix/barcodes'
#          is an ExternalLink." The alias check needed no repositioning within the block:
#          it was already last, and "last in the moved block" is still "before every read"
#          once the whole block moves earlier. The CSC-consistency block (the two length
#          checks and the #470 `nnz == 0` refusal) did not move.
#
#          #504 adds the order-pinning test for the #470 refusal — NO production code
#          moved for it. TEST-76 builds a matrix with `nnz == 0` but `indptr[-1] == 5`
#          and asserts the `indptr[-1] != nnz` disagreement message fires, not the generic
#          emptiness marker; a mutation ladder proved hoisting the `nnz == 0` block above
#          the two length checks reddens it. The reason for both: diagnosis correctness —
#          a refusal must name the actual defect, not an innocent bystander file.
