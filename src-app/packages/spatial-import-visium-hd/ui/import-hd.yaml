# spatial.import-visium-hd declarative view_spec (issue #361) — the bin PICKER the importer
# never had.
#
# The manifest declares `ui: [ui/import-hd.yaml]`, so this view does NOT name its analysis
# (no `analysis:` back-pointer) and does NOT declare a `layout:` — one analysis renders into
# ONE pane and widgets render in DECLARATION ORDER, so the order below IS the layout (INV-3).
# The manifest declares only load/enable/execute (INV-16); THIS file owns everything the user
# sees + selects and declares its OWN option sources (INV-17). Every input the run consumes
# is a visible control passed EXPLICITLY on `run_processor` — what is launched is what was
# shown (INV-18).
#
# ── WHAT THIS FORM IS FOR ────────────────────────────────────────────────────────────────
#
# `spatial.import-visium-hd` reads `params.json`'s `bin_um` (default 8 µm) and imports ONE
# square bin of a Visium HD `binned_outputs/` bundle. Before this file there was NO form, so
# a human could only ever get the default: the bin was a run parameter with no control, and
# the other two resolutions the bundle carries were reachable only by an agent/MCP call that
# knew the parameter's name. #361 is exactly that gap. This view is the missing surface: a
# bundle picker (the upload container), a bin picker (which resolution to import), and a Run
# button.
#
# ── WHERE THE BIN OPTIONS COME FROM, AND WHY ─────────────────────────────────────────────
#
# The bin options are DERIVED from the container's declaration, never a literal `[2,8,16]`
# written here. #313's BIN_DIR_RE deliberately couples "which bins exist" to the container's
# declaration: `spatial/visium-hd-bundle` declares its twelve members under
# `square_002um/`, `square_008um/` and `square_016um/`, and a literal copy of that set in
# this file would drift the moment the container's declaration changed — the exact coupling
# #313 exists to keep. So the options come from the generic `container_members` data source
# (Part 1, `src-app/ui`): it reads the datatype's `input_requirements.members` out of the
# already-populated client-side datatype registry and offers the DISTINCT leading path
# segments as `{ value, label }` — `square_008um` → `{ value: 8, label: "square_008um" }`.
# The app carries zero of this domain's vocabulary; the container's own declaration is the
# single source of truth.
#
# ── THE HONEST LIMITATION, STATED PLAINLY ────────────────────────────────────────────────
#
# The form offers the bins the container DECLARES, and on the LOOSE-FILE upload arm that
# offer is exactly right: the server refuses an upload unless EVERY declared member is
# present (`dataset/routes.rs` — a declared multi-member container must actually GROUP, or
# the upload is refused BY NAME, and a PARTIAL member set is refused too), so there the
# declaration IS the inventory and a bundle that got in carries every bin this form offers.
# The gap is precisely and ONLY the archive-upload escape
# (`input_requirements.allow_archive: true` plus the `archives_only` arm of the upload
# route): a single `.tar.gz` is stored unexpanded and never validated against the declared
# members, so an archive-uploaded bundle CAN lack a bin the form still offers. The compute
# then REFUSES it by name (`select_bin` in `compute/import_visium_hd.py` raises "which is
# not a bin this bundle carries"). This view does NOT make an invalid bin unsubmittable —
# the compute is the authority, and the refusal names the bin and the bundle's actual set.
# No help text below claims otherwise.
#
# ── THE STRING-VALUED SELECT ──────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
#
# The declarative select is STRUCTURALLY string-valued: the kit's `Select` is typed
# `ValueBinding<string>` (`sdk/packages/kit/src/kit/select.tsx`), so the renderer's
# `toOption` coerces every option value through `String(...)` and `onChange` dispatches the
# chosen bin as a STRING — "8", not 8. This is the repo's documented convention: the
# embedding view's `reduce.yaml` passes `n_hvg`, `n_pcs` and `seed` as TEXT for the same
# reason — "Text-valued because a numeric widget kind is not in the core vocabulary;
# `require.number` holds them to the shared decimal grammar the compute's `int()`/`float()`
# reads". So the bin state field is declared `{ type: string, default: null }` — a STRING
# field whose default is NULL, the "no choice made" state: an untouched form sends NO bin,
# the compute takes its own `DEFAULT_BIN_UM` and records `chose_by == "default"`, and the
# `defaultBinNote` alert below makes that default visible before the run. The setter action
# declares `params: { value: string }`, and the compute's `select_bin` is the side that
# parses the string: it accepts an exact-integer string and refuses everything else exactly
# as it refused a non-number before. The compute's contract is #313's and stays; this form
# speaks it in the type the kit actually hands over.
id: spatial.import-visium-hd
title: Import Visium HD
# Reuse the EXISTING permission — this feature introduces no new gate. The workbench
# dispatches compute jobs, so `jobs::use` (granted to Users) is the gate.
permission: jobs::use

state:
  # The chosen upload container — the `spatial/visium-hd-bundle` dataset this run imports.
  # SINGULAR (single-select): the importer reads exactly one bundle per run. Seeded from the
  # sole compatible candidate when there is one; a picker when there are more.
  bundle: { type: string, default: null }
  # The square-bin resolution to import, as a STRING (see THE STRING-VALUED SELECT above).
  # Default NULL — an untouched form sends NO bin, so the compute takes its own
  # `DEFAULT_BIN_UM` (8 um) and records `chose_by == "default"`; a picked bin is the STRING
  # the picker hands over and records `chose_by == "parameter"`. The default is made VISIBLE
  # by the `defaultBinNote` alert below, not by prefill — prefill would make every launch
  # look like a deliberate choice. The options come from `$data.bins` (the container's
  # declaration), never a literal.
  bin: { type: string, default: null }

data:
  # The bin options — the ONLY source of the bin picker's offer. `container_members` reads
  # the datatype's `input_requirements.members` out of the client-side datatype registry and
  # offers the DISTINCT leading path segments as `{ value, label }` (Part 1, issue #361).
  # `square_008um` → `{ value: 8, label: "square_008um" }` — the renderer then coerces that
  # value through `String(...)` (see THE STRING-VALUED SELECT above), so what the picker
  # hands the setter is "8". The registry is populated asynchronously after auth, so "not
  # there yet" resolves EMPTY — never an error — and the picker's `empty_text` below says
  # what that means.
  bins:
    source: container_members
    args: { datatype: spatial/visium-hd-bundle }

widgets:
  # ── the INPUT, an ordinary field at the top of the SAME form (INV-17/INV-18) ──────
  #
  # Declares its OWN `source`; the manifest's `appliesTo` governs whether the analysis is
  # OFFERED, not what this control LISTS. `slot` is not a UI concept and is absent here — it
  # survives only as the wire key on `run_processor.inputs` (`bundle`). The source names the
  # datatype exactly (`datatype:`, not `subtypes_of:`): the container is the whole offer, and
  # a subtype would be a different container this importer does not read.
  - id: bundlePicker
    kind: artifact_ref
    auto_bind_sole_candidate: true
    label: Visium HD bundle
    source:
      datatype: spatial/visium-hd-bundle
    value: "$state.bundle"
    onChange: hd.setBundle
    require:
      required: true
      message: Choose the Visium HD bundle to import.
    empty_text: >-
      No Visium HD bundle in this project yet — upload one (a Space Ranger binned_outputs
      bundle) to import it.

  # ── the BIN — the whole reason this view exists (#361) ─────────────────────────────
  #
  # A closed set drawn from the DATA (INV-20): the container's own declaration, via the
  # `container_members` slice. The option LABELS are Space Ranger's own `binned_outputs/`
  # directory names, verbatim — the same strings the container's members carry — and the
  # VALUES are the embedded integers, which the renderer hands the setter as STRINGS (see
  # THE STRING-VALUED SELECT above).
  - id: binPicker
    kind: select
    label: Square bin
    help: >-
      Which resolution to import — one bin per run. The options are Space Ranger's own
      binned_outputs/ directory names: 2 um is the native capture grid (enormous and very
      sparse), 8 um is 10x's recommended analysis bin and what this importer uses when a run
      names no bin, 16 um is coarser. The other bins this bundle carries are one re-run away.
    options: "$data.bins"
    value: "$state.bin"
    onChange: hd.setBin
    empty_text: >-
      No bins to choose from — the options come from the container's own declaration, read
      when this view opens. If no bins are offered here, reopen the view. With nothing
      chosen, a run imports the 8 um default.

  # The DEFAULT, made visible as the default BEFORE the run starts. The importer's default
  # is not owner-confirmed (DEC-1 in the manifest), so the form must not absorb it silently:
  # the state default is NULL (an untouched form sends no bin), so THIS alert is the only
  # place the default is visible — the user sees that leaving the picker untouched imports
  # the 8 um default, and that the other two are one re-run away. Two imports at two bins
  # ARE the design's resolution group — every artifact is stamped with `measured_entity`, so
  # the pair is told apart by a field a human reads.
  - id: defaultBinNote
    kind: alert
    tone: info
    text: >-
      Leave the picker untouched and this form imports the 8 um default — 10x's recommended
      analysis bin and what this importer uses when a run names no bin. 2 um is the native
      capture grid: enormous and very sparse. 16 um is coarser. The other bins this bundle
      carries are one re-run away, and together they form a resolution group: each import is
      stamped with its measured entity, so two imports at two bins are told apart by a field
      a human reads.

  - id: runBtn
    kind: button
    label: Import Visium HD
    variant: primary
    # Deliberately NOT `when:` — hiding Run behind the message telling the user to run is
    # the deadlock `DeclarativeRegion` documents. It DERIVES its disabled state from the
    # form's own verdicts (the required bundle), which the engine lists underneath, so it
    # never sits greyed silently.
    onClick: hd.run

actions:
  - id: hd.setBundle
    title: Set the Visium HD bundle
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { bundle: "$params.value" }

  # `value: string`, matching the type the kit's select actually hands over (see THE
  # STRING-VALUED SELECT above): the renderer coerces the option value through `String(...)`,
  # so the setter declares the same type it is fed.
  - id: hd.setBin
    title: Set the square bin
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { bin: "$params.value" }

  # Run — a DECLARED run_processor → wait_for → toast (all in `EFFECT_OPS`), mirroring
  # `markers.yaml`'s `dm.run`. Every input the run consumes is passed EXPLICITLY from view
  # state (INV-18):
  #   · `inputs.bundle` — the chosen upload container (the manifest's `appliesTo.slot`).
  #   · `params.bin_um` — the chosen bin as a STRING when one was picked, or NULL when the
  #     picker was left untouched (the compute then takes its own `DEFAULT_BIN_UM` and
  #     records `chose_by == "default"` — see THE STRING-VALUED SELECT above).
  # Nothing is resolved invisibly between click and job.
  - id: hd.run
    title: Import Visium HD
    permission: jobs::use
    mutating: true
    params: {}
    body:
      - run_processor:
          id: spatial.import-visium-hd
          inputs:
            bundle: "$state.bundle"
          params:
            bin_um: "$state.bin"
          into: hdJob
      - wait_for: { job: "$hdJob", until: completed }
      - toast: { success: "Visium HD bundle imported" }
