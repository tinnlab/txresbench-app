# import-h5ad processor — a PURE DATA package. The `.h5ad` on-ingest CONVERTER
# (`trigger: on-ingest` → launcher-excluded, resolvable by id for the ingest/chaining
# path), registered by the generic `runtime/loadProcessors.ts` with NO app-code. A
# `.h5ad` is only an INPUT format (ingested upstream); this contributes ONLY the
# on-ingest converter — NO workbench view.
#
# The compute script is co-located under `compute/import-h5ad.py`; its stable `code_ref`
# = this analysis' `run.entry`, baked into the binary via `sandbox/processors/mod.rs`
# BUILTINS.
#
# Dual-parsed: the backend extensions loader also parses this file into an
# `ExtensionManifest`; `AnalysisContributionData` carries every FE key verbatim through
# `rest`, so the backend reads only `id` + `run` + `methods` here (`import.h5ad` is
# dispatched via `api.compute.run` → `code_ref`, NOT a backend converter/view).
id: import-h5ad
name: Import AnnData (.h5ad)
publisher: cyto
# 0.3.0 — the manifest/UI separation: `when`/`accepts`/`params`/`defaults`/
# `schedule.resources`/`inStandardRecipe`/`recipeOrder` are GONE (each a LOAD ERROR
# now, DEC-3) and `appliesTo` replaces them. Seed reconciliation is version-keyed, so
# without this bump an already-provisioned deployment keeps a stale extracted manifest
# that now fails to load.
version: 0.3.2
apiVersion: "1.0"
contributes:
  analyses:
    - id: import.h5ad
      category: data-io
      title: Import AnnData (.h5ad)
      description: >-
        Read an uploaded AnnData .h5ad and re-emit it as a typed expression matrix, per-cell
        metadata columns, and a dataset inspect report.
      whenHint: >-
        the user uploaded a .h5ad / AnnData file and wants it imported into the workbench
      examples:
        - import this h5ad
        - load the anndata file
      safety: read-run
      # A CONVERTER (DEC-4): launcher-excluded, still registered + resolvable by id.
      trigger: on-ingest

      # ── APPLICABILITY ─────────────────────────────────────────────────────────
      #
      # Replaces `when: has:single-cell/anndata` (a weaker restatement of the same
      # selector that could never independently fail), the `accepts` list (+ its
      # redundant `required: true` — everything here is required by definition, DEC-5),
      # and `params.fields`, a form schema wrapping a copy of the same selector. The
      # slot NAME (`input`) was that form's only non-redundant content and survives as
      # `slot:` — the key a caller sends and the key the compute resolves out of
      # `/inputs/inputs.json`.
      appliesTo:
        - slot: input
          type_id: single-cell/anndata

          # ITEM-29f / DEC-15 — DECLARED, because it is the behaviour this slot has always had.
          # Two paths bind a sole candidate for this slot with NO UI at all: `resolveInputs` at
          # launch (an agent/MCP call that supplied nothing) and `autoPickSoleArtifacts` from a
          # mount effect. Neither can show what it bound, so under R2/INV-3 neither may bind
          # unless the analysis says so. Absence means OFF.
          auto_bind_sole_candidate: true
      produces:
        - single-cell/expression
        - metadata-column
        - report/html
        - report/qc

      # No `ui:` — this package ships no view spec (an on-ingest converter is not
      # launched by a person), so the generic fallback form applies. The absence of the
      # key is now an explicit declared state rather than an empty directory.

      # `defaults: { input: "" }` is GONE — an empty string is the ABSENCE of a value,
      # not a default, and the compute owns absence at `params.json`.

      # The env image this contribution runs inside (#191 / E3). DECLARED, not inferred,
      # so the #80 dependency gate resolves its `run.dependencies` against THIS env's pin
      # set only. An env-LESS declaration is resolved against EVERY recipe on disk
      # (`server/build_helper/processor_manifest.rs`) — the fail-closed reading, and
      # exactly right while one recipe exists; with a second, deliberately narrower env
      # (`single-cell-r`) it would demand these python pins be installed there too. The
      # gate's own doc-comment prescribes this fix in writing: "the right relaxation is
      # for a contribution to DECLARE the env it targets, not for this gate to guess".
      env: single-cell
      run:
        kind: sandbox
        runtime: python
        entry: compute/import-h5ad.py
        # The libraries THIS entry's code imports, with the version range it is
        # supported against (#80). A minor-pinned range where the library's DEFAULTS decide a published
        # number; a wider one where it is a stable numerical floor.
        dependencies:
          - { library: anndata, version: ">=0.12,<0.13" }
          - { library: numpy, version: ">=2.0,<3" }
          - { library: pandas, version: ">=2.2,<3" }
          - { library: scipy, version: ">=1.14,<2" }
      # `resources: { cpu: 2, mem: 8Gi }` is GONE — nothing read it (`jobsCapability`
      # rebuilds the spec as `{ class }`); real limits come from the singleton sandbox
      # settings row.
      schedule:
        class: normal
      arch: [x86_64, aarch64]
      methodsText: >-
        Imported the AnnData .h5ad with scanpy read_h5ad; re-emitted the count matrix and obs
        columns as typed workstore artifacts.
      # `inStandardRecipe: true` / `recipeOrder: 1` are GONE — zero consumers in either
      # language.
