# clustering — SINGLE-DATASET Leiden clustering of an embedding (Stage 0).
#
# ONE analysis, `clustering.cluster`: it consumes an `embedding` (a PCA / latent
# representation), rebuilds the kNN graph FROM that embedding (never a 2-D UMAP/t-SNE
# layout — INV-11), partitions it with Leiden (igraph flavor → modularity), and commits
# the per-cell cluster label as a categorical `metadata-column` (owner DEC-9(c) / INV-2)
# plus a `report/qc` provenance report. The label is NOT an exclusive `clustering`
# datatype: a cluster label IS a categorical per-cell column, which the shipped
# single-cell-viz colour-by `Groups` slice colours for free (INV-16, zero src-app edit).
#
# THE MANIFEST DECLARES ONLY WHAT THE WORKBENCH NEEDS TO LOAD, ENABLE AND EXECUTE
# (INV-19). No labels, no help text, no field order, no form schema, no forecast of
# produced columns — those are read from the produced artifacts. The `ui:` key (Stage C)
# NAMES the view files whose CONTENTS the manifest does not describe: the run form
# (`ui/clustering.yaml`) + the descriptive-markers readout (`ui/markers.yaml`), which stack
# in order in the analysis' single pane. The view owns everything seen + selected (INV-17).
#
# Dual-parsed, like every processor manifest: the backend extensions loader parses it into
# an `ExtensionManifest` at boot and reads only `id` + `run` + `methods`.
id: clustering
name: Clustering
publisher: cyto
# 0.1.0 — Stage-0 Stage-A: the package skeleton + `clustering.cluster`'s CORE compute
# (embedding read, kNN-on-embedding, Leiden igraph/modularity, singleton reassignment,
# determinism pin, ceiling gate, the categorical `metadata-column` output + full
# provenance record).
# 0.2.0 — Stage-0 Stage-B: the DESCRIPTIVE per-cluster markers pass. When an `expression`
# matrix is bound, `sc.tl.rank_genes_groups(method='wilcoxon', tie_correct, pts)` (wilcoxon
# EXPLICIT — DEC-3) is folded into the `report/qc` report as a RANKING carrying the
# double-dipping / circularity disclosure (CL-INV-1, doc 10 §4); NO between-cluster p-value
# / FDR is headlined as inference.
# 0.3.0 — Stage-0 Stage-C: the two declarative views land (`ui/clustering.yaml` — the run
# form; `ui/markers.yaml` — the descriptive-markers readout that SURFACES the report's
# double-dipping disclosure). The analysis now declares `ui:` instead of falling back to the
# generic form. The coloured-UMAP-by-cluster is FREE (the categorical `metadata-column` +
# the shipped colour-by section, INV-16); no bespoke colour surface is added. The full test
# sweep is Stage D.
# 0.3.1 — Stage-0 conformance: `cluster.py` declares its input slots (`embedding`,
# optional `expression`) as module-level `*_SLOT` constants so the VIEW↔COMPUTE seam
# reader confirms it resolves what `clustering.yaml` binds; the `embedding` single-value
# input slot opts in to `auto_bind_sole_candidate` (DEC-15). Metadata/declaration only —
# no compute behaviour, output or attributes.cyto change.
# 0.3.3 — the package's zero-src-app-diff guard is now SELF-LIMITING: it runs only on the
# branch that introduced this package (add-only marker on this manifest) and SKIPS
# visibly elsewhere, instead of re-asserting this branch's diff shape on every future
# branch. Test-only; no compute, view or datatype behaviour changes. See
# docs/design/derived-guards.md §3. Seed reconciliation is version-keyed, hence the bump.
version: 0.3.4
apiVersion: "1.0"
contributes:
  analyses:
    - id: clustering.cluster
      category: clustering
      title: Cluster cells
      description: >-
        Partition one single-cell embedding into cluster labels: rebuild a kNN graph from
        the embedding (the PCA / latent representation, never a 2-D layout), then run Leiden
        (igraph flavor → modularity). Commits the per-cell cluster label as a categorical
        metadata column that colours the UMAP for free, plus a provenance report. The
        resolution is a reported operating parameter, not a discovered number of clusters.
      whenHint: >-
        the user has an embedding (a PCA / latent) and wants to group cells into clusters to
        annotate / visualise / compare from
      examples:
        - cluster these cells
        - run Leiden on this embedding
        - find cell clusters at resolution 1.0
      safety: read-run

      # ── APPLICABILITY (ITEM-1) — keys on the DATATYPE, SINGLE-select (INV-18) ────────
      # Any `embedding` of ≥3 dims qualifies, regardless of which producer made it; the
      # 2-D-layout refusal is a compute-side named refusal (INV-11), not a platform edit.
      appliesTo:
        - slot: embedding
          type_id: embedding
          # DEC-15 opt-IN: a headless (agent/MCP) launch that supplied nothing auto-binds
          # this single-value input when exactly one candidate exists; omitting it leaves
          # the input unresolved. Single-select, so the sole-candidate bind is unambiguous.
          auto_bind_sole_candidate: true

      # A GRAPH EDGE (`chaining.ts`), never an availability input: it lets the workbench
      # answer "which analysis yields this input?" (→ "run Reduce dimensions first").
      # `single-cell/expression` is the OPTIONAL markers input (Stage B): a graph edge, not
      # an availability gate — clustering runs labels-only without it, and the compute
      # resolves the `expression` slot from `/inputs/inputs.json` when it is bound. Absence
      # means labels-only (no descriptive markers), never a fabricated marker table.
      consumes: [embedding, single-cell/expression]

      # The DATATYPES it emits, and nothing finer (INV-19). A categorical `metadata-column`
      # (the cluster label — owner DEC-9(c)) + a `report/qc` provenance report. It does NOT
      # emit an exclusive `clustering` datatype (which the colour-by section cannot read).
      produces: [metadata-column, report/qc]

      # The declarative VIEWS (Stage C, INV-17). Package-relative + MUST exist (a `ui:` entry
      # naming a missing view file is a LOAD ERROR). The manifest names the files; it does NOT
      # describe their contents. They stack in this order in the analysis' single pane: the run
      # form first, the descriptive-markers readout below it.
      ui:
        - ui/clustering.yaml
        - ui/markers.yaml

      # The env image this contribution runs inside (#191 / E3). DECLARED, not inferred,
      # so the #80 dependency gate resolves its `run.dependencies` against THIS env's pin
      # set only. An env-LESS declaration is resolved against EVERY recipe on disk
      # (`server/build_helper/processor_manifest.rs`) — the fail-closed reading, and
      # exactly right while one recipe exists; with a second, deliberately narrower env
      # (`single-cell-r`) it would demand these python pins be installed there too. The
      # gate's own doc-comment prescribes this fix in writing: "the right relaxation is
      # for a contribution to DECLARE the env it targets, not for this gate to guess".
      env: single-cell
      run:
        kind: sandbox
        runtime: python
        entry: compute/cluster.py
        # The shared compute substrate + the descriptive-markers pass, staged into `/code`
        # beside the entry so `import _shared` / `import _markers` resolve.
        helpers:
          - compute/_shared.py
          - compute/_markers.py
        # The libraries THIS entry's code imports, with the version range it is
        # supported against (#80). A minor-pinned range where the library's DEFAULTS decide a published
        # number; a wider one where it is a stable numerical floor.
        dependencies:
          - { library: anndata, version: ">=0.12,<0.13" }
          - { library: numpy, version: ">=2.0,<3" }
          - { library: pandas, version: ">=2.2,<3" }
          - { library: scanpy, version: ">=1.11,<1.12" }
          - { library: igraph, version: ">=0.11,<2" }
          - { library: leidenalg, version: ">=0.10,<1" }
          - { library: scipy, version: ">=1.14,<2" }

      # `normal` ⇒ 4 GiB / 2 cores / 600 CPU-s (DEC-8). A labels-only single-dataset run
      # sits comfortably inside the Normal envelope; the markers pass (Stage B) re-checks the
      # SAME Normal memory ceiling before the CSC read and, when a matrix would exceed it,
      # refuses BY NAME pointing at a REACHABLE lever — a smaller single dataset or raising
      # the deployment's sandbox memory limit (INV-10). This package ships ONE analysis fixed
      # at `class: normal` with no per-run class control (DEC-8), so the refusal never names a
      # `batch` class as the escape hatch — there is none to reach (F2).
      schedule:
        class: normal
      arch: [x86_64, aarch64]

      methodsText: >-
        Partitioned the cells into clusters: rebuilt a k-NN graph over the input embedding
        and ran Leiden (igraph flavor, modularity objective) at the recorded resolution. The
        cluster label was committed as a per-cell categorical column; the embedding was not
        modified. When an expression matrix was bound, DESCRIPTIVE per-cluster marker genes
        were computed (Wilcoxon rank-sum, tie-corrected) and reported as a ranking — these
        are descriptive, not inferential: because the clusters were defined from the same
        cells, between-cluster marker p-values are anti-conservative by construction (double
        dipping) and are not reported as evidence.

      # KEPT + load-bearing: `server/.../provenance/export/methods.rs` reads
      # `contributes.analyses[<id>].methods` to narrate the exported `methods.md`. The
      # package declares the nouns + which ROLE each param plays; a param with no declared
      # role is DISCLOSED BY NAME by the narrator, never silently dropped (ITEM-15).
      methods:
        subject: { singular: cell, plural: cells }
        action: clustered
        commits: "one per-cell cluster-label column, labelled `{name}`"
        commits_unlabeled: a per-cell cluster-label column
        note: >-
          The kNN graph is rebuilt from the embedding (never a 2-D layout); Leiden uses the
          igraph flavor with the modularity objective, so `resolution` is comparable only
          within that objective. The embedding is not modified. Descriptive marker genes, when
          an expression matrix is bound, use the Wilcoxon rank-sum test (explicit, tie-
          corrected) and are reported as a ranking; because the clusters were defined from the
          same cells, between-cluster marker p-values are double-dipped and are not reported.
        # Only params whose ROLE is in the closed narration vocabulary are mapped; the rest
        # (`resolution`/`n_neighbors`/`metric`/`n_top_markers`) are DISCLOSED BY NAME by the
        # runtime narrator.
        params:
          seed: seed
          name: output_label
