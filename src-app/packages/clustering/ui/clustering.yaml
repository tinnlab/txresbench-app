# clustering.cluster declarative view_spec (Stage-0 Stage-C, ITEM-13).
#
# The RUN FORM. The MANIFEST declares `ui: [ui/clustering.yaml, ui/markers.yaml]`, so this
# view names no analysis (no `analysis:` back-pointer) and no `layout:` — one analysis renders
# into ONE pane and its `ui:` fragments stack in the order the manifest lists them, widgets in
# DECLARATION ORDER, so the order below IS the layout of the run form (INV-19). The manifest
# declares only load/enable/execute (INV-16); THIS file owns everything the user sees +
# selects and declares its OWN option sources (INV-17). Every input the run consumes is a
# visible control passed EXPLICITLY on `run_processor` — what is launched is what was shown
# (INV-18). The output-name taken set is DERIVED from the chosen embedding's cells axis
# (INV-20), never a hardcoded closed list.
#
# The twin of `embedding/ui/reduce.yaml` / `qc/ui/qc.yaml` (one input, a handful of
# parameters, one Run) with `cell-filter`'s output-name `not_in` guard grafted on. It reuses
# the EXISTING permission — clustering introduces no new gate; the workbench dispatches compute
# jobs, so `jobs::use` (granted to Users) is the gate (mirrors `cell-filter`/`qc`).
id: clustering.cluster
title: Cluster cells
permission: jobs::use

state:
  # The ONE embedding this run partitions (a PCA / Harmony latent — the reduced space, never a
  # 2-D layout, INV-11). SINGULAR (single-select, INV-18): Stage-0 clustering is single-dataset
  # and the compute REFUSES >1. Seeded from the sole candidate when there is one; a picker
  # otherwise. `null`, never "" — a closed-set control's default is null.
  embedding: { type: string, default: null }
  # The OPTIONAL cells × genes expression matrix. When bound → the DESCRIPTIVE per-cluster
  # markers pass runs (Stage B) and the markers readout below has content; empty → labels only
  # (no fabricated marker table). `null` is a legitimate default — labels-only is a real run.
  expression: { type: string, default: null }
  # The operating resolution — a REPORTED parameter, not a discovered "true k" (INV-21). Default
  # 1.0 (scanpy convention, owner DEC-1). Text-valued because a numeric widget kind is not in
  # the core vocabulary; `require.number` holds it to the decimal grammar the compute reads.
  resolution: { type: string, default: "1.0" }
  # n_neighbors — FIXED at the documented default and EXPOSED (INV-14): the tuned dial is
  # `resolution`, not this. Recorded, never jointly swept with resolution.
  nNeighbors: { type: string, default: "15" }
  # The neighbour metric — a RECORDED choice, never claimed correct (INV-7).
  metric: { type: string, default: "euclidean" }
  seed: { type: string, default: "0" }
  # The output cluster-label member NAME (the cells-axis column the run commits). Not "" — a
  # column name has no empty answer (the run invents none), so a blank default would ship a
  # form invalid the instant it opens. `leiden` is the compute's own fallback.
  name: { type: string, default: "leiden" }

data:
  # The cells-axis members already on the CHOSEN embedding's dataset — the taken-set the
  # output-name `not_in` reads (its KEYS). Catalog-only (`as: sources`): names + ids, no
  # bodies (INV-11). Skipped until an embedding is chosen. Mirrors reduce/visualize/cell-filter.
  obsSources:
    source: axis_columns
    args: { of: "$state.embedding", axis: cells, as: sources }

const:
  # The distance-metric vocabulary as DATA (the `metricPicker` options). An OPEN, RECORDED
  # choice (INV-7): VALUES are the strings the compute compares (`cluster.py`: `metric` on
  # `sc.pp.neighbors`); LABELS are the user's reading. The help below states it is recorded,
  # not recommended, so nothing on screen presents one metric as correct.
  metrics:
    - { value: "euclidean", label: "euclidean" }
    - { value: "cosine", label: "cosine" }
    - { value: "correlation", label: "correlation" }
    - { value: "manhattan", label: "manhattan" }

widgets:
  # ── the INPUT embedding (INV-11/INV-17/INV-18) ────────────────────────────────────
  #
  # Keys on the `embedding` DATATYPE regardless of producer (INV-17); the manifest's
  # `appliesTo` governs whether the analysis is OFFERED, not what this control LISTS. `slot`
  # is not a UI concept and is absent here — it survives only as the wire key on
  # `run_processor.inputs` (`embedding`).
  - id: embeddingPicker
    kind: artifact_ref
    auto_bind_sole_candidate: true
    label: Embedding
    source: { datatype: embedding }
    value: "$state.embedding"
    onChange: cl.setEmbedding
    require:
      required: true
      message: >-
        Choose the embedding to cluster — a PCA / latent reduced space, never a 2-D layout.
    empty_text: >-
      No embedding in this project yet — run a reduce (or import a latent) to produce one to
      cluster.

  # ── RESOLUTION — the tuned dial, LABELLED WITH ITS OBJECTIVE (INV-4/INV-21) ─────────
  #
  # The field is labelled with the objective it drives (the modularity family): a `resolution`
  # value is only comparable WITHIN one flavor+objective, so the label + help state which, and
  # the compute refuses a cross-objective comparison (`cluster.py::refuse_cross_objective_
  # comparison`). It is a reported operating parameter, never a discovered "true" number of
  # clusters (INV-21) — the help says so.
  - id: resolutionInput
    kind: text
    label: Resolution (modularity objective)
    help: >-
      Higher resolution → more, smaller clusters. This drives Leiden's modularity objective, so
      the number is comparable only within that objective (not against a CPM run). It is a
      reported operating parameter you chose, not a discovered "true" number of clusters.
    value: "$state.resolution"
    placeholder: "1.0"
    onChange: cl.setResolution
    require:
      number: { min: 0 }
      message: The resolution must be a number greater than 0.

  # ── n_neighbors — FIXED default, exposed (INV-14) ─────────────────────────────────
  - id: nNeighborsInput
    kind: text
    label: Neighbours
    help: >-
      Fixed at the documented default; the dial to tune is the resolution above, not this. It
      is recorded so a run is reproducible, and is not jointly swept with the resolution.
    value: "$state.nNeighbors"
    placeholder: "15"
    onChange: cl.setNNeighbors
    require:
      number: { integer: true, min: 1 }
      message: The neighbour count must be a whole number ≥ 1.

  # ── the METRIC — a RECORDED choice, never claimed correct (INV-7) ─────────────────
  - id: metricPicker
    kind: select
    label: Distance metric
    help: >-
      The neighbour metric is recorded as the choice you made — no metric is claimed correct
      for every embedding.
    options: "$const.metrics"
    value: "$state.metric"
    onChange: cl.setMetric

  - id: seedInput
    kind: text
    label: Random seed
    value: "$state.seed"
    placeholder: "0"
    onChange: cl.setSeed
    require:
      number: { integer: true, min: 0 }
      message: The seed must be a whole number ≥ 0.

  # ── the OPTIONAL markers input (Stage B) ──────────────────────────────────────────
  #
  # When bound, the run describes what each cluster expresses (descriptive markers → the
  # markers readout below). Empty is a REAL answer — labels-only clustering never reads the
  # counts, so this carries NO `require`. It is a graph edge in the manifest
  # (`consumes: single-cell/expression`), a genuine input here (INV-18): what is launched is
  # what was shown.
  - id: expressionPicker
    kind: artifact_ref
    auto_bind_sole_candidate: true
    label: Expression matrix (optional — for descriptive markers)
    help: >-
      Bind the cells × genes count matrix to describe what each cluster expresses (descriptive
      per-cluster markers). Leave empty to commit the cluster labels only — no marker table is
      fabricated without it.
    source: { subtypes_of: single-cell/expression }
    value: "$state.expression"
    onChange: cl.setExpression
    empty_text: >-
      No expression matrix in this project — the run will commit cluster labels only, without
      descriptive markers.

  # ── the OUTPUT NAME — the cells-axis member the run commits ───────────────────────
  #
  # `not_in` the whole cells axis (`obsSources`' KEYS): runs coexist provenance-immutable, so a
  # second column under an existing name would leave two columns with one name and a reader
  # keeps whichever came last. Mirrors reduce/visualize/cell-filter's name field.
  - id: nameInput
    kind: text
    label: Output cluster-label name
    value: "$state.name"
    placeholder: "e.g. leiden"
    onChange: cl.setName
    require:
      required: true
      not_in: "$data.obsSources"
      message:
        required: >-
          The cluster label needs a name — it is the cells-axis member this run commits, and
          the run refuses to invent one.
        not_in: >-
          "{value}" is already a column on this dataset's cells axis. Committing a second one
          under that name would leave two columns with one name, so pick another.

  - id: runBtn
    kind: button
    label: Cluster cells
    variant: primary
    # Deliberately NOT `when:` — hiding Run behind the message telling the user to run is the
    # deadlock `DeclarativeRegion` documents. It DERIVES its disabled state from the form's own
    # verdicts (the required embedding, the number constraints, the name guard), which the
    # engine lists underneath, so it never sits greyed silently.
    onClick: cl.run

# NO view-side over-ceiling refusal (mirrors reduce's ITEM-10 note): the honest predicate needs
# the chosen embedding's DECLARED cell count as a scalar, and no `data:` source in the shipped
# vocabulary exposes it — expressing it would need a NEW `src-app/ui` data source, which breaks
# INV-16/INV-19. The TIME (labels) / MEMORY (markers) ceilings are enforced COMPUTE-side before
# a byte is read (`cluster.py` `ceiling_refuse_if_over` / `markers_memory_refuse_if_over`,
# ITEM-9/INV-10), which an agent/MCP call that never rendered this form reaches too.

actions:
  - id: cl.setEmbedding
    title: Set the input embedding
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { embedding: "$params.value" }

  - id: cl.setExpression
    title: Set the expression matrix
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { expression: "$params.value" }

  - id: cl.setResolution
    title: Set the resolution
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { resolution: "$params.value" }

  - id: cl.setNNeighbors
    title: Set the neighbour count
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { nNeighbors: "$params.value" }

  - id: cl.setMetric
    title: Set the distance metric
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { metric: "$params.value" }

  - id: cl.setSeed
    title: Set the random seed
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { seed: "$params.value" }

  - id: cl.setName
    title: Set the output cluster-label name
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { name: "$params.value" }

  # Run — a DECLARED run_processor → wait_for → toast. Every input the run consumes is passed
  # EXPLICITLY from view state (INV-18):
  #   · `inputs.embedding` — the chosen embedding (single-select, INV-18).
  #   · `inputs_from` binds the OPTIONAL `expression` slot to the chosen matrix, gated on one
  #     being chosen — no expression, no binding, labels-only.
  #   · `params` — the resolution / n_neighbors / metric / seed / output name.
  # Nothing is resolved invisibly between click and job.
  - id: cl.run
    title: Cluster cells
    permission: jobs::use
    mutating: true
    params: {}
    body:
      - run_processor:
          id: clustering.cluster
          inputs:
            embedding: "$state.embedding"
          inputs_from:
            - when: "$state.expression"
              slot: "expression"
              artifact: "$state.expression"
          params:
            resolution: "$state.resolution"
            n_neighbors: "$state.nNeighbors"
            metric: "$state.metric"
            seed: "$state.seed"
            name: "$state.name"
          into: clusterJob
      - wait_for: { job: "$clusterJob", until: completed }
      - toast: { success: "Cluster labels computed" }
