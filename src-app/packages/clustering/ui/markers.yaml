# clustering markers readout declarative view_spec (Stage-0 Stage-C, ITEM-14 / CL-INV-1).
#
# The PAYOFF READOUT (J1a — "what defines a cluster"). It is the SECOND `ui:` fragment of the
# `clustering.cluster` analysis (`ui: [ui/clustering.yaml, ui/markers.yaml]`): the manifest
# stacks its fragments in order, so this renders BELOW the run form in the same analysis pane
# (`viewSpec.ts`: "several `ui:` files of one analysis stack in the order the manifest lists
# them"). It names no analysis and no `layout:` (INV-19).
#
# ── THE COLOURED UMAP IS NOT HERE, AND THAT IS THE POINT (INV-16 / owner DEC-9(c)) ──────
# The ★ payoff — the UMAP coloured by cluster — is FREE and is NOT re-implemented here. The
# cluster label is emitted as a categorical `metadata-column` (`cluster.py`
# `write_metadata_column`), which the SHIPPED `single-cell-viz` colour-by section binds for
# free: `single-cell-viz/ui/colour-by.yaml:90-96` binds `datatype: metadata-column` and splits
# `kind: categorical (Groups)`, and `rowSpaceColumns.ts:429` filters datatype by EXACT
# equality — so the fresh cluster column is listed + colourable with ZERO clustering-specific
# view code and ZERO src-app edit. A bespoke colour surface here would be the defect INV-16
# forbids. `test_colour_by_binding.py` is the data-level proof of the free colour-by.
#
# ── WHAT IS HERE — the descriptive marker TABLE (no dotplot binding ships yet) ──────────
# There is no shipped `single-cell-viz` dotplot/matrixplot binding to reuse, so this declares a
# TABLE view of the `report/qc` markers (the plan's fallback). It reads the produced
# `clustering-report` via the shipped `job.result` document source (the twin of
# `embedding-integrate/ui/embedding-integrate.yaml`'s `jq` slice), narrowed to THIS analysis
# (`produced_by: clustering.cluster`) and discriminated by `kind: clustering-report`. The
# markers are DESCRIPTIVE, and the disclosure below states why (CL-INV-1).
id: clustering.markers
title: Cluster markers
# Reuse the EXISTING permission — this readout introduces no new gate (mirrors the run form).
permission: jobs::use

state:
  # Which cluster's top markers the table shows. `null` until chosen — the absence of a choice,
  # answered by the picker's `empty_text`, not "" (a chosen member of a set with no such member).
  markerCluster: { type: string, default: null }

data:
  # THE PRODUCED clustering-report, read as a DOCUMENT (INV-17 — a fact about produced data is
  # READ from the artifact, never forecast in the manifest). `shape: document` because the
  # report is a discriminated `{kind, levels, markers, …}` object, NOT a columnar table — the
  # columnar reader would zip its unequal-length members and drop `kind` (the defect
  # `embedding-integrate`'s `jq` documents). `kind: clustering-report` asserts exactly the
  # discriminator the columnar decode used to drop; `produced_by: clustering.cluster` narrows to
  # THIS analysis so a sibling `report/qc` (QC / cell-filter) never shadows it.
  report:
    source: job.result
    args:
      datatype: report/qc
      produced_by: clustering.cluster
      shape: document
      kind: clustering-report

widgets:
  # ── THE DOUBLE-DIPPING DISCLOSURE, SURFACED FROM THE REPORT (CL-INV-1, single source) ──
  #
  # The circularity disclosure is ALREADY in the report (Stage B — `_markers.py::
  # MARKER_DISCLOSURE`, folded into `report.markers.disclosure` by `cluster.py`). This alert
  # SURFACES that copy — `text` is the report's own field, resolved by the engine — so there is
  # ONE source of the sentence and no second copy to drift from it. It renders whenever a
  # clustering-report exists (markers computed OR skipped: the compute records the disclosure in
  # both arms), which is why it is gated on the markers block, not on the per-cluster table.
  - id: doubleDippingNote
    kind: alert
    tone: warning
    when: "$data.report.markers != null"
    text: "$data.report.markers.disclosure"

  # ── WHICH CLUSTER — options DERIVED from the produced report (INV-17/INV-20) ──────────
  #
  # The cluster ids come from the report's own explicit sorted `levels` set (INV-15), read from
  # the artifact, never a forecast list. Data-dependent, so it declares its own `empty_text`.
  - id: clusterPicker
    kind: select
    label: Cluster
    options: "$data.report.levels"
    value: "$state.markerCluster"
    onChange: mc.setMarkerCluster
    empty_text: >-
      No clusters yet — run the clustering above, binding an expression matrix, to list clusters
      and their descriptive markers.

  # ── the DESCRIPTIVE marker TABLE for the chosen cluster ───────────────────────────────
  #
  # Rows are the chosen cluster's top descriptive markers, read from the report
  # (`markers.per_cluster[<cluster>]`). A RANKING — score + effect size (log2fc) + in-cluster
  # expression fraction — never a p-value / FDR (the compute drops those, CL-INV-1). Empty until
  # a cluster is chosen, or when the run was labels-only (no expression bound → no marker table
  # is fabricated).
  - id: markersTable
    kind: table
    rows: "$data.report.markers.per_cluster[$state.markerCluster]"
    empty_text: >-
      Choose a cluster above to see its top descriptive marker genes. If the run was
      labels-only (no expression matrix bound), there are no markers to show — re-run binding an
      expression matrix.
    columns:
      - key: gene
        title: Gene
        value: "$row.gene"
        ellipsis: true
      - key: rank
        title: Rank
        value: "$row.rank"
      - key: score
        title: Score
        value: "$row.score"
      - key: log2fc
        title: log2FC
        value: "$row.log2fc"
      - key: pct_in
        title: Fraction expressing
        value: "$row.pct_in"

actions:
  - id: mc.setMarkerCluster
    title: Set the cluster to inspect
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { markerCluster: "$params.value" }
