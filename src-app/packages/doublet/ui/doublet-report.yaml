# doublet.detect readout declarative view_spec — the produced report.
#
# The SECOND `ui:` fragment of the `doublet.detect` analysis (`ui: [ui/doublet.yaml,
# ui/doublet-report.yaml]`): the manifest stacks its fragments in order, so this renders BELOW
# the run form in the same analysis pane. It names no analysis and no `layout:`.
#
# ── THE COLOURED UMAP IS NOT HERE, AND THAT IS THE POINT ────────────────────────────────
# Colouring an embedding by the doublet call is FREE and is NOT re-implemented here. The call
# is emitted as a CATEGORICAL `metadata-column`, which the SHIPPED `single-cell-viz` colour-by
# section binds for free (it binds `datatype: metadata-column` and splits `kind: categorical`
# into its Groups slice, and `rowSpaceColumns.ts` filters datatype by EXACT equality); the
# continuous score reaches the same section's Values slice. A bespoke colour surface here
# would be the defect that property exists to prevent. `test_colour_by_binding.py` is the
# data-level proof.
#
# ── WHAT IS HERE — and the ONE thing the vocabulary cannot express ──────────────────────
# The judgement this readout has to support is "is the simulated-score distribution BIMODAL,
# and therefore is the automatic call trustworthy at all?" That wants a distribution PLOT with
# the threshold drawn as a cutline. Stating the obstacle precisely, because the convenient
# version of it is wrong:
#
#   * `histogram` is NOT in the core `WIDGET_KINDS` (select, text, multiselect, range_slider,
#     list-editor, tabs, token-input, table, button, alert, stat, group, dataset-picker,
#     artifact_ref) — but it IS a registered EXTENSION widget kind
#     (`extensions/canvas/installCanvasWidgets.ts` registers it, and `parseViewSpec` accepts
#     any kind `hasWidget()` knows), so "the vocabulary cannot express it" is false.
#   * The real obstacle is that those renderers are DEAD: `installCanvasWidgets.ts` says so in
#     as many words — "no shipping `view_spec` instantiates `kind: … histogram …`" — each one
#     mounts a second `<Viz>`, and none is exercised by any shipped view or by the gate. A
#     package view would be the first caller of an untested renderer, on data (`shape:
#     document`) that is not the columnar frame the series binding expects.
#
# So the distribution ships as a BINS TABLE with each bin marked above/below the cut and the
# bin containing it flagged, plus the threshold and the plotted range as `stat`s. That is the
# fallback #128 sanctions for the cutline, extended to the plot itself, taken
# deliberately rather than by smuggling a core viz change into a package. The missing
# capability — a distribution plot with a threshold cutline over an analysis' own report
# document — is a SHARED platform gap that every thresholding analysis will want, and it is
# recorded for the epic owner in this package's DECISIONS record (DEC-10). It is NOT yet a
# filed issue, and this comment says so rather than claiming a filing that was not made.
id: doublet.report
title: Doublet report
# Reuse the EXISTING permission — this readout introduces no new gate (mirrors the run form).
permission: jobs::use

state:
  # Which batch's simulated-score distribution the table shows. `null` until chosen — the
  # absence of a choice, answered by the picker's `empty_text`, not "".
  histogramBatch: { type: string, default: null }

data:
  # THE PRODUCED doublet-report, read as a DOCUMENT. `shape: document` because the report is a
  # discriminated `{kind, batches, disclosure, …}` object, NOT a columnar table — the columnar
  # reader would zip its unequal-length members and drop `kind`. `kind: doublet-report` asserts
  # exactly that discriminator; `produced_by: doublet.detect` narrows to THIS analysis so a
  # sibling `report/qc` (QC / clustering / cell-filter) never shadows it.
  report:
    source: job.result
    args:
      datatype: report/qc
      produced_by: doublet.detect
      shape: document
      kind: doublet-report

widgets:
  # ── THE BATCHING STATE, stated plainly and FIRST ──────────────────────────────────
  #
  # This is the one thing a reader must not have to go looking for. Both alerts surface the
  # report's OWN sentence (`disclosure.batching`, written by the compute in both arms), so
  # there is ONE source of the text and no second copy to drift from it.
  - id: unbatchedWarning
    kind: alert
    tone: warning
    when: "$data.report.batched == false"
    text: "$data.report.disclosure.batching"
  - id: batchedNote
    kind: alert
    tone: info
    when: "$data.report.batched == true"
    text: "$data.report.disclosure.batching"

  # ── THE REFUSAL, when it happened ─────────────────────────────────────────────────
  #
  # No threshold could be determined anywhere, so NO call column exists. Saying so here is the
  # difference between "this analysis produced no call and told me why" and a user hunting for
  # a column that was deliberately not written.
  - id: noCallWarning
    kind: alert
    tone: warning
    when: "$data.report.call_emitted == false"
    text: >-
      No doublet CALL was produced for this run: the simulated-score histogram is not bimodal,
      so Scrublet's automatic threshold has no honest cut point and none was invented. The
      doublet SCORE column was still committed and is usable. To get a call, re-run with an
      explicit threshold — read it off the distribution below.

  # ── the run's headline numbers ────────────────────────────────────────────────────
  - id: cellsScoredStat
    kind: stat
    label: Cells scored
    value: "$data.report.n_evaluated"
  - id: calledStat
    kind: stat
    when: "$data.report.call_emitted == true"
    label: Called doublets
    value: "$data.report.n_called"
  - id: batchesStat
    kind: stat
    label: Samples scored independently
    value: "$data.report.n_batches"
  - id: batchColumnStat
    kind: stat
    when: "$data.report.batched == true"
    label: Sample column
    value: "$data.report.batch_column"
  - id: scanpyStat
    kind: stat
    label: scanpy version
    value: "$data.report.scanpy_version"

  # ── PER-SAMPLE SUMMARY — the rate and threshold that were actually used ───────────
  #
  # One row per independently scored population. The rate column is the visible proof of the
  # per-sample prior: on a batched run these differ between rows, because each is derived from
  # THAT sample's own cell count rather than from the merged total.
  - id: batchTable
    kind: table
    rows: "$data.report.batches"
    empty_text: >-
      No doublet run yet — run the detection above to see the per-sample rate, threshold and
      call counts.
    columns:
      - key: batch_label
        title: Sample
        value: "$row.batch_label"
        ellipsis: true
      - key: n_cells
        title: Cells
        value: "$row.n_cells"
      - key: expected_doublet_rate
        title: Expected rate
        value: "$row.expected_doublet_rate"
      - key: rate_source
        title: Rate from
        value: "$row.rate_source"
      - key: threshold
        title: Threshold
        value: "$row.threshold"
      - key: threshold_source
        title: Threshold from
        value: "$row.threshold_source"
      - key: n_called
        title: Called
        value: "$row.n_called"
      - key: pct_called
        title: "% called"
        value: "$row.pct_called"

  # ── THE SIMULATED-SCORE DISTRIBUTION — is it bimodal? ────────────────────────────
  #
  # Options come from the report's own `batch_names`, read from the artifact rather than
  # forecast. Two clear modes with the threshold sitting in the valley between them means the
  # automatic call is trustworthy; one mode means it is not, and the refusal alert above will
  # already be showing.
  - id: histogramBatchPicker
    kind: select
    label: Distribution for sample
    options: "$data.report.batch_names"
    value: "$state.histogramBatch"
    onChange: dr.setHistogramBatch
    empty_text: >-
      No samples yet — run the detection above to see its simulated-doublet score
      distribution.
  - id: histogramThresholdStat
    kind: stat
    label: Threshold for this sample
    value: "$data.report.threshold_by_batch[$state.histogramBatch]"
  # The x-axis is EACH BATCH'S OWN (the bin range is fitted to that batch's simulated scores,
  # widened to include its threshold), so switching samples in the table below rescales the
  # Score-from/to columns. Saying so beside the picker is the difference between a reader
  # comparing two distributions and a reader comparing two different axes without knowing it.
  - id: histogramRangeStat
    kind: stat
    label: Score range plotted for this sample
    value: "$data.report.range_by_batch[$state.histogramBatch]"
  - id: histogramTable
    kind: table
    rows: "$data.report.histogram_by_batch[$state.histogramBatch]"
    empty_text: >-
      Choose a sample above to see the distribution of scores over its SIMULATED doublets —
      the distribution the threshold is read off. Two clear modes mean the automatic call is
      trustworthy; a single mode means it is not, and no call is reported.
    columns:
      - key: bin_low
        title: Score from
        value: "$row.bin_low"
      - key: bin_high
        title: to
        value: "$row.bin_high"
      - key: count
        title: Simulated doublets
        value: "$row.count"
      - key: above_threshold
        title: Above threshold
        value: "$row.above_threshold"
      # The bin the cut falls INSIDE. `above_threshold` is true only for bins entirely past
      # the threshold (a cell is a doublet iff `score > threshold`), so without this column
      # the straddling bin renders as "below" and the reader has no way to see where the cut
      # actually sits — which is the whole job of this table.
      - key: contains_threshold
        title: Contains the cut
        value: "$row.contains_threshold"

  # ── THE DISCLOSURES, SURFACED FROM THE REPORT (single source) ────────────────────
  #
  # Every sentence below is the report's OWN field, resolved by the engine. The compute is the
  # single source of these strings; restating them here would create a second copy to drift
  # from it, and the exported methods paragraph reads the same doctrine from the manifest.
  - id: flagDontDeleteNote
    kind: alert
    tone: info
    text: "$data.report.disclosure.flag_dont_delete"
  - id: homotypicNote
    kind: alert
    tone: info
    text: "$data.report.disclosure.homotypic"
  - id: methodTradeoffNote
    kind: alert
    tone: info
    text: "$data.report.disclosure.method_tradeoff"

actions:
  - id: dr.setHistogramBatch
    title: Set the sample whose score distribution is shown
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { histogramBatch: "$params.value" }
