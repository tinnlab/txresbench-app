# doublet.scdblfinder readout declarative view_spec — the produced report.
#
# The SECOND `ui:` fragment of the `doublet.scdblfinder` analysis (`ui: [ui/scdblfinder.yaml,
# ui/scdblfinder-report.yaml]`): the manifest stacks its fragments in order, so this renders
# BELOW the run form in the same analysis pane. It names no analysis and no `layout:`.
#
# ── THE COLOURED UMAP IS NOT HERE, AND THAT IS THE POINT ────────────────────────────────
# Colouring an embedding by the doublet call is FREE and is NOT re-implemented here. The call
# is emitted as a CATEGORICAL `metadata-column` and the score as a continuous one — the SAME
# two kinds the Scrublet lane emits, which is the property that makes shipping two methods
# work at all — so the SHIPPED `single-cell-viz` colour-by section binds both for free. A
# bespoke colour surface here would be the defect that property exists to prevent.
#
# ── NO SIMULATED-SCORE HISTOGRAM, AND WHY THIS READOUT IS SHORTER THAN THE SIBLING'S ────
# `ui/doublet-report.yaml` spends a third of its length on the SIMULATED-SCORE DISTRIBUTION,
# because Scrublet's threshold IS the minimum between that histogram's two modes: whether the
# histogram is bimodal is the question that decides whether the automatic call is trustworthy
# at all, and when it is not, the run emits no call and the user's remedy is to read a
# threshold off the plot. None of that transfers. scDblFinder does not expose a simulated-score
# distribution, and its cut point is not read off one — it is chosen by the fitted classifier
# against the expected-rate prior, and the report records the resulting threshold per sample
# (the midpoint between the lowest called doublet and the highest called singlet) so a reader
# can reproduce the call from the score column without re-running the fit.
#
# So there is NO histogram binding here. Not "not yet", and not a fallback bins-table standing
# in for a plot the way the sibling's does: there is no such distribution to bind, and
# inventing a plot-shaped surface over data this method does not produce would be a readout
# asserting a mechanism the method does not have.
#
# ── WHAT IS DISTINCTIVE HERE INSTEAD: THE METHOD COMPARISON ─────────────────────────────
# This package now ships TWO doublet callers and asks the user to pick between them by method.
# A readout that says only how well THIS run went leaves that choice unsupported — and the
# published literature does not settle it either: scDblFinder is not one of the nine methods
# Xi & Li 2021 compared, so a ranking cannot be quoted for it. What CAN be stated is a
# like-for-like measurement on this repository's own ground-truth fixture, and the block at the
# bottom states BOTH methods' numbers from it, produced under the same fixture, seed,
# construction and estimator. Numbers produced under different constructions are not a
# comparison and are not published as one.
id: doublet.scdblfinder.report
title: Doublet report (scDblFinder)
# Reuse the EXISTING permission — this readout introduces no new gate (mirrors the run form).
# It is also what gates the synthesized `doublet.scdblfinder.report::describe` action, which is
# why a readout that declares no actions of its own still has to declare a permission.
permission: jobs::use

# NO STATE. Every value below is READ from the produced report; nothing on this surface is
# chosen, so there is nothing per-instance to remember. The sibling's one state field exists
# only to hold which sample's score histogram is being shown, and there is no histogram here.
# The key is still declared — `parseViewSpec` requires a `state` object — rather than omitted,
# so "this view holds no state" is a statement in the file rather than an absence a reader has
# to interpret.
state: {}

data:
  # THE PRODUCED report, read as a DOCUMENT. `shape: document` because the report is a
  # discriminated `{kind, batches, disclosure, …}` object, NOT a columnar table — the columnar
  # reader would zip its unequal-length members to max length, pad the short ones with nulls
  # and drop `kind` entirely.
  #
  # `produced_by` IS LOAD-BEARING HERE IN A WAY IT IS NOT IN MOST VIEWS, and this is the one
  # binding in this package that a reader should not skim. BOTH doublet methods emit
  # `datatype: report/qc` carrying `kind: doublet-report` — deliberately, because the identical
  # output shape is what lets `cell.filter`, the colour-by and the exporter consume either
  # method's run unchanged. That identity means `datatype` + `kind` alone select "the newest
  # doublet report by EITHER method": run Scrublet after scDblFinder and this readout would
  # render the Scrublet run's numbers under the scDblFinder heading, silently, with every field
  # resolving. `produced_by: doublet.scdblfinder` narrows to THIS analysis, and a `produced_by`
  # that matches nothing resolves to NOTHING rather than falling back to the unnarrowed newest.
  report:
    source: job.result
    args:
      datatype: report/qc
      produced_by: doublet.scdblfinder
      shape: document
      kind: doublet-report

widgets:
  # ── THE BATCHING STATE, stated plainly and FIRST ──────────────────────────────────
  #
  # This is the one thing a reader must not have to go looking for. Both alerts surface the
  # report's OWN sentence (`batching_note`, written by the compute in both arms), so there is
  # ONE source of the text and no second copy to drift from it. The unbatched arm is a WARNING
  # and not an info note: an unbatched run on a merged matrix is not a different answer, it is
  # a wrong one, and the compute's own sentence says so in as many words.
  - id: unbatchedWarning
    kind: alert
    tone: warning
    when: "$data.report.batched == false"
    text: "$data.report.batching_note"
  - id: batchedNote
    kind: alert
    tone: info
    when: "$data.report.batched == true"
    text: "$data.report.batching_note"

  # ── THE REFUSAL, when it happened ─────────────────────────────────────────────────
  #
  # NOTHING was scored, so no call column exists at all. Saying so here is the difference
  # between "this analysis produced no call and told me why" and a user hunting for a column
  # that was deliberately not written.
  #
  # NOTE that this refusal has a DIFFERENT CAUSE from the sibling's identically-shaped one, and
  # the text has to say so. Scrublet omits the call when its simulated-score histogram has no
  # honest cut point, and the remedy is to supply a threshold by hand. scDblFinder's classifier
  # always produces a cut point when it fits at all — so a missing call here means every
  # population FAILED TO SCORE: each was below the minimum cell count, or the fit itself
  # errored. There is no threshold to supply, and offering one as the remedy would send the
  # user to a control this form does not have.
  - id: noCallWarning
    kind: alert
    tone: warning
    when: "$data.report.call_emitted == false"
    text: >-
      No doublet CALL was produced for this run: no population could be scored at all, so an
      all-singlet call column would be a fabricated answer rather than a result, and none was
      written. The per-sample table below names the refusal for each population — most often
      too few cells to build an artificial-doublet population from. If the run was batched,
      check the sample column: a column with many small levels splits the matrix past the point
      where any level can be scored.

  # ── the run's headline numbers ────────────────────────────────────────────────────
  - id: cellsScoredStat
    kind: stat
    label: Cells scored
    value: "$data.report.n_evaluated"
  - id: cellsNotScoredStat
    kind: stat
    label: Cells not scored
    value: "$data.report.n_not_evaluated"
  - id: calledStat
    kind: stat
    when: "$data.report.call_emitted == true"
    label: Called doublets
    value: "$data.report.n_called"
  - id: batchesStat
    kind: stat
    label: Samples scored independently
    value: "$data.report.n_batches"
  - id: batchColumnStat
    kind: stat
    when: "$data.report.batched == true"
    label: Sample column
    value: "$data.report.batch_column"
  - id: scoreModeStat
    kind: stat
    label: Score
    value: "$data.report.parameters.score"
  - id: citationStat
    kind: stat
    label: Method
    value: "$data.report.citation"
  # The RESOLVED library versions, read out of the artifact. They are in the report rather than
  # in a `run.dependencies` declaration for a structural reason worth stating where a reader
  # meets them: helper staging and the dependency recorder are python-gated, so the R lane
  # declares no `run.dependencies` and records what it actually loaded instead. This is the
  # thing that is NOT lost along with that declaration — the version that produced these
  # numbers travels with them.
  - id: scdblfinderVersionStat
    kind: stat
    label: scDblFinder version
    value: "$data.report.library_versions.scDblFinder"
  - id: rVersionStat
    kind: stat
    label: R version
    value: "$data.report.library_versions.R"

  # ── PER-SAMPLE SUMMARY — the rate and threshold that were actually used ───────────
  #
  # One row per independently scored population, and one row per REFUSED one. The rate column
  # is the visible proof of the per-sample prior: on a batched run these differ between rows,
  # because each is derived from THAT sample's own cell count rather than from the merged
  # total. That is the half `scDblFinder(samples=)` would not have given us, so it is the half
  # that has to be visible.
  #
  # The refusal column is a first-class column and not a footnote: a level that was not scored
  # is a level whose cells are `not_evaluated`, and a reader comparing call counts across
  # samples has to be able to see that one of them was never in the comparison.
  - id: batchTable
    kind: table
    rows: "$data.report.batches"
    empty_text: >-
      No scDblFinder run yet — run the detection above to see the per-sample rate, threshold
      and call counts.
    columns:
      - key: sample
        title: Sample
        value: "$row.sample"
        ellipsis: true
      - key: n_cells
        title: Cells
        value: "$row.n_cells"
      - key: scored
        title: Scored
        value: "$row.scored"
      - key: expected_doublet_rate
        title: Expected rate
        value: "$row.expected_doublet_rate"
      - key: rate_source
        title: Rate from
        value: "$row.rate_source"
      - key: threshold
        title: Threshold
        value: "$row.threshold"
      - key: n_called
        title: Called
        value: "$row.n_called"
      - key: refusal
        title: Why not scored
        value: "$row.refusal"
        ellipsis: true

  # ── THE DISCLOSURES, SURFACED FROM THE REPORT (single source) ────────────────────
  #
  # Every sentence below is the report's OWN field, resolved by the engine. The compute is the
  # single source of these strings; restating them here would create a second copy to drift
  # from it, and the exported methods paragraph reads the same doctrine from the manifest.
  - id: notAFilterNote
    kind: alert
    tone: info
    text: "$data.report.disclosure.not_a_filter"
  - id: homotypicNote
    kind: alert
    tone: info
    text: "$data.report.disclosure.homotypic"
  # This one ENDS by pointing at the block below it ("see `measured_performance` in this
  # report"), which is why the comparison is placed here rather than higher up: the sentence
  # that says the published rankings cannot settle the choice is immediately followed by the
  # measurement that can.
  - id: methodTradeoffNote
    kind: alert
    tone: info
    text: "$data.report.disclosure.method_tradeoff"

  # ── THE METHOD COMPARISON — this readout's distinctive element ───────────────────
  #
  # BOTH methods' numbers, on ONE fixture, stated together. The point is not to advertise this
  # method: it is that a user who has just been told the literature cannot rank these two needs
  # something it CAN be told, and the only honest thing available is a like-for-like
  # measurement in this repository. Both sets of numbers are read from the SAME report field,
  # so there is no arrangement in which this surface can show one method's number against a
  # stale copy of the other's — they are maintained together in `tests/test_ground_truth.py`
  # and a test asserts the report agrees with it.
  #
  # The fixture and the note come FIRST, before either method's numbers, and deliberately so.
  # The note states the two ceilings that cap BOTH methods on this benchmark and belong to the
  # fixture rather than to either caller (pbmc3k's own ~2% native doublets score as false
  # positives against a truth vector that calls them singlets; homotypic doublets are
  # undetectable by any simulation-based method). Numbers read without those two facts read as
  # poor absolute performance rather than as a bounded comparison.
  - id: measuredFixtureStat
    kind: stat
    label: Measured on
    value: "$data.report.measured_performance.fixture"
  - id: measuredNote
    kind: alert
    tone: info
    text: "$data.report.measured_performance.note"
  - id: scdblfinderRecallStat
    kind: stat
    label: scDblFinder — recall
    value: "$data.report.measured_performance.scdblfinder.recall"
  - id: scdblfinderPrecisionStat
    kind: stat
    label: scDblFinder — precision
    value: "$data.report.measured_performance.scdblfinder.precision"
  - id: scdblfinderAuprcStat
    kind: stat
    label: scDblFinder — AUPRC
    value: "$data.report.measured_performance.scdblfinder.auprc"
  # The OTHER method's numbers, on this method's own readout. That is the whole construct: a
  # readout that showed only its own would leave the comparison to a user opening two panes and
  # trusting that the two were measured the same way — which is exactly the thing that cannot
  # be trusted, and is why the report carries both rather than each carrying its own.
  - id: scrubletRecallStat
    kind: stat
    label: Scrublet — recall
    value: "$data.report.measured_performance.scrublet.recall"
  - id: scrubletPrecisionStat
    kind: stat
    label: Scrublet — precision
    value: "$data.report.measured_performance.scrublet.precision"
  - id: scrubletAuprcStat
    kind: stat
    label: Scrublet — AUPRC
    value: "$data.report.measured_performance.scrublet.auprc"

# NO `actions:` ENTRIES. This readout is pure disclosure — nothing on it is chosen, so there is
# no verb for it to declare. The key is still present because `parseViewSpec` requires an
# actions ARRAY, and because an empty one is a statement ("this surface acts on nothing")
# rather than an omission. The synthesized `doublet.scdblfinder.report::describe` capability is
# registered regardless, off this file's top-level `permission`, so an agent can still read the
# live report through it.
actions: []
