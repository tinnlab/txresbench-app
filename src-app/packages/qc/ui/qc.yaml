# Compute-QC declarative view_spec.
#
# The view owns EVERYTHING a person sees, including WHICH artifacts the run consumes
# (INV-2/INV-4). ONE form, ONE pane: widgets render in DECLARATION ORDER, top to bottom,
# so the order below IS the layout.
#
# `analysis: qc.10x` is GONE — it pointed the wrong way. The MANIFEST declares
# `ui: [ui/qc.yaml]`, so the binding is owned by the registration file and a view no
# longer has to know which analysis it belongs to.
#
# `layout: { regions: … }` is GONE (INV-3). It was a widget-id→dock-region map that made
# ONE analysis mount as TWO panes with the same title — the run pane and the control
# surface — with the input visible only in the one the user would never open.
id: qc.compute
title: Compute QC metrics
# Reuse an EXISTING real permission — QC introduces no new gate. The workbench dispatches
# compute jobs, so `jobs::use` (granted to Users, gates job create/run) is the gate.
permission: jobs::use

state:
  # The chosen artifacts for the run's `matrices` slot.
  #
  # Seeded, not hardcoded: at mount the host fills this with the compatible artifact(s)
  # when the answer is unambiguous, and leaves it empty otherwise. That is the SAME
  # resolution `hostCtx.runProcessor` used to perform — the only change is that its
  # result is now visible state the user can see and override, instead of a hidden step
  # between pressing Run and the job starting (which threw `found ${options.length}`
  # whenever the count was not exactly 1).
  #
  # A LIST. QC runs over every selected modality matrix in ONE job, because the cells
  # axis is SHARED: CITE-seq QC decides which cells to keep from RNA *and* protein *and*
  # hashtag metrics together, and a per-modality run cannot express that (DEC-6).
  matrices: { type: list, default: [] }

  # A `default` may reference declared values ANYWHERE inside it, so the starting metric list
  # names the four catalog entries it seeds instead of restating them. The patterns used to be
  # written out FOUR times across three files (the manifest's `defaults`, this `state` default,
  # `const.presets.rna`, and the compute's `DEFAULT_QC_METRICS`); what remains is the catalog
  # below and the compute's own fallback (it must have one — `params.json` may omit the key).
  # Two copies, each with a distinct job.
  #
  # WHICH four is a real decision and it is stated HERE rather than as a flag on the catalog
  # entries: "what a fresh form is pre-filled with" is a property of the FORM, and the catalog is
  # a list of what a user MAY add. `pct_hb` and `pct_isotype` are in the catalog and not here —
  # present, offered, not imposed.
  qc_metrics:
    type: list
    default:
      - "$const.metricPresets.total_counts.metric"
      - "$const.metricPresets.n_genes.metric"
      - "$const.metricPresets.pct_mito.metric"
      - "$const.metricPresets.pct_ribo.metric"

  # What the preset picker is SHOWING. Choosing is adding, and `qc.addPreset` clears this as its
  # last step, so it is only ever transiently non-empty: the control reads as an affordance
  # ("Choose…") rather than as a display of the last thing added.
  presetChoice: { type: string, default: null }

  # The genes-axis artifacts whose VALUES the gene regexes are matched against — a LIST,
  # positionally ALIGNED with `matrices` (entry i belongs to matrix i), which is the shape
  # `qc-10x.py` resolves its `gene_names` slot in.
  #
  # It was a single string, and the mismatch was silent: matrix 0 got the artifact, matrices
  # 1..N-1 got nothing, and every pattern metric on them was dropped with a warning buried in
  # `obs.json`. It could not have been right as a scalar in the first place — the option set
  # is per-matrix (a column on THAT matrix's genes axis), so one value cannot name a column
  # of two different datasets. The compute now REFUSES a list it cannot pair one-to-one.
  #
  # Empty is a legitimate state only for a run that emits NOTHING: every metric row is a gene
  # SET (the two former builtins are `.*` rows), so the compute refuses a run that selected a
  # metric and bound no names. Each entry is seeded by its own picker when that axis has
  # exactly one text column, and left blank otherwise.
  geneNames: { type: list, default: [] }

  # `modality` is GONE with its picker (see `modalityPicker` below).
  #
  # `groupBy` is GONE too. It appeared exactly ONCE in the shipped file — its own
  # declaration. No widget rendered it, no action set it, no canvas series read it; its
  # comment claimed a "global group-by" that did not exist. Same class as the manifest's
  # `inStandardRecipe`/`recipeOrder`: declared, typed, never consulted. Deleted rather
  # than left sitting here looking like a feature.

data:
  # WHICH COLUMN NAMES ARE ALREADY TAKEN on the axes this run will write to.
  #
  # This exists for one requirement: a metric's name becomes an emitted column name (DEC-1),
  # and storage does NOT key on the name — `artifacts_natural_key` is
  # `(project_id, dataset_id, run_id, output_id)` — so re-running QC with a name that is
  # already there creates a SECOND column of that name rather than replacing the first. The
  # reader then merges an axis' columns into one frame by name, last one wins, and the rest
  # are shadowed with the winner decided by row order. Measured on a real project: `n_genes`
  # ×3 on one axis, `total_counts` / `pct_mito` / `pct_ribo` ×2 each. The user chose to be
  # REFUSED here rather than have the run version or overwrite, accepting that re-running
  # after tweaking a pattern means picking a new name.
  #
  # `as: sources` asks the axis relation for `{ name → artifact id }` instead of for values,
  # which costs one catalog call and NO artifact reads — the names are producer declarations
  # on the catalog rows. The `require.not_in` below reads its KEYS.
  #
  # `of: $state.matrices` is the LIST, and the scope is the whole point. An axis instance is
  # the anchor's own dataset plus the axis name, so this resolves the cells axis of EVERY
  # selected matrix's dataset and unions them. Scoping it any wider — "is this name anywhere
  # in the project" — would mark all four seeded rows invalid the moment the form opened for
  # any user who had ever run QC on a DIFFERENT dataset, i.e. the feature would ship dead for
  # exactly the projects it is for. Scoping it narrower (the first matrix only) would miss a
  # collision on the second, which is the silent-wrong-answer direction.
  #
  # `produced_by: others` is the same scoping decision one axis further in, and it is the
  # difference between a form that can be run twice and one that cannot.
  #
  # The four seeded metric names ARE the four column names a first run emits. Without this
  # clause a successful run invalidated every row it had just created: `not_in` saw the
  # columns, all four rows went red, and Run never came back — so re-running QC on the same
  # dataset (after widening a pattern, or with an added metric) meant renaming all four
  # metrics first. The rule the user chose is that a run may SUPERSEDE ITS OWN previous
  # output, and only its own: a name another producer put on this axis is still refused,
  # because that is a genuine collision between two different analyses' columns and the
  # remedy really is to pick another name.
  #
  # It names no analysis. "Its own" is resolved from this view's own `run_processor` op
  # (`qc.run`, at the foot of this file), so the analysis id lives in the file exactly once.
  # A second copy here would still parse and still resolve after a rename, and would simply
  # stop excluding anything — the same silent-no-op class as the `analysis:` back-pointer
  # this view deliberately does not carry. An unattributed column (an import, or a run whose
  # provenance was never recorded) is NOT this analysis' own and still blocks.
  #
  # Before any matrix is chosen the slice resolves to nothing and is SKIPPED, so an unanswered
  # form is not told its names are free — it is told to choose a matrix.
  existingColumns:
    source: axis_columns
    args: { of: "$state.matrices", axis: cells, as: sources, produced_by: others }

# NO `canvas:` — QC COMPUTES METRICS AND PLOTS NOTHING.
#
# (The `derived:` block below reads NOTHING from `data:` — it is a re-keying of a declared
# constant, so this view still resolves no result of its own.)
#
# This view used to read its own `/obs` result back and push one violin SERIES per emitted
# column onto the workbench's single shared canvas. Three versions of that block shipped;
# each fixed HOW it plotted (hardcoded metric names → a `for_each` over the form's rows →
# `columns_of` the result) and none asked WHETHER this analysis should plot at all. It
# should not.
#
# `docs/analysis-workbench/INTERFACE_DESIGN.md` §3.4 puts the violins, the thresholds and the
# before/after cell-count delta in ONE surface, because a distribution plot exists to support
# a threshold DECISION — "keep users honest, visibly" (§1.5) is about seeing what a cutoff
# removes. A plot with no criterion beside it answers no question the user asked; it is a
# readout that arrives unbidden and competes for the shared canvas with the analysis that
# does have criteria.
#
# So the criteria decide what is plotted, and the criteria live in cell-filter — whose canvas
# already draws a before/after pair per criterion the user builds. QC's job ends at producing
# the columns those criteria are built ON: `produces: [metadata-column, report/qc]`.
#
# The result readout QC legitimately owes the user ("did this run land, and what did it
# emit?") is a RUN-FEEDBACK concern, not a canvas one — see
# `docs/design/analysis-run-feedback.md`.

# The catalog as a MAP keyed by preset name buys ONE thing that a list cannot: `state`'s default
# can NAME the four it seeds (`$const.metricPresets.pct_mito.metric`). A list would have to name
# them by POSITION, which reorders silently.
derived:
  # The SAME catalog, keyed by the value the picker commits — so `qc.addPreset` can look up what
  # the user chose. An action body sees `$state`/`$derived`/`$data`, never `$const`, and this is
  # the identity `for_each` that bridges the two rather than a second copy of the data.
  presetByValue:
    for_each: "$const.metricPresets[*] as $p"
    key: "$p.value"

  # THE ROWS THE TABLE ALREADY HOLDS, keyed by their NAME — which is the one question the preset
  # picker has to ask before offering anything (see `presetPicker.offer_when`).
  #
  # Keyed by `name` and not by the preset's `value` because NAME is what collides: the name becomes
  # an emitted column, `metricTable.require.unique_by` is declared on it, and the compute raises
  # `DuplicateMetricName` on it. The two happen to be spelled identically for every catalog entry
  # today, and keying on the coincidence would silently stop working for the first preset whose
  # value and metric name diverge — including a row the user renamed by hand, which is the case
  # this must get right (renaming a row to `pct_mito` must retire that preset from the offer).
  #
  # The same identity `for_each` the block above uses, over state instead of const — so it tracks
  # every add, remove and rename with no action doing bookkeeping.
  metricNames:
    for_each: "$state.qc_metrics as $m"
    key: "$m.name"

const:
  # Grounded in research/MULTIMODAL_qc_metrics.md: the two whole-genome rows (what the scanpy
  # builtins were), the two species-sensitive percentage presets, and the two that used to exist
  # only as hand-written buttons. It mirrors the compute's own `DEFAULT_QC_METRICS` fallback,
  # which exists for a different boundary (`params.json` may omit the key).
  #
  # A row carries NO `modality`, and that is the whole INV-6/INV-8 point. The rows used to be
  # grouped into `rna`/`prot`/`atac` families, each row restating its family as a `modality:`
  # literal — the closed list the deleted modality PICKER offered, one level down, presented
  # in the metric table as though it came from the artifact.
  #
  # It came from here. The compute never read it (`parse_qc_metrics` keeps
  # `{name, pattern, aggregation}`),
  # and it could not have: a metric is a question about gene names, asked of EVERY bound
  # matrix, and the emitted column's prefix is the answering MATRIX's own `structure.modality`.
  # Its one real consumer was the canvas `valueKey`, which is exactly where the fiction did
  # damage.
  #
  # The `prot`/`atac` families that sat beside `rna` had no consumer at all — no widget, no
  # action, no canvas series referenced them. What they were REACHING for is the catalog below:
  # a capability requirement carried by the entry, rather than a modality restated by the user.
  # ── the PRESET CATALOG — every predefined metric, as DATA ───────────────────────────────
  #
  # REPORTED: "there should be some add predefine metrics and show user the metrics they can
  # add, hemoglobin should be in there too, total counts, mito, robo should be in there too."
  #
  # A preset used to exist if and only if somebody hand-wrote a BUTTON and an ACTION for it,
  # each carrying its row inline (`qc.addHb`, `qc.addIsotype`). The four seeded defaults had no
  # add affordance AT ALL: delete `pct_ribo` and the only way back was a custom row where the
  # user retypes `^(RP[SL]|Rp[sl])` from memory. So "which metrics can I add" was answered by
  # the widget list, and the answer was wrong in both directions.
  #
  # This is the class fixed rather than the instances: ONE catalog, ONE generic add action
  # (`qc.addPreset`), ONE picker that lists it. Adding the next preset is a row here — no widget,
  # no action, no app change.
  #
  # Each entry is BOTH an option and a row. `value`/`label`/`description` are what the picker
  # shows (the description is the option's SECOND LINE — what this metric matches, at the moment
  # the user is deciding whether they want it); `metric` is exactly what gets appended, which is
  # why the appended row can be a reference rather than a literal.
  #
  # `when` is the CAPABILITY requirement, carried by the entry. It was `when: has:protein` on the
  # isotype BUTTON; it is the same clause in the same grammar, one level down, so a gated preset
  # is simply not among the options on data that cannot support it. That is what makes the next
  # capability-gated preset a data change too.
  #
  # The NAMES are the emitted column names verbatim (DEC-1), which is why they read `pct_mito`
  # rather than `mito`: the compute no longer decorates a stem, so the familiar name has to be
  # STATED. With four aggregations a decoration rule would have to vary by aggregation
  # (`sum_`/`mean_`/`count_`/`pct_`), i.e. a rule the user learns in order to predict their own
  # output — which is the same class of invisible system decision as the aggregation itself.
  #
  # `builtin: true` is GONE from the first two, and that is the point rather than a tidy-up.
  # `total_counts` / `n_genes_by_counts` used to be name-matched against a hardcoded
  # `BUILTIN_METRIC_NAMES` in the compute: they carried no gene set, had their own parse path,
  # and could not be removed, renamed or narrowed. They are ORDINARY rows now — `sum` over all
  # genes and `count` over all genes — so every row in the table means the same kind of thing.
  metricPresets:
    total_counts:
      value: total_counts
      label: total_counts
      description: "every gene — the cell's total counts"
      metric: { id: m_total, name: total_counts, pattern: ".*", aggregation: sum }
    n_genes:
      value: n_genes
      label: n_genes
      description: "every gene — how many are detected in the cell"
      metric: { id: m_genes, name: n_genes, pattern: ".*", aggregation: count }
    pct_mito:
      value: pct_mito
      label: pct_mito
      description: "mitochondrial genes (MT- / mt-, human and mouse)"
      metric: { id: m_mito, name: pct_mito, pattern: "^MT-|^mt-", aggregation: percentage }
    pct_ribo:
      value: pct_ribo
      label: pct_ribo
      description: "ribosomal protein genes (RPS / RPL, human and mouse)"
      metric: { id: m_ribo, name: pct_ribo, pattern: "^(RP[SL]|Rp[sl])", aggregation: percentage }
    pct_hb:
      value: pct_hb
      label: pct_hb
      description: "hemoglobin genes (HB…, excluding the HBP pseudogenes)"
      metric: { id: m_hb, name: pct_hb, pattern: "^HB[^(P)]", aggregation: percentage }
    pct_isotype:
      value: pct_isotype
      label: pct_isotype
      description: "isotype controls — the protein assay's own background"
      when: "has:protein"
      metric: { id: m_isotype, name: pct_isotype, pattern: "^IgG|_control", aggregation: percentage }

  # The CLOSED aggregation vocabulary, as DATA — the option set for the table's `Aggregation`
  # cell and the same four `qc-10x.py::AGGREGATIONS` accepts.
  #
  # Each entry states that aggregation's COMPLETE definition, denominator included, and that is
  # load-bearing rather than decorative. The defect this column exists to remove is a
  # denominator the system picks and never shows: every metric used to mean
  # `100 × Σ(set) / total counts`, stated nowhere, so `pct_mito = 0` meant either "no
  # mitochondrial reads" or "the regex matched nothing" and nothing on screen distinguished
  # them. Putting the definition in a footnote would leave the same gap one step further away;
  # putting it in the OPTION is where the user is when they decide.
  #
  # `mean`'s denominator is the one the design had to CHOOSE between two defensible readings
  # (`Σ ÷ |set|` counts undetected genes as zeros; `Σ ÷ |detected|` does not), so its
  # description says which — and a user who wants the other one can build it from two rows
  # (`sum` ÷ `count`), which is why this is the safe default rather than merely a picked one.
  #
  # `label` and `description` are SEPARATE (REPORTED). They used to be ONE string —
  # `"sum — Σ counts over the gene set"` — so the CHOSEN state rendered the whole sentence into
  # a narrow table column, and an option could not be two lines because a label is one string.
  # The label is now the value verbatim (what the cell shows at rest = what the run receives),
  # and the definition is the second line of the option ROW, which is where the user is while
  # deciding and nowhere else.
  aggregations:
    - { value: sum, label: sum, description: "Σ counts over the gene set" }
    - { value: mean, label: mean, description: "Σ ÷ genes in the set (undetected count as 0)" }
    - { value: count, label: count, description: "genes in the set with a count > 0" }
    - { value: percentage, label: percentage, description: "100 × Σ set ÷ the cell's total counts" }

widgets:
  # ── the INPUTS, as ordinary fields at the top of the SAME form ────────────────
  #
  # The view declares its OWN `source`. An earlier draft had this carry `slot: matrix`
  # and take its candidates from the manifest — which put the manifest back in charge of
  # what the user may choose, i.e. the manifest defining the UI by another route.
  #
  # These are two different questions and they only happen to rhyme here:
  #   manifest `appliesTo` — when to OFFER the analysis at all (enablement)
  #   this `source`        — what this control lets you PICK
  #
  # `slot` is not a UI concept and is absent here. It survives only as the wire key when
  # the run is dispatched (`inputs: { matrices: … }`), which is execution.
  #
  # Behaviour follows the candidate count, which is what makes the old `found 2 → throws`
  # impossible:  1 → pre-selected read-only summary · 0 → empty, with the alert below
  # · 2+ → a real picker.
  - id: matrixPicker
    kind: artifact_ref
    # ITEM-29e / DEC-15 — DECLARED, because it is the behaviour this surface has always
    # had. `auto_bind_sole_candidate` is opt-IN (absence means OFF, which is R2/INV-3 as
    # written); before it existed the sole-candidate bind was unconditional with no way to
    # turn it off. Stating it here keeps this control byte-identical for the user and makes
    # the affordance visible in the file, which is the entire point of the rule.
    auto_bind_sole_candidate: true
    label: Count matrices
    multiple: true
    # QC needs RAW counts — total_counts / %mito are meaningless post-normalization.
    source:
      subtypes_of: single-cell/expression
      excludes: [single-cell/normalized]
    value: "$state.matrices"
    onChange: qc.setMatrices
    # Clause 1 of the deleted `disabledWhen`, declared where it can also SPEAK: the field
    # states it, the summary beside Run states it, and Run derives from it — one
    # declaration, three consumers, no second predicate to drift.
    #
    # It says CHOOSE, not IMPORT. It is the sentence for a project that HAS matrices and an
    # answer the user has not given yet; the sentence for a project that has none is
    # `empty_text` below, and conflating the two is the reported defect.
    require:
      min_items: 1
      message: Choose at least one raw-count matrix to compute over.
    # What `noInputAlert` used to say, moved onto the control that actually knows whether it
    # is true. The alert is DELETED — see the block where it stood for the measurement.
    empty_text: >-
      No raw-count expression matrix in this project yet. Import one (or, if you have a
      normalized matrix only, note that QC needs raw counts).

  # The input that exists NOWHERE today, and is the reason `pct_mito` can silently be 0.
  #
  # The compute matches gene patterns against `adata.var_names` — hardcoded
  # (`qc-10x.py`), not a param. On a CELLxGENE h5ad the index is ENSEMBL ids and the
  # symbols live in `var["feature_name"]`, so `^MT-|^mt-` matches nothing and every
  # pattern metric reports 0 with no error. A regex matching zero genes is not a failure,
  # it is an empty set.
  #
  # It is a SEPARATE ARTIFACT on the genes axis, not a column inside the matrix — the
  # matrix is a bare `sparse_csc` store (`data`/`indices`/`indptr`) carrying no names at
  # all. So this is a second artifact INPUT, resolved from the genes axis of the same
  # dataset as the chosen matrix.
  #
  # It cannot be INFERRED, and the reference dataset is the proof: its genes axis carries
  # EIGHT columns, at least five of them strings — `genes_index` (ENSEMBL),
  # `feature_name` (symbols), `feature_biotype`, `feature_type`, `feature_reference`.
  # Nothing structural separates them. Guessing by NAME is a hardcoded spelling list that
  # drops the next spelling; guessing by CONTENT is inference from data (INV-2). So the
  # picker offers every string-valued artifact on the axis, unfiltered and unranked, and
  # pre-selects only when there is exactly ONE candidate — DEC-8.
  #
  # It also cannot be a manifest key: the option set does not exist until the matrix has
  # been chosen. A dependency between two controls is what a form expresses naturally and
  # a static contract cannot — which is exactly what the axis-scoped `of` ref encodes.
  #
  # `values: text`, NOT `values: string` — and the difference is the whole point of this
  # control.
  #
  # A producer's `kind` names an ENCODING: `string` is inline utf8, `categorical` is
  # dictionary-encoded with a level set. Gene SYMBOLS repeat across a genes axis, so every
  # importer stores them dictionary-encoded — which means `values: string` admitted exactly
  # ONE column on a real dataset: the axis's own index. The picker then reported "Only one
  # match — selected automatically" and bound the ENSEMBL identifier column, against which
  # `^MT-|^mt-` and `^(RP[SL]|Rp[sl])` match NOTHING. Every pattern metric came out zero,
  # with no error, because a regex matching no genes is an empty set and not a failure.
  #
  # That is the exact silent zero this whole control was added to remove, re-created one
  # level down by a filter that named a storage choice while meaning a semantic one.
  # `text` means "text-valued, however encoded" (`axisSource.ts::valueKindsFor`) and admits
  # both encodings; `numeric` columns on the same axis stay excluded, because a picker for
  # "which column holds the names" that offers counts is a different wrong answer.
  #
  # ONE PICKER PER MATRIX (`for_each`), anchored on THAT matrix's genes axis. It was a single
  # control anchored on `$state.matrices[0]`, which is wrong twice over: it offered matrix 0's
  # columns for the whole run, and it bound ONE value to a `gene_names` slot the compute reads
  # list-ALIGNED with `matrices` — so on a two-matrix run matrix 1 had no gene names and every
  # pattern metric on it vanished. Two matrices are two different genes axes and two different
  # column sets; "which column holds the symbols" is a question per matrix, and INV-4 says the
  # answer has to be on screen before Run.
  - id: geneNamesPicker
    kind: artifact_ref
    # ITEM-29e / DEC-15 — DECLARED, because it is the behaviour this surface has always
    # had. `auto_bind_sole_candidate` is opt-IN (absence means OFF, which is R2/INV-3 as
    # written); before it existed the sole-candidate bind was unconditional with no way to
    # turn it off. Stating it here keeps this control byte-identical for the user and makes
    # the affordance visible in the file, which is the entire point of the rule.
    auto_bind_sole_candidate: true
    for_each: "$state.matrices as $m, $i"
    label: Gene names from
    source: { axis: genes, of: "$m", datatype: metadata-column, values: text }
    value: "$state.geneNames[$i]"
    # the row's position IS the pairing — the write-back targets `geneNames[i]`.
    args: { index: "$i" }
    onChange: qc.setGeneNames
    # PER RENDERED INSTANCE — which is the whole point, and the fix for a defect that
    # shipped.
    #
    # The old gate read `$state.geneNames.length < $state.matrices.length`, which does not
    # mean "every matrix is paired". `qc.setGeneNames` writes `geneNames[i]` by INDEX, so
    # answering only the THIRD picker gives `length === 3` with holes at 0 and 1: the
    # comparison reads `3 < 3`, Run enables, and two matrices reach the compute unpaired —
    # the exact `the gene_names slot has 0 binding(s)` refusal the gate was added to
    # prevent. A count cannot see a hole. A requirement declared on the CONTROL is asked
    # once per rendered picker, so the holes are precisely what it sees.
    require:
      required: true
      message: >-
        Every selected matrix needs a gene-name column. The metrics match genes by pattern, so
        without names there is nothing to match against and the run cannot compute them.

  # `noInputAlert` is GONE, and its sentence is now `matrixPicker.empty_text`.
  #
  # It was REPORTED, and the report is worth recording because the failure is the exact one
  # this whole round is about — a predicate that reads correctly and asserts something else:
  #
  #   condition:  $state.matrices.length == 0     ("the user has not SELECTED a matrix")
  #   text:       "No raw-count expression matrix in this project yet. Import one …"
  #                                                ("the project CONTAINS no matrix")
  #
  # Two different propositions, and it asserted the second while testing the first. Measured
  # against the reporting user's own project: TWO raw-count matrices present, both
  # `sparse_csc`, both `x_state: raw_counts`. The picker pre-selects only at exactly ONE
  # candidate, so with two nothing was bound, `matrices` stayed empty, and the alert fired —
  # i.e. the message appeared PRECISELY BECAUSE the user had more than one of the thing it
  # said they had none of, and grew more confident the more data they imported.
  #
  # It could not be repaired in place: a view cannot observe candidate availability at all
  # (`evalWhen` reads state/derived/data/const/capabilities, and the artifact catalog is an
  # internal channel a view may not query), so any `when` written here can only ever test
  # the nearest observable thing, which is selection. Declared on the control there is no
  # predicate at all — the engine already knows the count at the one point the answer
  # exists.

  # `modalityPicker` is GONE — it asked the user to restate what the data declares, and
  # it could not express most of the answers.
  #
  # The import stamps the modality on every emitted matrix (`rna`/`prot`/`hto`/`atac`/
  # `crispr`/a sanitized key for any unrecognised `feature_types`) into the store's OWN
  # `structure` — which travels with the bytes into the sandbox — alongside `meta.modality`
  # and `meta.feature_types` as catalog-side provenance. `classify_feature_type` is OPEN by
  # construction: "an unrecognized feature type maps to a sanitized modality of its own —
  # NEVER dropped, NEVER folded into RNA" (INV-8: no modality privileged).
  #
  # The picker offered a CLOSED list of three: `[rna, prot, atac]`. It could not name
  # `hto` or `crispr` — modalities the importer's own table produces — so a hashtag run
  # forced one of three wrong answers, and the wrong one became the emitted column
  # prefix. The ingest layer goes to real trouble to avoid that silent fold; the UI
  # reintroduced it two steps later (INV-6).
  #
  # NOTHING replaces it here, and nothing needs to. `qc-10x.py::modality_keys` reads each
  # matrix's own declaration off the staged store; the view neither picks a modality nor
  # relays one. The metric ROWS carried the closed list for a while after the picker died
  # (see `const.defaultMetrics`) — this is the surface where that was visible, as a
  # read-only "Modality" column claiming an artifact source it never had.

  # The remove affordance is a per-row BUTTON that says "Remove", not the row-SELECTION
  # checkbox.
  #
  # `selection: { value: $const.noneSelected, onChange: qc.removeMetric }` was the previous
  # spelling and it failed in three ways at once, each of which hid the next:
  #
  #   1. It was MIS-LABELLED. The table's selection column renders a checkbox named
  #      `select <row>`; checking it deleted the row. A destructive control that reads as a
  #      selection is not discoverable as destructive — the only way to find out is to lose
  #      the row.
  #   2. It was PINNED to `$const.noneSelected`, so the box could never appear checked. A
  #      user who ticked it saw it snap back, which reads as a broken checkbox, not as a
  #      delete that fired.
  #   3. It did not work AT ALL. The selection column forwards the row's `key` — the row's
  #      own `id` (`m_total`) — and `listRemove` takes a positional index, so the op was a
  #      no-op on every row. "I can add custom metrics but cannot delete them" was the
  #      literal report.
  #
  # `cell: { button: … }` is a CORE table primitive (see `TableCellSpec`), added for the
  # same reason `editable_text` exists: acting on one row is a general table need, and
  # cell-filter's criteria list already had it (`critRemove`) only because it is built out
  # of `group` + `for_each` rather than a table. A bespoke `qc-metric-list` widget KIND
  # would have been the INV-6 violation; a missing generic primitive was the real gap.
  #
  # `cell: { select: … }` is the same story a third time. The `Aggregation` column is a
  # CLOSED-SET choice, and the table had no vocabulary for one — so it could only have
  # shipped as a free-text cell the user can mistype, or as a qc-named widget kind. It is a
  # core primitive for the same reason: any table has closed-set columns (a status, a unit,
  # a mode), and nothing about it knows what QC is.
  #
  # `Genes` is not `Gene regex` (DEC-3). The column selects a gene SET; a regex is one way
  # to express it, and the repo already carries a `geneset/collection` datatype, so a set
  # REFERENCE is a plausible future cell value. Naming the column after the mechanism would
  # have to be undone then — the same rename `accepts` → `appliesTo` already went through.
  - id: metricTable
    kind: table
    rows: "$state.qc_metrics"
    # WITH NO ROWS the grid is replaced by an empty state, and this is its sentence.
    #
    # It says what a row IS and where the first one comes from, because those are the two things
    # a column of headings over nothing cannot say — and both affordances it names are the two
    # controls directly beneath it, so the sentence and the way to act on it are adjacent.
    #
    # Reaching this state takes one gesture: the form seeds four rows, and removing them is a
    # per-row button. Deleting all four is also a reasonable thing to want (a run over one custom
    # metric), so this is an ordinary state rather than a corner.
    empty_text: >-
      No metrics to compute. A metric is a set of genes plus how to reduce it to one number per
      cell — add a custom one, or pick a predefined metric, with the controls just below.
    # Clause 2 of the deleted `disabledWhen`, plus the one the compute enforces and the form
    # never did: two rows sharing a name raise `DuplicateMetricName`, which is fatal.
    # A per-constraint MAP, not one sentence: "you have no rows" and "two of your rows collide"
    # have different remedies, and a single string cannot describe both. The duplicate case is
    # also the one a preset can now reach — the picker adds whatever is chosen, so choosing the
    # same preset twice lands here, named and refused, rather than silently doubling a column.
    require:
      min_items: 1
      unique_by: name
      message:
        min_items: >-
          No metrics to compute. Add at least one row — a metric is a gene set plus how to reduce
          it, and a run with none produces no columns.
        unique_by: >-
          Two metrics share a name. Each name becomes an emitted column, and the run REFUSES a
          duplicate (`DuplicateMetricName`) — remove one, or rename it.
    columns:
      - key: name
        title: Metric
        # `Add custom metric` seeds a row whose name AND pattern are blank, and the compute
        # raises `MissingGenePattern` on an empty pattern — deliberately, because the empty
        # regex matches every gene and reports ~100 % on every cell. So click-then-Run was a
        # guaranteed failed job that the old gate (list non-empty) was satisfied by. The
        # requirement is per ROW, evaluated in that row's scope.
        # `not_in` is NOT `unique_by` (which the table itself declares). That one asks
        # whether two rows of THIS form collide; this one asks whether a row collides with a
        # column that already exists on the axis the run writes to. A form can satisfy the
        # first completely and still produce a duplicate, and the remedies differ — drop a
        # row, versus rename against what is already there — so they are separate
        # constraints with separate sentences.
        #
        # The set it reads is scoped to OTHER producers (`existingColumns`' `produced_by`),
        # so the sentence below is only ever shown about someone else's column — which is
        # why it can say "another analysis" and why "pick another name" is a remedy the user
        # can actually act on. Re-running THIS analysis over its own columns is not a
        # collision and says nothing here.
        cell:
          editable_text:
            value: "$row.name"
            onChange: qc.setMetricField
            require:
              required: true
              not_in: "$data.existingColumns"
              message:
                not_in: >-
                  A column named "{value}" was already put on this axis by another analysis.
                  This run would add a second one beside it rather than replace it, so pick
                  another name.
      - key: pattern
        title: Genes
        cell:
          editable_text:
            value: "$row.pattern"
            onChange: qc.setMetricField
            require: { required: true }
      - key: aggregation
        title: Aggregation
        cell:
          select:
            value: "$row.aggregation"
            options: "$const.aggregations"
            onChange: qc.setMetricField
      # AN ICON, NOT A WORD (REPORTED).
      #
      # `Remove` is the same word on every row, and the column heading is empty — so the text said
      # nothing the glyph does not, and said it N times. It was the widest column in the grid
      # (95px of a 284px pane, a third of the space, spent restating one thing) in the pane the
      # user actually docks this form into.
      #
      # `label` is NOT dropped. It becomes the accessible NAME and the hover/focus TOOLTIP, and it
      # carries the ROW with it (`Remove pct_mito`), so what a screen-reader user hears, what a
      # voice user says, and what a pointer user reads on hover are one string that names the
      # metric this button destroys. That is the trade an icon-only DESTRUCTIVE action has to make
      # to be honest: it spends the redundant reading, never the only one, and the reading it keeps
      # answers "what does this remove?" rather than merely "remove".
      #
      # `icon: remove` is a key into the renderer's CLOSED registry of row-action glyphs — a view
      # is DATA and must not be able to reach an arbitrary one. An unregistered name falls back to
      # the labelled text button, so a typo here costs width, never legibility.
      #
      # The criteria table in `cell-filter` already reads this way; this is the second table
      # arriving at the same answer, not a new idea.
      - key: remove
        title: ""
        cell:
          button:
            label: Remove
            icon: remove
            variant: destructive
            args: { index: "$index" }
            onClick: qc.removeMetric

  - id: addMetricBtn
    kind: button
    label: Add custom metric
    variant: default
    onClick: qc.addMetric

  # ── the PREDEFINED metrics, browsable (REPORTED) ──────────────────────────────
  #
  # It was one BUTTON per preset, each carrying its row inline, and the four seeded defaults had
  # no button at all — so the set of metrics a user could add was whatever somebody had thought
  # to hand-write, and "what can I add?" had no surface that answered it.
  #
  # ONE picker over the WHOLE catalog answers it. Each option shows the metric's name and, on a
  # second line, WHAT IT MATCHES — which is the question a user actually has ("is `pct_ribo` the
  # one for RPS/RPL?"), and which a list of bare names cannot answer.
  #
  # A capability-gated entry is not offered at all: the gate is declared on the OPTION, so the
  # protein preset is absent from RNA-only data exactly as its button used to be hidden.
  - id: presetPicker
    kind: select
    label: Add a predefined metric
    options: "$const.metricPresets[*]"
    value: "$state.presetChoice"
    # A PRESET THAT IS ALREADY IN THE TABLE IS NOT OFFERED.
    #
    # Choosing is adding, so an option that is already a row is an offer to do the one thing the
    # form then REFUSES: `metricTable.require.unique_by: name` invalidates the duplicate the
    # instant it lands, the run gate closes, and the user is left deleting a row they were
    # invited to create. The gate was right and the OFFER was wrong.
    #
    # `offer_when` and NOT `require.not_in` on this picker, and the distinction is the whole
    # reason the vocabulary needed a new key. A `require` is a claim about what the RUN will
    # refuse, so it closes the submit gate — and adding a preset is entirely optional, so a
    # requirement here would refuse a launch over a choice nobody has to make. This narrows what
    # is OFFERED and asserts nothing about validity. `unique_by` on the table stays as the
    # backstop for the collision that arrives by another route (a row renamed by hand).
    #
    # Declared ONCE on the control rather than as a clause on each of the six entries: the rule
    # belongs to the offer, not to any entry, so adding the seventh preset stays a pure data
    # change. Six copies of one clause is six chances for the seventh to be written without it —
    # and it would be MISSING silently, offering a duplicate with nothing to say so.
    offer_when: "$derived.metricNames[$option.metric.name] == absent"
    # …and when every preset HAS been added, the control says so in its own words. The engine's
    # generic wording is "No options yet", which is right for a binding that has not resolved and
    # wrong here: this set is exhausted, not pending, and there is nothing to wait for.
    empty_text: Every predefined metric is already in the table.
    # CHOOSING IS THE ACTION. There was a second step — pick, then press Add — and the press
    # carried no decision: the only thing it could do was the thing the choice already said.
    # `qc.addPreset` now takes the chosen value as a param and spends it, so the picker returns
    # to its placeholder and is immediately ready for the next one.
    onChange: qc.addPreset
  # `addTssBtn` / `qc.addTss` are GONE. The button appended a metric row carrying
  # `source: fragments` and NO `pattern` — and `source` is a key nothing has ever read.
  #
  # Every row in `qc_metrics` is a GENE-NAME REGEX metric: `parse_qc_metrics` keeps
  # `{name, pattern, aggregation}` and the compute answers it with `re.match` over the bound
  # `gene_names` values. A pattern-less row therefore used to be compiled as `""`, and
  # the empty regex matches EVERY gene — so `pct_tss_enrichment` came out ~100 % on
  # every cell, with no warning, plotted by the canvas beside the metrics that are real.
  # That is the silent wrong answer this file exists to stop, and it was REACHABLE:
  # `single-cell/atac` declares the `fragments` capability (`single-cell-types`), the
  # importer stamps that datatype on any ATAC modality, and `deriveCaps` makes
  # `has:fragments` true for the whole project.
  #
  # It could not have worked as declared either. TSS enrichment is computed from
  # FRAGMENT POSITIONS relative to a TSS annotation — not from gene names, so it is not
  # expressible as a `{name, pattern, aggregation}` row at all — and the fragments file is not an
  # input to this analysis: `appliesTo` declares `matrices`, the view binds `matrices` +
  # `gene_names`, and the fragments path exists only as a recorded LINKAGE from ingest
  # (`multimodal.py::extract_atac_linkage`), never as a mountable artifact.
  #
  # It is the last survivor of the deleted `const.presets.atac` family (`frip` /
  # `tss_enrichment` / `nucleosome_signal`, all `source: fragments`), which this branch
  # removed for having no consumer. A control that produces a number nobody should trust
  # is worse than a missing feature, so it is deleted rather than left. Real ATAC
  # fragment metrics need a fragments INPUT SLOT and their own compute path; when that
  # exists they are an analysis, not a row in this table.
  #
  # The compute-side defect was NOT specific to this row and is fixed independently:
  # `compile_gene_pattern` now REFUSES an absent/empty pattern
  # (`MissingGenePattern` → `fail`), so `qc.addMetric`'s blank row — reachable by every
  # user on every dataset — can no longer produce a 100 % column either.

  # `noMetricsAlert` and `unpairedGeneNamesAlert` are GONE, and their sentences moved verbatim
  # into `require.message` on `metricTable` and `geneNamesPicker`.
  #
  # They existed only because a requirement could not be written once: their `when` clauses
  # were hand-copied fragments of the Run button's `disabledWhen`, restating in prose what the
  # gate already computed. Two copies of one rule in two places that can drift apart — and one
  # of them (the unpaired one) was copied from a predicate that was already wrong. Now the
  # requirement is declared on the control, and the field, the summary beside Run and the gate
  # all read that one declaration.
  #
  # `noInputAlert` above STAYS, and the distinction is worth stating because the predicates
  # look identical: `matrices.length == 0` because the PROJECT HAS NO CANDIDATES is a fact
  # about the environment with no action available in this form, while the same emptiness
  # because the USER HAS NOT CHOSEN YET is an unanswered question. The alert speaks to the
  # first; the constraint speaks to the second — and a required control whose candidate set is
  # empty deliberately shows no error at all, because a red "required" on a control that offers
  # nothing is an instruction nobody can follow.

  - id: runBtn
    kind: button
    label: Compute QC metrics
    variant: primary
    # Deliberately NOT `when:` — that HIDES the widget, and hiding the Run button is the
    # exact deadlock `DeclarativeRegion` already documents: "a fresh project would show
    # 'No data yet. Run the analysis that produces its input' with the Run button hidden
    # behind the very message telling the user to run it." Disabled-and-visible says why;
    # hidden says nothing.
    #
    # NO `disabledWhen`. Its three clauses — no matrix, no metric rows, unpaired gene names —
    # are each declared on the control they are ABOUT, and the button's disabled state is
    # DERIVED from those declarations rather than restating them. That is not a tidy-up: the
    # third clause was provably wrong (see `geneNamesPicker.require`), and it was wrong in a
    # way only a hand-written whole-form predicate can be.
    #
    # The engine states the unmet ones under the button, so a disabled primary action is never
    # a mystery.
    onClick: qc.run

actions:
  - id: qc.setMatrices
    title: Set count matrices
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: list }
    body:
      # `geneNames` is POSITIONALLY aligned with `matrices`, so changing the matrices
      # invalidates every entry: index i now anchors a different dataset's genes axis, and a
      # kept value would name a column of the matrix that USED to be there. Cleared, then
      # re-seeded by each per-matrix picker (which pre-selects when its axis has exactly one
      # string column). Silently keeping a stale list is how a positional pairing rots.
      - set: { matrices: "$params.value", geneNames: [] }

  - id: qc.setGeneNames
    title: Set gene-name source
    permission: jobs::use
    mutating: true
    stateful: true
    # `index` is the matrix position the picker was rendered for — the pairing itself.
    params: { index: number, value: string }
    body:
      - set: { "geneNames.{$params.index}": "$params.value" }

  # Edit a metric row's field by INDEX (the table's editable_text onChange forwards
  # `{ index, key, value }`). The interpolated set-path targets the row's field.
  # ONE action serves every editable cell in the table, including the closed-set
  # `Aggregation` one: a `select` cell dispatches `{key, index, value}` byte-identically to
  # an `editable_text` cell, so the vocabulary grew without the view growing an action.
  - id: qc.setMetricField
    title: Edit metric field
    permission: jobs::use
    mutating: true
    stateful: true
    params: { index: number, key: string, value: string }
    body:
      - set: { "qc_metrics.{$params.index}.{$params.key}": "$params.value" }
  # A blank row carries an aggregation, because a row without one is REFUSED by the compute
  # (DEC-4), not defaulted there. It is `percentage` for the same reason the two preset
  # affordances below use it — a custom gene-set metric is conventionally read as a share of
  # the cell's counts — and unlike the old invisible default it is VISIBLE in the cell the
  # instant the row appears, and changeable before Run.
  - id: qc.addMetric
    title: Add a custom metric
    permission: jobs::use
    mutating: true
    stateful: true
    params: {}
    body:
      - listAppend:
          path: qc_metrics
          value: { id: "", name: "", pattern: "", aggregation: percentage }
  # `index` — the row's POSITION, which is what `listRemove` removes by. It used to be
  # `{ key: string, selected: boolean }` (the selection column's payload), and the `key` it
  # was handed was the row's `id`, so nothing was ever removed. Same shape as
  # `cf.removeCriterion`, which has always been correct.
  - id: qc.removeMetric
    title: Remove a metric
    permission: jobs::use
    mutating: true
    stateful: true
    params: { index: number }
    body:
      - listRemove: { path: qc_metrics, index: "$params.index" }
  # THE generic add. `qc.addHb` / `qc.addIsotype` are GONE, and this replaces them ALL: the row
  # it appends is READ from the catalog rather than written here, so a preset is a datum and
  # adding the next one is a row in `const.metricPresets` — no action, no button, no app change.
  #
  # It appends the four `{id, name, pattern, aggregation}` fields EXPLICITLY rather than the
  # whole catalog entry, because a catalog entry also carries what the PICKER needs
  # (`value`/`label`/`description`/`when`) and those have no business in a metric row: they would
  # ride into `params.qc_metrics` and into the recorded provenance of every run.
  #
  # …then CLEARS the choice. Without that, the picker still holds the preset that is now in the
  # table, its `not_in` fires immediately, and the form is refused for having done exactly what
  # the user just asked for.
  - id: qc.addPreset
    title: Add a predefined metric
    permission: jobs::use
    mutating: true
    stateful: true
    # The CHOSEN value arrives as a param, from the picker's own change. It is not read back out
    # of `presetChoice`, because the picker's write and this read would then be two steps that
    # can disagree — and the second one is the one that appends.
    params: { value: string }
    body:
      - listAppend:
          path: qc_metrics
          value:
            id: "$derived.presetByValue[$params.value].metric.id"
            name: "$derived.presetByValue[$params.value].metric.name"
            pattern: "$derived.presetByValue[$params.value].metric.pattern"
            aggregation: "$derived.presetByValue[$params.value].metric.aggregation"
      # Spend the choice, so the control returns to its placeholder rather than sitting on a
      # value that has already been acted on.
      - set: { presetChoice: null }
  # `qc.addTss` is GONE with its button — see the `addTssBtn` block above. Every
  # remaining add affordance appends a row carrying a real `pattern`, which is the
  # invariant `qcSurface.test.ts` now asserts over the whole action set rather than
  # over a list of known action ids.

  - id: qc.run
    title: Compute QC metrics
    permission: jobs::use
    mutating: true
    params: {}
    body:
      # `inputs` is passed EXPLICITLY, from view state (INV-4).
      #
      # It used to be absent, and `hostCtx.runProcessor` auto-resolved artifact-ref inputs
      # from the catalog — invisible, and a hard throw when the count was not exactly 1.
      # Auto-resolution still runs, but as the SEED for `state.matrices` at mount; by the
      # time this fires the value is on screen and has been overridable. What is launched
      # is what was shown.
      #
      # BOTH are artifact inputs. `gene_names` is not a param: it names an artifact, so it
      # is mounted and resolved by slot like any other input.
      - run_processor:
          id: qc.10x
          inputs:
            matrices: "$state.matrices"
            gene_names: "$state.geneNames"
          params:
            qc_metrics: "$state.qc_metrics"
          into: qcJob
      - wait_for: { job: "$qcJob", until: completed }
      - toast: { success: "QC metrics computed" }

# The `canvas:` block that stood here — one violin series per emitted metric column, pushed
# onto the workbench's single shared canvas — is DELETED. The rationale is recorded above,
# where the `data:`/`derived:` slice that fed it used to be.
