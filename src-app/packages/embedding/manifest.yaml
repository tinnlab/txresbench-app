# embedding — SINGLE-DATASET dimensionality reduction + 2-D visualization (Stage 0).
#
# ONE package holds TWO analyses (ITEM-0b), mirroring `embedding-integrate` (the tree's
# other two-analysis package): `embedding.reduce` (a count matrix → a PCA embedding, the
# memory-bound half) and `embedding.visualize` (an embedding of ≥3 dims → a 2-D layout,
# the time-bound half). They share one compute substrate (`compute/_shared.py`: the
# six-var thread pin, the I/O wire contract, the CSC reader, the ceiling gate, the report
# shape) so one version bump moves both halves.
#
# THE MANIFEST DECLARES ONLY WHAT THE WORKBENCH NEEDS TO LOAD, ENABLE AND EXECUTE
# (INV-16). No labels, no help text, no field order, no form schema, no forecast of
# produced columns — those live in the view (Stage 0-C) and are READ from artifacts
# (INV-19). No `ui:` key here yet ⇒ the workbench builds the generic fallback form from
# `appliesTo` until the declarative views land; that is an explicit declared state, not an
# accident (see the QC manifest's `ui:` note).
#
# Dual-parsed, like every processor manifest: the backend extensions loader parses it into
# an `ExtensionManifest` at boot and reads only `id` + `run` + `methods`.
id: embedding
name: Embedding
publisher: txr
# 0.1.0 — Stage-0 Stage-A: the package skeleton + `embedding.reduce`'s CORE compute
# pipeline (raw-count gate, skip-scaling, seurat_v3 HVG, arpack PCA, float64 gene
# statistics, six-var thread pin, ceiling gate, provenance) and `embedding.visualize`'s
# neighbour-path + UMAP/t-SNE layout.
# 0.2.0 — Stage-0 Stage-B: optional single-dataset Harmony batch correction on
# `embedding.reduce` (pinned harmonypy, EXPLICIT params `theta`-first, a THIRD
# `method="harmony"` embedding + a harmonypy-absent NAMED refusal — INV-22/ITEM-20a/20b)
# and the honest report (the DEC-8 lossy-summary voice + INV-13 metric caveat). One
# version bump moves both halves (ITEM-0b). The declarative views land in a later sub-stage.
# 0.3.0 — Stage-0 Stage-C: the two declarative views (`ui/reduce.yaml`, `ui/visualize.yaml`)
# land, so each analysis now declares its `ui:` file instead of falling back to the generic
# form. The view OWNS everything the user sees + selects and derives its options from the data
# (INV-16/17/18/20); no compute changed. One version bump moves both halves (ITEM-0b).
# 0.4.0 — Stage-0 Stage-D: the INLINE metadata filter (ITEM-2b/2c/2d/14a-d/OD-3) — an optional
# predicate over ANY cells-axis obs column, subset at read BEFORE the fit so the embedding is
# re-derived on the survivors (INV-12). The `reduce.yaml` criteria builder + the compute reuse
# `cell-filter`'s SHIPPED `criteria_keep_mask` VERBATIM (DEC-11), staged via `compute/_criteria.py`.
# 0.4.1 — Stage-0 conformance: the single-value input slots (`matrices` on reduce,
# `embedding` on visualize) opt in to `auto_bind_sole_candidate` (DEC-15). Declaration
# only — no compute behaviour, output or attributes.txr change.
# 0.4.7 — #567: test-only fix for the cross-package bare-module-name collision — the
# `_shared`/`_criteria` compute modules are now loaded under namespaced `sys.modules` keys
# via `embedding_fixtures.import_own` instead of the flat name, so a sibling package's
# same-named module can never win in a shared pytest session. No production/compute
# behaviour changed.
# 0.4.3 — the package's zero-src-app-diff guard is now SELF-LIMITING: it runs only on the
# branch that introduced this package (add-only marker on this manifest) and SKIPS
# visibly elsewhere, instead of re-asserting this branch's diff shape on every future
# branch. Test-only; no compute, view or datatype behaviour changes. See
# docs/design/derived-guards.md §3. Seed reconciliation is version-keyed, hence the bump —
# TEST-17 is `scripts/check-processor-seed-versions.sh`, observed RED naming this package
# before the bump and GREEN after, so it is demonstrably not a vacuous check.
version: 0.4.7
apiVersion: "1.0"
contributes:
  analyses:
    # ── ANALYSIS 1 — the reduce (single-dataset, memory-bound) ─────────────────────
    - id: embedding.reduce
      category: embedding
      title: Reduce dimensions
      description: >-
        Reduce one single-cell count matrix to a PCA embedding: raw-count validation →
        normalize → highly-variable genes (seurat_v3) → PCA. Produces an `embedding` (the
        PCA representation) and a provenance report. Never exposes a corrected
        representation as an expression matrix, and never standardizes (no scaling / no
        regress-out).
      whenHint: >-
        the user has one count matrix and wants a PCA embedding to cluster / annotate /
        visualize from
      examples:
        - reduce this dataset to a PCA embedding
        - run PCA on these counts
        - prepare this matrix for a UMAP
      safety: read-run

      # ── APPLICABILITY (ITEM-2) — RAW counts only; SINGLE-select in Stage 0 (DEC-12) ─
      # `modality` is deliberately NOT excluded (the modality-vs-modality collision is a
      # Stage-1 named refusal, DEC-9).
      appliesTo:
        - slot: matrices
          subtypes_of: single-cell/expression
          excludes: [single-cell/normalized, single-cell/protein, single-cell/atac]
          # DEC-15 opt-IN: a headless (agent/MCP) launch auto-binds this single-value input
          # when exactly one candidate exists; omitting it leaves the input unresolved.
          auto_bind_sole_candidate: true

      # A GRAPH EDGE (`chaining.ts`), never an availability input: the batch / covariate and
      # the inline-filter columns are cells-axis `metadata-column`s, so this analysis is a
      # consumer of that datatype.
      consumes: [metadata-column]

      # The DATATYPES it emits, and nothing finer (INV-19). `embedding` is the exact string
      # `embedding.visualize` requires, so the chaining edge resolves by string equality
      # (ITEM-0d).
      produces: [embedding, report/qc]

      # The env image this contribution runs inside (#191 / E3). DECLARED, not inferred,
      # so the #80 dependency gate resolves its `run.dependencies` against THIS env's pin
      # set only. An env-LESS declaration is resolved against EVERY recipe on disk
      # (`server/build_helper/processor_manifest.rs`) — the fail-closed reading, and
      # exactly right while one recipe exists; with a second, deliberately narrower env
      # (`single-cell-r`) it would demand these python pins be installed there too. The
      # gate's own doc-comment prescribes this fix in writing: "the right relaxation is
      # for a contribution to DECLARE the env it targets, not for this gate to guess".
      env: single-cell
      run:
        kind: sandbox
        runtime: python
        entry: compute/reduce.py
        # The shared compute substrate, staged into `/code` beside the entry so
        # `import _shared` resolves (same mechanism `embedding-integrate`'s join-quality
        # uses to import its sibling). `_criteria.py` is `cell-filter`'s predicate kernel
        # VENDORED VERBATIM (DEC-11) — the platform confines `run.helpers` to a package's
        # OWN tree (`processors/mod.rs::confine_under_package` rejects any `..`), so the
        # kernel cannot be imported across packages and is vendored + conformance-tested.
        helpers:
          - compute/_shared.py
          - compute/_criteria.py
        # The libraries THIS entry's code imports, with the version range it is
        # supported against (#80). A minor-pinned range where the library's DEFAULTS decide a published
        # number; a wider one where it is a stable numerical floor.
        dependencies:
          - { library: anndata, version: ">=0.12,<0.13" }
          # OPTIONAL: used only when `integration: harmony`. Declaring it unconditionally
          # would break the fallback this analysis' own refusal message recommends — an
          # `integration: none` run against an image that predates the pin would fail for a
          # library it never touches. Optional keeps the build requirement and the version
          # assertion, and drops only the "absent ⇒ refuse" leg.
          - { library: harmonypy, version: "==2.0.0", optional: true }
          - { library: numpy, version: ">=2.0,<3" }
          - { library: pandas, version: ">=2.2,<3" }
          - { library: scanpy, version: ">=1.11,<1.12" }
          - { library: scikit-misc, version: ">=0.5,<0.6" }
          - { library: scipy, version: ">=1.14,<2" }

      # ── UI (Stage-0 Stage-C) — the declarative view files this analysis renders ─────
      # The manifest names the FILE; it says nothing about what is in it (INV-16). Everything
      # the user sees + selects — labels, field order, the option sources — lives in the view
      # (INV-17). Package-relative + MUST exist (a missing `ui:` entry is a LOAD ERROR).
      ui:
        - ui/reduce.yaml

      # `normal` ⇒ 4 GiB / 2 cores / 600 CPU-s (DEC-3). Single-dataset Stage-0 runs sit
      # comfortably inside the Normal envelope; `batch` would buy memory headroom at the
      # cost of scheduling priority and is not declared without a measured need.
      schedule:
        class: normal
      arch: [x86_64, aarch64]

      methodsText: >-
        Reduced the count matrix to a PCA embedding: normalize-total + log1p, seurat_v3
        highly-variable genes on the raw counts, then PCA (arpack). No scaling or
        regress-out was applied; the matrix was not modified.

      methods:
        subject: { singular: cell, plural: cells }
        action: embedded
        # `at most`, not a flat count: `n_pcs`/`n_hvg` are the REQUESTED values, and the
        # compute clamps both (`min(n_pcs, max_comps)` / `min(n_hvg, n_genes)`, and
        # seurat_v3 may select fewer still). Interpolating them as a flat assertion would
        # put a confident, citable number into methods.md that the run can contradict —
        # which is worse than the literal `{n_pcs}` braces it replaces, because a brace
        # reads as a broken tool and a wrong number reads as a fact.
        commits: "a PCA embedding of at most {n_pcs} components over at most {n_hvg} highly-variable genes"
        commits_unlabeled: a PCA embedding
        # This note is now narrated on EVERY run (#131 — it used to be dropped whenever the
        # analysis narrated no constraint, which for this analysis is always). It therefore
        # has to be true of every run: the old wording asserted flatly that the
        # representation "is not batch-corrected", which is FALSE for a run that recorded
        # an integration method — the compute emits a corrected representation and makes it
        # the primary one. It states the condition instead.
        note: >-
          Highly-variable genes use seurat_v3 on the raw counts. The PCA representation
          this step commits is NEVER batch-corrected (it is stamped `correction: none`
          whatever the run requested) and is never exposed as an expression matrix. When
          the run records `integration: harmony`, the step commits a SEPARATE corrected
          representation alongside the uncorrected PCA one, and its report names that one
          as the step's primary result. Nothing downstream is bound to that choice: a
          consumer sees two candidate representations and something — a person or the
          agent — picks one, so which of them a later step used is that step's own recorded
          input, not an inference from this one. The
          requested component and gene counts are upper bounds: the run reduces either when
          the data admits fewer, and records the effective values in the report it emits
          alongside its outputs.
        # `integration` and `batch_column` are `narrated_value` so their RECORDED VALUES are
        # stated. The note above is a CONDITIONAL on `integration`, and a document that
        # poses a question about the run and then declines to answer it is worse than one
        # that never asked: with the value stated, a reader sees `integration` = `harmony`
        # or `= none` and knows which arm of the note applies to the run in front of them.
        #
        # `n_pcs`/`n_hvg` are `narrated_value` because the `commits` phrase above
        # INTERPOLATES them (#131). That declaration is what makes the placeholder
        # build-checkable: an undeclared `{token}` is a build failure, not a literal
        # brace printed into the exported methods.md. They are still disclosed by name
        # on any run where the phrase could not be rendered.
        params:
          seed: seed
          name: output_label
          n_pcs: narrated_value
          n_hvg: narrated_value
          integration: narrated_value
          batch_column: narrated_value

    # ── ANALYSIS 2 — the visualize (keys on the datatype, time-bound) ──────────────
    - id: embedding.visualize
      category: embedding
      title: Visualize embedding
      description: >-
        Lay out one embedding of at least 3 dimensions as a 2-D embedding, via UMAP or
        t-SNE, whatever produced the input (our PCA, or an imported latent). Records which
        neighbour path ran and the layout choices made; a 2-D embedding is a lossy summary,
        not a measurement surface.
      whenHint: >-
        the user has an embedding (a PCA, or an imported latent) and wants a 2-D layout to
        look at
      examples:
        - make a UMAP of this
        - lay this embedding out in 2-D
        - t-SNE this PCA
      safety: read-run

      # ── APPLICABILITY (ITEM-0c) — keys on the DATATYPE, regardless of producer ──────
      # `embedding` is a bare-id derived datatype; any embedding of ≥3 dims qualifies. The
      # <3-dim refusal is enforced COMPUTE-side, by a named refusal read from the declared
      # structure before any read (`visualize.py`, ITEM-0e), not a `min_dims` platform edit.
      # The view-side `checks:` half was DESCOPED (DEC-15): no shipped `data:` source exposes
      # an artifact's declared dimension count as a scalar, so there is no form-side guard —
      # the compute-side belt is the single enforcement point.
      appliesTo:
        - slot: embedding
          type_id: embedding
          # DEC-15 opt-IN: a headless (agent/MCP) launch auto-binds this single-value input
          # when exactly one candidate exists; omitting it leaves the input unresolved.
          auto_bind_sole_candidate: true

      produces: [embedding, report/qc]

      # The env image this contribution runs inside (#191 / E3). DECLARED, not inferred,
      # so the #80 dependency gate resolves its `run.dependencies` against THIS env's pin
      # set only. An env-LESS declaration is resolved against EVERY recipe on disk
      # (`server/build_helper/processor_manifest.rs`) — the fail-closed reading, and
      # exactly right while one recipe exists; with a second, deliberately narrower env
      # (`single-cell-r`) it would demand these python pins be installed there too. The
      # gate's own doc-comment prescribes this fix in writing: "the right relaxation is
      # for a contribution to DECLARE the env it targets, not for this gate to guess".
      env: single-cell
      run:
        kind: sandbox
        runtime: python
        entry: compute/visualize.py
        helpers:
          - compute/_shared.py
        # The libraries THIS entry's code imports, with the version range it is
        # supported against (#80). A minor-pinned range where the library's DEFAULTS decide a published
        # number; a wider one where it is a stable numerical floor.
        dependencies:
          - { library: anndata, version: ">=0.12,<0.13" }
          - { library: numpy, version: ">=2.0,<3" }
          - { library: pandas, version: ">=2.2,<3" }
          - { library: scanpy, version: ">=1.11,<1.12" }
          - { library: scikit-learn, version: ">=1.7,<2" }
          - { library: umap-learn, version: ">=0.5,<0.6" }
          - { library: scipy, version: ">=1.14,<2" }

      # ── UI (Stage-0 Stage-C) — the declarative view file this analysis renders ──────
      # No `canvas:` in it (ITEM-12): §Coordinates in `single-cell-viz` already renders any
      # `{ capabilities: [plottable-xy], dims: 2 }` artifact, and `embedding` declares
      # `plottable-xy`, so the produced 2-D layout is plotted (and coloured by a gene) there —
      # a second plotting surface here would compete (INV-19).
      ui:
        - ui/visualize.yaml

      # `normal` — time-bound, nobody-waiting is false here (a layout is quick) but a
      # `batch` class moves no time (DEC-3), so `normal` is the settled class.
      schedule:
        class: normal
      arch: [x86_64, aarch64]

      methodsText: >-
        Built a k-NN graph over the input embedding and produced a 2-D layout (UMAP or
        t-SNE). The neighbour path and layout parameters were recorded; the input was not
        modified.

      methods:
        subject: { singular: cell, plural: cells }
        action: laid out
        commits: "a 2-D {method} embedding"
        commits_unlabeled: a 2-D embedding
        # `n_neighbors`/`min_dist`/`metric` are disclosed by name (ITEM-3). `method` is
        # `narrated_value`: the `commits` phrase above interpolates it, and declaring it
        # is what lets the build gate check the placeholder instead of letting a literal
        # `{method}` reach the exported methods.md (#131).
        params:
          seed: seed
          name: output_label
          method: narrated_value
