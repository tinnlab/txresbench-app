# differential-expression — TWO analyses over a single-cell expression matrix grouped by a
# categorical `metadata-column`, plus a Visualize SECTION contributing the volcano readout.
#
#   · `de.markers`  — a DESCRIPTIVE marker scan (ranked effect + detection rates, NO p-value).
#                     Any categorical grouping (cluster / annotation / condition). Always R2.
#   · `de.compare`  — an INFERENTIAL condition comparison (pseudobulk → PyDESeq2/NB-GLM →
#                     logFC/neglog10p/padj). RAW COUNTS only (INV-13). R1 when the grouping is
#                     external + a sample column gives ≥2 samples/side; R2/R3 otherwise.
#
# The whole feature is DATA — manifest + python compute + declarative views — baked into the
# server seed; no server module, no migration, no new permission (reuses `jobs::use`). Mirrors
# the `clustering` + `embedding` packages: the manifest declares only what the workbench needs
# to LOAD, ENABLE and EXECUTE (the datatype selectors + `run` + `methods` + `schedule`); the
# `ui:` files own everything the user sees + selects. Two independent invalidity problems —
# SELECTION and REPLICATION — are kept apart: pseudobulk fixes replication and does NOTHING for
# selection, so the regime (never the analysis id) decides whether a p-value is written (INV-1/
# INV-2). Method dispatch is a `catalog()` registry with ≥2 methods per analysis (INV-12).
id: differential-expression
name: Differential expression
publisher: cyto
# 0.2.2 — the package's zero-src-app-diff guard is now SELF-LIMITING: it runs only on the
# branch that introduced this package (add-only marker on this manifest) and SKIPS
# visibly elsewhere, instead of re-asserting this branch's diff shape on every future
# branch. Test-only; no compute, view or datatype behaviour changes. See
# docs/design/derived-guards.md §3. Seed reconciliation is version-keyed, hence the bump.
# 0.2.3 (#196) — `tests/test_rootfs_deps.py` gives up its WHOLE-TREE claim. The
# pin ⇄ build-smoke correspondence is a property of EVERY env recipe, but it was asserted
# here about one hardcoded recipe from inside this package's test directory, so a second
# recipe's pins would have been unguarded the day one landed. It now lives in
# `sandbox::env_image::every_env_recipe_smoke_verifies_every_pinned_import`, iterating
# `discover_env_recipes`. What stays here are this recipe's FROZEN anchors
# (derived-guards.md §4), now fail-closed on the subject's absence. Test-only; no compute,
# view or datatype behaviour changes. Seed reconciliation is version-keyed, hence the bump.
# 0.2.4 (#196 + #191, at the merge) — 0.2.3 was claimed INDEPENDENTLY by two branches for
# two unrelated changes: E3's `env: single-cell` declaration and this item's move of the
# whole-tree pin/smoke claim out of `tests/`. Git merged the two identical `version:` lines
# with NO conflict, so one bump would have covered both — the same shape as the certification
# counter where two removals produced one decrement. Seed reconciliation is version-keyed, so
# the merged content gets its own version rather than inheriting a number that already meant
# something else.
# 0.2.7 — #163 re-records `_PY_ENV_TREE_LOCK` in `tests/test_rootfs_deps_r.py` because the
# python env recipe gains a `pyarrow` pin (the Xenium boundaries reader). Nothing this
# package COMPUTES changes; the bump is what `scripts/check-processor-seed-versions.sh`
# requires of any file moving under a seed package, so a provisioned deployment re-extracts
# onto the new lattice instead of keeping a stale one.
#
# 0.2.15 — #567: test-only fix for the cross-package bare-module-name collision — the
# `_criteria`/`_regime` bare imports are now loaded under namespaced `sys.modules` keys
# via `de_fixtures.import_own`, so embedding's same-named vendored copies can never win
# the flat name in a shared pytest session. No production/compute behaviour changed.
#
# 0.2.8 — TEST-DIRECTORY ONLY (#299 sweep). `tests/test_zero_src_app_diff.py`'s
#          advanced-contrast guard open-coded the marker-keyed introducing-branch gate
#          (`repo_root()` / `added_paths()` / `pytest.skip(...)` / `changed_paths()`) — the
#          FOURTH copy of that body in the tree, and the one the new repo-wide sweep found on
#          its first run, which is what a sweep is for. It now delegates to
#          `_lib/zero_core_guard.require_introducing_file`, keeping its own premise (the ADD
#          of this package's vendored criteria kernel, NOT the package manifest — those are
#          two different branches, as this module's own docstring reasons out) and its own
#          skip sentence, which is passed through as `reason=` rather than dropped.
#          Behaviour unchanged; no allow-set widened, no assertion removed.
#
#          The version moves because `scripts/check-processor-seed-versions.sh` is
#          base-relative over the whole package DIRECTORY, `tests/` included. Forward from
#          the merge target (`origin/main` @ `20ff18e5` reads 0.2.7); checked against every
#          in-flight sibling branch as well, none of which claims above 0.2.7 — the rule
#          #300 exists for, applied rather than assumed.
version: 0.2.15
apiVersion: "1.0"
contributes:
  analyses:
    # ── de.compare — the INFERENTIAL condition comparison (RAW COUNTS, INV-13) ─────────────
    - id: de.compare
      category: differential-expression
      title: Compare groups
      description: >-
        Differential expression between two groups of cells, as a genuine inferential test when
        the grouping is external and replicated: aggregate RAW counts to (sample × group)
        pseudobulks, then run a replicate-aware bulk test (PyDESeq2 Wald by default, NB-GLM as
        an alternative) → log fold-change, −log10 p and BH-adjusted FDR. The regime is a
        resolved consequence of the grouping's provenance — a matrix-derived or unreplicated
        grouping yields ranked effects with p-values ABSENT, never a fabricated significance.
      whenHint: >-
        the user has an external condition (treatment / genotype / responder status) and a
        replicate/sample column, and wants a real differential-expression test between two groups
      examples:
        - compare treated vs control
        - run differential expression between conditions
        - which genes are up in responders
      safety: read-run

      # APPLICABILITY keys on the DATATYPE (single-select). The expression slot is typed RAW
      # COUNTS (INV-13): `subtypes_of: single-cell/expression` MINUS the normalized/protein/atac
      # layers — feeding a normalized/log matrix into the pseudobulk→DESeq2 path is the legacy D4
      # defect and is refused BY NAME compute-side (the excludes here is the declaration; the
      # named refusal is the belt). DEC-15 opt-IN auto-bind for a headless launch.
      appliesTo:
        - slot: expression
          subtypes_of: single-cell/expression
          excludes: [single-cell/normalized, single-cell/protein, single-cell/atac]
          auto_bind_sole_candidate: true

      # GRAPH EDGES (`chaining.ts`), not availability inputs: the grouping + sample columns are
      # categorical `metadata-column`s bound by the view (`grouping:`/`sample:` slots), and
      # `metadata-column` lets the workbench answer "which analysis yields this input?".
      consumes: [single-cell/expression, metadata-column]

      produces: [de/result, report/qc]

      ui:
        - ui/compare.yaml

      # The env image this contribution runs inside (#191 / E3). DECLARED, not inferred,
      # so the #80 dependency gate resolves its `run.dependencies` against THIS env's pin
      # set only. An env-LESS declaration is resolved against EVERY recipe on disk
      # (`server/build_helper/processor_manifest.rs`) — the fail-closed reading, and
      # exactly right while one recipe exists; with a second, deliberately narrower env
      # (`single-cell-r`) it would demand these python pins be installed there too. The
      # gate's own doc-comment prescribes this fix in writing: "the right relaxation is
      # for a contribution to DECLARE the env it targets, not for this gate to guess".
      env: single-cell
      run:
        kind: sandbox
        runtime: python
        entry: compute/compare.py
        helpers:
          - compute/_shared.py
          - compute/_regime.py
          - compute/_methods.py
          - compute/_pseudobulk.py
          # DE advanced-contrast (v0.2): the VENDORED cell-filter criteria kernel (INV-A1),
          # staged beside compare.py so `import _criteria` resolves in the sandbox `/code`.
          - compute/_criteria.py
        # The libraries THIS entry's code imports, with the version range it is
        # supported against (#80). A minor-pinned range where the library's DEFAULTS decide a published
        # number; a wider one where it is a stable numerical floor.
        dependencies:
          - { library: decoupler, version: ">=2.2,<3" }
          - { library: numpy, version: ">=2.0,<3" }
          - { library: pandas, version: ">=2.2,<3" }
          - { library: pydeseq2, version: ">=0.5,<0.6" }
          - { library: statsmodels, version: ">=0.15,<0.16" }

      # `normal` ⇒ 4 GiB / 2 cores / 600 CPU-s (DEC-10). Pseudobulk collapses cells to a tiny
      # (sample × group) matrix, so memory never binds; the banded read keeps the peak inside the
      # Normal envelope, re-checked BEFORE the read with a refusal naming a REACHABLE lever. No
      # per-run class control, so a refusal never names a `batch` escape hatch that does not exist.
      schedule:
        class: normal
      arch: [x86_64, aarch64]

      methodsText: >-
        Tested differential expression between two groups of cells. When the grouping was external
        to the matrix and a replicate/sample column gave at least two samples per side, raw counts
        were aggregated to (sample × group) pseudobulks and a replicate-aware bulk test was run
        (PyDESeq2 Wald by default, or a negative-binomial GLM) → log fold-change, −log10 p and
        Benjamini-Hochberg FDR within the comparison. When the grouping was derived from the same
        matrix (double dipping) or unreplicated, the run returned ranked effect sizes with the
        p-value and FDR ABSENT rather than a fabricated significance — pseudobulk addresses
        replication and does nothing for the circular selection.

      methods:
        subject: { singular: gene, plural: genes }
        action: tested
        commits: "one per-comparison differential-expression gene table, `{name}`"
        commits_unlabeled: a per-comparison differential-expression gene table
        note: >-
          The unit of replication is the pseudobulk (sample × group); the bulk test runs on the
          pseudobulk matrix, never per cell. Raw counts are passed straight through (DESeq2
          normalizes internally); no global pseudocount is added. Multiple testing is corrected
          Benjamini-Hochberg within each comparison, and the across-comparison family is reported
          too. The regime (R1 inferential / R2 descriptive / R3 unreplicated) is decided by the
          grouping column's provenance, not by the analysis, and gates whether p-values are
          written at all.
        params:
          seed: seed
          name: output_label

    # ── de.markers — the DESCRIPTIVE marker scan (any categorical grouping, always R2) ────────
    - id: de.markers
      category: differential-expression
      title: Scan markers
      description: >-
        Rank the marker genes of each group against the rest, for ANY categorical grouping
        (a clustering, an annotation, an imported condition): a DESCRIPTIVE ranking of effect
        size + detection rates (Wilcoxon rank-sum by default, t-test as an alternative), with
        NO p-value headlined. Because a matrix-derived grouping was defined from the same cells,
        between-group p-values are circular (double dipping); the padj column is ABSENT, not 1.
      whenHint: >-
        the user has a categorical grouping (clusters / cell types / a condition) and wants to
        see what genes define each group, as a ranking rather than a significance claim
      examples:
        - what are the markers of each cluster
        - rank genes that define these cell types
        - scan markers for this grouping
      safety: read-run

      # Counts in; the compute normalizes internally (normalize_total + log1p) before the test
      # and records it in provenance (DEC-17). Same RAW-counts slot as de.compare — one input
      # type across both analyses.
      appliesTo:
        - slot: expression
          subtypes_of: single-cell/expression
          excludes: [single-cell/normalized, single-cell/protein, single-cell/atac]
          auto_bind_sole_candidate: true

      consumes: [single-cell/expression, metadata-column]

      produces: [de/result, report/qc]

      ui:
        - ui/markers.yaml

      # The env image this contribution runs inside (#191 / E3). DECLARED, not inferred,
      # so the #80 dependency gate resolves its `run.dependencies` against THIS env's pin
      # set only. An env-LESS declaration is resolved against EVERY recipe on disk
      # (`server/build_helper/processor_manifest.rs`) — the fail-closed reading, and
      # exactly right while one recipe exists; with a second, deliberately narrower env
      # (`single-cell-r`) it would demand these python pins be installed there too. The
      # gate's own doc-comment prescribes this fix in writing: "the right relaxation is
      # for a contribution to DECLARE the env it targets, not for this gate to guess".
      env: single-cell
      run:
        kind: sandbox
        runtime: python
        entry: compute/markers.py
        helpers:
          - compute/_shared.py
          - compute/_regime.py
          - compute/_methods.py
        # The libraries THIS entry's code imports, with the version range it is
        # supported against (#80). A minor-pinned range where the library's DEFAULTS decide a published
        # number; a wider one where it is a stable numerical floor.
        dependencies:
          - { library: numpy, version: ">=2.0,<3" }
          - { library: pandas, version: ">=2.2,<3" }
          - { library: pydeseq2, version: ">=0.5,<0.6" }
          - { library: scipy, version: ">=1.14,<2" }
          - { library: statsmodels, version: ">=0.15,<0.16" }

      schedule:
        class: normal
      arch: [x86_64, aarch64]

      methodsText: >-
        Scanned the marker genes of each group against the rest for a categorical grouping. The
        counts were normalized internally (normalize_total + log1p) and each group was contrasted
        with the rest using the Wilcoxon rank-sum test (or a t-test) → a ranking score, log
        fold-change effect size and per-group detection fractions. These markers are DESCRIPTIVE:
        because the grouping was defined from the same cells the markers are computed on,
        between-group p-values are anti-conservative by construction (double dipping) and are not
        reported — the padj column is ABSENT, not 1.

      methods:
        subject: { singular: gene, plural: genes }
        action: ranked
        commits: "one per-group marker gene table, `{name}`"
        commits_unlabeled: a per-group marker gene table
        note: >-
          The comparison is fixed at each group versus the rest. The test is descriptive: because
          the grouping was defined from the same cells, between-group marker p-values are double
          dipped and are not reported (padj is absent, not 1). The counts are normalized internally
          (normalize_total + log1p) before the test; per-group mean/variance accumulate in float64.
        params:
          seed: seed
          name: output_label

  # ── The Visualize SECTION — the DE volcano readout, contributed as a 4th SectionFrame card ──
  #
  # Same idiom as single-cell-viz's Coordinates / Color by / Features: a `pane: visualize`
  # section applying to the `de/result` datatype, whose `ui/visualize-section.yaml` is an
  # `entry_list` of the run's per-comparison artifacts, each with a regime badge + a Plot ▸ that
  # sets the canvas cell's chart-kind to `volcano` (VolcanoView). NOT a bespoke volcano card.
  sections:
    - id: de.viz.differential-expression
      title: Differential expression
      pane: visualize
      order: 40
      collapsed: false
      # Keys on the `de/result` DATATYPE (the per-comparison gene tables the run produced),
      # whoever produced them — the same capability-agnostic idiom Color by uses for
      # `metadata-column`.
      applies_to: [{ type_id: de/result }]
      ui: [ui/visualize-section.yaml]
