# de.compare run form (Frame A → "Compare groups"). Mirrors clustering/cell-filter: the manifest
# declares `ui: [ui/compare.yaml]`, so this names no analysis and no layout — widgets render in
# DECLARATION ORDER. Every input the run consumes is a VISIBLE control passed EXPLICITLY on
# run_processor (INV-18). The method enum is SOURCED from the compare method `catalog()` (INV-12,
# enforced by TEST-29 against `_methods.compare_catalog()`), not hardcoded. The regime is a
# RESOLVED consequence of the grouping's provenance (INV-2), never a user toggle. Reuses
# `jobs::use` — no new permission.
id: de.compare
title: Compare groups
permission: jobs::use

state:
  # The RAW-COUNTS matrix (INV-13). Single-select; seeded from the sole candidate (DEC-15).
  expression: { type: string, default: null }
  # The grouping condition — a categorical `metadata-column` (external condition/genotype).
  grouping: { type: string, default: null }
  # The replicate/sample column (DEC-5) — drives the pseudobulk unit + the R1/R3 split.
  sample: { type: string, default: null }
  # The contrast: group1 vs group2 (levels of the grouping column).
  group1: { type: string, default: null }
  group2: { type: string, default: null }
  # The compare method — enum sourced from the catalog (INV-12).
  method: { type: string, default: "pydeseq2" }
  # Min cells per pseudobulk (DEC-6). Text so the numeric grammar is held by require.number.
  minCells: { type: string, default: "10" }
  # Multiplicity family (DEC-7 / G4).
  multiplicity: { type: string, default: "bh_within" }

  # ── DE advanced-contrast (v0.2) ─────────────────────────────────────────────────────
  # The contrast MODE. `simple` (default, INV-A2) keeps the v1 two-levels-of-one-column path;
  # `advanced` builds each side from a criteria expression over any obs column (INV-A1).
  contrastMode: { type: string, default: "simple" }
  # The two group criteria lists — each a cell-filter `criteria` list of
  # `{column, control, min?, max?, keep?}` rows (INV-A1), AND-combined. Advanced mode only.
  group1Criteria: { type: list, default: [] }
  group2Criteria: { type: list, default: [] }

data:
  # The cells-axis columns of the chosen matrix (names + kinds), and the same relation asked for
  # the artifact ids (`as: sources`) so the run binds what the form showed. Mirrors cell-filter.
  obs:
    source: axis_columns
    args: { of: "$state.expression", axis: cells }
  obsSources:
    source: axis_columns
    args: { of: "$state.expression", axis: cells, as: sources }
  # Advanced mode: the obs COLUMN VALUES for each group's criterion columns (lazily fetched,
  # like cell-filter — bodies land only for the columns a criterion actually names). The two
  # groups fetch independently since a group's mask only needs ITS OWN columns; both frames
  # span the SAME cells axis, so the two masks are per-cell over the same length.
  g1Obs:
    source: axis_columns
    args: { of: "$state.expression", axis: cells, values_for: "$state.group1Criteria" }
  g2Obs:
    source: axis_columns
    args: { of: "$state.expression", axis: cells, values_for: "$state.group2Criteria" }

const:
  # The compare method options — the SAME set `_methods.compare_catalog()` registers, in the same
  # order (default first). TEST-29 binds this to the catalog; adding a method is a code-only
  # catalog() entry + this line (no datatype/manifest edit).
  compareMethods:
    - { value: "pydeseq2", label: "PyDESeq2 · Wald" }
    - { value: "nb_glm", label: "NB-GLM" }
  multiplicities:
    - { value: "bh_within", label: "BH within" }
    - { value: "bh_across", label: "+ across" }
  # The contrast-mode toggle options (Simple default, INV-A2).
  contrastModes:
    - { value: "simple", label: "Simple" }
    - { value: "advanced", label: "Advanced" }
  # AC2 — the per-criterion include/exclude toggle (the mockup `.incexc` chip). Categorical rows
  # only: a categorical exclude is realized as the COMPLEMENT keep-set in the compute
  # (`_criteria_with_excludes`) so the vendored kernel stays byte-identical (INV-A1); a numeric
  # exclude is not expressible by the single-range kernel, so the toggle is HIDDEN on numeric rows.
  includeExclude:
    - { value: "include", label: "Include" }
    - { value: "exclude", label: "Exclude" }
  # An empty per-cell hidden mask — feeds `count_by` so a group's `before` bucket IS its cell
  # count (no cell hidden). Declared as a const so nothing derives an all-false array by hand.
  noHidden: []

derived:
  # Categorical cells-axis columns — the grouping + sample pickers' options.
  catColumns: { columns_of: { obs: "$data.obs", only: categorical } }
  # The DISTINCT category values per column — the contrast group pickers read the grouping's.
  categoriesByColumn: { categories_by_column: { obs: "$data.obs" } }

  # ── DE advanced-contrast: the criteria builders + the live n₁/n₂/overlap preview ──────────
  # ALL obs columns (categorical + numeric) as criterion-picker options, their control types,
  # and the categorical keep-set options — reusing cell-filter's exact criteria idiom (INV-A1).
  advColumns: { columns_of: { obs: "$data.obs" } }
  advControlByColumn: { columns_of: { obs: "$data.obs", keyed: true } }
  advCategoriesByColumn: { categories_by_column: { obs: "$data.obs" } }
  # The per-group KEEP masks — the SAME `criteria_keep_mask` primitive the compute vendors, so
  # the live preview and the committed contrast agree cell-for-cell (INV-A5).
  g1Mask: { keep_mask: { criteria: "$state.group1Criteria", frame: "$data.g1Obs" } }
  g2Mask: { keep_mask: { criteria: "$state.group2Criteria", frame: "$data.g2Obs" } }
  # Live per-group cell COUNTS: `count_by` over each mask (no hidden) → the `true` bucket's
  # `before` IS the count of kept cells (n₁ / n₂). Real, client-side, derived from the masks.
  g1By: { count_by: { group: "$derived.g1Mask", hidden: "$const.noHidden" } }
  g2By: { count_by: { group: "$derived.g2Mask", hidden: "$const.noHidden" } }
  # Live OVERLAP detection: `count_by` grouped by g1 with g2 as the hidden mask →
  # `true.before` = |g1| and `true.after` = |g1 ∩ ¬g2|, so `before > after` ⟺ the two groups
  # SHARE ≥1 cell. Run gates on this (INV-A3/A5); the compute also refuses BY NAME (ITEM-4),
  # which is what names the exact shared-cell count.
  overlapBy: { count_by: { group: "$derived.g1Mask", hidden: "$derived.g2Mask" } }

widgets:
  - id: expressionPicker
    kind: artifact_ref
    auto_bind_sole_candidate: true
    label: Count matrix
    help: >-
      Raw counts. Pseudobulk sums integer counts and DESeq2 normalizes internally — a
      normalized / log layer is refused by name (INV-13).
    source: { subtypes_of: single-cell/expression }
    value: "$state.expression"
    onChange: de.setExpression
    require:
      required: true
      message: Choose the raw-count matrix to compare groups in.
    empty_text: No single-cell count matrix in this project yet — import one to compare groups.

  # ── the contrast MODE toggle (Simple default, INV-A2) ─────────────────────────────
  - id: contrastModePicker
    kind: select
    label: Contrast
    help: >-
      Simple: two levels of one grouping column. Advanced: build each group from a combination
      of include criteria over any obs column (AND across rows), reusing the cell-filter builder.
    options: "$const.contrastModes"
    value: "$state.contrastMode"
    onChange: de.setContrastMode

  - id: groupingPicker
    kind: select
    label: Grouping column
    when: "$state.contrastMode == simple"
    help: The categorical condition to contrast (an external condition / genotype / responder status).
    options: "$derived.catColumns"
    value: "$state.grouping"
    onChange: de.setGrouping
    empty_text: No categorical column to group by — they come from the dataset chosen above.

  - id: samplePicker
    kind: select
    label: Replicate / sample column
    help: >-
      The replicate/sample column drives the pseudobulk unit (sample × group). With ≥2 samples per
      side the comparison is a genuine inferential test (R1); with one sample per side it is
      unreplicated (R3, ranked effects only).
    options: "$derived.catColumns"
    value: "$state.sample"
    onChange: de.setSample
    empty_text: No categorical column to use as the sample/replicate axis.

  - id: group1Picker
    kind: select
    label: Group 1 (numerator)
    when: "$state.contrastMode == simple"
    options: "$derived.categoriesByColumn[$state.grouping]"
    value: "$state.group1"
    onChange: de.setGroup1
    empty_text: Pick a grouping column above to list its groups.

  - id: group2Picker
    kind: select
    label: Group 2 (denominator)
    when: "$state.contrastMode == simple"
    options: "$derived.categoriesByColumn[$state.grouping]"
    value: "$state.group2"
    onChange: de.setGroup2
    empty_text: Pick a grouping column above to list its groups.

  # ── ADVANCED: two criteria-builder group panels + live n₁/n₂ + overlap (INV-A1/A5/A6) ─────
  # Each panel is the SHIPPED cell-filter criteria idiom (a `criteria` list of
  # {column, control, min/max/keep} rows + Add criterion), AND-combined — NOT a bespoke group
  # editor (INV-A6 non-negotiable #1). The per-row control follows the column type
  # (`advControlByColumn`): a numeric column takes min/max, a categorical column a keep-set.
  - id: group1Table
    kind: table
    when: "$state.contrastMode == advanced"
    rows: "$state.group1Criteria"
    empty_text: >-
      Group 1 has no criteria yet. A criterion picks one column and says what to keep of it — a
      range for a measurement, a set of categories for a label. Add the first with the button below.
    columns:
      - key: column
        title: Column
        cell:
          select:
            value: "$row.column"
            options: "$derived.advColumns"
            onChange: de.g1.setCriterionField
            empty_text: No columns to filter on — they come from the dataset chosen above.
      - key: constraint
        title: Constraint
        parts:
          - key: min
            cell:
              editable_text:
                when: "$derived.advControlByColumn[$row.column] == range"
                value: "$row.min"
                placeholder: "Min"
                onChange: de.g1.setCriterionField
                require: { number: {} }
          - key: max
            cell:
              editable_text:
                when: "$derived.advControlByColumn[$row.column] == range"
                value: "$row.max"
                placeholder: "Max"
                onChange: de.g1.setCriterionField
                require: { number: {} }
          - key: keep
            cell:
              multiselect:
                when: "$derived.advControlByColumn[$row.column] == multiselect"
                value: "$row.keep"
                options: "$derived.advCategoriesByColumn[$row.column]"
                placeholder: "All categories"
                onChange: de.g1.setCriterionField
      # AC2 — the include/exclude toggle (mockup `.incexc`). CATEGORICAL rows only: an exclude is
      # realized as the COMPLEMENT keep-set in the compute (`_criteria_with_excludes`), the kernel
      # unchanged (INV-A1). Hidden on numeric rows — a single min/max range can't express "outside".
      - key: mode
        title: Keep
        cell:
          select:
            when: "$derived.advControlByColumn[$row.column] == multiselect"
            value: "$row.mode"
            options: "$const.includeExclude"
            onChange: de.g1.setCriterionField
      - key: remove
        title: ""
        cell:
          button:
            label: Remove
            icon: remove
            variant: destructive
            onClick: de.g1.removeCriterion
  - id: group1AddBtn
    kind: button
    when: "$state.contrastMode == advanced"
    label: Add criterion
    variant: primary
    onClick: de.g1.addCriterion
  - id: group1Count
    kind: stat
    when: "$state.contrastMode == advanced"
    label: Group 1 cells
    value: "$derived.g1By['true'].before"

  - id: group2Table
    kind: table
    when: "$state.contrastMode == advanced"
    rows: "$state.group2Criteria"
    empty_text: >-
      Group 2 has no criteria yet. A criterion picks one column and says what to keep of it — a
      range for a measurement, a set of categories for a label. Add the first with the button below.
    columns:
      - key: column
        title: Column
        cell:
          select:
            value: "$row.column"
            options: "$derived.advColumns"
            onChange: de.g2.setCriterionField
            empty_text: No columns to filter on — they come from the dataset chosen above.
      - key: constraint
        title: Constraint
        parts:
          - key: min
            cell:
              editable_text:
                when: "$derived.advControlByColumn[$row.column] == range"
                value: "$row.min"
                placeholder: "Min"
                onChange: de.g2.setCriterionField
                require: { number: {} }
          - key: max
            cell:
              editable_text:
                when: "$derived.advControlByColumn[$row.column] == range"
                value: "$row.max"
                placeholder: "Max"
                onChange: de.g2.setCriterionField
                require: { number: {} }
          - key: keep
            cell:
              multiselect:
                when: "$derived.advControlByColumn[$row.column] == multiselect"
                value: "$row.keep"
                options: "$derived.advCategoriesByColumn[$row.column]"
                placeholder: "All categories"
                onChange: de.g2.setCriterionField
      # AC2 — the include/exclude toggle (mockup `.incexc`). CATEGORICAL rows only (see group1).
      - key: mode
        title: Keep
        cell:
          select:
            when: "$derived.advControlByColumn[$row.column] == multiselect"
            value: "$row.mode"
            options: "$const.includeExclude"
            onChange: de.g2.setCriterionField
      - key: remove
        title: ""
        cell:
          button:
            label: Remove
            icon: remove
            variant: destructive
            onClick: de.g2.removeCriterion
  - id: group2AddBtn
    kind: button
    when: "$state.contrastMode == advanced"
    label: Add criterion
    variant: primary
    onClick: de.g2.addCriterion
  - id: group2Count
    kind: stat
    when: "$state.contrastMode == advanced"
    label: Group 2 cells
    value: "$derived.g2By['true'].before"

  # AC3 — the OVERLAP readout, DYNAMIC (mockup flips green ✓ ↔ red). `alert.tone` is a static enum
  # (not an ExprString), so the live green/red flip is realized as TWO conditional alerts gated on
  # the real overlap derived (`overlapBy.true.before > .after` ⟺ |g1 ∩ g2| > 0), never a single
  # always-shown warning. The two groups must be DISJOINT (INV-A3); Run's `disabledWhen` reads the
  # SAME intersection and the compute names the exact shared-cell count (ITEM-4).
  - id: overlapReadoutDisjoint
    kind: alert
    when: "$state.contrastMode == advanced && $derived.overlapBy['true'].before <= $derived.overlapBy['true'].after"
    tone: success
    text: >-
      ✓ The two groups are disjoint — no cell is on both sides. Safe to run this contrast.
  - id: overlapReadoutOverlap
    kind: alert
    when: "$state.contrastMode == advanced && $derived.overlapBy['true'].before > $derived.overlapBy['true'].after"
    tone: error
    text: >-
      Group 1 and Group 2 OVERLAP — they share at least one cell, so Run is disabled: a cell on
      both sides of a contrast is invalid. Narrow a criterion (or add an exclude) so the groups
      separate; the exact shared-cell count is named when you run.

  - id: methodPicker
    kind: select
    label: Method
    help: >-
      Pseudobulk replicate-aware tests. Extensible — a 3rd method is one catalog() entry (edgeR
      needs R). The choice stays within this product; it never spans marker + condition tests.
    options: "$const.compareMethods"
    value: "$state.method"
    onChange: de.setMethod

  - id: minCellsInput
    kind: text
    label: Min cells / pseudobulk
    help: Pseudobulks below this many cells are dropped (recorded, never silently omitted).
    value: "$state.minCells"
    placeholder: "10"
    onChange: de.setMinCells
    require:
      number: { integer: true, min: 1 }
      message: The minimum cells per pseudobulk must be a whole number ≥ 1.

  - id: multiplicityPicker
    kind: select
    label: Multiplicity
    help: Benjamini-Hochberg within the comparison by default; the across-comparison family is emitted too.
    options: "$const.multiplicities"
    value: "$state.multiplicity"
    onChange: de.setMultiplicity

  # The regime is a RESOLVED consequence, not a toggle (INV-14 pt 3). SIMPLE mode: the v1 info
  # callout stating the regime (R1/R2/R3) is decided at run time from the grouping's PROVENANCE.
  - id: regimeCallout
    kind: alert
    when: "$state.contrastMode == simple"
    tone: info
    text: >-
      The regime is decided by the grouping's provenance, not the analysis: an external grouping
      with ≥2 samples per side is inferential (R1 — p-values and FDR). A grouping derived from
      this matrix (double dipping) or with one sample per side returns ranked effects with the
      p-value and FDR ABSENT, not a fabricated significance.

  # ── AC4 — the conservative-regime callout + per-criterion-column PROVENANCE CHIPS (advanced) ──
  # The mockup shows a regime callout with a chip per criterion column marking external vs derived
  # (any derived ⇒ R2). The chips name WHICH columns constrain each group (one chip per criterion
  # column, live from the criteria lists); the external/derived resolution + the final regime are
  # AUTHORITATIVE in the compute (`_regime.classify_contrast` over each column's `attributes.cyto`)
  # and stamped into the `de-report`, because the form's column frame carries only {kind, levels,
  # n} — NOT provenance — and surfacing it would need a `src-app/ui` change the zero-diff cut
  # forbids (same class as DRIFT-1.2/1.3; see DRIFT-1.5). The callout states the conservative rule.
  - id: regimeCalloutAdvanced
    kind: alert
    when: "$state.contrastMode == advanced"
    tone: info
    text: >-
      The regime is conservative over EVERY criterion column of both groups: if ANY is
      matrix-derived (a cluster / annotation / prediction) the whole contrast is R2 (double
      dipping) — ranked effects with the p-value and FDR ABSENT. R1 (a genuine test) needs all
      criterion columns external AND a sample column giving ≥2 samples/side. Resolved from each
      column's provenance at run time; the chips below name the criterion columns per group.
  - id: group1ProvChips
    kind: stat
    when: "$state.contrastMode == advanced && $c.column"
    for_each: "$state.group1Criteria as $c"
    label: Group 1 criterion column
    value: "$c.column"
  - id: group2ProvChips
    kind: stat
    when: "$state.contrastMode == advanced && $c.column"
    for_each: "$state.group2Criteria as $c"
    label: Group 2 criterion column
    value: "$c.column"

  - id: runBtn
    kind: button
    label: Run comparison
    variant: primary
    # INV-A3 — in ADVANCED mode, Run is DISABLED while the two group masks overlap. `overlapBy`
    # is `count_by(group=g1Mask, hidden=g2Mask)`, so `true.before` = |g1| and `true.after` =
    # |g1 ∩ ¬g2|; `before > after` ⟺ the groups share ≥1 cell. The `contrastMode == advanced`
    # guard keeps Simple mode (where both criteria lists are empty → both masks all-true) from
    # ever disabling Run. The compute ALSO refuses overlap by name (belt + braces).
    disabledWhen: "$state.contrastMode == advanced && $derived.overlapBy['true'].before > $derived.overlapBy['true'].after"
    onClick: de.run

actions:
  - id: de.setExpression
    title: Set the count matrix
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { expression: "$params.value" }
  - id: de.setGrouping
    title: Set the grouping column
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { grouping: "$params.value" }
  - id: de.setSample
    title: Set the sample column
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { sample: "$params.value" }
  - id: de.setGroup1
    title: Set group 1
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { group1: "$params.value" }
  - id: de.setGroup2
    title: Set group 2
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { group2: "$params.value" }
  - id: de.setMethod
    title: Set the method
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { method: "$params.value" }
  - id: de.setMinCells
    title: Set min cells per pseudobulk
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { minCells: "$params.value" }
  - id: de.setMultiplicity
    title: Set the multiplicity family
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { multiplicity: "$params.value" }

  # ── DE advanced-contrast actions ────────────────────────────────────────────────────
  - id: de.setContrastMode
    title: Set the contrast mode
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { contrastMode: "$params.value" }
  # Group 1 criteria CRUD — mirrors cell-filter's cf.addCriterion / cf.setCriterionField /
  # cf.removeCriterion, keyed to group1Criteria.
  - id: de.g1.addCriterion
    title: Add a Group 1 criterion
    permission: jobs::use
    mutating: true
    stateful: true
    params: {}
    body:
      - listAppend: { path: group1Criteria, value: { column: "", control: "", min: "", max: "", keep: [], mode: "include" } }
  - id: de.g1.setCriterionField
    title: Set a Group 1 criterion field
    permission: jobs::use
    mutating: true
    stateful: true
    params: { index: number, key: string, value: string }
    body:
      - set: { "group1Criteria.{$params.index}.{$params.key}": "$params.value" }
  - id: de.g1.removeCriterion
    title: Remove a Group 1 criterion
    permission: jobs::use
    mutating: true
    stateful: true
    params: { index: number }
    body:
      - listRemove: { path: group1Criteria, index: "$params.index" }
  # Group 2 criteria CRUD.
  - id: de.g2.addCriterion
    title: Add a Group 2 criterion
    permission: jobs::use
    mutating: true
    stateful: true
    params: {}
    body:
      - listAppend: { path: group2Criteria, value: { column: "", control: "", min: "", max: "", keep: [], mode: "include" } }
  - id: de.g2.setCriterionField
    title: Set a Group 2 criterion field
    permission: jobs::use
    mutating: true
    stateful: true
    params: { index: number, key: string, value: string }
    body:
      - set: { "group2Criteria.{$params.index}.{$params.key}": "$params.value" }
  - id: de.g2.removeCriterion
    title: Remove a Group 2 criterion
    permission: jobs::use
    mutating: true
    stateful: true
    params: { index: number }
    body:
      - listRemove: { path: group2Criteria, index: "$params.index" }

  - id: de.run
    title: Run comparison
    permission: jobs::use
    mutating: true
    params: {}
    body:
      - run_processor:
          id: de.compare
          inputs:
            expression: "$state.expression"
          inputs_from:
            # SIMPLE mode binds the grouping column; ADVANCED mode leaves grouping unset. The
            # sample column is bound in BOTH modes (it drives the pseudobulk unit + regime).
            - when: "$state.grouping"
              slot: "grouping"
              artifact: "$data.obsSources[$state.grouping]"
            - when: "$state.sample"
              slot: "sample"
              artifact: "$data.obsSources[$state.sample]"
            # ADVANCED mode binds one `column:<name>` slot per criterion column of each group —
            # the slot NAME carries the column name (a metadata-column store can't), exactly as
            # cell-filter resolves its criteria columns. Empty in Simple mode (no criteria).
            - for_each: "$state.group1Criteria as $c"
              when: "$c.column"
              slot: "column:{$c.column}"
              artifact: "$data.obsSources[$c.column]"
            - for_each: "$state.group2Criteria as $c"
              when: "$c.column"
              slot: "column:{$c.column}"
              artifact: "$data.obsSources[$c.column]"
          params:
            contrast_mode: "$state.contrastMode"
            group1: "$state.group1"
            group2: "$state.group2"
            group1_criteria: "$state.group1Criteria"
            group2_criteria: "$state.group2Criteria"
            method: "$state.method"
            min_cells: "$state.minCells"
            multiplicity: "$state.multiplicity"
          into: compareJob
      - wait_for: { job: "$compareJob", until: completed }
      - toast: { success: "Comparison computed" }
