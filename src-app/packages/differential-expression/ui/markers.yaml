# de.markers run form (Frame A → "Scan markers"). The DESCRIPTIVE marker scan over ANY
# categorical grouping. The comparison is FIXED (each group vs the rest, read-only). The method
# enum is sourced from the marker method `catalog()` (INV-12, TEST-29). The regime callout is
# always R2 for a matrix-derived grouping — ranked, no p-values; padj absent, not 1 (INV-3/INV-4).
id: de.markers
title: Scan markers
permission: jobs::use

state:
  expression: { type: string, default: null }
  grouping: { type: string, default: null }
  method: { type: string, default: "wilcoxon" }

data:
  obs:
    source: axis_columns
    args: { of: "$state.expression", axis: cells }
  obsSources:
    source: axis_columns
    args: { of: "$state.expression", axis: cells, as: sources }

const:
  # The marker method options — the SAME set `_methods.marker_catalog()` registers (TEST-29).
  markerMethods:
    - { value: "wilcoxon", label: "Wilcoxon rank-sum" }
    - { value: "t-test", label: "t-test" }

derived:
  catColumns: { columns_of: { obs: "$data.obs", only: categorical } }

widgets:
  - id: expressionPicker
    kind: artifact_ref
    auto_bind_sole_candidate: true
    label: Expression matrix
    help: Counts in; the scan normalizes internally (normalize_total + log1p) before the test.
    source: { subtypes_of: single-cell/expression }
    value: "$state.expression"
    onChange: dm.setExpression
    require:
      required: true
      message: Choose the expression matrix to scan markers from.
    empty_text: No single-cell matrix in this project yet — import one to scan markers.

  - id: groupingPicker
    kind: select
    label: Grouping column
    help: Any categorical column — clusters, an annotation, a condition.
    options: "$derived.catColumns"
    value: "$state.grouping"
    onChange: dm.setGrouping
    empty_text: No categorical column to group by — they come from the dataset chosen above.

  - id: methodPicker
    kind: select
    label: Method
    help: >-
      Descriptive marker tests. Same catalog() seam as the compare methods — logistic-regression
      is the easy 3rd. The choice never spans marker + condition products.
    options: "$const.markerMethods"
    value: "$state.method"
    onChange: dm.setMethod

  # The comparison is FIXED — each group vs the rest — and shown read-only (no control).
  - id: comparisonNote
    kind: alert
    tone: info
    text: "Comparison: each group vs the rest (fixed)."

  # Always R2 for a matrix-derived grouping — the resolved consequence, not a toggle (INV-14).
  - id: regimeCallout
    kind: alert
    tone: warning
    text: >-
      Descriptive — ranked, no p-values. A grouping derived from this same matrix makes
      between-group p-values circular (double dipping), so the scan returns ranked effect size +
      detection rates; the padj column is absent, not 1.

  - id: runBtn
    kind: button
    label: Run marker scan
    variant: primary
    onClick: dm.run

actions:
  - id: dm.setExpression
    title: Set the expression matrix
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { expression: "$params.value" }
  - id: dm.setGrouping
    title: Set the grouping column
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { grouping: "$params.value" }
  - id: dm.setMethod
    title: Set the method
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { method: "$params.value" }

  - id: dm.run
    title: Run marker scan
    permission: jobs::use
    mutating: true
    params: {}
    body:
      - run_processor:
          id: de.markers
          inputs:
            expression: "$state.expression"
          inputs_from:
            - when: "$state.grouping"
              slot: "grouping"
              artifact: "$data.obsSources[$state.grouping]"
          params:
            method: "$state.method"
          into: markerJob
      - wait_for: { job: "$markerJob", until: completed }
      - toast: { success: "Marker scan computed" }
