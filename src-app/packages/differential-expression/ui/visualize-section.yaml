# Frame B — the DE Visualize SECTION contribution (ITEM-13 / ITEM-17 / INV-14).
#
# One more SectionFrame card in the Visualize pane, same idiom as Coordinates / Color by /
# Features: a search + an `entry_list` whose rows are the run's per-comparison `de/result`
# artifacts (read from the run's `de-report` index, DEC-14), each carrying its REGIME badge and
# a Plot ▸ that emits a VOLCANO onto the canvas. The volcano is the canvas chart-kind
# `VolcanoView` reached via `canvas.series[].type: volcano` — NEVER a bespoke card (INV-14 pt 1).
# A row is a VERB (Plot), not a selected choice — pressing twice opens two plots (mirrors
# colour-by). The section is section-owned, so its `entry_list` carries no artifact_ref and no
# auto-bind (DEC-15).
id: de.viz.differential-expression.section
title: Differential expression
permission: projects::use
# What this section is HOLDING, so the host frame can badge it when collapsed.
badge: "$state.plots.length"

state:
  # The emitted VOLCANO cells this section owns; the canvas below is a `for_each` over them.
  plots: { type: array, default: [] }

data:
  # The run's DE index (DEC-14) — the `de-report` report/qc that enumerates every comparison the
  # run produced, each with its `id`, `name`, `comparison`, `group` and `regime`. Read as a
  # DOCUMENT (a discriminated `{kind, comparisons, …}` object). The newest DE run's report;
  # `kind: de-report` discriminates it from a sibling QC / clustering report.
  report:
    source: job.result
    args:
      datatype: report/qc
      shape: document
      kind: de-report
  # The column bodies of the emitted comparisons — one de/result table per plotted volcano
  # (mirrors colour-by's `plotted`). Each carries the `logFC` + `neglog10p`/`padj` members the
  # VolcanoView binds.
  plotted:
    source: column_values
    args: { of: "$state.plots" }

widgets:
  # The rows are the run's comparisons, grouped by their source (`condition · PyDESeq2`,
  # `leiden · Wilcoxon`), each with a regime badge + a Plot ▸ (INV-14). No selected state — a
  # colouring/plot is an ACT, so a second press opens a second volcano.
  - id: comparisons
    kind: entry_list
    disposition: one
    entries: "$data.report.comparisons"
    # M2 — rows render under their SOURCE heading (the producer's `report.groups`, e.g.
    # "condition · pseudobulk (PyDESeq2)", "leiden · markers (Wilcoxon)"), mirroring colour-by.
    groups: "$data.report.groups"
    grouped: "$data.report.grouped"
    search: { placeholder: Find a comparison… }
    empty_text: >-
      No differential-expression results yet — run a comparison or a marker scan to list its
      comparisons here.
    # M1 — the REGIME (R1/R2/R3) rides on each row as its `qualifier`, a renderer-SUPPORTED
    # inline distinguisher (`EntryListRenderer` renders `$row.qualifier` beside the name); the
    # producer stamps `qualifier = regime` on every comparison. The former `badge: $row.regime`
    # was a NON-field the renderer never drew, so the hero signal was invisible. The ▸ opens the
    # volcano on the canvas.
    action:
      label: Plot
      icon: plot
      onClick: de.viz.plotComparison
      args:
        artifact: "$row.id"
        name: "$row.name"
        regime: "$row.regime"

  # Absence-is-absence, surfaced (INV-3): an R2 comparison has no significance axis to plot.
  - id: r2Note
    kind: alert
    tone: info
    text: >-
      Plot opens a volcano on the canvas (x = log2 fold-change, y = −log10 p; drag the |fc| ≥ and
      −log10 p ≥ rails there). An R2 comparison plots ranked effect only — no significance axis.

actions:
  # A second click opens a SECOND volcano — `listAppend`, so a row carries no selected state.
  - id: de.viz.plotComparison
    title: Plot this comparison
    permission: projects::use
    mutating: false
    stateful: true
    params: { artifact: string, name: string, regime: string }
    body:
      - listAppend:
          path: plots
          value:
            artifact: "$params.artifact"
            name: "$params.name"
            regime: "$params.regime"

  - id: de.viz.unplotComparison
    title: Close this volcano
    permission: projects::use
    mutating: false
    stateful: true
    params: { index: number }
    body:
      - listRemove: { path: plots, index: "$params.index" }

# ── THE PROJECTION — one VOLCANO per emitted cell over this section's OWN list ──────────────
#
# The chart-kind is `volcano` (VolcanoView), bound to the row's `de/result` table: the effect
# channel is `logFC`, the significance channel `neglog10p` (VolcanoView's DragRails own the
# |fc| ≥ / −log10 p ≥ thresholds). `switchTo` is the allow-list of alternate readings — here just
# `volcano` (there is no other honest reading of a differential-expression table). NEVER a
# panel-embedded chart (INV-14 pt 1).
canvas:
  grid: []
  datasets:
    - id: "plotted.$i"
      for_each: "$state.plots as $c, $i"
  series:
    - id: "s-volcano-$i"
      for_each: "$state.plots as $c, $i"
      type: volcano
      coordId: "volcano-$i"
      datasetId: "plotted.$i"
      controlled: true
      title: "$c.name"
      switchTo: [volcano]
      encode: { effectColumn: "logFC", significanceColumn: "neglog10p" }
      close: { action: de.viz.unplotComparison, args: { index: "$i" } }
