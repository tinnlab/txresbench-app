# geneset.collections section (Frame B surface) — the Visualize "Gene sets" card. Applies to the
# `geneset/collection` datatype: it is the project's gene-sets surface — the New-collection entry
# point (opens the draftable geneset.curate editor bound to a fresh draft) + a frozen-collection
# PICKER whose selection drives Export GMT + Edit → new version, which operate on the REAL
# selected artifact.
#
# INV-7 lineage (DEC-11, owner-approved 2026-08-25 — BUILT): the mockup Frame B's version chain
# (v3←v2←v1 + +A −B membership delta, superseded dim) is now a real feature. The draftable
# primitive records the fork edge at freeze (a `draft_artifact_lineage` table + parent/version
# stamp in the freeze-completion hook; `GET /api/drafts/artifacts/{id}/lineage` walks it), and the
# domain-free `lineage` widget below renders the chain + delta for the SELECTED frozen collection.
id: geneset.collections.section
title: Gene sets
permission: drafts::use

# The FROZEN collection the section acts on (Export / Edit). Bound by the picker below — a REAL
# declarative source (the project's `geneset/collection` artifacts), so Export/Edit operate on a
# selected artifact instead of an empty default.
state:
  selected_artifact_id: { type: string, default: null }

widgets:
  - id: intro
    kind: alert
    tone: info
    text: >-
      A gene-set collection is frozen and content-hash-pinned, so any figure or annotation that
      uses it stays reproducible. Editing a frozen collection forks a new version — the past is
      never rewritten. Pick a collection to export it as GMT, or edit it into a new version.

  - id: newBtn
    kind: button
    label: New collection
    variant: primary
    onClick: gsSec.newCollection

  # The frozen-collection picker — lists the project's geneset/collection artifacts and binds the
  # selected one to `$state.selected_artifact_id` (the real source Export/Edit act on).
  - id: collectionPicker
    kind: artifact_ref
    label: Collection
    source: { datatype: geneset/collection }
    value: "$state.selected_artifact_id"
    onChange: gsSec.selectCollection
    empty_text: >-
      No frozen collections yet — press New collection, add sets, then Freeze to save one here.

  # Version lineage (INV-7) — walks the selected frozen collection's parent chain and renders
  # v3←v2←v1 + the per-set +A −B membership delta (superseded versions dim, not hidden). The
  # widget is DOMAIN-FREE; `values_field: genes` rides the domain noun from this package view.
  - id: lineage
    kind: lineage
    label: Version history
    artifact: "$state.selected_artifact_id"
    values_field: genes

  # `default`, NOT `outline` (#374). The view-spec's button vocabulary is
  # `primary | default | destructive`, and the renderer's BUTTON_VARIANT map translates
  # `default` → the shadcn `outline` button — which is the secondary look these two want.
  # `variant: outline` is the shadcn token, one vocabulary too low: it missed the map, the
  # renderer passed `undefined` to <Button>, and cva's `defaultVariants` painted both of
  # these as SOLID primary. Same defect class as the `tone: destructive` crash — a token
  # borrowed from the UI-kit's vocabulary into a declared view.
  - id: exportBtn
    kind: button
    label: Export GMT
    variant: default
    onClick: gsSec.exportGmt

  - id: editBtn
    kind: button
    label: Edit → new version
    variant: default
    onClick: gsSec.editFork

actions:
  - id: gsSec.selectCollection
    title: Select a frozen collection
    permission: drafts::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { selected_artifact_id: "$params.value" }

  # New collection — the generic `draft.launchEditor` creates a fresh geneset/collection draft and
  # LAUNCHES the geneset.curate editor pane bound to THAT draft (deterministic; INV-6).
  - id: gsSec.newCollection
    title: New gene-set collection
    permission: drafts::use
    mutating: true
    params: {}
    body:
      - call_action:
          id: draft.launchEditor
          params:
            kind: geneset/collection
            analysis: geneset.curate

  # Export GMT (ITEM-10) — the generic, domain-free `draft.exportGmt` serializes the SELECTED
  # frozen collection's `structure.sets` to a `.gmt` download. `values_field: genes` rides the
  # domain noun from the package view (the action stays domain-free).
  - id: gsSec.exportGmt
    title: Export GMT
    permission: drafts::use
    mutating: false
    params: {}
    body:
      - call_action:
          id: draft.exportGmt
          params:
            artifact_id: "$state.selected_artifact_id"
            values_field: genes

  # Edit → new version — `draft.editFork` creates a fork draft SEEDED from the selected frozen
  # artifact's `structure.sets` (so the editor opens with the current content, INV-6) and launches
  # the editor bound to it.
  - id: gsSec.editFork
    title: Edit into a new version
    permission: drafts::use
    mutating: true
    params: {}
    body:
      - call_action:
          id: draft.editFork
          params:
            artifact_id: "$state.selected_artifact_id"
            kind: geneset/collection
            analysis: geneset.curate
