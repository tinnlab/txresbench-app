# `_lib` — the RESERVED, `_`-prefixed producer-format package (DEC-7, ITEM-1..4).
#
# Like `_helpers` it is NOT a domain processor: it contributes NO datatype, converter
# or view. Its sole job is to be a home ON DISK for the shared FORMAT code every
# processor writes its outputs through — the Zarr v3 sharded writer (`txr_zarr.py`)
# — so it resolves FROM THE EXTRACTED FOLDER (`<data_root>/processors/_lib/…`) at run
# time like every other package.
#
# ## Why it is its own package and not part of `_helpers`
# `_helpers` ships DOMAIN-ADJACENT compute helpers (an alignment engine, a column
# summarizer). `_lib` ships the STORAGE FORMAT, which is the thing the framework's
# conformance suite gates against and the thing the browser reader must agree with
# byte-for-byte. Keeping them apart means a change to the format is visible as a change
# to `_lib` alone, and it keeps the format module free of the pandas/scipy imports the
# compute helpers carry — `txr_zarr` is numpy + stdlib, which is what lets it be
# vendored anywhere without dragging a dependency graph along (DEC-7).
#
# ## Two kinds of file live here, and the split is load-bearing
# `txr_zarr.py` / `txr_columns.py` / `txr_csc.py` / `txr_zarr_read.py` are STAGED into
# the sandbox `/code` dir (see `PY_HELPER_FILES` in the server's sandbox processor
# resolver) — a processor imports them and they run in the processor's own process.
#
# `conformance.py` (ITEM-18/19) is deliberately NOT staged and must not be added to that
# table. It is the framework-owned gate that JUDGES what a processor emitted, so putting it
# in the processor's process is the arrangement DEC-8 rules out ("invoked by the ingest
# path, not by the processor"). It runs over an emitted `/outputs` directory from outside:
# `python3 -m conformance <outputs_dir>`, as a verification processor or a CI step.
# `test_conformance.py::test_the_gate_is_not_reachable_from_the_processors_own_process`
# fails if a staged module ever imports it.
#
# The dependency is one-way, not absent: `conformance.py` DOES import `txr_zarr` (for
# ITEM-19's `key_sequence_digest`, which the producer declares and the gate recomputes —
# a comparison that is only meaningful if both sides digest identically). Gate→writer is
# fine; writer→gate is the arrangement DEC-8 forbids, and is what the test above pins.
# `conformance.py` is entry-scoped-staged for the verification entry, and `txr_zarr.py`
# is globally staged, so the import resolves in that job's `/code` dir.
#
# ## The `_` prefix
# The folder-scan registry (`ExtensionRegistry::build_from_dir`) SKIPS `_`-prefixed
# dirs, so `_lib` contributes nothing to `GET /api/extensions`. It still carries this
# manifest so the embedded-seed extractor treats it as a seed package and EXTRACTS its
# files to disk, and so the manifest lint validates it. A separate-repo contributor
# must NOT use a `_`-prefixed id for a real (contributing) package.
id: _lib
name: Shared output-format library
publisher: txr
