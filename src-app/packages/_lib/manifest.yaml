# §3). NOT staged into any sandbox `/code` (absent from `PY_HELPER_FILES` and
# `RESERVED_ENTRY_HELPERS`), so no processor's runtime changes; the bump exists for seed
# reconciliation hygiene, which keys on the package version when its file set moves.
#
# 0.3.3 — edits `model_coverage_exempt.json`: the two `trajectory.*` producer register
# rows, and the `graph/attributed` lattice entry rewritten from a stated undecidable to a
# stated decision now that its first producer has landed (feat/trajectory-analysis,
# DEC-11). Same mechanical reason as 0.3.2 and no runtime change: the register file is
# not staged into any sandbox `/code` either. This is 0.3.3 rather than a merge that
# keeps 0.3.2, because `check-processor-seed-versions.sh` is BASE-RELATIVE — it compares
# against `merge-base(origin/main, HEAD)`, which for this merged tree IS `origin/main`,
# where `_lib` already reads 0.3.2. Keeping 0.3.2 would leave `_lib` changed-without-a-
# bump against that base and fail the guard.
#
# 0.3.4 — `model_coverage_exempt.json` gains the `spatial/boundaries` lattice disposition
# (#152). The file is DATA the model-coverage guard reads, and it lives here rather than
# beside the Rust guard because every entry necessarily names a datatype and an axis while
# `server/tests/**` is domain-scanned. Same reconciliation reasoning as 0.3.2: a file
# under the package moved, so the version moves with it — the runtime picks the change up
# from the per-file digest either way, but an operator reading two builds' versions must
# be able to tell them apart.
#
# THIS IS 0.3.4 RATHER THAN A MERGE THAT KEEPS 0.3.3, and #152 reached that by APPLYING
# DEC-11's generalizable rule above rather than by re-deriving it. Both sides of this
# conflict independently bumped to 0.3.3 for the same mechanical reason (each edits
# `model_coverage_exempt.json`), so "take both rationales, highest version" — the
# resolution #152's own BASE.md predicted — would have kept 0.3.3 and reddened the guard:
# `check-processor-seed-versions.sh` measures against `merge-base(origin/main, HEAD)`,
# which on this merged tree IS `origin/main`, where `_lib` NOW reads 0.3.3. The rule is
# to move forward FROM the merge target's value, not to take the higher of the two sides.
# Verified rather than argued: the guard reports `ok _lib — changed, version 0.3.3 ->
# 0.3.4` and exits 0.
#
# 0.3.5 — `model_coverage_exempt.json` gains the three `spatial.import-visium` producer
# register rows (#154). It is the FIRST producer of `spatial/coordinates`, so the
# model-coverage guard's producer arm goes red on it until somebody decides what the pair
# states; the register is complete in BOTH directions, so there is no way to add a
# row-bearing output without stating its disposition. Same reconciliation reasoning as
# 0.3.2, and the same rule DEC-11 generalized and #152 applied: move FORWARD from the
# merge target's value (`origin/main` reads 0.3.4), never take the higher of two sides.
#
# 0.4.2 — `model_coverage_exempt.json` gains the three `da.*` producer register rows plus the
# `da/result` lattice row (#75). `da.clusters` and `da.neighbourhoods` are new producers with
# row-bearing outputs, and `da/result` declares `entity_axis: population` — a level set of a
# clustering, or a derived kNN neighbourhood — which no dataset anchors. The register is complete
# in BOTH directions, so neither could land without stating a disposition; all four are
# `rows-undeclared`, matching the `trajectory.paga`/`dpt` precedent rather than claiming the
# stronger `rows-declared` the compute does not support (it passes no `membership=`, and the
# platform's membership channel takes positions on a dataset axis, which a partition's levels are
# not).
#
# WHY THIS BUMP WAS NEARLY MISSED, recorded because the near-miss is the useful part: the
# pre-merge run of `check-processor-seed-versions` was CLEAN on this branch, and the failure
# appeared only when the change was staged onto current `origin/main`. `_lib` is the shared
# package EVERY analysis depends on, so a provisioned host that skips re-extraction on an
# unchanged version keeps a stale `_lib` for the whole tree, not for one package. Same rule as
# 0.3.5 and DEC-11: move FORWARD from the merge target's value (`origin/main` reads 0.4.1),
