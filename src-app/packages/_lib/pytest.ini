# Pytest wiring for the `_lib` output-format suite (TEST-7/8/9).
#
# Run from THIS directory:
#     python3 -m pytest -q
# The suite is numpy + stdlib only (no server, no DB, no pandas) — same dependency
# floor as the module it tests, so it runs anywhere `cyto_zarr` itself would.
[pytest]
testpaths = .
python_files = test_*.py
python_functions = test_*
addopts = -q
