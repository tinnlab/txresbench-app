# The DA Visualize SECTION (#124) — one more SectionFrame card in the Visualize pane, the same
# idiom as `de.viz.differential-expression` and single-cell-viz's Coordinates / Color by: a search
# + an `entry_list` whose rows are the run's `da/result` artifacts (read from the run's `da-report`
# index), each carrying its REGIME as an inline qualifier and a `Plot ▸` that emits a VOLCANO onto
# the canvas.
#
# ZERO NEW CHART KIND, AND THAT IS THE POINT. Chart kinds are a CLOSED list in
# `src-app/libs/viz/src/viz-core/charts/chartSchemas.ts` (scatter, bar, box, violin, dotplot,
# heatmap, histogram, image, volcano, grid). Milo's canonical readout is a beeswarm and there is
# none — adding one would be a `src-app/libs/viz` change, i.e. a direct violation of the
# zero-src-app-diff invariant that makes "adding an analysis is pure data" true. A DA result is
# genuinely volcano-shaped (effect size vs significance over many entities), and the `volcano`
# chart kind takes `encode: {effectColumn, significanceColumn}` FROM THIS FILE — so this is reuse,
# not a workaround.
#
# The regime rides each row as `qualifier`, NOT as `badge:`. `EntryListRenderer` renders
# `$row.qualifier` beside the name and draws no `badge` at all; the DE package shipped that bug
# once already and corrected it, and this section is not going to repeat it.
#
# A row is a VERB (Plot), not a selected choice — pressing twice opens two volcanoes (mirrors
# colour-by). The section is section-owned, so its `entry_list` carries no artifact_ref and no
# auto-bind.
id: da.viz.differential-abundance.section
title: Differential abundance
permission: projects::use
badge: "$state.plots.length"

state:
  # The emitted VOLCANO cells this section owns; the canvas below is a `for_each` over them.
  plots: { type: array, default: [] }

data:
  # The run's DA index — the `da-report` report/qc document that enumerates every comparison the
  # run produced, each with its `id`, `name`, `comparison`, `group`, `regime` and the
  # `significance_column` that comparison's regime + analysis actually wrote. `kind: da-report`
  # discriminates it from a sibling QC / DE / clustering report.
  report:
    source: job.result
    args:
      datatype: report/qc
      shape: document
      kind: da-report
  # The column bodies of the emitted comparisons — one `da/result` table per plotted volcano
  # (mirrors colour-by's `plotted`). Each carries the `logFC` + `neglog10p` members the volcano
  # binds, and — in an R1 neighbourhood run — `spatial_fdr` and `padj` beside them.
  plotted:
    source: column_values
    args: { of: "$state.plots" }

widgets:
  - id: comparisons
    kind: entry_list
    disposition: one
    entries: "$data.report.comparisons"
    groups: "$data.report.groups"
    grouped: "$data.report.grouped"
    search: { placeholder: Find a comparison… }
    empty_text: >-
      No differential-abundance results yet — run Find shifting populations or Compare population
      abundance to list its comparisons here.
    action:
      label: Plot
      icon: plot
      onClick: da.viz.plotComparison
      args:
        artifact: "$row.id"
        name: "$row.name"
        regime: "$row.regime"

  # Absence-is-absence, surfaced. An R2/R3 DA result has NO significance axis at all — `neglog10p`
  # is ABSENT from the artifact, not 1 — so its volcano plots ranked effect only. Silently drawing
  # an empty y-axis would be the worst outcome, so the section says so.
  - id: regimeNote
    kind: alert
    tone: info
    text: >-
      Plot opens a volcano on the canvas: x = log2 abundance fold-change, y = −log10 of the
      ADJUSTED false-discovery rate this analysis headlines. NOTE the chart's y-axis label and
      significance rail both read "−log10 p": this section does not currently set an axis-title
      override, and the rail's caption is fixed in the shared chart component regardless. Read
      both as the ADJUSTED value — the rail is setting a real FDR threshold, not a raw-p one. An R2 or R3 comparison has no
      significance axis at all — the p-value and both FDR columns are ABSENT, not 1 — so its
      volcano has nothing to put on y and renders empty; read the ranked effect from the table
      instead. The regime is shown beside each row's name, so you can see which you are about to
      open.

  # Which column a threshold means depends on WHICH analysis produced the row, and the section
  # does not assume one shape for both. Neighbourhoods OVERLAP, so their headline is the
  # connectivity-weighted `spatial_fdr`; cluster populations are DISJOINT, so a connectivity
  # weight there would be meaningless and `padj` is the correct — and the only written — column.
  - id: fdrNote
    kind: alert
    tone: info
    text: >-
      The y axis is whichever correction the producing analysis headlines, so the two are not
      being conflated: a neighbourhood row's is the SPATIAL (connectivity-weighted) FDR, because
      neighbourhoods overlap and plain Benjamini-Hochberg would be anti-conservative where the
      graph is dense — the unweighted value is written alongside it so the correction is auditable.
      A cluster row carries no spatial FDR at all: clusters are disjoint, so plain BH is the right
      correction and a weighted one would mean nothing.

actions:
  # A second click opens a SECOND volcano — `listAppend`, so a row carries no selected state.
  - id: da.viz.plotComparison
    title: Plot this comparison
    permission: projects::use
    mutating: false
    stateful: true
    params: { artifact: string, name: string, regime: string }
    body:
      - listAppend:
          path: plots
          value:
            artifact: "$params.artifact"
            name: "$params.name"
            regime: "$params.regime"

  - id: da.viz.unplotComparison
    title: Close this volcano
    permission: projects::use
    mutating: false
    stateful: true
    params: { index: number }
    body:
      - listRemove: { path: plots, index: "$params.index" }

# ── THE PROJECTION — one VOLCANO per emitted cell over this section's OWN list ──────────────
#
# The chart-kind is the SHIPPED `volcano` (VolcanoView), bound to the row's `da/result` table: the
# effect channel is `logFC` and the significance channel `neglog10_significance` — the −log10 of
# the ADJUSTED value each analysis headlines (`spatial_fdr` for neighbourhoods, `padj` for
# clusters), which is what makes INV-DA-4's "every threshold, badge and headline reads
# `spatial_fdr`" true of the surface a reader actually drags a rail on, and not merely of the
# bytes on disk. Binding `neglog10p` here — the RAW, UNCORRECTED p — is the defect that was
# caught in review: the correction the run computes would have been stored and then never used by
# the one control that thresholds anything. `switchTo` is the allow-list of alternate readings —
# here just `volcano`, because there is no other honest reading of an effect-vs-significance table
# over populations.
canvas:
  grid: []
  datasets:
    - id: "plotted.$i"
      for_each: "$state.plots as $c, $i"
  series:
    - id: "s-da-volcano-$i"
      for_each: "$state.plots as $c, $i"
      type: volcano
      coordId: "da-volcano-$i"
      datasetId: "plotted.$i"
      controlled: true
      title: "$c.name"
      switchTo: [volcano]
      encode: { effectColumn: "logFC", significanceColumn: "neglog10_significance" }
      close: { action: da.viz.unplotComparison, args: { index: "$i" } }
