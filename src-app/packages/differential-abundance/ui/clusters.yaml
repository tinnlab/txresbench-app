# da.clusters run form — "Compare population abundance". Mirrors `differential-expression`'s
# `ui/compare.yaml`: the manifest declares `ui: [ui/clusters.yaml]`, so this names no analysis and
# no layout — widgets render in DECLARATION ORDER. Every input the run consumes is a VISIBLE
# control passed EXPLICITLY on run_processor. The regime is a RESOLVED consequence of the
# CONDITION's provenance, never a user toggle.
#
# THE DESIGN PLUMBING IS REUSED, NOT REINVENTED (#82): the condition + sample pickers are two
# `select`s over `derived.catColumns` (`columns_of: {obs: $data.obs, only: categorical}`), bound on
# run through `inputs_from` with `artifact: "$data.obsSources[$state.<col>]"`, exactly as
# `de.compare` binds its grouping + sample columns. Two analyses inventing two design UXs would be
# a defect, not a variation.
#
# THE SHARP DIFFERENCE FROM `de.compare`: there, one column is BOTH the grouping and the thing
# tested. Here they SEPARATE — the POPULATION column defines the count matrix's rows and the
# CONDITION defines the tested coefficient — so the regime is classified on the CONDITION and
# never on the population. See `compute/_shared.py::column_provenance` for why that is required
# rather than convenient.
#
# Reuses `jobs::use` — no new permission.
id: da.clusters
title: Compare population abundance
permission: jobs::use

state:
  # The POPULATION column, as an ARTIFACT: its levels are the rows of the count matrix, and its
  # dataset anchors every other column picker below. There is NO matrix and NO embedding input —
  # three metadata columns are a complete input for this analysis.
  population: { type: string, default: null }
  # The tested coefficient, and the unit of replication — both COLUMN NAMES on the same cells axis.
  condition: { type: string, default: null }
  sample: { type: string, default: null }
  # The contrast: two levels of the condition column.
  group1: { type: string, default: null }
  group2: { type: string, default: null }
  # Additive terms in the design formula, as column names (0..n).
  covariates: { type: array, default: [] }
  # The count-model engine — enum sourced from `_kernel.catalog()`.
  method: { type: string, default: "pydeseq2" }
  # The NORMALIZATION and, for the ALR mode, the population it is relative to. There is
  # deliberately no third option and no "raw proportions" mode.
  normalization: { type: string, default: "poscounts" }
  reference: { type: string, default: null }
  # Thresholds. Text so the numeric grammar is held by `require.number`.
  minCells: { type: string, default: "10" }
  fdr: { type: string, default: "0.1" }
  # The committed table's label — the `{label}` the exported methods document names.
  name: { type: string, default: "abundance" }
  # Emit the per-cell signed-effect column that colours the UMAP for free.
  emitEffectColumn: { type: string, default: "yes" }

data:
  # The cells-axis columns of the dataset the POPULATION column belongs to, and the same relation
  # asked for the artifact ids (`as: sources`) so the run binds what the form showed.
  obs:
    source: axis_columns
    args: { of: "$state.population", axis: cells }
  obsSources:
    source: axis_columns
    args: { of: "$state.population", axis: cells, as: sources }

const:
  # The engine options — the SAME set `_kernel.catalog()` registers, in the same order (default
  # first). Adding an engine is a code-only catalog() entry plus this line.
  methods:
    - { value: "pydeseq2", label: "PyDESeq2 · Wald" }
    - { value: "nb_glm", label: "NB-GLM" }
  # The CLOSED normalization vocabulary. Both entries name the assumption they make, because that
  # assumption is what a reader has to accept to believe the result (INV-DA-1).
  normalizations:
    - { value: "poscounts", label: "Robust size factors (assumes most populations unchanged)" }
    - { value: "reference", label: "Relative to a reference population (assumes it is constant)" }
  yesNo:
    - { value: "yes", label: "Yes" }
    - { value: "no", label: "No" }

derived:
  # Categorical cells-axis columns — the condition / sample / covariate pickers' options.
  catColumns: { columns_of: { obs: "$data.obs", only: categorical } }
  # The DISTINCT levels per column — the contrast group pickers read the condition's.
  categoriesByColumn: { categories_by_column: { obs: "$data.obs" } }

widgets:
  # ── which question does this analysis answer? Stated, not implied ────────────────
  - id: questionCallout
    kind: alert
    tone: info
    text: >-
      This asks "does the proportion of THIS NAMED population change between conditions?" — the
      unit is a label you can talk about. It is a different question from Find shifting
      populations, which asks whether ANY region of the data shifts and hands back discovered
      regions instead of names. This one is nameable but RESOLUTION-BOUND, and it cannot see a
      shift confined to part of a population.

  - id: populationPicker
    kind: artifact_ref
    # DEC-15 opt-IN, declared: the sole-candidate bind fires only when the project holds exactly
    # ONE `metadata-column`, and a spec that omits the key silently unbinds the surface.
    auto_bind_sole_candidate: true
    label: Population column
    help: >-
      The categorical column whose levels are the populations to test — a cluster label or a
      curated annotation. Its dataset supplies the condition and sample columns below. No
      expression matrix and no embedding are read: abundance counts cells, not reads.
    source: { subtypes_of: metadata-column }
    value: "$state.population"
    onChange: da.setPopulation
    require:
      required: true
      message: Choose the population column whose abundance you want to compare.
    empty_text: >-
      No population column in this project yet — cluster the cells or import an annotation first.

  - id: conditionPicker
    kind: select
    label: Condition column
    help: >-
      The external condition being tested (treatment / genotype / responder status). THIS is the
      column whose provenance decides the regime — never the population column, which is
      matrix-derived by construction and was drawn without seeing the condition.
    options: "$derived.catColumns"
    value: "$state.condition"
    onChange: da.setCondition
    empty_text: No categorical column to use as the condition — they come from the population column's dataset.

  - id: samplePicker
    kind: select
    label: Replicate / sample column
    help: >-
      The SAMPLE is the unit of replication: cells are not replicates. With ≥2 samples per side
      the comparison is a genuine inferential test (R1); with one sample per side it is
      unreplicated (R3) and the p-value is ABSENT, not 1.
    options: "$derived.catColumns"
    value: "$state.sample"
    onChange: da.setSample
    empty_text: No categorical column to use as the sample/replicate axis.

  - id: group1Picker
    kind: select
    label: Condition 1 (numerator)
    options: "$derived.categoriesByColumn[$state.condition]"
    value: "$state.group1"
    onChange: da.setGroup1
    empty_text: Pick a condition column above to list its levels.

  - id: group2Picker
    kind: select
    label: Condition 2 (denominator)
    options: "$derived.categoriesByColumn[$state.condition]"
    value: "$state.group2"
    onChange: da.setGroup2
    empty_text: Pick a condition column above to list its levels.

  - id: covariatePicker
    kind: multiselect
    label: Covariates (optional)
    help: >-
      Additive terms in the design formula — a batch, a donor sex, a processing site. Each must be
      constant within a sample, because the design frame's row IS a sample.
    options: "$derived.catColumns"
    value: "$state.covariates"
    onChange: da.setCovariates
    empty_text: No categorical column available as a covariate.

  # ── the compositional controls — the part that decides whether the answer is valid ──
  - id: compositionCallout
    kind: alert
    tone: info
    text: >-
      Cell-population proportions are COMPOSITIONAL — they sum to 1 — so a real rise in one
      population mechanically depresses every other one's proportion. A per-population test on
      raw proportions is invalid, and it manufactures more false positives the bigger the real
      effect is. This analysis therefore tests INTEGER COUNTS under the normalization you choose
      below, and there is no raw-proportion option: if the chosen normalization cannot be
      established the run refuses by name rather than falling back to one.

  - id: normalizationPicker
    kind: select
    label: Normalization
    help: >-
      Robust size factors assume MOST POPULATIONS ARE UNCHANGED (they break down if a majority
      move). A reference population assumes THAT POPULATION'S ABSOLUTE ABUNDANCE IS CONSTANT and
      makes every effect explicitly relative to it. Whichever you pick is recorded and narrated
      in the exported methods, together with its assumption.
    options: "$const.normalizations"
    value: "$state.normalization"
    onChange: da.setNormalization

  - id: referencePicker
    kind: select
    label: Reference population
    when: "$state.normalization == reference"
    help: >-
      Must be present in EVERY sample — the log-ratio is undefined in a sample that lacks it, and
      the run refuses by name rather than substituting something else.
    options: "$derived.categoriesByColumn[$state.population]"
    value: "$state.reference"
    onChange: da.setReference
    empty_text: Pick a population column above to list its populations.

  - id: relativeCaveat
    kind: alert
    tone: warning
    text: >-
      Differential abundance measures RELATIVE composition. Without a spike-in or a total-cell
      count, "this population went up" and "everything else went down" are indistinguishable —
      both readings fit the same data.

  - id: resolutionCaveat
    kind: alert
    tone: warning
    text: >-
      This result is SENSITIVE TO THE CLUSTERING RESOLUTION your populations were defined at: they
      are an arbitrary partition of a continuum, so a coarser or finer partition of the same cells
      can change which populations move and by how much. Find shifting populations is the
      resolution-free complement.

  - id: methodPicker
    kind: select
    label: Count model
    help: >-
      Negative-binomial count models over the (population × sample) integers. Both engines are
      handed the SAME size factors, so the normalization — not the engine — carries the
      compositional claim.
    options: "$const.methods"
    value: "$state.method"
    onChange: da.setMethod

  - id: nameInput
    kind: text
    label: Result label
    help: >-
      Names the committed table, so a second run of the same comparison does not read as the same
      artifact. It is also the label the exported methods document names the commit by.
    value: "$state.name"
    placeholder: "abundance"
    onChange: da.setName
    require:
      required: true
      message: Give the committed table a label.

  - id: minCellsInput
    kind: text
    label: Min cells / sample
    help: Samples below this many cells are dropped — and listed in the run report, never silently omitted.
    value: "$state.minCells"
    placeholder: "10"
    onChange: da.setMinCells
    require:
      number: { integer: true, min: 1 }
      message: The minimum cells per sample must be a whole number ≥ 1.

  - id: fdrInput
    kind: text
    label: FDR threshold
    help: The false-discovery rate a population is called significant at. Recorded in the run's methods.
    value: "$state.fdr"
    placeholder: "0.1"
    onChange: da.setFdr
    require:
      number: { min: 0, max: 1 }
      message: The FDR threshold must be a number between 0 and 1.

  - id: effectColumnPicker
    kind: select
    label: Commit a per-cell effect column
    help: >-
      Writes each cell's population effect as a per-cell column, which colours the embedding for
      free through the shipped Color by section.
    options: "$const.yesNo"
    value: "$state.emitEffectColumn"
    onChange: da.setEmitEffectColumn

  - id: regimeCallout
    kind: alert
    tone: info
    text: >-
      The regime is decided by the CONDITION's provenance, not by the analysis: an external
      condition with ≥2 samples per side is inferential (R1 — p-values and FDR are written). A
      condition carrying no external provenance, or with one sample per side, returns ranked
      effects with the p-value and FDR ABSENT — not a fabricated significance. The population
      column's own provenance is deliberately NOT used: populations are matrix-derived by
      construction and were drawn without seeing the condition, so this is not double dipping.

  - id: runBtn
    kind: button
    label: Compare abundance
    variant: primary
    onClick: da.clusters.run

actions:
  - id: da.setPopulation
    title: Set the population column
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { population: "$params.value" }
  - id: da.setCondition
    title: Set the condition column
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { condition: "$params.value" }
  - id: da.setSample
    title: Set the sample column
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { sample: "$params.value" }
  - id: da.setGroup1
    title: Set condition 1
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { group1: "$params.value" }
  - id: da.setGroup2
    title: Set condition 2
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { group2: "$params.value" }
  - id: da.setCovariates
    title: Set the covariates
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { covariates: "$params.value" }
  - id: da.setMethod
    title: Set the count model
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { method: "$params.value" }
  - id: da.setNormalization
    title: Set the normalization
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { normalization: "$params.value" }
  - id: da.setReference
    title: Set the reference population
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { reference: "$params.value" }
  - id: da.setName
    title: Set the result label
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { name: "$params.value" }

  - id: da.setMinCells
    title: Set min cells per sample
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { minCells: "$params.value" }
  - id: da.setFdr
    title: Set the FDR threshold
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { fdr: "$params.value" }
  - id: da.setEmitEffectColumn
    title: Set whether to commit a per-cell effect column
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { emitEffectColumn: "$params.value" }

  - id: da.clusters.run
    title: Compare population abundance
    permission: jobs::use
    mutating: true
    params: {}
    body:
      - run_processor:
          id: da.clusters
          inputs:
            population: "$state.population"
          inputs_from:
            - when: "$state.condition"
              slot: "condition"
              artifact: "$data.obsSources[$state.condition]"
            - when: "$state.sample"
              slot: "sample"
              artifact: "$data.obsSources[$state.sample]"
            # One `covariate:<name>` slot per selected covariate — the slot NAME carries the
            # column name, because a `metadata-column` store cannot carry its own display name.
            # Same idiom `de.compare` uses for its criteria columns.
            - for_each: "$state.covariates as $c"
              when: "$c"
              slot: "covariate:{$c}"
              artifact: "$data.obsSources[$c]"
          params:
            group1: "$state.group1"
            group2: "$state.group2"
            method: "$state.method"
            normalization: "$state.normalization"
            reference: "$state.reference"
            name: "$state.name"
            min_cells: "$state.minCells"
            fdr: "$state.fdr"
            emit_effect_column: "$state.emitEffectColumn"
            # The `threshold_list` the manifest's `methods.params` declares. It is SENT as a
            # non-empty list of `{metric, min|max}` entries because the methods narrator appends
            # the `note` — which carries this feature's whole compositional-correctness
            # disclosure — ONLY when at least one constraint was narrated. A declaration with no
            # constraint-producing role silently drops that disclosure from the exported
            # `methods.md`, which is the out-of-app trust deliverable. Declaring the thresholds is
            # also simply correct: they ARE the run's recorded constraints.
            thresholds:
              - { metric: "false-discovery rate", max: "$state.fdr" }
              - { metric: "cells per sample", min: "$state.minCells" }
          into: daJob
      - wait_for: { job: "$daJob", until: completed }
      - toast: { success: "Population abundance compared" }
