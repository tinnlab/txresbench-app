# differential-abundance — TWO analyses that answer "which cell populations shift in PROPORTION
# between conditions", plus the `da/result` output kind and the Visualize SECTION that plots it.
#
#   · `da.neighbourhoods` — Milo-style NEIGHBOURHOOD DA. Rebuilds a kNN graph from an `embedding`,
#                           samples + refines overlapping neighbourhoods, counts cells per
#                           (neighbourhood × sample), and tests the condition coefficient with an
#                           NB count model under a DECLARED normalization. RESOLUTION-FREE: a
#                           population is DISCOVERED, not named. Writes BOTH `padj` and the
#                           connectivity-weighted `spatial_fdr` (INV-DA-4).
#   · `da.clusters`       — CLUSTER/ANNOTATION-level DA over a named population column. Three
#                           `metadata-column`s are a complete input — no matrix, no embedding.
#                           NAMEABLE but RESOLUTION-BOUND, and it is blind to a shift confined to
#                           part of a cluster. Writes `padj`; `spatial_fdr` is ABSENT (clusters are
#                           disjoint, so a connectivity weight there would be meaningless).
#
# THE TWO ANALYSES ANSWER DIFFERENT QUESTIONS AND THE VIEWS SAY SO. They are not two flavours of
# one thing: "is there ANY region whose composition shifts?" is not "does the proportion of THIS
# named cell type change?".
#
# The whole feature is DATA — manifest + python compute + declarative views — baked into the
# server seed by `extensions/embedded.rs`'s `include_dir!`; no server module, no migration, no new
# permission (both analyses reuse `jobs::use`), no new chart kind (the shipped `volcano` plots a
# DA result for free), and no rootfs edit (the NB engine, `pydeseq2`, is ALREADY pinned and
# already in production in `de.compare`).
#
# TWO INDEPENDENT INVALIDITY PROBLEMS ARE KEPT APART, exactly as the DE package keeps SELECTION and
# REPLICATION apart:
#   · COMPOSITIONALITY — proportions sum to 1, so a real rise in one population MECHANICALLY
#     depresses every other one. A per-population test on raw proportions is invalid and its error
#     rate scales WITH the real effect. Handled by testing INTEGER COUNTS under an explicitly
#     NAMED normalization (`poscounts` robust size factors, or a named reference population / ALR).
#   · REPLICATION — cells are not replicates. Handled by making the SAMPLE the column space of the
#     count matrix and by the R1/R2/R3 regime.
# Fixing one does NOTHING for the other (INV-DA-1 / INV-DA-2).
id: differential-abundance
name: Differential abundance
publisher: txr
# 0.1.0 — the package lands whole: the `da/result` kind, both analyses, the compositional kernel
# (poscounts | reference-ALR), the refined-neighbourhood construction, connectivity-weighted
# spatial FDR, both run forms, the Visualize volcano section, and the behavioural acceptance
# battery (power / FDR control / the naive-proportion NEGATIVE CONTROL) + two-tier reference
# parity. Introduced on this branch ⇒ exempt from the seed version-BUMP rule, but the key itself
# is required and every later content change must bump it forward.
#
# 0.1.1 — TEST-HARNESS FIX ONLY; no compute, manifest contract or UI change. Four test call sites
# stop importing this package's `compute/_shared.py` and `compute/_regime.py` by their bare flat
# names and load them by path instead (`tests/da_modules.py::import_own`). Six packages ship a
# `_shared.py` and two ship a `_regime.py`, and a pytest process holds every package's `compute/`
# on one `sys.path`, so the flat name binds to whichever suite imports first.
#
# The version moves because this gate asks a deployment question, not a source one: an
# already-provisioned host skips re-extraction at an unchanged version, so it would keep the old
# tree. Forward from the merge target (`origin/main` reads 0.1.0), never the higher of two sides.
#
# 0.1.2 — TEST-DIRECTORY ONLY, no compute, no ui, no declaration change (#299/#265/#238/
#          #268/#282). This package's branch-diff guards are routed through
#          `_lib/zero_core_guard`'s self-limiting gate, which derives from the diff itself
#          whether the current branch is the one that INTRODUCES this package and SKIPS
#          visibly with a stated reason everywhere else. Unscoped, they re-executed on every
#          later branch and asserted that stranger's diff was also confined to a package it
#          had nothing to do with, so they went red on six consecutive branches. No allow-set
#          was widened and no assertion removed — `docs/design/derived-guards.md` §5 names
#          both as not the repair; the property is real and only its SCOPE was wrong.
#
#          The version moves because `scripts/check-processor-seed-versions.sh` is
#          base-relative over the whole package DIRECTORY, `tests/` included. Forward from
#          the merge target (`origin/main` @ `20ff18e5` reads 0.1.1), never the higher of two
#          sides — the rule `_lib`'s own manifest records at 0.3.5/0.4.2.
#
# 0.1.3 — TEST-DIRECTORY ONLY, no compute, no ui, NO DECLARATION CHANGE (#305). Both entries'
#          `run.dependencies[]` are byte-identical to 0.1.2 and that is the substance of the
#          change, not an omission from it.
#
#          `tests/test_rootfs_unchanged.py`'s behavioural ratchet went red on `origin/main`
#          @ `45acbdfd` reporting `pyarrow` as an env library nobody expected, on BOTH entries.
#          The check names two possible causes and they need opposite fixes. It is the second
#          one — a DECLARED dependency started pulling it in — established by capturing the
#          import stack inside the REAL runs: `compute/clusters.py:208 import pandas` ->
#          `pandas/compat/pyarrow.py:8`, and on the sibling entry `compute/_nhoods.py:73` ->
#          `anndata` -> the same `pandas` line. `scikit-learn` reaches it independently at
#          `sklearn/utils/fixes.py:421`. No compute file imports `pyarrow`, and — the claim that
#          can be made spelling-independently — neither entry DEPENDS on it: both were RUN with
#          the library made unimportable and both completed.
#
#          It is not even a NEW load. `pyarrow` was already in the shipped image at 25.0.0 as a
#          hard transitive of the pinned `spatialdata==0.7.3`, so every DA run has always
#          loaded it; #163 PINNED it, and the ratchet's subject set is exactly the `import=`
#          names `requirements.txt` pins, so a load that was being filtered out became visible.
#          The same shape as `PIL`/#155 one screen away in that file.
#
#          So `pyarrow` is recorded as `transitive` on both entries and DELIBERATELY NOT
#          declared: the entries call no pyarrow API, both RUN to completion with it made
#          unimportable — asserted on every run by TEST-3, not merely recorded — and
#          `run.dependencies[]` is a runtime REFUSAL contract
#          (`_lib/txr_deps.py`) — declaring it would make an unused library a hard requirement
#          and refuse runs on any image lacking it, which #263 says is a live risk. Three new
#          tests EARN that classification instead of asserting it (each entry RUNS to completion
#          with pyarrow unimportable, so no spelling of a hard direct import survives; the import
#          ORIGIN is traced inside both real runs and must belong to a DECLARED library and not to
#          this package; and the declared library SET of each entry is now locked, so the rejected
#          fix would itself go red).
#
#          TEST-5 of `.lifecycle/da-pyarrow-transitive`: this is the version movement
#          `scripts/check-processor-seed-versions.sh` requires of any file moving under a seed
#          package, so a provisioned deployment re-extracts instead of keeping a stale tree.
#          Forward from the merge target (`origin/main` @ `45acbdfd` reads 0.1.2), never the
#          higher of two sides.
version: 0.1.3
apiVersion: "1.0"
contributes:
  # ── THE OUTPUT KIND ───────────────────────────────────────────────────────────────────────
  #
  # Declared INSIDE this package (packages already contribute datatypes — `single-cell-types`,
  # `open-kinds`, `anndata-import`), which keeps the non-package `src-app` diff to the pytest.ini
  # registration line plus the mechanical lattice-golden entry (DEC-3).
  #
  # `de/result` is the WRONG kind for this: it declares `axes: [{name: gene}]` /
  # `entity_axis: gene`, and its stated purpose is being "the gene-axis analog of a
  # `metadata-column`". A DA row is a NEIGHBOURHOOD or a CLUSTER, not a gene — reusing it would
  # lie about the axis and misroute the serving path. `graph/attributed` is rejected as the
  # PRIMARY output too: the DA headline is a TABLE, carrying `logFC`/`spatial_fdr` on nodes would
  # need an `open-kinds` widening, and there is no graph/beeswarm chart kind to plot it with
  # (chart kinds are a CLOSED list in `libs/viz`; adding one would be a direct `src-app` change).
  datatypes:
    - id: da/result
      extends: tabular
      title: DA result (per-population abundance table)
      description: >-
        One differential-abundance comparison as a per-population table over the `population`
        axis: the abundance effect (`logFC`), a ranking `score`, the population's size
        (`n_cells`), the mean per-sample proportion on each side (`mean_prop_1`/`mean_prop_2`),
        the DISTINCT sample counts contributing per side (`n_samples_1`/`n_samples_2`), and —
        only when the regime is inferential — `neglog10p`, `padj`, (neighbourhoods only) the
        connectivity-weighted `spatial_fdr`, and `neglog10_significance`, the −log10 of whichever
        of those two this analysis headlines. `-log10(p)` is stored, never raw `p`. There is no
        `comparison` axis — one comparison is one artifact; a run's set is indexed by its
        `report/qc`.
      is_abstract: false
      axes:
        - { name: population, key_label: population_id }
      # The single entity axis — a value of this type has exactly ONE per population. Build-gated:
      # it must name one of the axes declared above.
      entity_axis: population
      # Served through the ordinary entity-axis annotation-table (columnar) path, exactly as
      # `de/result` is — no bespoke byte-range decode, no new core branch.
      storage:
        layout: { kind: columnar_table }
        format: zarr
        file_layout: single
      capabilities: [da-result]
      arrays:
        # ONE per-population annotation table. The p-family members (`neglog10p`/`padj`/
        # `spatial_fdr`) are DECLARED here as the type's schema but are WRITTEN by a producer
        # only in an inferential (R1) regime — an R2/R3 artifact OMITS them entirely (absent,
        # not 1). `spatial_fdr` is additionally omitted by `da.clusters` in EVERY regime,
        # because clusters are disjoint and a connectivity weight over them is meaningless.
        - name: table
          kind: annotation-table
          dims: [{ axis: population }]
          attrs:
            - { name: logFC, dtype: f32 }
            - { name: neglog10p, dtype: f32 }
            - { name: padj, dtype: f32 }
            - { name: spatial_fdr, dtype: f32 }
            # The −log10 of the ADJUSTED significance THIS analysis headlines: `spatial_fdr` for
            # `da.neighbourhoods` (overlapping regions ⇒ the connectivity-weighted correction),
            # `padj` for `da.clusters` (disjoint populations ⇒ plain BH). ONE name, so a consumer
            # does not have to branch on which analysis produced the table — and the volcano's
            # significance channel binds to THIS, which is what makes INV-DA-4's "every threshold,
            # badge and headline reads spatial_fdr" true of the shipped surface rather than only
            # of the stored bytes. Stored on the −log10 scale because that is the scale the
            # shipped `volcano` chart kind treats its significance channel as being on (its
            # threshold rail compares `y >= pThreshold`), so writing the raw 0..1 FDR there would
            # invert the meaning of every threshold drawn on it. R1 only.
            - { name: neglog10_significance, dtype: f32 }
            - { name: n_cells, dtype: f32 }
            - { name: mean_prop_1, dtype: f32 }
            - { name: mean_prop_2, dtype: f32 }
            - { name: n_samples_1, dtype: f32 }
            - { name: n_samples_2, dtype: f32 }
            - { name: score, dtype: f32 }
          layout: { kind: columnar_table }

  analyses:
    # ── da.neighbourhoods — the PRIMARY, resolution-free analysis ────────────────────────────
    - id: da.neighbourhoods
      category: differential-abundance
      title: Find shifting populations
      description: >-
        Find REGIONS of the cell-neighbourhood graph whose composition shifts between two
        conditions, without committing to a clustering resolution: rebuild a kNN graph from an
        embedding, sample and refine overlapping neighbourhoods, count cells per (neighbourhood ×
        sample), and test the condition with a negative-binomial count model under a named
        normalization. Overlapping neighbourhoods get a connectivity-weighted (spatial) FDR.
        Populations are DISCOVERED rather than named — the complement to the cluster-level
        analysis, which is nameable but resolution-bound.
      whenHint: >-
        the user has an embedding, an external condition and a replicate/sample column, and wants
        to know WHETHER ANY REGION of the data shifts in abundance without first choosing a
        clustering resolution
      examples:
        - which cell populations changed between treated and control
        - find regions whose abundance shifts with condition
        - run milo-style differential abundance
      safety: read-run

      # APPLICABILITY keys on the DATATYPE, single-select — the SAME edge `clustering.cluster`
      # takes. Any `embedding` of ≥3 dims qualifies whoever produced it; a 2-D UMAP/t-SNE LAYOUT
      # is refused BY NAME compute-side, from the DECLARED structure, before any read (INV-11).
      # DEC-15 opt-IN auto-bind for a headless (agent/MCP) launch.
      appliesTo:
        - slot: embedding
          type_id: embedding
          auto_bind_sole_candidate: true

      # GRAPH EDGES (`chaining.ts`), not availability inputs: they let the workbench answer
      # "which analysis yields this input?" (→ "run Reduce dimensions first"). NOTABLY ABSENT:
      # `single-cell/expression` — DA counts CELLS, not reads, so the whole raw-counts gate, the
      # banded CSC read and the matrix memory ceiling that dominate `de.compare` do not apply.
      consumes: [embedding, metadata-column]

      produces: [da/result, report/qc]

      ui:
        - ui/neighbourhoods.yaml

      # #191/E3 — DECLARE the env this contribution targets. An env-LESS declaration is resolved
      # against EVERY recipe on disk (`server/build_helper/processor_manifest.rs`): fail-closed,
      # and exactly right while ONE recipe exists, which is all there was when this package was
      # written. Main has since added a second, deliberately narrower R recipe (`single-cell-r`),
      # and an env-less block now demands these PYTHON pins be installed there too — so the build
      # gate refuses `anndata`, which `single-cell-r` correctly does not ship. The gate's own
      # doc-comment prescribes this fix: "the right relaxation is for a contribution to DECLARE
      # the env it targets, not for this gate to guess".
      env: single-cell
      run:
        kind: sandbox
        runtime: python
        entry: compute/neighbourhoods.py
        helpers:
          - compute/_shared.py
          - compute/_regime.py
          - compute/_kernel.py
          - compute/_nhoods.py
        # #80 — the DECLARED, PINNED dependency contract. Every library this entry imports is
        # named here with a supported range, and the BUILD GATE resolves each against
        # `env-rootfs/single-cell/requirements.txt`, so a drift between what the analysis USES and
        # what the env SHIPS fails `cargo build` rather than a user's run. This is the
        # machine-enforced form of INV-DA-6 ("no new dependency"): before it existed that
        # invariant rested on a test grepping the Dockerfile for names — and the pins have since
        # MOVED OUT of that file, which is exactly the drift a declaration catches and a grep
        # does not.
        dependencies:
          - { library: anndata, version: ">=0.12,<0.13" }
          - { library: numpy, version: ">=2.0,<3" }
          - { library: pandas, version: ">=2.2,<3" }
          - { library: pydeseq2, version: ">=0.5.2,<0.6" }
          - { library: scanpy, version: ">=1.11,<1.12" }
          - { library: scikit-learn, version: ">=1.7,<2" }
          - { library: scipy, version: ">=1.14,<2" }
          - { library: statsmodels, version: ">=0.15,<0.16" }

      # `normal` ⇒ 4 GiB / 2 cores / 600 CPU-s, matching every sibling. The (nhood × sample)
      # matrix is tiny; the memory-bound term is the kNN over the embedding plus the boolean
      # neighbourhood matrix. The ceiling is re-checked BEFORE the read with a refusal naming a
      # REACHABLE lever — and, as in `clustering`, the refusal never names a `batch` class,
      # because this package ships no per-run class control.
      schedule:
        class: normal
      arch: [x86_64, aarch64]

      methodsText: >-
        Tested differential abundance across the cell-neighbourhood graph. A k-nearest-neighbour
        graph was rebuilt from the input embedding (never a 2-D layout), index cells were sampled
        at the recorded proportion under the recorded seed and refined to the nearest actual cell
        to each neighbourhood's median position, and cells were counted per (neighbourhood ×
        sample). The condition coefficient was tested with a negative-binomial count model over
        those INTEGER counts under the recorded normalization — never on raw proportions — with
        the sample as the unit of replication, and the test statistic referred to the reference
        distribution RECORDED with the result — a small-sample (Student-t) reference on the residual
        degrees of freedom for the default PyDESeq2 engine, the engine's own reference for the
        NB-GLM alternative. Because neighbourhoods overlap, the false-discovery
        rate was corrected with a connectivity-weighted Benjamini-Hochberg procedure (spatial
        FDR); the unweighted BH value is recorded alongside it. When the condition carried no
        external provenance, or fewer than two samples contributed on a side, the run returned
        ranked effects with the p-value and FDR ABSENT rather than a fabricated significance.

      # KEPT + load-bearing: `server/.../provenance/export/methods.rs` reads
      # `contributes.analyses[<id>].methods` to narrate the exported `methods.md` — the
      # out-of-app trust deliverable. TWO NARRATOR TRAPS ARE DELIBERATELY AVOIDED HERE:
      #   1. `note` is appended ONLY when at least one constraint was narrated, so this
      #      declaration MUST carry a constraint-producing role. `thresholds: threshold_list` is
      #      that role, and the run form always sends a non-empty `thresholds` list; without it
      #      the compositional-correctness disclosure below would silently vanish from
      #      `methods.md`.
      #   2. the narrator substitutes the literal token `{label}` ONLY. Sibling packages declare
      #      `{name}` / `{method}` placeholders that render VERBATIM into the exported document;
      #      this one uses `{label}` and nothing else.
      methods:
        subject: { singular: population, plural: populations }
        action: tested
        commits: "one per-neighbourhood differential-abundance table, labelled `{label}`"
        commits_unlabeled: a per-neighbourhood differential-abundance table
        note: >-
          The statistical model is a negative-binomial generalized linear model over the INTEGER
          (neighbourhood x sample) count matrix, fitted by the RECORDED count-model engine and
          tested on the condition coefficient of the recorded design formula (every covariate
          actually used is recorded in that formula). The engine is a run-time choice, recorded
          with the result: the default is PyDESeq2's negative-binomial Wald test, and a
          statsmodels negative-binomial GLM is equally selectable. The reference distribution for
          the statistic is likewise recorded rather than assumed — because a differential-abundance
          design is small-sample by construction the PyDESeq2 arm refers its Wald statistic to a
          Student-t distribution on the residual degrees of freedom rather than to a normal, while
          the NB-GLM arm's own reference is already conservative on designs of this size and no
          second small-sample penalty is applied to it. The `small_sample_correction` flag and the
          `residual_df` recorded with every result say which reference was used. The abundance statistic is NEVER computed from raw
          proportions by an independent per-population test. Counts are normalized by the recorded
          normalization, and the assumption it makes is stated with it: `poscounts` robust
          median-of-ratios size factors assume MOST POPULATIONS ARE UNCHANGED, while a named
          reference population (the additive-log-ratio transform) assumes THAT POPULATION'S
          ABSOLUTE ABUNDANCE IS CONSTANT; when neither can be established the run refuses by name
          rather than falling back to proportions. The unit of replication is the SAMPLE, never
          the cell, and the number of distinct samples contributing on each side is recorded per
          population. Because neighbourhoods OVERLAP, plain Benjamini-Hochberg would be
          anti-conservative in dense regions, so the reported false-discovery rate is
          connectivity-weighted (spatial FDR, weight 1/kth-nearest-neighbour distance); the
          unweighted value is recorded beside it. Neighbourhood-level results are RESOLUTION-FREE
          — no clustering resolution was chosen — which is what distinguishes them from the
          cluster-level analysis. Finally, two limitations that bound what this result can mean:
          differential abundance measures RELATIVE composition, so without a spike-in or a
          total-cell-count measurement "this population went up" and "everything else went down"
          are indistinguishable; and if the condition label had influenced how the cells were
          embedded, the selection would be circular in a way this run cannot detect and does not
          claim to.
        params:
          thresholds: threshold_list
          seed: seed
          name: output_label

    # ── da.clusters — the NAMEABLE, resolution-bound analysis (no matrix, no embedding) ──────
    - id: da.clusters
      category: differential-abundance
      title: Compare population abundance
      description: >-
        Test whether the proportion of each NAMED population — a cluster label or a curated
        annotation — changes between two conditions. Cells are counted per (population × sample)
        and the condition is tested with a negative-binomial count model under a named
        normalization, never with a per-population test on raw proportions. Three metadata
        columns are a complete input: no expression matrix and no embedding are read. The result
        is nameable, but it is SENSITIVE TO THE CLUSTERING RESOLUTION and blind to a shift
        confined to part of a cluster — the neighbourhood analysis is the resolution-free
        complement.
      whenHint: >-
        the user has a curated population/cluster label, an external condition and a
        replicate/sample column, and wants to know whether a NAMED cell type changes in proportion
      examples:
        - did the proportion of CD8 T cells change between conditions
        - compare cell type abundance between treated and control
        - test cluster abundance across conditions
      safety: read-run

      # The POPULATION column is the subject the analysis applies to. Single-select, so DEC-15's
      # opt-IN auto-bind is DECLARED — the shipped rule is that every single-value slot states its
      # position, and omitting the key leaves a headless (agent/MCP) launch unable to resolve the
      # input at all. It binds ONLY when exactly one candidate exists, which in a project carrying
      # many categorical columns is simply never; the user still picks.
      appliesTo:
        - slot: population
          type_id: metadata-column
          auto_bind_sole_candidate: true

      consumes: [metadata-column]

      # The optional per-cell signed-effect column is a `metadata-column`, which the SHIPPED
      # colour-by section colours on the UMAP for free — no bespoke colour surface.
      produces: [da/result, metadata-column, report/qc]

      ui:
        - ui/clusters.yaml

      # #191/E3 — DECLARE the env this contribution targets. An env-LESS declaration is resolved
      # against EVERY recipe on disk (`server/build_helper/processor_manifest.rs`): fail-closed,
      # and exactly right while ONE recipe exists, which is all there was when this package was
      # written. Main has since added a second, deliberately narrower R recipe (`single-cell-r`),
      # and an env-less block now demands these PYTHON pins be installed there too — so the build
      # gate refuses `anndata`, which `single-cell-r` correctly does not ship. The gate's own
      # doc-comment prescribes this fix: "the right relaxation is for a contribution to DECLARE
      # the env it targets, not for this gate to guess".
      env: single-cell
      run:
        kind: sandbox
        runtime: python
        entry: compute/clusters.py
        helpers:
          - compute/_shared.py
          - compute/_regime.py
          - compute/_kernel.py
        # #80 — see the note on `da.neighbourhoods`. The declaration is per-ANALYSIS and names
        # what THIS entry imports: `da.clusters` reads no embedding, so it needs neither `scanpy`
        # nor `scikit-learn`.
        dependencies:
          - { library: numpy, version: ">=2.0,<3" }
          - { library: pandas, version: ">=2.2,<3" }
          - { library: pydeseq2, version: ">=0.5.2,<0.6" }
          - { library: scipy, version: ">=1.14,<2" }
          - { library: statsmodels, version: ">=0.15,<0.16" }

      schedule:
        class: normal
      arch: [x86_64, aarch64]

      methodsText: >-
        Tested differential abundance of named cell populations. Cells were counted per
        (population x sample) and the condition coefficient was tested with a negative-binomial
        count model over those INTEGER counts under the recorded normalization — never on raw
        proportions, whose compositional constraint makes an independent per-population test
        invalid — with the test statistic referred to the reference distribution RECORDED with the
        result (a small-sample Student-t reference on the residual degrees of freedom for the
        default PyDESeq2 engine; the engine's own reference for the NB-GLM alternative). The sample was the unit of replication, and samples below the recorded minimum
        cell count were dropped and listed. Cluster-level abundance is SENSITIVE TO THE
        CLUSTERING RESOLUTION at which the populations were defined: the same data partitioned
        more or less finely can move a result. When the condition carried no external provenance,
        or fewer than two samples contributed on a side, the run returned ranked effects with the
        p-value and FDR ABSENT rather than a fabricated significance.

      methods:
        subject: { singular: population, plural: populations }
        action: tested
        commits: "one per-population differential-abundance table, labelled `{label}`"
        commits_unlabeled: a per-population differential-abundance table
        note: >-
          The statistical model is a negative-binomial generalized linear model over the INTEGER
          (population x sample) count matrix, fitted by the RECORDED count-model engine and tested
          on the condition coefficient of the recorded design formula (every covariate actually
          used is recorded in that formula). The engine is a run-time choice, recorded with the
          result: the default is PyDESeq2's negative-binomial Wald test, and a statsmodels
          negative-binomial GLM is equally selectable. The reference distribution for the statistic
          is likewise recorded rather than assumed — because a differential-abundance design is
          small-sample by construction the PyDESeq2 arm refers its Wald statistic to a Student-t
          distribution on the residual degrees of freedom rather than to a normal, while the NB-GLM
          arm's own reference is already conservative on designs of this size and no second
          small-sample penalty is applied to it. The `small_sample_correction` flag and the
          `residual_df` recorded with every result say which reference was used. The abundance statistic is NEVER computed from raw
          proportions by an independent per-population test: cell-type proportions are
          compositional, so a real rise in one population mechanically depresses every other one
          and a per-population proportion test manufactures confident false positives whose rate
          grows WITH the size of the real effect. Counts are normalized by the recorded
          normalization, and the assumption it makes is stated with it: `poscounts` robust
          median-of-ratios size factors assume MOST POPULATIONS ARE UNCHANGED, while a named
          reference population (the additive-log-ratio transform) assumes THAT POPULATION'S
          ABSOLUTE ABUNDANCE IS CONSTANT; when neither can be established the run refuses by name
          rather than falling back to proportions. The unit of replication is the SAMPLE, never
          the cell, and the number of distinct samples contributing on each side is recorded per
          population. Because populations here are DISJOINT named clusters, the false-discovery
          rate is the plain Benjamini-Hochberg value and no connectivity weighting is applied or
          reported. A cluster-level result is SENSITIVE TO THE CLUSTERING RESOLUTION: the
          populations are an arbitrary partition of a continuum, so a coarser or finer partition
          of the same cells can change which populations move and by how much, and a shift
          confined to part of a cluster is invisible here — the neighbourhood analysis is the
          resolution-free complement. Finally, two limitations that bound what this result can
          mean: differential abundance measures RELATIVE composition, so without a spike-in or a
          total-cell-count measurement "this population went up" and "everything else went down"
          are indistinguishable; and if the population labels had been derived with knowledge of
          the condition — clustering after condition-aware integration, or an annotation
          transferred from a condition-matched reference — the selection would be circular, which
          this run cannot detect from the recorded provenance and does not claim to.
        params:
          thresholds: threshold_list
          # NO `seed` role: `da.clusters` draws nothing at random (it counts cells and fits a
          # GLM), so declaring one would narrate a randomness the run does not have.
          name: output_label

  # ── The Visualize SECTION — the DA volcano, on the SHIPPED chart kind ──────────────────────
  #
  # Same idiom as `de.viz.differential-expression` and single-cell-viz's Coordinates / Color by:
  # a `pane: visualize` section applying to the `da/result` DATATYPE, whose view is an
  # `entry_list` over the run's `da-report` index with a `Plot ▸` verb. The chart kind is the
  # ALREADY-SHIPPED `volcano` (`encode: {effectColumn, significanceColumn}` read from the section
  # YAML), so this contributes ZERO `src-app/libs/viz` change. Milo's canonical readout is a
  # beeswarm and there is no beeswarm chart kind — adding one would be a viz-library change, and
  # a DA result genuinely IS volcano-shaped (effect vs significance over many entities), so this
  # is reuse rather than a workaround.
  sections:
    - id: da.viz.differential-abundance
      title: Differential abundance
      pane: visualize
      order: 50
      collapsed: false
      applies_to: [{ type_id: da/result }]
      ui: [ui/visualize-section.yaml]
