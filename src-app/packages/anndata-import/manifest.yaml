# AnnData / 10x import extension — the backend-owned source of truth for the
# h5ad/10x converter and the datatypes it contributes. Parsed at boot by
# `server/src/modules/extensions/loader.rs` and served over `GET /api/extensions`.
# It also CONTRIBUTES a domain datatype (`contributes.datatypes`) merged into the
# datatype registry: the `annotation-table` supporting datatype.
id: anndata-import
name: AnnData / 10x Import
publisher: cyto
# 0.4.0 — the manifest/UI separation: the FE `analyses` entry drops
# `when`/`accepts`/`params`/`defaults`/`schedule.resources`/`inStandardRecipe`/
# `recipeOrder` (each is now a LOAD ERROR, DEC-3) for `appliesTo` + `consumes`, and the
# dangling `contributes.views` entry + the stale axis-overlay note go with them. Seed
# reconciliation is version-keyed (`extensions/embedded.rs::reconcile`), so without this
# bump an already-provisioned deployment keeps a stale extracted manifest that now fails
# to load.
version: 0.5.2
apiVersion: "1.0"
contributes:
  # ── FE workbench contribution ────────────────────────────────────────────────
  # The `contributes.converters` block below is the SEPARATE server-side on-ingest
  # dispatch source of truth. The two are dual-parsed — the FE loader
  # (`runtime/loadProcessors.ts`) reads `analyses`, the backend loader reads
  # `converters` — each ignoring the other's key (`Contributes` does NOT
  # `deny_unknown_fields`). See the note above `converters:` for why the duplicated
  # `run` block is NOT collapsed.
  analyses:
    - id: anndata.import
      category: data-io
      title: AnnData / 10x Import
      description: >-
        Read an uploaded AnnData .h5ad / 10x matrix and re-emit it as a CSC expression
        matrix, the embeddings it contains, per-cell metadata columns, and a dataset
        inspect report — every output a Zarr v3 store.
      whenHint: >-
        the user uploaded a .h5ad / AnnData or a 10x matrix and wants it imported into the
        workbench
      examples:
        - import this h5ad
        - load the 10x matrix
      safety: read-run
      # A CONVERTER (DEC-4): launcher-excluded, still registered + resolvable by id for
      # the on-ingest / ingest-chaining path.
      trigger: on-ingest

      # ── APPLICABILITY ─────────────────────────────────────────────────────────
      #
      # Replaces `when: has:single-cell/anndata` (a weaker restatement that could never
      # independently fail), the `accepts` list, and `params.fields` (a form schema
      # wrapping a copy of the same selector; its only non-redundant content was the
      # slot name `input`, which survives as `slot:`).
      #
      # No `required:` flag — everything here is required by definition (DEC-5).
      appliesTo:
        - slot: input
          type_id: single-cell/anndata

          # ITEM-29f / DEC-15 — DECLARED, because it is the behaviour this slot has always had.
          # Two paths bind a sole candidate for this slot with NO UI at all: `resolveInputs` at
          # launch (an agent/MCP call that supplied nothing) and `autoPickSoleArtifacts` from a
          # mount effect. Neither can show what it bound, so under R2/INV-3 neither may bind
          # unless the analysis says so. Absence means OFF.
          auto_bind_sole_candidate: true
      # The `- { type_id: single-cell/matrix-mtx, required: false }` accepts-entry moved
      # HERE. `required: false` never gated availability; it only ever carried a graph
      # edge, and burying it in `accepts` made one key mean two things (DEC-5).
      #
      # NOTE what this key does and does not say for THIS package. For `cell.filter`,
      # `consumes` is a genuine producer→consumer chaining edge ("run QC first"). Here
      # the mtx trio is an ALTERNATIVE PRIMARY input, not a supplement — nothing
      # produces a `single-cell/matrix-mtx`, it is uploaded — so the edge finds no
      # producer and `chaining.ts` offers nothing, which is correct. What actually
      # dispatches an mtx-trio ingest is the `converters[].accepts` list below, which
      # the BACKEND reads; this entry keeps the FE registry's record of the second
      # accepted input without asserting it is a precondition.
      consumes: [single-cell/matrix-mtx]

      produces:
        - single-cell/expression
        - embedding
        - metadata-column
        - report/html
        - report/qc

      # No `ui:` — this package ships no view spec, so the generic fallback form
      # applies. An on-ingest converter is launcher-excluded and is not normally
      # rendered at all; the absence of the key is now an explicit declared state.

      # `defaults: { input: "" }` is GONE — an empty string is not a default, it is the
      # absence of a value, and the compute owns absence at the one boundary where it
      # can occur (`params.json`).

      # The env image this contribution runs inside (#191 / E3). DECLARED, not inferred,
      # so the #80 dependency gate resolves its `run.dependencies` against THIS env's pin
      # set only. An env-LESS declaration is resolved against EVERY recipe on disk
      # (`server/build_helper/processor_manifest.rs`) — the fail-closed reading, and
      # exactly right while one recipe exists; with a second, deliberately narrower env
      # (`single-cell-r`) it would demand these python pins be installed there too. The
      # gate's own doc-comment prescribes this fix in writing: "the right relaxation is
      # for a contribution to DECLARE the env it targets, not for this gate to guess".
      env: single-cell
      run:
        kind: sandbox
        runtime: python
        entry: compute/h5ad_import.py
        # S6 — this package's OWN sibling module, co-staged next to the entry so
        # `import multimodal` resolves in the sandbox. It used to be staged by a
        # fixed server table (`PY_HELPER_FILES`) that pulled THIS package's script
        # path into EVERY python entry's code dir, cross-package and globally; the
        # app builtin therefore named a specific domain package. `h5ad_import.py` is
        # the only entry that imports it, so declaring it here is exact.
        # (`align.py` / `colsummary.py` stay app-staged: they live in the reserved
        # `_helpers` package and are the app's own cross-cutting helpers.)
        helpers:
          - compute/multimodal.py
        # The libraries THIS entry's code imports, with the version range it is
        # supported against (#80). A minor-pinned range where the library's DEFAULTS decide a published
        # number; a wider one where it is a stable numerical floor.
        dependencies:
          - { library: anndata, version: ">=0.12,<0.13" }
          - { library: h5py, version: ">=3.14,<4" }
          - { library: numpy, version: ">=2.0,<3" }
          - { library: pandas, version: ">=2.2,<3" }
          - { library: scanpy, version: ">=1.11,<1.12" }
          - { library: scipy, version: ">=1.14,<2" }
      # `resources: { cpu: 2, mem: 8Gi }` is GONE — nothing read it (`jobsCapability`
      # rebuilds the spec as `{ class }`); real limits come from the singleton sandbox
      # settings row.
      schedule:
        class: normal
      arch: [x86_64, aarch64]
      methodsText: >-
        Imported the AnnData .h5ad / 10x matrix; re-emitted the count matrix as a
        gene-major CSC Zarr store, extracted the embeddings, and preserved the per-cell obs
        columns as typed workstore artifacts.
      # `inStandardRecipe: true` / `recipeOrder: 1` are GONE — zero consumers in either
      # language.

  # ── BACKEND on-ingest dispatch ───────────────────────────────────────────────
  #
  # WHY THIS BLOCK STILL REPEATS `run` (it is NOT dead duplication):
  #
  # `analyses` and `converters` are read by DIFFERENT parsers into DIFFERENT types, and
  # neither can see the other's block:
  #   * FE — `runtime/loadProcessors.ts` builds an `AnalysisContribution` from
  #     `contributes.analyses[]`; `run` is a required field of that shape.
  #   * Rust — `extensions::types::ConverterContribution` deserializes
  #     `contributes.converters[]`; `run: RunSpec` is a NON-optional field with no
  #     `#[serde(default)]`, so a converters entry WITHOUT `run` fails to deserialize
  #     and the package's backend contribution is dropped at boot. The backend's own
  #     view of `analyses` (`AnalysisContributionData`) deliberately keeps every FE key
  #     verbatim in a `#[serde(flatten)] rest` map and does not re-type it — the
  #     converter dispatch never looks there.
  #
  # So collapsing the two `run` blocks into one is a CROSS-LANGUAGE change (a new
  # fallback in one parser to read the other's block), not a text dedupe — and it would
  # couple two contribution kinds that are deliberately independent. ITEM-20's
  # phase-2 verdict said exactly this. Left as two declarations, deliberately.
  #
  # The rest of this block is NOT a duplicate: `env`, `trigger`, `params: none`, the
  # SUPPORTING accepts-entries with their per-axis alignment, and the `produces`
  # cardinalities exist only here. Note also that `accepts`/`params` are the BACKEND
  # `ConverterContribution`'s own field names — they are not the FE analysis keys the
  # schema removed, and removing them here would break on-ingest dispatch outright.
  converters:
    - id: h5ad-import
      title: Import AnnData / 10x
      # Auto-runs when a dataset of an accepted type is ingested (DEC-4 vocabulary
      # = on-ingest only this round).
      trigger: on-ingest
      # Zero-param converter (the "non-parametric analysis on upload").
      params: none
      # The analysis-domain env image this converter runs inside (ITEM-23 /
      # DEC-22/23): resolved by the sandbox `env_image` registry to
      # `ghcr.io/ziee-ai/cyto-env/single-cell@sha256:…`, lazy-fetched on first
      # use. Falls back to the EMBEDDED rootfs (DEC-24) until OCI/GHCR lands, so
      # this runs today with no network.
      env: single-cell
      accepts:
        # PRIMARY inputs (a bare `{type_id}` defaults role=primary — DEC-6).
        - type_id: single-cell/anndata
        - type_id: single-cell/matrix-mtx
        # SUPPORTING inputs (ITEM-6): the annotation-table datatype declared below,
        # aligned to a named primary AXIS. These declare the upload wizard's optional
        # annotation SLOTS (ITEM-16) + how each aligns (key-join onto the axis, DEC-18).
        - type_id: annotation-table
          role: supporting
          slot: cells_annotation
          axis: cells
          kind: annotation_table
          alignment:
            strategy: key_join
            axis: cells
            # Cells key on a 10x barcode: strip a trailing `-<digit>` GEM-well suffix
            # then trim. Matches the integrate script's axis-aware default for `cells`.
            normalize: [barcode_suffix, trim]
        - type_id: annotation-table
          role: supporting
          slot: genes_annotation
          axis: genes
          kind: annotation_table
          alignment:
            strategy: key_join
            axis: genes
            # Genes key on a gene id/symbol: strip a trailing Ensembl `.<version>` then
            # trim. NO `barcode_suffix` — its trailing `-<digit>` strip MANGLES real
            # dash-DIGIT gene symbols (NKX2-1, NKX2-5, HOXA-1 …) and two can collide into
            # a hard AlignmentError. Matches the integrate script's axis-aware default.
            normalize: [ensembl_version, trim]
      produces:
        # The CSC gene-expression matrix (one, or one-per-modality when
        # var['feature_types'] splits). ITEM-27 deleted the lossless multi-file store
        # output: it was the transpose BUFFER this matrix was streamed back out of, not a
        # second product, so replacing the transpose retired it. ITEM-38 then removed the
        # datatype itself from `single-cell-types`, so the id is gone from the tree.
        - datatype: single-cell/expression
          cardinality: many
        - datatype: embedding
          cardinality: many
        - datatype: metadata-column
          cardinality: many
        - datatype: report/html
          cardinality: one
      run:
        kind: sandbox
        runtime: python
        entry: compute/h5ad_import.py
        # This package's OWN sibling module, co-staged next to the entry so
        # `import multimodal` resolves in the sandbox (see the `analyses` entry above —
        # the two parsers each read their own `run`, so both must declare it).
        helpers:
          - compute/multimodal.py
        # The libraries THIS entry's code imports, with the version range it is
        # supported against (#80). A minor-pinned range where the library's DEFAULTS decide a published
        # number; a wider one where it is a stable numerical floor.
        dependencies:
          - { library: anndata, version: ">=0.12,<0.13" }
          - { library: h5py, version: ">=3.14,<4" }
          - { library: numpy, version: ">=2.0,<3" }
          - { library: pandas, version: ">=2.2,<3" }
          - { library: scanpy, version: ">=1.11,<1.12" }
          - { library: scipy, version: ">=1.14,<2" }

  # `contributes.views` is GONE. Its single entry declared
  # `{ id: anndata-inspector, entry: ui/AnnDataInspector.tsx }` — a file that DOES NOT
  # EXIST anywhere in the tree (`find . -name 'AnnDataInspector*'` returns nothing), so
  # the declaration named a viewer the app could never mount.

  datatypes:
    # (ITEM-5a) The NEW generic supporting datatype — a keyed CSV/TSV of attribute
    # columns, aligned to a named entity AXIS of a primary datatype (DEC-3). Declared
    # HERE in a manifest (not `builtin.rs`) — this PROVES the modular seam (DEC-19): a
    # new supporting type needs no core edit. Concrete, extends the `data` root, opaque
    # raw-upload storage (the integrate converter parses the raw csv/tsv), sniffed by
    # the `csv`/`tsv` extensions.
    - id: annotation-table
      extends: data
      title: Annotation table
      description: >-
        A keyed CSV/TSV of attribute columns joined to a named entity AXIS of a
        primary dataset (cells → barcode, genes → gene_id, …). One generic supporting
        type serves every axis of every domain (DEC-3/DEC-15); the integrate converter
        aligns it and emits axis-tagged metadata-columns.
      is_abstract: false
      storage:
        layout:
          kind: opaque_as_is
        format: csv
      # NO `ingest.extensions`: `annotation-table` is a SUPPORTING type resolved by
      # CONTEXT (the supporting file's `kind`), never a PRIMARY sniff target. Listing
      # csv/tsv here would hijack a generic `.csv` primary upload (which must sniff to
      # `de`), since sniff picks the lowest datatype id and `annotation-table` < `de`.
    #
    # The former trailing NOTE here — "the AXES of the EXISTING Rust datatypes
    # `single-cell/anndata` + `single-cell/matrix-mtx` … are attached at boot as an
    # axis-overlay in `datatype/mod.rs::single_cell_axis_overlays()`" — is GONE. It was
    # stale in two ways: that overlay is DELETED (`datatype/mod.rs` says so in its own
    # comment: "the former boot axis-overlay (`single_cell_axis_overlays()`) is
    # deleted"), and those two datatypes are no longer Rust-registered — they are
    # contributed by the `single-cell-types` package, where they now declare NO axes at
    # all (INV-7: an upload/export container is opaque).
