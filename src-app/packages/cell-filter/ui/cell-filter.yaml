# Cell-filter declarative view_spec.
#
# No `analysis:` key — the MANIFEST declares `ui: [ui/cell-filter.yaml]`, so the binding
# is owned by the registration file. No `layout:` — one analysis renders into ONE pane
# and widgets render in DECLARATION ORDER, so the order below IS the layout (INV-3).
#
# NON-DESTRUCTIVE annotator: the user builds CRITERIA on ANY obs column; the combined
# keep-mask (the AND of every criterion) is client-side `$derived` and tuned live
# (before/after plots reshape as thresholds move — no artifact); Run COMMITS ONE
# immutable per-cell boolean `metadata-column` named BY THE USER — the mask name field
# below IS the column name, verbatim (true = kept). It
# never writes a filtered matrix, an embedding, or a subset. JOINT DROP: the mask is ONE
# per-cell boolean over the SHARED obs, so a criterion on any modality's column drops the
# whole cell across ALL modalities.
#
# CONTROLLED cell-close: the before/after cells are `controlled: true`; a cell-close
# routes to the declared `cf.removeCriterion` (a state mutation) — viz does NOT
# self-remove, so the `for_each` render can't re-create the cell (the reopen-loop guard).
id: cell.filter
title: Cell filter
# Reuse the EXISTING permission — cell filter introduces no new gate.
permission: jobs::use

state:
  # The dataset whose cells this mask annotates. Seeded from the single compatible
  # artifact when there is exactly one; a picker when there are more.
  #
  # SINGULAR, unlike QC's `matrices`. The mask is ONE per-cell boolean over the SHARED
  # cells axis, so the unit of selection is the DATASET, not the modality — that is what
  # JOINT DROP means: a criterion on any modality's column drops the whole cell
  # everywhere. Per-modality selection here would imply per-modality masks, which is the
  # opposite of the design.
  expression: { type: string, default: null }

  # NO `cellsIndex`. The cells-axis KEY (barcode) picker that stood here is DELETED, along
  # with its widget, its setter, and its `cells_index` run binding.
  #
  # The compute keeps the optional slot, and legitimately: `obs_names` has exactly two
  # consumers — `resolve_gate` (a gate cell-set given as explicit ids) and the allow-list
  # slot (`cells`/`cell-set`/`cell_set`/`cellset`). NEITHER is reachable from this view.
  # `cf.run` sends `params: {}` and binds no cell-set slot, so on every run this UI can
  # launch the barcodes were read, length-checked against the matrix, and then used for
  # nothing. The committed mask is written positionally (`axis="cells"`, no keys), so it
  # does not carry them out either.
  #
  # It was not merely inert. It was a required-LOOKING decision sitting directly above the
  # criteria builder — the control the user actually came for — arguing carefully about why
  # they must choose, for a run that never read the answer.
  #
  # The gate/allow-list path stays reachable via the API/MCP surface, which is where it is
  # driven from. If this view ever grows a cell-set criterion, the picker comes back WITH
  # the feature that needs it, rather than standing here waiting for one.

  # The user-built criteria list — each `{ column, control, min?, max?, keep? }`. Empty
  # by default; `cf.addCriterion` appends a blank row.
  criteria: { type: list, default: [] }
  # A categorical obs column to group the violins by / color the scatter. Empty ⇒ ungrouped.
  groupBy: { type: string, default: null }
  # The mask column's NAME. Not a label that gets slugged into one — the string here is
  # the column the run commits, character for character (`compute/cell-filter.py::
  # mask_column_name`). The `keep_` prefix and the `keep_all` empty fallback are gone.
  #
  # DEFAULTED, and not to `""`. Every other string field on this view defaults empty
  # because empty is a real answer there (no group-by, no dataset chosen yet); a column
  # name has no empty answer — the run refuses one — so a blank default would ship a form
  # that is invalid the instant it opens, with a red requirement under a field the user
  # has not reached yet. `keep` is what the column IS, which is the honest first suggestion
  # and the nearest thing to the `keep_all` fallback the prefix removal deletes.
  #
  # It is deliberately a name that WILL collide on the second run against the same
  # dataset, and that is the design rather than an oversight: masks coexist
  # (provenance-immutable, never overwritten), so a second `keep` beside the first is two
  # columns with one name — the shadowing the uniqueness requirement exists to prevent.
  # The refusal names the clash and the remedy is one word; a default that quietly
  # versioned itself would put the user back to not knowing what their column is called.
  label: { type: string, default: "keep" }
  # Standalone-plot toggles. Opened from the interface, closed from the canvas cell X
  # (both a declared state mutation — the close-is-a-state-mutation rule).
  showEmbedding: { type: boolean, default: false }
  showSpatial: { type: boolean, default: false }

data:
  # The criteria columns come from the cells axis of the SELECTED dataset, not from a QC
  # report.
  #
  # It was `{ source: job.result, args: { path: /obs, datatype: report/qc } }` — obs read
  # out of QC's report artifact. That contradicted this analysis' own description ("Build
  # criteria on ANY obs column — QC metrics + pre-existing metadata"): sourced from
  # `report/qc`, only QC's OWN output columns are offerable. On a real CELLxGENE import
  # that is 4 columns instead of 65 — `cell_type`, `disease`, `donor_age`,
  # `development_stage`, `cell_type_level_0..4` and the rest are simply not selectable,
  # even though filtering on them is the stated point (INV-5/INV-6).
  #
  # Reading the AXIS instead also removes an ordering coupling: criteria no longer
  # require QC to have run first. If QC has run its columns are there because they are
  # artifacts on the axis — not because this view knows QC exists.
  # ITEM-34 — `values_for` makes this read LAZY: metadata for every column on the axis, values
  # only for the columns a criterion actually names. It is what stops a 65-column import fetching
  # 65 bodies to populate a picker that needs names, kinds and levels. The picker is unchanged —
  # `columns_of` and `categories_by_column` answer from the declaration sidecar — and a body
  # arrives when, and only when, a criterion refers to it.
  #
  # The window between naming a column and its body landing is the owner's LOADING GATE
  # (DRIFT-1.11): `keep_mask` returns all-FALSE for a pending criterion and `pendingColumns`
  # below names it. Conservative and visible, never permissive and invisible.
  obs:
    source: axis_columns
    args: { of: "$state.expression", axis: cells, values_for: "$state.criteria" }

  # The SAME axis relation, asked for the ARTIFACT ID behind each column instead of its
  # values (`as: sources` → `{ column: artifact_id }`).
  #
  # It is what makes the Run bind what the form showed. `cell-filter.py` resolves every obs
  # column by SLOT — `column:<name>` — because a `metadata-column` store keeps its values
  # under the constant member `values` and cannot carry its own name; the name has to arrive
  # with the binding. `$data.obs` is `{ name: values[] }` with the ids already merged away,
  # so it can say WHICH columns exist and not WHERE they live. Without this slice the run
  # shipped only `expression` (a CSC matrix, which carries no obs at all), every criterion
  # resolved to an absent column, `criteria_keep_mask` skipped it, and the committed mask
  # kept every cell — a filter that silently did nothing, at rc=0, with a green report.
  #
  # Reading the ids costs one catalog call and NO artifact fetches (a column's name and id
  # are both producer declarations on the catalog row), and it shares its row selection with
  # the frame above, so a column the builder OFFERS always has a source the Run can mount.
  # It is ALSO the taken-set `labelInput.require.not_in` reads (the map's KEYS are every
  # column name declared on this axis). One slice, not a second identical one: the question
  # "which columns exist here" has one answer, and minting it twice is how two answers come
  # to disagree. Its coverage is exactly what the mask name needs — the dataset's OWN
  # imported obs columns AND every column any run put on the axis, in one set, because the
  # AXIS is the namespace the `keep_` prefix used to stand in for.
  obsSources: { source: axis_columns, args: { of: "$state.expression", axis: cells, as: sources } }

derived:
  # All of these already derive from DATA rather than from any declaration — the column
  # list and each column's control shape are read from what is actually there. This is
  # the pattern the datatype's static `annotations` block was standing in for, and it is
  # why removing that block costs this view nothing.
  #
  # The obs columns as `[{value,label,control}]` (the criterion column picker's options)
  # + a `{ column: control }` MAP (the per-criterion control-type `when` gate) + a
  # `{ column: plotKind }` MAP (the before/after cell's viz kind) — all from `columns_of`.
  columns: { columns_of: { obs: "$data.obs" } }
  controlByColumn: { columns_of: { obs: "$data.obs", keyed: true } }
  # The chart KIND each control type seeds its before/after cell with — DECLARED here,
  # not a `violin`/`bar` default hardcoded inside the core `columns_of` primitive.
  plotKindByColumn: { columns_of: { obs: "$data.obs", keyed: true, as: { range: violin, multiselect: bar } } }
  # Categorical columns only — the group-by picker.
  catColumns: { columns_of: { obs: "$data.obs", only: categorical } }
  # The DISTINCT category VALUES per categorical obs column (`{ column: string[] }`) —
  # the keep-set multiselect's OPTIONS. Without it the keep-set column had no options and a
  # categorical criterion could never be built.
  categoriesByColumn: { categories_by_column: { obs: "$data.obs" } }
  # The COMBINED client-side keep-mask: AND over the criteria (joint drop). Backs the
  # `obs.kept` before/after stream; committed under `$state.label` on Run.
  keptMask: { keep_mask: { criteria: "$state.criteria", obs: "$data.obs" } }
  # ITEM-34 — WHICH criterion columns are still waiting for their body. The loading gate for the
  # lazy read above, and it answers with NAMES rather than a boolean so a user with several
  # criteria can see which one is not ready. Empty ⇒ every criterion can be answered.
  pendingColumns: { pending_criterion_columns: { criteria: "$state.criteria", frame: "$data.obs" } }

widgets:
  # ── the INPUT, in the same form as everything else (INV-2/INV-4) ─────────────
  #
  # Declares its OWN source; the manifest's `appliesTo` governs whether the analysis is
  # OFFERED at all, not what this control LISTS. `slot` is not a UI concept and is absent
  # here — it survives only as the wire key on `run_processor`'s `inputs`.
  - id: expressionPicker
    kind: artifact_ref
    # ITEM-29e / DEC-15 — DECLARED, because it is the behaviour this surface has always
    # had. `auto_bind_sole_candidate` is opt-IN (absence means OFF, which is R2/INV-3 as
    # written); before it existed the sole-candidate bind was unconditional with no way to
    # turn it off. Stating it here keeps this control byte-identical for the user and makes
    # the affordance visible in the file, which is the entire point of the rule.
    auto_bind_sole_candidate: true
    label: Dataset
    source: { subtypes_of: single-cell/expression }
    value: "$state.expression"
    onChange: cf.setExpression
    # What the deleted `disabledWhen: "$state.expression == ''"` said, declared where it can
    # also speak for itself. When the project has NO candidate this reports nothing at all
    # (a red "required" on a control offering nothing is an instruction nobody can follow) —
    # `empty_text` speaks there instead.
    #
    # CHOOSE, not IMPORT: this is the sentence for a project that HAS datasets and an answer
    # the user has not given yet.
    require:
      required: true
      message: Choose the dataset whose cells this mask annotates.
    # What `noInputAlert` used to say, moved onto the control that actually knows whether it
    # is true.
    #
    # The alert is DELETED, and it carried the same reported defect QC's did: its condition
    # (`$state.expression == ''`) tested whether the user had SELECTED a dataset while its
    # text asserted the project CONTAINED none. Since the picker pre-selects only at exactly
    # one candidate, a project with TWO datasets and no selection produced "No single-cell
    # dataset in this project yet" — the message getting more confident the more data was
    # imported. It is not repairable as a predicate: a view cannot observe candidate
    # availability (the catalog is an internal channel a view may not query), so any `when`
    # written here can only test selection. Declared on the control there is no predicate.
    empty_text: No single-cell dataset in this project yet. Import one to build a keep-mask.

  # A dataset IS chosen, and the axis carries nothing to threshold on. That is not an error and
  # not an empty dataset — it is the ordinary state of a project where the metrics have not been
  # computed yet, and the whole point of this analysis is filtering on them.
  #
  # The SENTENCE is this view's to write: what the user should know here is a fact about THIS
  # workflow, and no host can phrase it for every analysis. The DESTINATION is not — naming an
  # analysis from another package inside this file breaks silently (a dead affordance, not an
  # error) the moment a deployment ships a different producer or a domain names one otherwise.
  # `action.launch: producer` asks the host to derive it from THIS analysis' own
  # `consumes: [metadata-column]`, so nothing here names what it points at.
  #
  # `when` is deliberately narrow: with columns present this says nothing, and with no dataset
  # chosen the alert above already speaks. Always-on guidance is noise, and noise is how a user
  # learns to stop reading the thing that will eventually matter.
  #
  # It is gated on RESOLVED-AND-EMPTY (`$dataStatus == empty`), not on merely-empty
  # (`$derived.columns.length == 0`), and the difference was a live falsehood. `columns` is
  # empty in TWO situations — the axis answered and carries nothing, and the axis has not
  # answered yet — and this sentence is only about the first. The second is reached on the
  # most ordinary project there is: `expressionPicker` pre-selects when the project holds
  # exactly ONE candidate, so on first mount the dataset lands the instant the catalog does
  # and the axis frame it anchors is still in flight for a beat after. A user opening a
  # one-dataset project was told it carries no per-cell measurements while its 65 columns
  # were on the wire.
  #
  # `$dataStatus` is the region's own data lifecycle, which the store has always tracked and
  # a view could not read until now. `empty` is authoritative: every declared slice resolved
  # and found nothing (`runtime/dataStatus.ts`). Mid-fetch the status is whatever last
  # resolved, never `empty`, so this stays silent — and an `error` is `error`, so a failed
  # read no longer borrows this sentence to explain itself (`RegionStatus` says the true
  # thing there, retryably).
  #
  # Nor does a set of columns that EXISTS and cannot be read: that resolves `unreadable`, not
  # `empty`, and has its own sentence directly below. The two are both "nothing to show", and
  # only this one is answered by "go and compute them" — `obsSources` answers off the catalog
  # rows and `obs` opens them, so the state where the ids are all present and none of the
  # values arrive is reachable and used to land here, wrongly.
  #
  # The `$state.expression != ''` clause stays. It is not redundant with the status: after a
  # dataset is cleared the previous anchor's `empty` survives until the next resolve lands,
  # and this sentence presupposes a chosen dataset ("THIS dataset carries…").
  - id: noCriteriaColumnsAlert
    kind: alert
    tone: info
    when: "$state.expression != '' && $dataStatus == empty"
    text: >-
      Nothing to filter on yet — this dataset carries no per-cell measurements. Compute them
      first, then build criteria here.
    action:
      launch: producer

  # The columns ARE on the axis and none of them could be read.
  #
  # It carries no `action: launch: producer`, and that omission is the point. The affordance
  # beside the sentence above offers to PRODUCE the input; here the input exists, and offering
  # to make it again would send the user to re-run an analysis whose output is already sitting
  # in the catalog. Nothing this view can launch fixes an unreadable read — the region's own
  # status surface offers the move that might (a retry), so this widget states the fact and
  # stops.
  #
  # `warning`, not `info`: unlike the sentence above this is not the ordinary state of a young
  # project, and unlike `error` it is not "we could not reach the server" — the request was
  # answered and the answer was unusable.
  - id: unreadableColumnsAlert
    kind: alert
    tone: warning
    when: "$state.expression != '' && $dataStatus == unreadable"
    text: >-
      This dataset's per-cell measurements are listed but could not be read, so there is
      nothing to build criteria on yet. They may still be uploading — try again in a moment.

  # ITEM-34 / DRIFT-1.11 — the LOADING GATE the owner chose, made visible.
  #
  # It names the waiting column rather than showing a bare spinner, because the state it reports
  # is one a user can act on (wait, or drop that criterion) and because with several criteria a
  # spinner cannot say which. It sits ABOVE the table so it is read before the result below it.
  #
  # The mask is already all-FALSE while this is non-empty — the gate is not what makes the
  # result safe, it is what makes the safety legible.
  - id: pendingColumnsAlert
    kind: alert
    tone: info
    when: "$derived.pendingColumns.length > 0"
    # PROSE ONLY, no `$` ref. `AlertRenderer` resolves `text` through `evalExpr`, which refuses a
    # mixed text+ref string as arbitrary code — an interpolated sentence here THROWS and the
    # widget renders as an error. Naming the waiting column on this surface therefore needs
    # `interpolate` in the renderer (a core change, deliberately not made here); the kernel's
    # answer already carries the names for the surface that wants them (DRIFT-1.28).
    text: >-
      Loading the values for a criterion column. That criterion is not applied yet, so the
      result below is not final.

  # ── the criteria builder ─────────────────────────────────────────────────────
  #
  # A TABLE, the same generic primitive the metric editor uses (REPORTED: "column, min, max
  # should appear in a table, like how QC render the metrics"). It was a `group` repeated with
  # `for_each`, which stacks each criterion as a card of full-width labelled fields: three
  # criteria filled the pane, the columns of different rows never lined up, and comparing two
  # thresholds meant reading two blocks of prose. A criteria list is a LIST OF ROWS WITH THE
  # SAME FIELDS, which is what a table is for.
  #
  # `options` and the per-column control shape still come from `$derived`, so ANY column present
  # on the axis is filterable — whether it came from an upstream run, from the import, or from a
  # supporting-file upload.
  #
  # Each bound cell carries its own per-row `when`, which is what the group's per-widget `when`
  # used to do. It is load-bearing in both directions: a numeric column must not be offered a
  # keep-set (typing one silently reclassifies the criterion as categorical and the bounds stop
  # being applied), and a categorical column must not be offered bounds (they coerce its values
  # to NaN and drop every row). The gate reaches the REQUIREMENT too, so a bound hidden by a
  # column change is not judged — a message on a field that is not drawn is unanswerable.
  - id: criteriaTable
    kind: table
    rows: "$state.criteria"
    # THE OPENING STATE OF THIS FORM, not a corner: `state.criteria` defaults to `[]`, so this is
    # what every user sees the first time the pane mounts. It used to be a grid of three headings
    # over nothing — a titled, populated-looking frame announcing a structure and withholding
    # every instance of it, at the exact moment the reader knows least about what the analysis
    # wants from them.
    #
    # The sentence says what a criterion IS (a column plus what to keep of it) and names the
    # affordance that makes the first one, which sits directly beneath. It is the view's to write
    # because the engine knows only that the rows are a list.
    empty_text: >-
      No criteria yet. A criterion picks one column and says what to keep of it — a range for a
      measurement, a set of categories for a label. Add the first one with the button below.
    columns:
      # Column picker — ANY obs column, as a per-row closed set.
      - key: column
        title: Column
        cell:
          select:
            value: "$row.column"
            options: "$derived.columns"
            onChange: cf.setCriterionField
            # WHAT AN EMPTY PICKER IS ABOUT, said at the picker.
            #
            # The engine's own wording ("No options yet") names the SYMPTOM, and it names it at
            # the control the user is actually poking, four controls above the sentence that
            # names the CAUSE. With no dataset chosen the Run footer already says "Dataset —
            # Choose the dataset whose cells this mask annotates" and Run is disabled — but a
            # user pokes the empty picker, not the footer, and "Add criterion" stays enabled
            # precisely so they can. (Disabling it instead would trade one uninformative state
            # for another: a non-submit `button` has no channel for a REASON — `disabledWhen`
            # renders no explanation, only the submit gate's requirement list does — so a
            # disabled Add would be a silently dead control.)
            #
            # It says where the options COME FROM rather than "choose a dataset first", because
            # the same emptiness has two causes — no dataset chosen, and a chosen dataset whose
            # axis carries nothing offerable — and an instruction that is wrong in the second
            # would be a new lie in place of the old silence. `noCriteriaColumnsAlert` above
            # speaks for the second case specifically.
            empty_text: No columns to filter on — they come from the dataset chosen above.
      # THE CONSTRAINT — one column, and whichever control this row's column type calls for.
      #
      # It was THREE columns (Min, Max, Keep), and that was the reported defect's first cause.
      # A grid reserves a column's width on EVERY row, but `controlByColumn` makes these three
      # MUTUALLY EXCLUSIVE per row: a continuous column takes bounds and can never take a
      # keep-set, a categorical column the reverse. So every row paid permanent width for a
      # control it could not use — measured on this surface, 51px of a 268px form column spent
      # on a "Keep" heading over an empty box on a continuous row. Three columns for one field
      # slot is what pushed a 340px grid out of a 268px column, and no amount of tightening the
      # controls themselves would have paid that back.
      #
      # `parts` is one column holding several row-scoped parts. Each keeps its OWN key, which is
      # the property that makes this a placement change and nothing else: `min`/`max`/`keep`
      # still address their own verdicts (`at.part: max` below), their own testids, and their own
      # per-row `when` — evaluated by the renderer AND by the validity pre-pass, exactly as when
      # they were columns. The gate that used to decide whether a column drew anything now
      # decides which sibling fills the slot, so a row shows one control instead of one control
      # and two blanks.
      #
      # A bound is FREE TEXT, and until 6243901c nothing looked at it. That is silent in the
      # worst possible direction: `criteria.ts::parseBound` — the normative coercion, conformed
      # to by four readers — maps an ungrammatical bound to UNBOUNDED rather than to an error, on
      # purpose, so the preview, the committed mask and the attested replay cannot disagree.
      # So `1O`, `1_000`, or a `10` pasted from a spreadsheet with a non-breaking space all
      # mean NO CONSTRAINT: the criterion filters nothing, the mask keeps every cell, rc=0,
      # green report. The form is the only layer that can catch this.
      #
      # `require.number` calls that SAME parser (never `Number()`), so what the form reports as
      # invalid is exactly what the readers would have treated as unbounded. An EMPTY bound
      # stays legal — a one-sided threshold is the ordinary case, and "unbounded on purpose" is
      # a real answer.
      - key: constraint
        # ONE heading over both readings, because the column is one question ("what does this
        # criterion keep?") asked of two kinds of column. "Min"/"Max"/"Keep" cannot survive the
        # fold: a heading that names one branch is wrong on every row of the other.
        title: Constraint
        parts:
          # CONTINUOUS control (min/max) — drawn only when the row's column is continuous.
          # The bounds carry `placeholder` now: the column heading named them while they were
          # columns, and one shared heading cannot. (The accessible name always carried it; this
          # is the same fact for someone looking at the screen.)
          - key: min
            cell:
              editable_text:
                when: "$derived.controlByColumn[$row.column] == range"
                value: "$row.min"
                placeholder: "Min"
                onChange: cf.setCriterionField
                require: { number: {} }
          - key: max
            cell:
              editable_text:
                when: "$derived.controlByColumn[$row.column] == range"
                value: "$row.max"
                placeholder: "Max"
                onChange: cf.setCriterionField
                require: { number: {} }
          # CATEGORICAL control (keep-set) — drawn only when the row's column is categorical.
          - key: keep
            cell:
              multiselect:
                when: "$derived.controlByColumn[$row.column] == multiselect"
                value: "$row.keep"
                options: "$derived.categoriesByColumn[$row.column]"
                # An EMPTY keep-set is "no category selected", which every reader of the mask
                # treats as NO CONSTRAINT — so the empty state says "all", not "none". Stating
                # it here rather than defaulting it in the engine is the point: what an empty
                # set means is this column's claim about its own filter, and no other column
                # need agree.
                placeholder: "All categories"
                onChange: cf.setCriterionField
      # The row's destructive action, as an ICON — the second cause of the overflow, and the
      # cheaper one to state: "Remove" is the same word on every row and it was 95px of a 268px
      # form column, a third of the pane spent restating one verb. As an icon it is 32px.
      #
      # `label` is NOT dropped. It becomes the accessible name (carrying the row with it) and
      # the hover tooltip, so the control is still named to a screen-reader user, a voice user
      # and a pointer user. An icon-only control that were merely unlabelled would be a worse
      # bargain than the width — this trades the REDUNDANT reading, not the only one.
      - key: remove
        title: ""
        cell:
          button:
            label: Remove
            icon: remove
            variant: destructive
            onClick: cf.removeCriterion
    # NO RANGE CONTROL under the row (REPORTED, reversing an earlier report that asked for one).
    # The bounds are the two numeric inputs above and nothing else: ONE hand on one answer.
    #
    # The band it replaced was a genuine second hand — it READ and WROTE the same two
    # `criteria.{i}.min`/`.max` fields, so nothing about those fields changes here. `require.number`
    # on each and the `minAboveMax` relation below judge exactly what they judged before, because
    # they were always declared on the FIELDS and never on a control.
  - id: addCriterionBtn
    kind: button
    label: Add criterion
    variant: primary
    onClick: cf.addCriterion
  # Global group-by — a categorical obs column split across every plot.
  - id: groupByPicker
    kind: select
    label: Group by
    options: "$derived.catColumns"
    value: "$state.groupBy"
    onChange: cf.setGroupBy
    # The same sentence as the criterion column picker's, narrowed to what THIS control offers:
    # the group-by set is the CATEGORICAL columns, so a dataset carrying only measurements
    # empties it while the criteria builder stays full. Saying "no columns" here would be false
    # on exactly that dataset.
    empty_text: No categorical column to group by — they come from the dataset chosen above.
  # Standalone-plot TOGGLES, gated by capability. Each opens a standalone before/after pair
  # on the canvas.
  #
  # Show and hide are two buttons on complementary gates rather than one button that changes
  # what it does, because a control whose action depends on state is a control the user has to
  # read twice. Only one is ever rendered.
  #
  # The hide half used to exist only as the pair's own cell X on the canvas — `cf.hideEmbedding`
  # was declared and reachable ONLY from there. So from the form the toggle was one-way: it said
  # "Show" whether or not the pair was already shown, and the way back was an affordance in a
  # different region that nothing pointed at. A toggle that cannot be untoggled where it was
  # toggled is the defect; the cell X stays as the second way, not the only way.
  - id: showEmbeddingBtn
    kind: button
    label: "Show embedding before/after"
    when: "has:embedding && $state.showEmbedding == false"
    onClick: cf.showEmbedding
  - id: hideEmbeddingBtn
    kind: button
    label: "Hide embedding before/after"
    when: "has:embedding && $state.showEmbedding"
    onClick: cf.hideEmbedding
  - id: showSpatialBtn
    kind: button
    label: "Show spatial before/after"
    when: "has:spatial && $state.showSpatial == false"
    onClick: cf.showSpatial
  - id: hideSpatialBtn
    kind: button
    label: "Hide spatial before/after"
    when: "has:spatial && $state.showSpatial"
    onClick: cf.hideSpatial

  # The mask is NAMED, and the name is the user's. What is typed here is the column the run
  # commits — no `keep_` prefix, no slug (`compute/cell-filter.py::mask_column_name`), which
  # is why the two constraints below can be asked of the typed TEXT: there is no resolution
  # step between this field and the committed name for a check to miss. The old slug was
  # lossy (`abc-1`, `abc 1` and `abc_1` were one column), so a text-level uniqueness check
  # under it would have passed all three and still collided.
  #
  # ## The advisory that used to sit under this field is GONE, and so is its argument
  #
  # It said: an unnamed mask commits as `keep_all`, which is legal but almost never meant,
  # "so it is SAID rather than enforced" — `require` being "a machine-checked claim about
  # what the run will REFUSE, and this run refuses nothing". Both halves stopped being true
  # in the same change. There is no `keep_all` to fall back to, the run REFUSES a blank
  # label, and it refuses a name it cannot know is free only because the FORM can. So the
  # advisory did not merely become redundant — it would now be a warning next to a field
  # whose emptiness is a hard error, i.e. the exact "reads correctly, means something else"
  # class the rest of this file spends its comments closing.
  - id: labelInput
    kind: text
    label: Mask column name
    value: "$state.label"
    placeholder: "e.g. keep"
    onChange: cf.setLabel
    require:
      # `required` and `not_in` answer different questions with different remedies — supply
      # a name, versus supply a DIFFERENT name — so they are two constraints with two
      # sentences, and the pre-pass reports at most one of them at a time (presence first).
      required: true
      # THE TAKEN SET IS THE WHOLE AXIS, and there is deliberately no `produced_by: others`
      # narrowing here. QC declares one, and the difference is what the two analyses do on a
      # re-run: QC's four seeded rows ARE the columns a first run emits, and re-running QC
      # over its own metrics is a redo, so it may supersede its OWN output. This analysis
      # never supersedes anything — `manifest.yaml` states that runs coexist,
      # provenance-immutable, never overwriting — so a second run under the same name lands a
      # SECOND column beside the first, and a reader merging the axis by name keeps whichever
      # row came last. That is a real collision no matter who made the other column, so this
      # one blocks on its own previous masks exactly as it blocks on someone else's.
      #
      # It also covers the case the `keep_` prefix was silently handling: the dataset's own
      # imported obs columns are on this axis too, so `pct_mito` is refused here without the
      # constraint needing to know that obs columns and masks are different kinds of thing.
      not_in: "$data.obsSources"
      message:
        required: >-
          The mask needs a column name — it is what this run commits, and the run refuses to
          invent one.
        not_in: >-
          "{value}" is already a column on this dataset's cells axis, either from the data
          itself or from an earlier run. Committing a second one under that name would leave
          two columns with one name and a reader would silently keep whichever came last, so
          pick another name.

  - id: runBtn
    kind: button
    label: Commit keep-mask
    variant: primary
    # Deliberately NOT `when:` — hiding the Run button is the deadlock
    # `DeclarativeRegion` documents ("Run the analysis that produces its input", with the
    # Run button hidden behind the very message telling the user to run it).
    #
    # NO `disabledWhen`: its one clause is now `expressionPicker.require.required`, and the
    # button DERIVES its disabled state from the form's own verdicts. The engine lists the
    # unmet ones underneath, so the button never sits greyed with nothing said.
    onClick: cf.run

# ── cross-field constraints (the relations no single control owns) ──────────────────────
checks:
  # A keep-range whose Min is above its Max keeps NOTHING, and says so nowhere: the compute
  # applies it faithfully, the mask empties, rc=0. It belongs to neither control — it is the
  # relation BETWEEN them — so it cannot be a `require` on either, and it lands on the row's
  # own Max rather than on the form.
  #
  # The two `!= ''` guards are load-bearing, not defensive. `evalWhen`'s relational branch
  # coerces with `Number`, and `Number('') === 0` — so a blank Max would read as 0 and
  # `min > 0` would fire on every ordinary lower bound, which is exactly the class of
  # "reads correctly, means something else" this whole round is closing. An empty bound means
  # UNBOUNDED here, and an unbounded side cannot be above or below anything.
  #
  # `at.part` is what keeps it on the ROW after the builder became a table: a table renders its
  # rows as PARTS of one widget, so there is no per-row widget id left to name, and the only
  # other address is the whole table — which would report "some criterion is inverted" over an
  # unbounded list. `part: max` is the same address that column's own control reads its
  # requirement message from, so a relation and a requirement land in the same place. It stays
  # `max` now that the range control sits in a band beneath the row: the inversion is a relation
  # between the two TYPED bounds, and it belongs on the second of them, not on the band.
  #
  # The range control CANNOT produce this state — a two-ended control has no way to express an
  # inversion and commits its pair ordered — so this relation is now about the TYPED bounds
  # alone. That is a narrowing of what can go wrong, not a reason to drop the check: typing is
  # still the primary way a bound is set, and it is the way the inversion was reachable.
  - id: minAboveMax
    for_each: "$state.criteria as $c, $i"
    fails_when: "$c.min != '' && $c.max != '' && $c.min > $c.max"
    at: { widget: criteriaTable, part: max, index: "$i" }
    message: Min is above Max, so this criterion keeps nothing.

  # A criterion built on a column the CURRENTLY SELECTED dataset does not carry.
  #
  # `cf.setExpression` writes ONE field — the criteria list is deliberately untouched by a
  # switch — so a criterion built on dataset A survives onto B naming a column B may not have.
  # The LAUNCH was already protected: `run_processor.inputs_from` binds one `column:<name>` slot
  # per criterion and treats an unresolvable one as an ERROR, so a bad run cannot start. The gap
  # was the FORM in between, and it was silent in the worst way — `controlByColumn[$row.column]`
  # is undefined for an off-axis column, which is the same gate both bound arms and the keep-set
  # read, so the row drew its column name over three empty slots and plotted nothing (the
  # canvas series carry that gate too). A row that shows no control and no reason is
  # indistinguishable from a broken form.
  #
  # KEEP-AND-MARK, not clear-on-switch. The alternatives were: drop the criteria (simple, and it
  # silently deletes work the moment a user switches to compare and switches back), or keep only
  # the resolvable ones (a filtering op the CLOSED `EFFECT_OPS` vocabulary deliberately does not
  # have, and it deletes silently too). Marking preserves the work, states the cause, and is
  # expressible with the vocabulary already here: a `check` with `for_each` + `at.part` is
  # exactly "one row of this list is invalid, at this control, for this reason", which is the
  # address `minAboveMax` above already lands on and which feeds the field's own message, the
  # form summary and the submit gate from ONE declaration. No new construct.
  #
  # The predicate is the row's OWN render gate, negated. That is the point rather than a
  # coincidence: what the form reports as unusable is exactly the condition under which the row
  # draws no control — the two cannot come to disagree, in the same way `require.number` calls
  # the same `parseBound` its readers do.
  #
  # `$c.column != ''` is load-bearing: `cf.addCriterion` seeds a blank row, and a freshly added
  # row is UNANSWERED, not wrong. It is also what `inputs_from`'s own `when: $c.column` gate
  # says, so the form and the launch agree about which criteria are inputs at all.
  #
  # There is no "and the frame has landed" guard, because there is no window that needs one: a
  # switch does NOT clear the previous frame (`resolveAndApplyViewData` replaces data only when
  # the new one lands, and clears only on an AUTHORITATIVE `empty`), a freshly mounted store has
  # no criteria to accuse, and a `loading` region renders no widgets at all. The one state that
  # does empty the frame — an authoritative empty — genuinely means every criterion is off-axis.
  - id: criterionColumnOffAxis
    for_each: "$state.criteria as $c, $i"
    fails_when: "$c.column != '' && $derived.controlByColumn[$c.column] == absent"
    at: { widget: criteriaTable, part: column, index: "$i" }
    message: >-
      The selected dataset has no column by this name — switching datasets leaves a criterion
      built on the previous one behind. Pick a column this dataset carries, or remove the
      criterion.

actions:
  - id: cf.setExpression
    title: Set dataset
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { expression: "$params.value" }

  - id: cf.addCriterion
    title: Add a criterion
    permission: jobs::use
    mutating: true
    stateful: true
    params: {}
    body:
      - listAppend: { path: criteria, value: { column: "", control: "", min: "", max: "", keep: [] } }
  # ONE generic per-field setter (column / min / max / keep) targeted by the row INDEX.
  #
  # `key`, not `field`: a table column dispatches `{key, index, value}` — the column's own key
  # IS the field it edits — so one action serves every editable column of the table, exactly as
  # the metric editor's does. The parameter was renamed rather than translated at four call
  # sites, because a per-column `args: { field: … }` restating the column key is a second
  # spelling of one fact.
  - id: cf.setCriterionField
    title: Set a criterion field
    permission: jobs::use
    mutating: true
    stateful: true
    params: { index: number, key: string, value: string }
    body:
      - set: { "criteria.{$params.index}.{$params.key}": "$params.value" }
  - id: cf.removeCriterion
    title: Remove a criterion
    permission: jobs::use
    mutating: true
    stateful: true
    params: { index: number }
    body:
      - listRemove: { path: criteria, index: "$params.index" }
  - id: cf.setGroupBy
    title: Set group-by column
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { groupBy: "$params.value" }
  - id: cf.setLabel
    title: Set mask label
    permission: jobs::use
    mutating: true
    stateful: true
    params: { value: string }
    body:
      - set: { label: "$params.value" }
  - id: cf.showEmbedding
    title: Show embedding plot
    permission: jobs::use
    mutating: true
    stateful: true
    params: {}
    body:
      - set: { showEmbedding: true }
  - id: cf.hideEmbedding
    title: Hide embedding plot
    permission: jobs::use
    mutating: true
    stateful: true
    params: {}
    body:
      - set: { showEmbedding: false }
  - id: cf.showSpatial
    title: Show spatial plot
    permission: jobs::use
    mutating: true
    stateful: true
    params: {}
    body:
      - set: { showSpatial: true }
  - id: cf.hideSpatial
    title: Hide spatial plot
    permission: jobs::use
    mutating: true
    stateful: true
    params: {}
    body:
      - set: { showSpatial: false }

  # Run — a DECLARED run_processor → wait_for: commit the immutable mask under its name.
  # SAVE-POINT PROVENANCE: the run carries its `criteria` — the ONE encoding of the
  # filter, the one the compute kernel reads — and once the mask is committed the
  # `call_action` step records those SAME criteria as a durable recipe through the
  # existing `POST /provenance/selections` chokepoint. The input artifact + project come
  # off `run_processor`'s own return bag (Carrier A), so the recorded input and the run's
  # `used` edge cannot disagree. With NO constraining criteria the action records NOTHING
  # (an all-true "selection" must not be recordable).
  - id: cf.run
    title: Commit keep-mask
    permission: jobs::use
    mutating: true
    params: {}
    body:
      # `inputs` is passed EXPLICITLY, from view state — what is committed is what was
      # on screen (INV-4). It used to be absent, and `hostCtx.runProcessor` auto-resolved
      # the artifact-ref input from the catalog: invisible, and a hard throw when the
      # candidate count was not exactly 1.
      #
      # `inputs_from` is the part `inputs` alone cannot express. The compute resolves each
      # obs column on `column:<name>` — the slot carries the name because a
      # `metadata-column` store cannot (its values live under the constant member `values`,
      # and the display name is a catalog fact that is never staged into a sandbox). WHICH
      # columns those are is the user's criteria list, so the slot NAMES are data and no
      # literal `inputs:` key can spell them. One binding per criterion, gated on the
      # criterion having a column yet (a freshly-added row has none and is not an input);
      # anything that passes the gate and cannot be resolved is an ERROR, because a
      # criterion whose column never reaches the run is exactly the silent keep-everything
      # this block exists to prevent.
      - run_processor:
          id: cell.filter
          inputs:
            expression: "$state.expression"
          inputs_from:
            - for_each: "$state.criteria as $c"
              when: "$c.column"
              slot: "column:{$c.column}"
              artifact: "$data.obsSources[$c.column]"
          params: { criteria: "$state.criteria", label: "$state.label" }
          into: filterJob
      - wait_for: { job: "$filterJob", until: completed }
      # The save-point provenance capture. It runs BEFORE the success toast on purpose: a
      # REJECTION here aborts the body, so "Keep-mask committed" is never shown for a run
      # whose recipe was not recorded (the action toasts the real failure itself, and
      # `WidgetHost.dispatch` surfaces any rejection it did not). `criteria` IS the
      # record: the action derives "nothing constrains anything" (a legitimate no-op,
      # recorded as nothing) from the same list the kernel filters on.
      #
      # The run used to ALSO carry a `predicate` — the same filter lifted into a DSL —
      # and the action recorded THAT. Two encodings of one filter can disagree, and
      # repeatedly did (a recorded predicate constraining what the committed mask did
      # not, at rc=0). The lift is deleted.
      - call_action:
          id: provenance.record-selection
          params:
            project_id: "$filterJob.projectId"
            input_artifact_id: "$filterJob.inputs[0].artifactId"
            criteria: "$state.criteria"
            label: "$state.label"
      - toast: { success: "Keep-mask committed" }

# Declared CANVAS before/after, driven onto the SINGLE @ziee/viz canvas. Each active
# criterion emits a `before` cell over `obs` + an adjacent `after` cell over `obs.kept`
# (the derived keep-mask survivors). The plot KIND follows the column type (continuous →
# violin, categorical → bar) via two `when`-gated series per role (a `$ref` `type` can't
# parse — the chart kind must be a concrete registered type). The cells are
# `controlled: true`; their close routes to `cf.removeCriterion` (the reopen guard).
#
# The series bind to the criteria the user actually built, not to a fixed metric list, so
# this block does not carry the static-plot problem QC's canvas had.
canvas:
  # The DECLARED keep-mask for the `.kept` dataset variants. The app used to read
  # `$derived.keptMask` by that literal name from core, so every processor had to spell
  # its mask exactly that or its `.kept` panes silently showed every row unmasked.
  mask: "$derived.keptMask"
  datasets:
    - { id: obs }
    - { id: obs.kept }
  # No static `grid`. A static list cannot enumerate an unbounded, user-built set of criteria,
  # so each series declares its OWN `region` instead and the app derives the grid from the plots
  # that survived (`placeSeries`). Every "before" declares row 0 and every "after" row 1, with the
  # column filled in from the plot's position within its own row — so a criterion's two sides sit
  # in ONE column, before directly above after, for any number of criteria.
  #
  # Leaving the grid to viz's auto-derivation put every pane in ONE ROW at 1/N width, and made the
  # reading order the order the TEMPLATES expanded in: because the before/after templates are
  # grouped by family below, one continuous criterion and one categorical one interleaved into
  # per-criterion pairs and the sides stopped lining up at all. Which panes sit next to each other
  # is the whole affordance of a before/after canvas; it must not depend on which columns the user
  # happened to pick.
  grid: []
  #
  # ── TITLES: derived, never hand-written per criterion ────────────────────────────────
  # Every pane says WHICH column it shows and WHICH SIDE of the mask it is. The criteria list is
  # user-built and unbounded, so the string is interpolated from the criterion's own `$c.column`
  # plus the side this series is; a per-criterion literal could not exist. Without it a canvas of
  # several criteria is a row of identical unlabelled violins, and the before/after pairing — the
  # entire point of the surface — is only inferable from position.
  #
  # ── switchTo: the kind switcher offers ALTERNATE READINGS OF THIS DISTRIBUTION, nothing else ──
  # Absent, the chrome auto-infers from binding-schema compatibility against the whole obs frame,
  # which is far too permissive to be useful here: `volcano`'s channel binds a table by NAME (so it
  # is "satisfiable" by any dataset, and this frame has no differential-statistics table — the pane
  # would render empty), and `scatter`/`image` are offered because the frame advertises a `metric`
  # layout that is just its first two numeric columns interleaved. Neither is a way of looking at
  # ONE criterion's distribution, which is what this cell is.
  #
  # So each family declares its own allow-list, chosen as "the same data, read differently":
  #   • continuous → violin (density) / box (quartile summary) / histogram (binned frequency).
  #     All three plot exactly the column being thresholded; the histogram in particular shows the
  #     mode and tail a min/max bound is about to cut. They also share the channel id `value`, so
  #     the binding survives the switch, and all three are satisfiable on ANY frame that can serve
  #     the violin (a numeric column is catalogued as both `value` and `continuous`) — a declared
  #     alternative that is not satisfiable THROWS at parse and blanks the whole canvas.
  #     `bar`/`dotplot`/`heatmap` are excluded on both counts: their grouping is a REQUIRED category
  #     AXIS (so they would bind whichever categorical column happens to be first, which has nothing
  #     to do with this criterion), and declaring them would throw outright on a metrics-only frame.
  #   • categorical → `bar` alone. A count per category has one honest rendering with these
  #     built-ins; the matrix kinds need a value LIST this cell does not have. A one-entry list is
  #     the point — it says "there is no other reading", rather than offering six wrong ones.
  series:
    # Continuous criterion → before/after VIOLIN (value = the criterion's column; split by groupBy).
    - id: "s-before-violin-$i"
      for_each: "$state.criteria as $c, $i"
      when: "$derived.controlByColumn[$c.column] == range"
      type: violin
      coordId: "before-violin-$i"
      region: { row: 0 }
      datasetId: obs
      controlled: true
      title: "$c.column (before)"
      switchTo: [violin, box, histogram]
      encode: { valueKey: "$c.column", groupKey: "$state.groupBy" }
      close: { action: cf.removeCriterion, args: { index: "$i" } }
    - id: "s-after-violin-$i"
      for_each: "$state.criteria as $c, $i"
      when: "$derived.controlByColumn[$c.column] == range"
      type: violin
      coordId: "after-violin-$i"
      region: { row: 1 }
      datasetId: obs.kept
      controlled: true
      title: "$c.column (after)"
      switchTo: [violin, box, histogram]
      encode: { valueKey: "$c.column", groupKey: "$state.groupBy" }
      close: { action: cf.removeCriterion, args: { index: "$i" } }
    # Categorical criterion → before/after BAR (category breakdown = the criterion's column).
    - id: "s-before-bar-$i"
      for_each: "$state.criteria as $c, $i"
      when: "$derived.controlByColumn[$c.column] == multiselect"
      type: bar
      coordId: "before-bar-$i"
      region: { row: 0 }
      datasetId: obs
      controlled: true
      title: "$c.column (before)"
      switchTo: [bar]
      encode: { groupKey: "$c.column" }
      close: { action: cf.removeCriterion, args: { index: "$i" } }
    - id: "s-after-bar-$i"
      for_each: "$state.criteria as $c, $i"
      when: "$derived.controlByColumn[$c.column] == multiselect"
      type: bar
      coordId: "after-bar-$i"
      region: { row: 1 }
      datasetId: obs.kept
      controlled: true
      title: "$c.column (after)"
      switchTo: [bar]
      encode: { groupKey: "$c.column" }
      close: { action: cf.removeCriterion, args: { index: "$i" } }
    # Standalone embedding scatter before/after, toggled from the interface.
    # These four are SINGULAR (no `for_each`), so their titles are literal rather than
    # interpolated — but they carry one for the same reason the criteria cells do: a before/after
    # pair of the same view is two visually identical panes, and which is which must be READ, not
    # inferred from left-to-right order.
    - id: s-emb-before
      when: "$state.showEmbedding"
      type: scatter
      coordId: emb-before
      region: { row: 0 }
      datasetId: obs
      controlled: true
      title: Embedding (before)
      encode: { colorBy: { mode: categorical, key: "$state.groupBy" } }
      close: { action: cf.hideEmbedding }
    - id: s-emb-after
      when: "$state.showEmbedding"
      type: scatter
      coordId: emb-after
      region: { row: 1 }
      datasetId: obs.kept
      controlled: true
      title: Embedding (after)
      encode: { colorBy: { mode: categorical, key: "$state.groupBy" } }
      close: { action: cf.hideEmbedding }
    # The SPATIAL before/after pair, mirroring the embedding pair above.
    #
    # `showSpatialBtn` + `cf.showSpatial` shipped without them, so the button set a flag
    # NOTHING read: clicking it painted nothing, and `cf.hideSpatial` — the action that
    # would have turned it back off — had no affordance at all, because the only way to
    # reach a `hide*` here is a series' own `close:`. A show with no hide is a one-way
    # door; a show that shows nothing is worse.
    #
    # This declares the missing half rather than deleting the button, because the canvas
    # ALREADY serves the underlay: `CanvasObsSource` carries an optional `ImageUnderlay`
    # and `catalog().hasImage`/`imageUnderlay()` are implemented and tested
    # (`canvasBinding.test.ts` "spatial image underlay"). The capability was built and
    # never bound. A dataset with no image resolves `hasImage: false` and the pane stays
    # empty — which is why the button is `when: has:spatial` gated.
    - id: s-spatial-before
      when: "$state.showSpatial"
      type: image
      coordId: spatial-before
      region: { row: 0 }
      datasetId: obs
      controlled: true
      title: Spatial (before)
      encode: { colorBy: { mode: categorical, key: "$state.groupBy" } }
      close: { action: cf.hideSpatial }
    - id: s-spatial-after
      when: "$state.showSpatial"
      type: image
      coordId: spatial-after
      region: { row: 1 }
      datasetId: obs.kept
      controlled: true
      title: Spatial (after)
      encode: { colorBy: { mode: categorical, key: "$state.groupBy" } }
      close: { action: cf.hideSpatial }
