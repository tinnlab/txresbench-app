# Cell-filter processor — a PURE DATA package. Same treatment as the QC manifest.
#
# NON-DESTRUCTIVE annotator: the user builds CRITERIA on any obs column; the combined
# keep-mask is client-side `$derived` and tuned live; Run COMMITS ONE immutable per-cell
# boolean column NAMED BY THE USER (the label is the column name, verbatim — there is no
# `keep_` prefix and no slug). It never writes a filtered matrix, an embedding, or a
# subset. JOINT DROP: the mask is a single per-cell boolean over the SHARED obs, so a
# criterion on ANY modality's column drops the whole cell across all modalities.
#
# Dual-parsed: the backend extensions loader also parses this file into an
# `ExtensionManifest` at boot; `AnalysisContributionData` carries every FE key verbatim
# through `rest`, and the backend reads only `id` + `run` + the `methods` narration
# below. `cell.filter` is an ANALYSIS dispatched via `api.compute.run` → `code_ref`
# (= this analysis' `run.entry`), NOT a backend converter/view.
id: cell-filter
name: Cell filter
publisher: cyto
# 0.9.0 — MASK COLUMN NAMING. The committed column is the label VERBATIM (`keep_<label>`
# and the `keep_all` blank fallback are gone), the run REFUSES a blank label, and the view
# refuses a name already on the cells axis. Kernel + view move together, and seed
# reconciliation is version-keyed (`extensions/embedded.rs::reconcile`), so without this
# bump an already-provisioned deployment would keep slugging while the frontend ships the
# form that names the un-slugged column (DEC-3).
# 0.10.0 — `resolve_gate` no longer falls back from a cell ID to a ROW POSITION when the
# id is absent (a gate naming barcode "42" used to keep the 43rd row instead), and
# `_gate_to_ids` no longer reads a digits-only barcode string as an index. A gate that
# identifies no cell is now refused; `filter-report.json` gains `gate_unmatched`
# (report_schema 3). Behaviour change in the kernel ⇒ a bump, so a provisioned deployment
# re-extracts rather than keeping the old one.
version: 0.11.2
apiVersion: "1.0"
contributes:
  analyses:
    - id: cell.filter
      category: qc
      title: Cell filter
      description: >-
        Build criteria on any obs column (QC metrics + metadata), tune the keep-mask live
        via before/after plots, then commit ONE immutable per-cell keep-mask column
        named by the user. Non-destructive — the matrix is never filtered or copied.
        Cross-modal JOINT DROP: a criterion on any modality's column drops the whole cell
        across all modalities.
      whenHint: >-
        the user wants to build a per-cell keep-mask from QC-metric / metadata criteria
        (non-destructive)
      examples:
        - filter out low quality cells
        - keep cells with < 10% mito and > 500 genes
        - keep only the T-cell cluster
      safety: read-run

      # ── APPLICABILITY ─────────────────────────────────────────────────────────
      #
      # Replaces `accepts` (+ its `required: true` flag, redundant — everything in this
      # key is required by definition, DEC-5), `when`, and `params.fields`, which was a
      # form schema wrapping a copy of the same selector plus a `title`/`doc`. The only
      # non-redundant thing `params.fields` carried was the slot NAME, which survives as
      # `slot:` — the key a caller sends (`inputs: { expression: <id> }`) and the key
      # the compute resolves out of `/inputs/inputs.json`.
      #
      # SINGULAR, unlike QC's `matrices`. The mask is ONE per-cell boolean over the
      # SHARED cells axis, so the unit of selection is the DATASET, not the modality —
      # that is what JOINT DROP means. Per-modality inputs here would imply per-modality
      # masks, which is the opposite of the design.
      appliesTo:
        - slot: expression
          subtypes_of: single-cell/expression

          # ITEM-29f / DEC-15 — DECLARED, because it is the behaviour this slot has always had.
          # Two paths bind a sole candidate for this slot with NO UI at all: `resolveInputs` at
          # launch (an agent/MCP call that supplied nothing) and `autoPickSoleArtifacts` from a
          # mount effect. Neither can show what it bound, so under R2/INV-3 neither may bind
          # unless the analysis says so. Absence means OFF.
          auto_bind_sole_candidate: true
      # The optional `- { type_id: metadata-column, required: false }` accepts-entry
      # moved HERE. It was never an applicability condition — the shipped comment said
      # so outright: "Optional ⇒ never gates availability / adds no picker slot; it
      # makes cell.filter a real consumer of `metadata-column` so an annotator (QC)
      # chains to it in the graph." That is a GRAPH EDGE, not a precondition, and hiding
      # it inside `accepts` with `required: false` made one key mean two things (DEC-5).
      #
      # It earns a key of its own because `chaining.ts` uses it to answer "which
      # analysis yields this view's input?" — i.e. to offer "run Compute QC metrics
      # first". It is never an availability input.
      consumes: [metadata-column]

      # ── UI ────────────────────────────────────────────────────────────────────
      #
      # The manifest names the FILE; it says nothing about its contents. Package-relative
      # and MUST exist — a missing/unparseable path is a LOAD ERROR. This replaces both
      # the `ui/*.yaml` glob and the view spec's `analysis:` back-pointer.
      ui:
        - ui/cell-filter.yaml

      # ── OUTPUT ────────────────────────────────────────────────────────────────
      #
      # `produces_annotations: [{ name: "keep_<label>", type: categorical, axis: cells }]`
      # is GONE, for the same reason as QC's. The committed mask artifact stamps its own
      # kind (a two-value categorical) in `attributes.cyto`, and the conformance gate
      # VERIFIES that stamp against the declaration. This key was an unverified forecast
      # of the same fact, written before the column existed — and its `name` was a
      # template (`keep_<label>`) no consumer could match literally anyway (INV-5).
      produces: [metadata-column, report/qc]

      # `defaults: { expression: "", criteria: [], label: "" }` is GONE. Empty strings
      # and empty lists are not defaults, they are the ABSENCE of a value; and the
      # compute already handles absence at the one boundary where it can occur
      # (`params.json`).

      # ── EXECUTION ─────────────────────────────────────────────────────────────
      #
      # `inputs: { expression: expression.h5ad }` is GONE. It existed because
      # `cell-filter.py` finds its input by GLOB (`expression*.h5ad`, `*.h5ad`) — a
      # filename-sniffing fallback that only makes sense when reaching back to an
      # uploaded AnnData. The backend mounts ARTIFACTS; the runner names each mount from
      # the artifact it is mounting (ITEM-23), the compute resolves its slot from
      # `/inputs/inputs.json` like every other processor, and the glob goes with it.
      # The env image this contribution runs inside (#191 / E3). DECLARED, not inferred,
      # so the #80 dependency gate resolves its `run.dependencies` against THIS env's pin
      # set only. An env-LESS declaration is resolved against EVERY recipe on disk
      # (`server/build_helper/processor_manifest.rs`) — the fail-closed reading, and
      # exactly right while one recipe exists; with a second, deliberately narrower env
      # (`single-cell-r`) it would demand these python pins be installed there too. The
      # gate's own doc-comment prescribes this fix in writing: "the right relaxation is
      # for a contribution to DECLARE the env it targets, not for this gate to guess".
      env: single-cell
      run:
        kind: sandbox
        runtime: python
        entry: compute/cell-filter.py
        # The libraries THIS entry's code imports, with the version range it is
        # supported against (#80). A minor-pinned range where the library's DEFAULTS decide a published
        # number; a wider one where it is a stable numerical floor.
        dependencies:
          - { library: numpy, version: ">=2.0,<3" }
          - { library: pandas, version: ">=2.2,<3" }

      # `interactive`, not `normal` — a human IS waiting on this one: the mask is tuned
      # live and Run commits what they are already looking at. A real property of the
      # analysis, and it is wired (→ the job's `priority_class`).
      #
      # `resources: { cpu: 2, mem: 8Gi }` is GONE — nothing read it (`jobsCapability`
      # rebuilds the spec as `{ class }`), and real limits come from the singleton
      # sandbox settings row.
      schedule:
        class: interactive
      arch: [x86_64, aarch64]

      methodsText: >-
        Recorded a per-cell keep-mask column, named by the run's label, from the selected
        criteria — the matrix was not modified.

      # KEPT. Unlike almost everything else evicted from these manifests, this one is
      # live and load-bearing: `server/.../provenance/export/methods.rs` reads
      # `contributes.analyses[<id>].methods` to narrate the exported `methods.md`.
      # Without it a run exports "Step 'compute' was performed". The package declares the
      # nouns + which ROLE each param plays; the narrator owns only the rendering, which
      # is what carries the "never silently drop a term" guarantee — a param with no
      # declared role is DISCLOSED BY NAME, never omitted.
      #
      # The roles below mirror what `compute/cell-filter.py::main` actually applies:
      #   keep = thresholds AND criteria AND <allow-list slot> AND gate
      #   then, if `max_cells` is set, a SEEDED RANDOM subsample.
      methods:
        subject: { singular: cell, plural: cells }
        action: filtered
        # It says LABELLED, not "named `X`", and that is the migration answer for every run
        # committed before 0.9.0. `methods.rs` renders this template against the run's
        # recorded `label` param, reading the CURRENT manifest for every run regardless of
        # the package version that produced it — so a template spelling the column name would
        # narrate a pre-0.9.0 run's column as `strict` when the artifact is called
        # `keep_strict`. methods.md is the out-of-app trust deliverable; naming a column that
        # does not exist is worse than not naming one. "Labelled `strict`" is TRUE of both
        # eras, and from 0.9.0 the label IS the column name, so nothing is lost going forward.
        commits: "one per-cell keep-mask column, labelled `{label}`"
        commits_unlabeled: a per-cell keep-mask column
        note: The matrix itself was not modified (the mask is non-destructive).
        params:
          thresholds: threshold_list
          criteria: predicate_list
          predicate: opaque_predicate
          gate: allow_list
          cells: allow_list
          gate_ids: allow_list
          max_cells: subsample_cap
          seed: seed
          label: output_label
        # `cell-filter.py::main`'s `for name in (...)` barcode-allow-list slot probe.
        allow_list_slots: [cells, cell-set, cell_set, cellset]

      # `inStandardRecipe: true` / `recipeOrder: 4` are GONE — zero consumers in either
      # language; see the QC manifest for the measurement.
