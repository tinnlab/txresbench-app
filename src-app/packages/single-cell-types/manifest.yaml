        A generic named single-cell modality (CRISPR/HTO/CUSTOM/…), a matrix peer of expression — never dropped or folded into RNA.
      is_abstract: false
      # Axis IDENTITY only — `name` + `key_label`, nothing else (owner 2026-07-28:
