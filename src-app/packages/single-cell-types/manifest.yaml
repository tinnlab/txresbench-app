# single-cell types — the DATA package that OWNS the whole single-cell domain
# datatype lattice (processor-separability Phase 5, Slice 2 / ITEM-3..7, DEC-3).
#
# Every datatype here was formerly CODE-SEEDED in `server/src/modules/datatype/
# builtin.rs`; it now travels as pure DATA so the app builtin knows nothing
# domain-specific (INV-3) and a domain package can live in a SEPARATE repo. The
# merged registry (the 6 Rust roots ∪ these contributions) reproduces the
# `f56299d` lattice / viewers / validators field-for-field, so every consumer
# keeps resolving these types unchanged.
#
# This is a datatypes-ONLY, converter-less manifest (the loader's `validate()`
# only iterates converters, so a run-entry-free manifest is tolerated, DEC-3). It
# MUST NOT re-declare `annotation-table` (already contributed by `anndata-import`).
#
# Parsed at boot by `server/src/modules/extensions/loader.rs`; the datatypes are
# merged into the registry by `datatype/mod.rs::init` via
# `DatatypeRegistry::build_from_embedded()`.
id: single-cell-types
name: Single-cell Datatypes
publisher: cyto
# 0.8.0 — AN OPAQUE CONTAINER DECLARES NO INTERNAL STRUCTURE (INV-7), finishing 0.7.0(b).
#
# 0.7.0 re-parented `single-cell/anndata` + `single-cell/matrix-mtx` to `data/opaque` but
# left `anndata` still describing its own CONTENTS — the three claims it had inherited
# while it `extends: matrix`, none of which was re-examined when the parent changed:
#
#   * `capabilities: [sliceable, has-obs, has-var]` — REMOVED. Three assertions about
#     bytes nobody has parsed. An `.h5ad` becomes sliceable only after the import writes a
#     Zarr store, and it is that store's artifacts which advertise these.
#   * `storage.layout: { kind: chunked_sparse, orientation: csc }` — now `opaque_as_is`
#     (and `format: zarr` → `h5ad`). Whether the container is CSC-sparse inside is the
#     definition of an internal claim; `matrix-mtx` and `cell-set`, the other
#     `data/opaque` children, already declared `opaque_as_is`. `storage.file_layout` is
#     UNCHANGED: file cardinality is an upload-BOUNDARY fact, not internal structure.
#   * `schema: { cells, genes }` — REMOVED. Its own comment said it existed to preserve the
#     `matrix` shape validator. Besides being a structure claim, it was unreachable:
#     `validate_shape` runs only from `validate_artifact_typing` on the run-OUTPUT ingest
#     path, and nothing emits an artifact of this datatype.
#
# None of the three had a live consumer for THIS type: no shipped `appliesTo` uses a
# `capabilities:` selector (the importers match `type_id` exactly), and `validate_shape` /
# `validate_artifact_typing` run only on run-OUTPUT ingest, which never sees this datatype.
# `storage.file_layout` DOES gate a live path and is therefore left alone — see the entry
# for the inconsistency it carries and why that is a separate decision.
#
# What an opaque container may STILL declare — and why — is now written down in
# `docs/design/processor-manifest-ui-separation.md` (INV-7), which previously said only
# "declares no internal structure" and did not anticipate the upload boundary.
#
# Version-keyed reconciliation applies as below: WITHOUT this bump an already-provisioned
# deployment keeps serving a lattice in which an upload container advertises `sliceable`.
#
# 0.7.0 — AXES CARRY IDENTITY ONLY, and the two UPLOAD FORMATS are opaque (INV-5/INV-7).
#
#   (a) every `annotations:` block is DELETED. It declared, per axis, the columns that
#       axis "admits" — a forecast of data that does not exist yet, and the only type
#       claim in the system nothing verified. Measured against a real CELLxGENE dataset
#       (3460 × 35477) in a running deployment: of the NINE annotations
#       `single-cell/anndata` declared, EIGHT do not exist, while the dataset carries 65
#       obs columns the declaration never mentions. An axis now carries `name` +
#       `key_label` — its IDENTITY — and nothing else; what columns are actually present
#       is read from the `metadata-column` artifacts on the axis, each of which already
#       stamps its own kind and is checked by the conformance gate.
#
#   (b) `single-cell/anndata` + `single-cell/matrix-mtx` now `extends: data/opaque`. They
#       are UPLOAD/EXPORT containers, not analysable matrices (INV-7). See each entry for
#       the per-type argument. (0.8.0 above finishes the job: re-parenting alone left
#       `anndata` still advertising its contents.)
#
#       CORRECTION. This paragraph originally continued "and declare NO `axes` at all",
#       which was true when 0.7.0 shipped and STOPPED being true at `d842da5f`, where the
#       axes were restored — an amendment that updated neither this text nor the version.
#       Both entries DO declare `axes`, deliberately: axis IDENTITY is not internal
#       structure, it is the container's own dimension vocabulary, and it is needed at the
#       UPLOAD boundary before anything is parsed (`dataset/routes.rs` validates a
#       supporting file's axis against `reg.axes_for(dataset.datatype)`, and for an
#       uploaded h5ad that datatype IS the container; without it, attaching a per-cell
#       annotation CSV 422'd — 7 integration tests).
#
#       The stale sentence was not cosmetic: a reviewer reading it concluded the entries
#       below were a half-implemented change and only found the truth 300 lines further
#       down. A changelog that no longer matches the file misleads careful readers about
#       WORKING code, which is why the correction is recorded here rather than deleted.
#
# Seed reconciliation is version-keyed (`extensions/embedded.rs::reconcile`), so WITHOUT
# this bump an already-provisioned deployment keeps its stale extracted manifest — one
# that still puts an upload container in the matrix subtree and still declares columns
# that are not there — and the lattice it serves disagrees with the binary's.
#
# 0.6.0 — REMOVES the lossless multi-file store datatype (artifact-model ITEM-38).
# ITEM-27 replaced the out-of-core CSR→CSC transpose buffer with a streaming counting
# sort that writes Zarr directly, which deleted the store as an OUTPUT — but the TYPE
# survived here, and a registered datatype that NOTHING can produce is still offered by
# a converter picker and still resolves to nothing. The 0.4.0 note that used to sit
# below (the retired entry declaring `native-array-source` so the serve core could route
# a native in-process array lane) goes with it: both the capability's only carrier and
# the serve core that read it (ITEM-12/ITEM-13) are deleted, so the note documented two
# things that no longer exist. Seed reconciliation is version-keyed
# (`extensions/embedded.rs::reconcile`), so WITHOUT this bump an already-provisioned
# deployment keeps its stale extracted manifest — one that still declares the removed
# type — and the lattice it serves disagrees with the binary's.
#
# 0.5.0 — drops the RETIRED `storage.selector_map` / `storage.tiers` keys from every
# datatype (artifact-model ITEM-14; §0.3 lists *the tier system*, *`selector_map`* and
# *`tiers`* under **Deleted**). They answered "which transport decodes this selector —
# a server-side layout slice or a client-side range read?", a question that no longer
# has two answers: ITEM-12 deleted the Selection→Arrow serve core, so
# `GET /artifacts/{id}/data[/{*member}]` serves opaque byte ranges and the client
# always decodes. The core structs that accepted-and-discarded them are gone too, and
# both are `deny_unknown_fields`, so an extracted manifest still spelling either key
# now FAILS to parse and its whole datatype contribution is skipped. Seed
# reconciliation is version-keyed — this bump is what forces an already-provisioned
# deployment to re-extract the cleaned manifest.
#
# 0.3.0 — adds the `cell-set` datatype carrying `selection-set-target` (S5): the
# provenance interaction chokepoint now RESOLVES a captured selection's datatype
# from this declaration instead of stamping a `"cell-set"` literal from the server.
# Seed reconciliation is version-keyed, so an already-provisioned deployment needs
# this bump to re-extract — without it the resolver finds no carrier and degrades
# every selection to the neutral `data/opaque` root.
#
# 0.2.0 — `single-cell/matrix-mtx` re-accepts the Cell Ranger 2.x `genes.tsv`
# spelling of its third manifest member. A BEHAVIOUR change (which uploads
# auto-group), and the seed reconciliation is version-keyed, so an
# already-provisioned deployment needs this bump to re-extract the new members list.
# 0.9.0 — every MULTI-axis datatype now declares `entity_axis` (the axis whose entries
# a value of the type has ONE PER). The consumer used to take `axes[0]`, a position in
# what `AxisSpec` calls an identity list with no declared order; it now reads the name
# and REFUSES when a multi-axis type declares none. Without this bump an
# already-provisioned deployment keeps the entity-axis-less seed and its workbench
# reads fall back to the catalog's own axis order with a warning.
#
version: 0.10.0
apiVersion: "1.0"
contributes:
  datatypes:
    # ── matrix family — expression + its raw/normalized/modality subtypes ──
    - id: single-cell/expression
      extends: matrix
      title: Expression matrix
      description: A single-cell expression matrix (cells × genes), CSC-sparse.
      is_abstract: false
      # Axis IDENTITY only — `name` + `key_label`, nothing else (owner 2026-07-28:
      # "remove the annotations from the axes, keep name and key_label"). WHICH
      # columns exist on an axis is read from the artifacts that landed, never
      # forecast here (INV-5).
      #
      # These sit on the ANALYSABLE types. They used to be declared only on
      # `single-cell/anndata` + `single-cell/matrix-mtx` — the UPLOAD containers —
      # which is backwards: the formats nothing analyses were the only things
      # declaring the axes analysis runs over. Making those two opaque removed the
      # last axis declaration in the registry, and `axes_for` is a FLAT lookup (it
      # does not walk `extends`), so every subtype needs its own.
      axes:
        - { name: cells, key_label: barcode }
        - { name: genes, key_label: gene_id }
      # WHICH declared axis is the ENTITY axis — the axis whose entries a value of
      # this type has exactly ONE PER (a layout point, a dense column entry). The
      # `axes` list above is UNORDERED IDENTITY, so this may not be read off a
      # position; the consumer refuses rather than guessing when it is absent on a
      # multi-axis type. Build-gated: it must name one of the axes above.
      entity_axis: cells
      schema:
        type: object
        properties:
          cells: { type: integer, minimum: 0 }
          genes: { type: integer, minimum: 0 }
      storage:
        layout: { kind: chunked_sparse, orientation: csc }
        format: zarr
        file_layout: single
      capabilities: [sliceable, has-obs, has-var]
      ingest:
        extensions: [h5, h5ad, mtx]

