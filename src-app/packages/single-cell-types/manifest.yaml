    # ── multi-modal CONTAINER — links per-modality matrices (extends data) ──
    - id: single-cell/multimodal
      extends: data
      title: Multi-modal container
      description: >-
        A MuData-shaped multi-modal container linking per-modality matrices (rna/protein/atac/…) + a shared cells axis — not a flattened matrix.
      is_abstract: false
      # Axis IDENTITY only — `name` + `key_label`, nothing else (owner 2026-07-28:
      # "remove the annotations from the axes, keep name and key_label"). WHICH
      # columns exist on an axis is read from the artifacts that landed, never
      # forecast here (INV-5).
      #
      # These sit on the ANALYSABLE types. They used to be declared only on
      # `single-cell/anndata` + `single-cell/matrix-mtx` — the UPLOAD containers —
      # which is backwards: the formats nothing analyses were the only things
      # declaring the axes analysis runs over. Making those two opaque removed the
      # last axis declaration in the registry, and `axes_for` is a FLAT lookup (it
      # does not walk `extends`), so every subtype needs its own.
      axes:
        - { name: cells, key_label: barcode }
        - { name: features, key_label: feature_id }
      # WHICH declared axis is the ENTITY axis — the axis whose entries a value of
      # this type has exactly ONE PER (a layout point, a dense column entry). The
      # `axes` list above is UNORDERED IDENTITY, so this may not be read off a
      # position; the consumer refuses rather than guessing when it is absent on a
      # multi-axis type. Build-gated: it must name one of the axes above.
      entity_axis: cells
      schema:
        type: object
        properties:
          modalities: { type: array }
          shared_cells: { type: integer, minimum: 0 }
      storage:
        layout: { kind: opaque_as_is }
        format: json
        file_layout: single
      capabilities: [multimodal, modality]
      ingest:
        extensions: [h5mu]

    # ── upload/export CONTAINERS — opaque; axis IDENTITY but NO internal structure (INV-7) ──
    - id: single-cell/anndata
      # `extends: matrix` → `data/opaque`. Nothing ANALYSES an AnnData container. Its
      # only consumers are the two IMPORTERS (`anndata-import`, `import-h5ad`), which
      # take it by exact `type_id`, never by `subtypes_of` — verified across the tree:
      # every occurrence is an exact-id match (converter `accepts`, the sniffer, the
      # upload wizard's convertible-type catalog, tests). It exists to be uploaded,
      # converted once, and later EXPORTED for download. Analysis runs on what the
      # import produces — a `sparse_csc` Zarr store plus per-axis index and
      # metadata-column artifacts.
      #
      # `extends: matrix` put it in the matrix subtree, so anything accepting
      # `subtypes_of: matrix` would offer to run on a raw upload container — the "reach
      # back to the original file" path this feature removes. It is now a sibling of
      # `cell-set`, which already extends `data/opaque` for the same reason: opaque
      # bytes with a known meaning and no declared internal shape.
      extends: data/opaque
      # Axis IDENTITY only — `name` + `key_label`. An opaque container still DECLARES
      # what its dimensions ARE; it just does not claim what columns are on them.
      #
      # These came back after being removed as "an opaque container has no axes anyone
      # can read without parsing it". That reasoning is principled and empirically wrong:
      # `dataset/routes.rs` validates a SUPPORTING FILE's axis against
      # `reg.axes_for(dataset.datatype)`, and the dataset's datatype IS this upload
      # container. With no axes every axis is unknown, so attaching a per-cell annotation
      # CSV to an uploaded h5ad 422'd — 7 integration tests, and a real user capability
      # that exists precisely at upload time, before anything is parsed.
      #
      # Analysability is gated by `extends: data/opaque`, NOT by withholding axes. The two
      # are independent, and conflating them cost a feature.
      axes:
        - { name: cells, key_label: barcode }
        - { name: genes, key_label: gene_id }
      # WHICH declared axis is the ENTITY axis — the axis whose entries a value of
      # this type has exactly ONE PER (a layout point, a dense column entry). The
      # `axes` list above is UNORDERED IDENTITY, so this may not be read off a
      # position; the consumer refuses rather than guessing when it is absent on a
      # multi-axis type. Build-gated: it must name one of the axes above.
      entity_axis: cells
      title: AnnData
      # An UPLOADED/EXPORTED container, described by what a caller must hand over and get
      # back — not by what is inside it. The old wording ("A multi-file AnnData-Zarr
      # container (chunk-dir), CSC-sparse") described the internals AND contradicted this
      # entry's own `input_requirements: { requires: single }` in the same breath.
      description: >-
        An AnnData container uploaded or exported as ONE file (`.h5ad`, or a zipped AnnData-Zarr). Opaque: it is imported once into analysable artifacts, never analysed in place.
      is_abstract: false
      # NO `schema`. The removed block declared `{cells, genes}` — the container's INTERNAL
      # dimensions — and its comment said it existed to preserve `validate_matrix_shape`,
      # the validator this type inherited back when it `extends: matrix`. It is both a
      # structure claim INV-7 forbids and unreachable: `validate_shape` is only ever called
      # from `datatype::validate_artifact_typing`, which runs on the run-OUTPUT ingest path
      # (`workstore/ingest.rs`), and no processor emits an output of this datatype (an
      # uploaded h5ad becomes a dataset + file rows, never a workstore artifact). It could
      # not have rejected anything.
      storage:
        # `opaque_as_is`, not `chunked_sparse/csc`. Whether the bytes are CSC-sparse inside
        # is exactly the kind of internal claim an opaque container may not make — and the
        # sibling containers already say so: `single-cell/matrix-mtx` and `cell-set` (the
        # other `data/opaque` children) both declare `opaque_as_is`. `layout` is a REQUIRED
        # field, so the fix is the honest value, not omission. `format: zarr` → `h5ad`: what
        # a caller uploads/downloads is an `.h5ad` (see `ingest.extensions[0]`, which
        # `dataset/routes.rs` uses to name a promoted blob).
        layout: { kind: opaque_as_is }
        format: h5ad
        # `file_layout` STAYS `manifest`, and it is the one key here that is NOT an INV-7
        # question: how many files ARRIVE as one dataset is a fact about the upload
        # BOUNDARY, not about the contents (see the INV-7 table in
        # `docs/design/processor-manifest-ui-separation.md`). It also GATES A LIVE PATH —
        # `registry.file_layout_for` feeds `dataset::repository::enforce_cardinality`.
        #
        # KNOWN INCONSISTENCY, deliberately left alone: `manifest` says "N files jointly
        # form one of these", which disagrees with `input_requirements: { requires: single }`
        # below. `manifest` is the more permissive, so N independently-grouped `.h5ad`s are
        # accepted as ONE dataset today. Tightening it to `single` is a BEHAVIOUR change
        # outside INV-7's scope and it is load-bearing for two tests that use `.h5ad` as a
        # generic multi-file vehicle (`dataset::upload_test::grouping_default_splits_explicit_joins`,
        # `::split_separates_a_multifile_dataset`) — which is itself the argument for
        # deciding it on purpose rather than as a side effect of this change. Compare
        # `single_layout_group_is_rejected` in the same file, whose comment records an
        # earlier silent-vacuity incident from exactly this kind of datatype edit.
        file_layout: manifest
      # NO `capabilities`. `[sliceable, has-obs, has-var]` were three claims about the
      # container's contents: that it can be sliced, and that it carries obs/var. None is
      # true of bytes nobody has parsed — an h5ad is sliceable only AFTER the import writes
      # a Zarr store, and it is that store's artifacts which advertise these. They were
      # inherited when this type `extends: matrix` and were never re-examined. Nothing reads
      # them for this type: no shipped `appliesTo` uses a `capabilities:` selector, the two
      # importers match `type_id: single-cell/anndata` exactly, and the `?capability=` query
      # matches ARTIFACTS, of which this datatype has none. What they DID do was leak into
      # the FE's `deriveCaps` union, where a `when: "has:sliceable"` on an un-imported
      # upload would have evaluated true.
      #
      # `ingest` + `input_requirements` STAY: both are facts about the UPLOAD boundary, not
      # about the contents. `ingest` drives the sniffer (`datatype/sniff.rs`) and names the
      # export extension; `input_requirements` drives the upload wizard's picker.
      ingest:
        extensions: [h5ad, zarr]
        magic: ["504b0304"]
      input_requirements: { requires: single }

    # ── dense embedding + tabular derivatives ──
    - id: embedding
      extends: matrix
      title: Embedding
      description: A dense low-dim embedding (cells × dims), e.g. UMAP/PCA.
      is_abstract: false
      # Axis IDENTITY only — `name` + `key_label`, nothing else (owner 2026-07-28:
      # "remove the annotations from the axes, keep name and key_label"). WHICH
      # columns exist on an axis is read from the artifacts that landed, never
      # forecast here (INV-5).
      #
      # These sit on the ANALYSABLE types. They used to be declared only on
      # `single-cell/anndata` + `single-cell/matrix-mtx` — the UPLOAD containers —
      # which is backwards: the formats nothing analyses were the only things
      # declaring the axes analysis runs over. Making those two opaque removed the
      # last axis declaration in the registry, and `axes_for` is a FLAT lookup (it
      # does not walk `extends`), so every subtype needs its own.
      axes:
        - { name: cells, key_label: barcode }
        - { name: dims, key_label: dim_index }
      # WHICH declared axis is the ENTITY axis — the axis whose entries a value of
      # this type has exactly ONE PER (a layout point, a dense column entry). The
      # `axes` list above is UNORDERED IDENTITY, so this may not be read off a
      # position; the consumer refuses rather than guessing when it is absent on a
      # multi-axis type. Build-gated: it must name one of the axes above.
      entity_axis: cells
      storage:
        layout: { kind: chunked_dense }
        format: zarr
        file_layout: single
      # `plottable-xy` (DEC-7): the DECLARED capability the FE dispatches its
      # embedding/scatter plottability on (viz-canvas hero + the workbench
      # DataSource `layouts` catalog channel + analysis viz-discovery) — replacing
      # every former hardcoded `id === 'embedding'` / `isA(id,'embedding')` FE branch.
      capabilities: [obs-aligned, plottable-xy]
      viewers:
        - { view_kind_id: embedding-scatter, family: deckgl, consumes: [obs-aligned] }

    - id: clustering
      extends: tabular
      title: Clustering
      description: Per-cell cluster labels (codes + categories).
      is_abstract: false
      # Axis IDENTITY only — `name` + `key_label`, nothing else (owner 2026-07-28:
      # "remove the annotations from the axes, keep name and key_label"). WHICH
      # columns exist on an axis is read from the artifacts that landed, never
      # forecast here (INV-5).
      #
      # These sit on the ANALYSABLE types. They used to be declared only on
      # `single-cell/anndata` + `single-cell/matrix-mtx` — the UPLOAD containers —
      # which is backwards: the formats nothing analyses were the only things
      # declaring the axes analysis runs over. Making those two opaque removed the
      # last axis declaration in the registry, and `axes_for` is a FLAT lookup (it
      # does not walk `extends`), so every subtype needs its own.
      axes:
        - { name: cells, key_label: barcode }
      storage:
        layout: { kind: columnar_table }
        format: parquet
        file_layout: single
      capabilities: [categorical, obs-aligned]

    - id: metadata-column
      extends: tabular
      title: Metadata column
      description: A single per-cell metadata column (1-D).
      is_abstract: false
      # Axis IDENTITY only — `name` + `key_label`, nothing else (owner 2026-07-28:
      # "remove the annotations from the axes, keep name and key_label"). WHICH
      # columns exist on an axis is read from the artifacts that landed, never
      # forecast here (INV-5).
      #
      # These sit on the ANALYSABLE types. They used to be declared only on
      # `single-cell/anndata` + `single-cell/matrix-mtx` — the UPLOAD containers —
      # which is backwards: the formats nothing analyses were the only things
      # declaring the axes analysis runs over. Making those two opaque removed the
      # last axis declaration in the registry, and `axes_for` is a FLAT lookup (it
      # does not walk `extends`), so every subtype needs its own.
      axes:
        - { name: cells, key_label: barcode }
      storage:
        layout: { kind: chunked_1d }
        format: zarr
        file_layout: single
      # `continuous-column`: the DECLARED capability the workbench DataSource
      # `continuousColumns` catalog channel dispatches on — replacing the former
      # hardcoded `isA(datatype,'metadata-column')` FE filter (DEC-7 mechanism).
      # `clustering` already declares `categorical` for the categorical channel.
      # `metadata-column-family`: the DECLARED family marker the workstore axis-index
      # resolver (`sandbox/inputs.rs`) dispatches on — it resolves this capability →
      # each carrier's `descendants_inclusive` → the `datatype = ANY($n)` allow-set,
      # replacing the former hardcoded `datatype = 'metadata-column'` SQL literal
      # (DEC-12). A contributed subtype resolves for free via the lattice.
      capabilities: [obs-aligned, continuous-column, metadata-column-family]

    # ── recorded selection over the cells axis ──
    - id: cell-set
      extends: data/opaque
      title: Cell set
      description: >-
        A recorded selection over the cells axis, stored as the reproducible recipe (predicate + pinned input content-hash) rather than a materialized mask.
      is_abstract: false
      storage:
        layout: { kind: opaque_as_is }
        format: json
        file_layout: single
      # `selection-set-target`: the DECLARED marker the provenance interaction
      # chokepoint (`provenance/interaction.rs::selection_artifact_datatype`)
      # resolves via `types_with_capability` to type a captured selection artifact,
      # replacing the former hardcoded `datatype: "cell-set"` literal (S5). A domain
      # whose axis elements are wells / timepoints / regions declares its OWN
      # carrier instead; the server never assumes this one.
      capabilities: [selection-set-target]

    # ── QC report (opaque report subtype) ──
    - id: report/qc
      extends: report/html
      title: QC report
      description: >-
        A quality-control report (opaque report blob) carrying pre/post filtering distributions + threshold cutlines; reviewed in the qc-review panel.
      is_abstract: false
      storage:
        layout: { kind: opaque_as_is }
        format: html
        file_layout: single
      viewers:
        - { view_kind_id: qc-review, family: deckgl, consumes: [] }

    # ── raw sequencing input (FASTQ lane set) ──
    - id: sequence/fastq
      extends: data
      title: FASTQ reads
      description: >-
        Raw sequencing reads (FASTQ), served as-is — the Cell Ranger input type. A lane set (R1/R2 × L00n) jointly forms one dataset (multi-file manifest, DEC-16).
      is_abstract: false
      storage:
        layout: { kind: opaque_as_is }
        format: fastq
        file_layout: manifest

    # ── 10x raw matrix trio (auto-grouped manifest input) — opaque, no axes ──
    - id: single-cell/matrix-mtx
      # `extends: data` → `data/opaque`, and `axes` dropped. Same argument as
      # `single-cell/anndata`: this is an UPLOAD FORMAT, converted once into a
      # `single-cell/expression` store that analysis then runs on, and its only
      # consumers match it by exact `type_id` (the `anndata-import` converter's
      # `accepts`, the upload planner's `mtx-trio-target` capability lookup, the
      # dataset-repository trio detector) — never by `subtypes_of`. The declaration now
      # matches what the type already said about itself in two other places: its own
      # description ("An opaque raw input; a processor converts it into a
      # single-cell/expression matrix") and its `storage.layout: { kind: opaque_as_is }`.
      extends: data/opaque
      # Axis IDENTITY only — `name` + `key_label`. An opaque container still DECLARES
      # what its dimensions ARE; it just does not claim what columns are on them.
      #
      # These came back after being removed as "an opaque container has no axes anyone
      # can read without parsing it". That reasoning is principled and empirically wrong:
      # `dataset/routes.rs` validates a SUPPORTING FILE's axis against
      # `reg.axes_for(dataset.datatype)`, and the dataset's datatype IS this upload
      # container. With no axes every axis is unknown, so attaching a per-cell annotation
      # CSV to an uploaded h5ad 422'd — 7 integration tests, and a real user capability
      # that exists precisely at upload time, before anything is parsed.
      #
      # Analysability is gated by `extends: data/opaque`, NOT by withholding axes. The two
      # are independent, and conflating them cost a feature.
      axes:
        - { name: cells, key_label: barcode }
        - { name: genes, key_label: gene_id }
      # WHICH declared axis is the ENTITY axis — the axis whose entries a value of
      # this type has exactly ONE PER (a layout point, a dense column entry). The
      # `axes` list above is UNORDERED IDENTITY, so this may not be read off a
      # position; the consumer refuses rather than guessing when it is absent on a
      # multi-axis type. Build-gated: it must name one of the axes above.
      entity_axis: cells
      title: 10x matrix (MTX trio)
      description: >-
        The canonical 10x Genomics raw matrix trio — matrix.mtx(.gz) + barcodes.tsv(.gz) + features/genes.tsv(.gz) — where the three files JOINTLY form one dataset (multi-file manifest, DEC-31). An opaque raw input; a processor converts it into a single-cell/expression matrix.
      is_abstract: false
      storage:
        layout: { kind: opaque_as_is }
        format: mtx
        file_layout: manifest
      input_requirements:
        requires: manifest
        # `features.tsv|genes.tsv`: Cell Ranger renamed the third member at 3.0 —
        # 2.x writes `genes.tsv`, 3.x+ writes `features.tsv`. The `|`-alternation is
        # the core's ONE matching sugar (`dataset/repository.rs::matches_member`), so
        # both spellings auto-group. Dropping the alternative silently un-groups every
        # Cell Ranger 2.x trio.
        members: ["matrix.mtx", "barcodes.tsv", "features.tsv|genes.tsv"]
        allow_archive: true
      # `mtx-trio-target`: the DECLARED target marker the dataset upload planner
      # (`dataset/repository.rs::manifest_group_specs`) resolves via
      # `types_with_capability` to assign the auto-detected 10x trio's fixed type,
      # replacing the former hardcoded `MTX_TRIO_DATATYPE` id const (DEC-13). The
      # Cell-Ranger filename detector stays generic ingest infra.
      capabilities: [mtx-trio-target]
      # (This entry declares `axes` above, and no internal structure: `opaque_as_is`, no
      # `schema`, and one capability that is a DISPATCH MARKER for the upload planner
      # rather than a claim about the bytes. The trailing note that used to sit here said
      # "NO `axes`" and was left behind when the axes were restored in `d842da5f` — the
      # same stale-changelog defect as the one at the top of this file.)

    # ── the dataset ALIGNMENT (virtual-dataset-alignment, DEC-11 / ITEM-13) ──
    #
    # The artifact an embedding analysis over several datasets emits: the row/entity
    # vectors and level lookups through which a FUSED column is read. It is REAL — small,
    # content-hashed over its own bytes, immutable — while the fused columns it serves are
    # ABSTRACT (Postgres rows whose `content_hash` is of the DEFINITION, not of any bytes).
    # That split is the feature's, not this declaration's; what belongs here is the shape.
    #
    # ## Why the axis names carry NO domain noun
    #
    # This type sits in the domain package because that is where the datatype registry
    # lives (`metadata-column` is the precedent for a domain-AGNOSTIC type declared here),
    # but the alignment itself is domain-free by construction: it aligns whichever ENTITY
    # AXIS the user chose to join on — cells, genes, variants, samples — and the engine
    # that writes it "never knows which" (`_helpers/align.py`'s own words). Naming an axis
    # `gene` here would bake into infrastructure a choice the user makes per analysis, and
    # would be the first domain noun in a type nothing about which is domain. So the axes
    # are `unified_entities` / `segments` / `sources`, and the producer's `structure.axis`
    # must match `unified_entities`.
    #
    # ## Why `arrays[]` over an OPEN axis set
    #
    # These dimensions are lengths no obs/var pair can express — the segment count and the
    # source count are independent of the entity axis and of each other (and the OUTPUT row
    # count is not even an axis: since D18 it is reconstructed from the segment ranges, not
    # stored as a member). That is exactly the `open-kinds` thesis (a datatype declares its
    # `arrays[]` over an open axis set, and the client decodes from the producer-declared
    # `structure` with zero serve-core branching), and it is the read-side counterpart of
    # the writer's `aux` channel + `conformance._AUX_ROLES` (ITEM-12): each array below
    # corresponds to one declared aux role, and the extent that bounds it there is the
    # axis that binds it here.
    #
    # NOTE: `role: artifact` / `hidden: true` from DEC-11 are NOT declared here — no such
    # field exists on `DatatypeContribution` (it is `deny_unknown_fields`, so writing them
    # would fail the manifest at parse). They are ARTIFACT-ROW properties the producer
    # stamps at emit time, exactly as `annotation-integrate` stamps its sidecar.
    - id: dataset-alignment
      extends: tabular
      title: Dataset alignment
      description: >-
        The row/entity vectors and level lookups that define a fused (integrated) dataset:
        output row -> source row + segment, unified entity -> per-source column index
        (an INTERSECTION, never a union), and per-source categorical code -> unified code.
        Immutable: re-running an analysis emits a NEW alignment rather than updating one.
      is_abstract: false
      axes:
        - { name: unified_entities, key_label: unified_key }
        - { name: segments, key_label: segment_index }
        - { name: sources, key_label: source_index }
      # The axis a read of this artifact is dense over, and the one the producer's
      # `structure.axis`/`n` declare. Required here because the type is multi-axis: with it
      # absent the consumer refuses rather than reporting one axis's cardinality for
      # another's.
      entity_axis: unified_entities
      storage:
        layout: { kind: chunked_dense }
        format: zarr
        file_layout: single
      capabilities: [dataset-alignment]
      arrays:
        # DERIVED FROM A REAL EMITTED ARTIFACT, not from the plan text.
        #
        # This block previously declared a `segments` COLUMNAR TABLE the producer never
        # writes, and omitted five member classes it does. It had been written from the
        # design document rather than from an artifact, and nothing compared the two — so
        # both consumers built against what is emitted while the declaration quietly said
        # something else. `embedding-integrate`'s
        # `test_the_dataset_alignment_DECLARATION_matches_a_freshly_emitted_artifact`
        # now fails whenever these disagree, comparing ROLES and EXTENTS against a fresh
        # run rather than counting members (a count agrees for the wrong reasons).
        #
        # `name` is the producer's AUX ROLE — the key `conformance._AUX_ROLES` enumerates
        # and the member row carries — not a member path. The level lookups are one member
        # per (source, column), so they share one role and one declaration.
        # NO per-output-row vector (D18): `alignment_row_source` / `alignment_row_segment`
        # were dropped as pure redundancy. Output row `i` reconstructs to its
        # `(source, row-within-source)` from the segment table alone — the segment whose
        # `[segment_start, segment_end)` range contains `i` names the source (its
        # `alignment_segment_order` / declared order) and `i - segment_start` is the row
        # within that source. The per-source `key_sequence_digest` guards the positional
        # addressing.
        #
        # The segment table is FOUR separate 1-D members, not one columnar table: they are
        # written through the aux channel, which carries numeric arrays. `declared_order` is
        # the field a reader SORTS on — the array's own order is deliberately not the
        # semantic order (INV-6).
        - name: alignment_segment_dataset
          kind: alignment-vector
          dims: [{ axis: segments }]
          attrs: [{ name: source_index, dtype: i32 }]
          layout: { kind: chunked_1d }
        - name: alignment_segment_start
          kind: alignment-vector
          dims: [{ axis: segments }]
          attrs: [{ name: start_row, dtype: i64 }]
          layout: { kind: chunked_1d }
        - name: alignment_segment_end
          kind: alignment-vector
          dims: [{ axis: segments }]
          attrs: [{ name: end_row, dtype: i64 }]
          layout: { kind: chunked_1d }
        - name: alignment_segment_order
          kind: alignment-vector
          dims: [{ axis: segments }]
          attrs: [{ name: declared_order, dtype: i32 }]
          layout: { kind: chunked_1d }
        # unified entity x source -> that source's column index. Total by construction: the
        # entity set is an INTERSECTION, so there is no absence to encode (INV-2/INV-12).
        - name: alignment_entity_index
          kind: alignment-vector
          dims: [{ axis: unified_entities }, { axis: sources }]
          attrs: [{ name: source_column_index, dtype: i64 }]
          layout: { kind: chunked_dense }
        # ITEM-11's per-entity evidence: whether the sources' SECONDARY identifiers agreed.
        # A vector rather than a per-entity record on the artifact row, which a 20k-entity
        # run would push past MAX_MANIFEST_BYTES.
        - name: alignment_entity_evidence
          kind: alignment-vector
          dims: [{ axis: unified_entities }]
          attrs: [{ name: secondaries_agreed, dtype: i8 }]
          layout: { kind: chunked_1d }
        # One member per (source, column). Its length is that SOURCE's own level count, so
        # the dim is ANONYMOUS: it is not one of this datatype's axes and cannot be, since
        # it varies per member. A dropped level is stored as -1 (the obs-axis absence,
        # ITEM-5/DEC-A) — never on the entity axis, where absence is unreachable.
        #
        # `k` is an INTEGER (`ArrayDim::Anon { k: u64 }`), not a name — it is a positional
        # latent extent, and `0` means "unbound, varies per member". A first draft wrote
        # `{ k: source_levels }`, which is not a variant of that enum and failed the
        # manifest build gate outright.
        - name: alignment_level_lookup
          kind: alignment-vector
          dims: [{ k: 0 }]
          attrs: [{ name: unified_code, dtype: i32 }]
          layout: { kind: chunked_1d }
