      #
      # These sit on the ANALYSABLE types. They used to be declared only on
      # `single-cell/anndata` + `single-cell/matrix-mtx` — the UPLOAD containers —
      # which is backwards: the formats nothing analyses were the only things
      # declaring the axes analysis runs over. Making those two opaque removed the
