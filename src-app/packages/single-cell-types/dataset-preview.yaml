# Dataset-artifact PREVIEWS for the datatypes this package declares — the
# contribution half of the seam described in
# `docs/design/dataset-attach-readiness-and-preview.md`.
#
# ── What this file is for ───────────────────────────────────────────────────────
#
# The project's dataset-attach picker summarises what a dataset HOLDS, on one line.
# THIS FILE IS THAT LINE. The app sorts the phrases below by their `order` and joins
# them with " · "; it contributes no words of its own. What it used to contribute —
# a count of "artifacts" (its storage noun for a row in its own table) and a byte
# size — told a reader nothing about whether a dataset was worth opening, and both
# are gone from the line. The reader of a single-cell dataset wants how many cells
# and how many genes; that sentence can only be written here, because nothing in the
# app connects a producer's `shape` to the word "cells".
#
# The phrases are TEMPLATES over the group the app hands each entry: `{count}` is how
# many artifacts of that datatype the dataset holds, `{title}` is the display title
# THAT GROUP's own datatype declares in `manifest.yaml`, and `{meta.…}` /
# `{structure.…}` are dotted paths into the representative artifact's two producer
# declarations (arrays index by number, so `{structure.shape.0}` is the first
# declared dimension).
# The app's interpreter (`ui/src/modules/dataset/project-extension/preview/
# declared.ts`) knows no datatype id, no declaration key and no word — every one of
# them arrives from this file, so the NEXT datatype gets a preview with no code at all.
#
# ── The paths below are ones the producer actually writes ───────────────────────
#
# Verified against `packages/anndata-import/compute/h5ad_import.py` + the shared
# `packages/_lib/txr_csc.py` writer it calls — the on-ingest converter
# (`contributes.converters[].trigger: on-ingest`) that emits these artifacts:
#
#   single-cell/expression  `write_csc_zarr` returns, and `output_entry(…,
#                           structure=csc_structure)` stamps, a structure carrying
#                           `{encoding, kind, axes, shape, nnz, …}` — where `axes` and
#                           `shape` are built in the SAME dict literal from the same
#                           `axes=("cells", "genes")` argument `write_expression_csc`
#                           passes, so they are index-aligned by construction. That
#                           holds on BOTH the single-modality and the per-modality
#                           path (the per-modality split changes only which columns
#                           are selected, never the axis identity).
#
#                           The row count is why this reads `structure` rather than
#                           `meta`: the entry's `meta` is `{n_vars, nnz, source_dtype,
#                           x_state, count_source}` and there is NO cell count in it.
#                           `n_vars` duplicates `shape.1`; taking BOTH extents from
#                           the one declaration the producer wrote as a pair is the
#                           honest reading, and it is the only one that can state the
#                           dimension the reader asks about first.
#
#                           IT LEADS WITH `{title}` because extents alone say how BIG
#                           the thing is and never what it IS. This datatype has five
#                           declared SUBTYPES (raw counts, normalized, and the
#                           per-modality kinds), and a dataset can hold two of them at
#                           once — one entry per modality is the normal shape of a
#                           multi-modal import. Without a name that line is two bare
#                           dimension pairs and the reader cannot tell which array is
#                           which. The name is READ from `{title}` rather than written
#                           out here for exactly that reason: this entry is the only
#                           one on the branch, so it answers for every subtype through
#                           the lattice, and a literal noun here would print THIS
#                           type's word over a subtype's artifacts — a confident wrong
#                           label on the one line whose job is to tell them apart.
#                           `{title}` resolves per group, so each states its own name.
#
#                           NAMING THE AXES FROM `axes` RATHER THAN SPELLING THEM HERE
#                           is deliberate, and it is the one place this file declines
#                           to supply its own word. A phrase reading `{shape.0} cells`
#                           asserts that position 0 MEANS cells — the exact defect
#                           `lint-positional-declaration` was built from (the app once
#                           resolved a datatype's entity axis as `axes[0]`, and was
#                           already wrong on two contributed kinds). Reading the word
#                           from the SAME index makes the position carry no unstated
#                           semantic: a producer that ever emitted the pair the other
#                           way round would render "32,738 genes × 3,460 cells" —
#                           still true — instead of two numbers with the labels
#                           quietly swapped. The cost is that the phrase now needs
#                           `axes` as well as `shape`; they are written together by
#                           one function, so neither can arrive without the other.
#
#   metadata-column         one artifact per source column, so the phrase the reader
#                           wants is how MANY — the app's own count of real rows. Its
#                           `meta` carries `n` (the column's length) but NOT which
#                           axis it is a column OF (the axis is nested in `structure`
#                           per column, and a group of them mixes both axes while its
#                           representative is chosen by SIZE). A dimension that is
#                           right half the time is worse than none, so there is none.
#
#   embedding               likewise a count. Its `meta` carries `{name, kind, axis,
#                           n, n_dims}` — a real shape — but an embedding's own
#                           dimensions are not what distinguishes one dataset from
#                           another in a picker, and the line is one line.
#
# `one:` is the wording when a group holds exactly one artifact; the app picks
# between the two by cardinality and never inflects either.
apiVersion: "2.0"
previews:
  # The headline fact, so it leads — even though metadata columns are by far the most
  # NUMEROUS group. Ordering by count would bury it, which is why the order is
  # declared here rather than left to the app.
  - datatype: single-cell/expression
    order: 10
    text: "{title} — {structure.shape.0} {structure.axes.0} × {structure.shape.1} {structure.axes.1}"

  - datatype: metadata-column
    order: 20
    text: "{count} metadata columns"
    one: "{count} metadata column"

  - datatype: embedding
    order: 30
    text: "{count} embeddings"
    one: "{count} embedding"
