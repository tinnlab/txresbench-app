version: 0.8.10
apiVersion: "1.0"
contributes:
  datatypes:
    # ── spatial/coordinates — the tissue map ───────────────────────────────────────────
    #
    # Deliberately NOT named `spatial/cell-positions`. That name would be ACTIVELY FALSE
    # on Visium, where one row is a spot holding ~1-10 cells, and on Visium HD, where one
    # row is a bin holding a FRACTION of a cell. The kind is entity-agnostic on purpose:
    # it holds one position per MATRIX ROW, whatever that row is — which is exactly why
    # `measured_entity` (below, and enforced in `compute/spatial_declarations.py`) has to
    # exist.
    #
    # Structure: one 2-D numeric member over the entity axis — i.e. precisely what
    # `_lib/txr_columns.py::write_embedding` already emits, carrying `aligned_to` and
    # `membership`. Zero new writer code; the domain wrapper adds the declarations, not a
    # format.
    # ── `extends: matrix`, NOT `extends: embedding` — a FORCED amendment to §6.2 ───────
    #
    # The design says `extends: embedding`. THAT DOES NOT LOAD, and the failure is silent,
    # which is why it is corrected here rather than carried:
    #
    #   * `build.rs` runs `lint_processor_tree`, which resolves `extends` against the roots
    #     UNION every id contributed by EVERY package — so `cargo check` is green.
    #   * BOOT does not use that entry point. `ExtensionRegistry::scan_dir` runs the
    #     PER-PACKAGE validator on each package folder, and `lint_processor_package` builds
    #     its known-id set from the six universal roots ∪ THIS PACKAGE'S OWN ids only. Its
    #     own doc-comment says so: "A supertype contributed by a DIFFERENT package is
    #     therefore reported as a dangling `extends` here."
    #   * `embedding` is contributed by `single-cell-types`. So the whole package is
    #     rejected, `tracing::error!`-logged once, and SKIPPED — every kind below
    #     unregistered, the tissue map absent from the Coordinates section, the bundle
    #     un-uploadable, and no other signal anywhere.
    #
    # MEASURED, not reasoned: with `extends: embedding` the seed extracted `spatial-types/`
    # to disk and `datatype::tests::lattice_golden_fixture` still passed at 26 types — i.e.
    # the registry did not grow by one. The golden's silence was evidence of the package
    # being DEAD, not of it being correct. This leaf would have shipped inert.
    #
    # `matrix` is `embedding`'s OWN parent, so this makes the tissue map a SIBLING of an
    # embedding rather than a subtype, and every functional property §6.2 actually argues
    # for survives, because none of them came from the parent:
    #   * the Coordinates section is a CAPABILITY-only selector on `plottable-xy`, which is
    #     declared explicitly below (and had to be — capability lookup is flat);
    #   * `sc.viz.colour-by` selects `type_id: metadata-column`, untouched;
    #   * the axes and storage are re-declared here regardless, because `axes_for` is flat.
    # It also REMOVES a side effect `extends: embedding` had: the FE derives `has:<cap>`
    # over every `extends` ANCESTOR ID (`runtime/caps.ts::deriveCaps`), so a Visium import
    # that computed no embedding would have satisfied `has:embedding` and lit
    # `cell-filter`'s "Show embedding before/after" button. A tissue map is not a computed
    # embedding, and the lattice now says so.
    #
    # The alternative — teaching `lint_processor_package` to resolve cross-package
    # supertypes — is a CORE change and therefore not this leaf's to make. Flagged for the
    # owner: it is the first cross-package `extends` anyone has attempted, and until it
    # exists, "a new kind is pure data" holds only for a kind that extends a ROOT or a
    # sibling in its own package.
    - id: spatial/coordinates
      extends: matrix
      title: Spatial coordinates
      description: >-
        Per-entity positions in a tissue coordinate space (x, y) — the physical layout a
        spatial measurement was taken in, as opposed to a computed embedding. A producer
        ALWAYS emits two components; a z value travels as a sibling metadata-column with a
        declared kind, never as a third component and never as a zero fill.
      is_abstract: false
      # Axis IDENTITY only — `name` + `key_label`. `axes_for` is a FLAT lookup that does
      # not walk `extends`, so a subtype declares its own set even when the supertype
      # already has one.
      #
      # `cells` IS REUSED FOR THE MEASURED ENTITY, and that is the
      # BACKWARDS-COMPATIBILITY DECISION (#175 §5), not an approximation nobody noticed.
      # A Visium barcode and a Xenium segmented cell are both "the thing one matrix row
      # describes"; inventing a `spots` axis would fork EVERY existing analysis. The cost
      # — the axis name is imprecise on spot platforms — is paid by `measured_entity`
      # recording what a row actually is.
      axes:
        - { name: cells, key_label: barcode }
        - { name: dims, key_label: dim_index }
      # The axis a value of this type has exactly ONE PER. Build-gated: it must name one
      # of the axes above.
      entity_axis: cells
      storage:
        layout: { kind: chunked_dense }
        format: zarr
        file_layout: single
      # ── THE SINGLE HIGHEST-LEVERAGE LINE IN THIS FILE ────────────────────────────────
      # `plottable-xy` is DECLARED here, explicitly, and is NOT inherited from
      # `embedding`. Capability resolution on the backend is flat, exactly like `axes_for`:
      # `Datatype::has_capability` reads `self.capabilities` and never walks `extends`
      # (`server/src/modules/datatype/types.rs`), and `DatatypeRegistry::matches` gates a
      # selector on it. So a subtype that omits the capability simply does not have it.
      #
      # It is the capability `sc.viz.coordinates` binds on, and nothing else:
      # `single-cell-viz/manifest.yaml` declares `applies_to: [{ capabilities:
      # [plottable-xy] }]` — a CAPABILITY-ONLY selector. Declaring it here is what makes a
      # tissue map appear in the Coordinates section, selectable beside UMAP/PCA, with
      # ZERO UI work; `sc.viz.colour-by` (`applies_to: [{ type_id: metadata-column }]`)
      # then colours it by any existing metric for free.
      #
      # Contrast, recorded because the two decisions look identical and are not: a
      # velocity EMBEDDING-VECTORS type must NOT declare `plottable-xy`, because plotting
      # a velocity DIRECTION as a POSITION is scientifically wrong. These ARE positions.
      #
      # `spatial-coordinates` is the DISPATCH MARKER — named for what carries it rather
      # than the bare domain word.
      #
      # `spatial` is ALSO declared, and it is a different thing from the marker. The
      # shipped `has:<capability>` predicate is an EXACT TOKEN membership test
      # (`runtime/expr.ts::hasCapability` → `caps.has(cap)`), fed by `runtime/caps.ts::
      # deriveCaps`, which unions each produced datatype's id, its `extends` ancestors and
      # their DECLARED capability strings. `cell-filter`'s already-shipped spatial
      # before/after panes are gated `when: "has:spatial"`, so the marker name alone would
      # leave them unsatisfiable forever — which is the state they have been in since they
      # shipped. Declaring both lights those panes with zero edit to `cell-filter`.
      capabilities: [obs-aligned, plottable-xy, spatial-coordinates, spatial]
      # DECLARED, not inherited — for the same reason the capabilities are. `viewers_for`
      # walks UP the lattice, and `embedding` is no longer an ancestor (see the
      # `extends: matrix` note above), so the deck.gl scatter renderer a coordinate set is
      # viewed through has to be named here or a tissue-map artifact has no viewer at all.
      # `view_kind_id` is a free string the FE maps to a renderer; this is the same id
      # `embedding` declares, because the renderer is the same one — points in a plane.
      viewers:
        - { view_kind_id: embedding-scatter, family: deckgl, consumes: [obs-aligned] }

    # ── spatial/image — the tissue raster, as a DISPLAY DERIVATIVE ────────────────────
    #
    # Opaque: the pixel grid has no axis, no row order and no key sequence, so there is no
    # member structure to declare. An image's dimensions are y/x/c, which are not axes
    # anything in this system joins on — declaring them would be a structure claim INV-7
    # forbids. (Contrast the vendor bundle below, which DOES declare axis identity,
    # because a supporting file's axis is validated against the DATASET's datatype at
    # upload time, before anything is parsed.)
    #
    # WHY OME-TIFF AND NOT OME-NGFF/ZARR. The justification is PLATFORM REALITY, not the
    # opaque-refuses-Zarr conformance gate: that gate tests `zarr.json`, i.e. Zarr v3 only,
    # with zero `.zattrs`/`.zgroup` references, so an OME-NGFF 0.4 pyramid (a Zarr v2
    # layout) is a blind spot in it and only the opaque walk limit does real work. The
    # load-bearing fact is that ZERO of the 17 surveyed platforms ship NGFF natively.
    # OME-TIFF is also what a range-reading viewer can open at multi-GB scale; a PNG must
    # be fetched whole.
    #
    # IT IS A DISPLAY DERIVATIVE, NOT A SOURCE IMAGE (#176 — BUILT). Downsampled to a
    # resolution cap recorded in every artifact THAT HAS ONE (default 0.5 µm/pixel) —
    # an image whose micron scale could not be derived carries NO display-derivative block
    # and therefore no cap, because the cap could not be evaluated for it and recording one
    # would be the fabrication the absence-is-absence rule exists to prevent,
    #
    # …and the cap is a CODE-LEVEL DEFAULT today, not something an operator can state. An
    # earlier draft of this comment said "a parameter, never hard-coded", which reads as a
    # promise that somebody can choose it: nobody can. It is structured as a parameter
    # (`DEFAULT_RESOLUTION_CAP_UM`, threaded as a keyword through `downsample_factor`,
    # `downsample_plan` and `display_derivative_provenance`) so promoting it to a per-run
    # analysis parameter is a wiring change and not a rewrite, and every artifact that
    # carries provenance at all records the `resolution_cap_um` it was actually built under,
    # so two imports at different caps stay distinguishable from their own bytes. Making it
    # user-choosable is a product
    # decision with a UI surface and is deliberately NOT smuggled in here (#176 DEC-3).
    #
    # LOSSLESS ONLY (deflate/LZW; never JPEG), with the original resolution, the original
    # pixel grid, the vendor member it came from, the integer factor applied, the cap and
    # the tifffile version all recorded in provenance.
    #
    # `applied_resolution_um` is the ACHIEVED resolution, NEVER the cap. The factor is a
    # whole number (so every emitted pixel is the mean of a whole block of source pixels
    # rather than an interpolation between them), which means it generally OVERSHOOTS the
    # cap — 0.2 µm/pixel at a 0.5 cap lands at 0.6, not 0.5. Recording the cap would state
    # a resolution the emitted pixels do not have, and every downstream micron measurement
    # would inherit the error with a plausible number at the end and nothing saying so.
    # Downsampling and lossy compression are
    # NOT the same thing and must not be conflated: downsampling produces fewer, larger
    # pixels each a real average of real measurements, while lossy compression keeps the
    # pixel count and INVENTS the values — and someone will eventually zoom a region and
    # read intensity off it, where JPEG ringing around a high-contrast edge looks exactly
    # like biology. A below-cap source (Visium's `tissue_hires_image.png`) passes through
    # unchanged and is never upsampled. The SOURCE the derivative was built from stays in
    # the stored vendor bundle. Note what that is and is not: for Visium it is
    # `tissue_hires_image.png`, which is 10x's OWN 0.2x downscale — a Space Ranger `outs/`
    # bundle contains no full-resolution image at all, so this system never had the
    # instrument's pixels and must not imply it does. On a platform that DOES ship its
    # full-resolution raster (Xenium morphology, #162) the same pointer resolves to it. In-platform cell segmentation is an explicit
    # NON-GOAL that follows from this (#175 §9): at 0.5 µm/pixel a cell is ~30 px across
    # and boundary placement is already degraded. `compute/spatial_declarations.py`
    # enforces the codec and cap half.
    - id: spatial/image
      extends: data/opaque
      title: Tissue image
      description: >-
        A registered tissue image (H&E / DAPI / morphology / IF) as a pyramidal OME-TIFF,
        placed into a declared coordinate space by an affine. A DISPLAY DERIVATIVE, not
        the source: downsampled to a declared resolution cap and losslessly compressed,
        with the original retained in the uploaded vendor bundle. Opaque — the pixel grid
        has no axis, no row order and no key sequence, so there is no member structure to
        declare.
      is_abstract: false
      storage:
        layout: { kind: opaque_as_is }
        format: ome-tiff
        file_layout: single
      # ── NO `capabilities` AT ALL, and the omission is load-bearing ─────────────────
      # An OPAQUE container declares NOTHING about what is INSIDE it. The shipped gate
      # (`datatype_contribution_test.rs::test7`, INV-7) derives the container set from the
      # lattice — every `data/opaque` descendant — and asserts the capability list is
      # EMPTY once `*-target` entries are filtered out. The `-target` suffix is the ONLY
      # exemption, and it is narrow: it names a ROLE the host resolves through
      # `types_with_capability` (the upload planner's trio target, the provenance
      # selection target), i.e. a fact about how the file is ROUTED, never about its
      # bytes. `spatial/visium-bundle` earns it; a raster does not.
      #
      # An earlier cut declared `spatial` here and, after that was removed, a per-kind
      # `spatial-image` marker. Both were violations, and the marker was inert besides:
      # NOTHING enumerates it — the only shipped `has:spatial*` gate is `has:spatial`, and
      # no `types_with_capability` call site names it. A declaration nothing can satisfy
      # is the silently-ignored-key class this tree removes on sight (same reasoning as
      # the dropped `ome.tif` ingest entries below).
      #
      # Nothing is lost. A raster's dispatch identity is its DATATYPE ID: `deriveCaps`
      # (`caps.ts`) unions each produced datatype's id, its `extends` ancestors and their
      # declared capabilities, so `has:spatial/image` already resolves. And an import
      # always emits `spatial/coordinates` alongside the raster, so `has:spatial` is
      # present for the dataset either way.
      # `tif` / `tiff` ONLY. §6.3 of the design also lists `ome.tif` / `ome.tiff`, and
      # those two entries would be INERT: the sniffer's `extension_of` takes
      # `rsplit_once('.')` (`datatype/sniff.rs`), so `sample.ome.tif` yields `tif` and a
      # two-segment entry can never match anything. A declaration nothing can satisfy is
      # the silently-ignored-key class this tree removes on sight, so it is dropped here
      # rather than copied forward — the `tif`/`tiff` entries already cover every
      # OME-TIFF filename. (Nothing else in the tree claims a TIFF extension; the shipped
      # ingest sets are `h5`/`h5ad`/`mtx`, `h5mu`, `h5ad`/`zarr` and `html`/`htm`.)
      ingest:
        extensions: [tif, tiff]

    # ── spatial/labels — the segmentation label raster ────────────────────────────────
    #
    # Same opaque shape and the same coordinate space as its image. Deliberately a
    # SEPARATE kind rather than a flavour of `spatial/image`: an intensity raster and an
    # integer label raster are read differently (nearest-neighbour only, no interpolation,
    # no windowing) and a consumer must be able to tell them apart from the declaration
    # alone. Paired with a per-entity id LUT carried as sibling metadata-columns on the
    # entity axis.
    - id: spatial/labels
      extends: data/opaque
      title: Segmentation label mask
      description: >-
        An integer label raster (0 = background, n = entity n) as OME-TIFF, in the same
        coordinate space as its image. Consumed by the label-mask surface and paired with
        a per-entity id lookup carried as sibling metadata-columns.
      is_abstract: false
      storage:
        layout: { kind: opaque_as_is }
        format: ome-tiff
        file_layout: single
      # No `capabilities`, for the same INV-7 reason recorded on `spatial/image`: an
      # opaque container declares nothing about its contents, and a per-kind
      # `spatial-labels` marker was both a violation of the shipped gate and inert —
      # nothing enumerates it.
      #
      # ── THE DISCRIMINATOR (#229). "Dispatched on its datatype id" WAS NOT REACHABLE ───
      #
      # The sentence that used to end this block — "the label raster is dispatched on its
      # datatype id" — is FALSE for the only consumer that has to make the distinction, and
      # #159 hit that wall: this kind and `spatial/image` declare a BYTE-IDENTICAL container
      # (`opaque_as_is` + `ome-tiff` + `single`, no axes, no capabilities, no schema), so the
      # producer-declared LAYOUT — the one thing the byte plane and the raster discovery
      # route on — cannot separate them, and the workspace that must choose MAY NOT read the
      # id. TWO INDEPENDENT GUARDS, both DERIVED from these manifests, say so:
      # `test_a_new_kind_costs_zero_core_code` (TEST-1, this suite) scans `src-app/**` +
      # `scripts/**` for every id this package contributes, and the FE's
      # `lint-no-domain-in-builtin.mjs` builds its forbidden datatype literals by READING the
      # manifests (`contributedDatatypes()`).
      #
      # That second one is why a generic `image/labels` TIER does not solve this, and the
      # refutation is worth stating because it is counter-intuitive: the tier's whole appeal
      # is that `image/labels` reads as generic and passes the lint TODAY. It passes today
      # only because NOTHING DECLARES IT. Declare it and it joins the derived set, and the
      # consumer that was supposed to route on it is forbidden from spelling it — MEASURED on
      # this branch, both guards red on the same probe. A new id cannot be its own escape
      # hatch. (And a cross-package `extends` does not even load, so the tier could not live
      # in a neutral package anyway — boot's per-package lint resolves `extends` against the
      # roots ∪ THIS package's own ids; see the amendment on `spatial/coordinates` above,
      # and #369.)
      #
      # What IS left is `viewers`. It is the one channel that is legal here, generic on the
      # consumer side, and resolved by the lattice rather than asserted in prose:
      #
      #   * LEGAL ON AN OPAQUE CONTAINER. INV-7's MAY-NOT table is `capabilities` describing
      #     contents · a non-`opaque_as_is` `storage.layout` · `schema` · `arrays` (and an
      #     axis carrying more than identity). A viewer reference is none of those and makes
      #     no claim about the bytes INSIDE the container: it states what the artifact is
      #     FOR, which is the boundary half of the amendment, not the contents half. The
      #     shipped gates read `dt.capabilities` (`datatype_contribution_test.rs`'s opaque
      #     loop, this package's TEST-14 mirror, `datatypeShape.test.ts`'s `contentsClaims`);
      #     none of them reads `viewers`, and this declaration adds no capability.
      #   * SPELLABLE BY A DOMAIN-BLIND CONSUMER. A `view_kind_id` is PRESENTATION
      #     vocabulary, not a datatype id, so the derived-vocabulary guard does not forbid it
      #     — and `label-mask` carries no term from the FE domain lint's noun list. The app
      #     core is allowed to know renderer names; that is what a renderer registry is.
      #   * ALREADY THE CHANNEL THIS PACKAGE USES. `spatial/coordinates` above declares
      #     `embedding-scatter` for exactly this reason — a declaration puts an artifact in
      #     front of a renderer with zero UI work.
      #
      # ONE-SIDED ON PURPOSE. `spatial/image` gains nothing here. The rule a consumer runs is
      # "an opaque OME-TIFF that declares the label-mask view kind is an INDEX raster; every
      # other one is intensity" — a POSITIVE declaration on the kind that must be recognised,
      # so a raster whose producer declares nothing is still renderable as an underlay rather
      # than silently disappearing (the same fail-open posture the discovery already takes).
      # It also keeps this a pure package edit: the shared Rust/TS parity golden pins
      # `spatial/image → viewers_for: []` as a CASE, and moving that case would make a data
      # declaration cost an edit under `server/src/` — the exact trade the golden's own
      # `lattice` array was deleted to avoid. `spatial/labels` has no case there.
      #
      # `consumes` names what the RENDERER needs from elsewhere in the project, never what is
      # in this container: a mask is meaningless without the per-entity lookup it indexes
      # into, which rides the entity axis as ordinary `obs-aligned` metadata-columns. That is
      # the same pairing OME-NGFF spells as `image-label.properties`, in this tree's own
      # vocabulary.
      viewers:
        - { view_kind_id: label-mask, family: deckgl, consumes: [obs-aligned] }

    # ── spatial/boundaries — segmentation polygons, as a LONG VERTEX TABLE ────────────
    #
    # Renamed from `spatial/geometry` by owner decision (§15.0): the old name encoded
    # SHAPE (identical to `coordinates` — both are literally points) rather than CONTENTS
    # (completely different), and two separate readers hit that confusion in one review.
    #
    # THE RAGGED-ARRAY PROBLEM, SOLVED WITH ZERO FRAMEWORK CHANGE. A polygon set is ragged
    # (entity i has k_i vertices). The two candidate encodings were: offsets as an `aux`
    # member with an entity extent — which would EDIT `_lib/conformance.py` to add two
    # `_AUX_ROLES` entries, i.e. a framework-owned gate change on the critical path of a
    # domain declaration — or offsets as SIBLING metadata-columns on the entity axis,
    # which costs nothing. Take the second: a producer emits `boundary_vertex_start` and
    # `boundary_vertex_count` as ordinary metadata-column artifacts (1-D over the entity
    # axis, carrying `aligned_to`, conformance-checked like every other column), and a
    # consumer reads `[start, start + count)` out of this table. The ragged structure
    # becomes two dense per-entity vectors plus a sorted long table — which is what CSR
    # does, and exactly the shape a CSC `indptr` already is, so the idea is native to the
    # tree rather than imported.
    #
    # Worth stating as a general invariant, because it removes an `_AUX_ROLES` edit from
    # the critical path of every future ragged kind: ANY ragged per-entity structure can
    # be encoded as a long table plus per-entity offset metadata-columns, with zero
    # framework change.
    #
    # The vendor already hands the data over in this shape — boundaries ship one row per
    # polygon VERTEX, not one row per cell.
    - id: spatial/boundaries
      extends: tabular
      title: Segmentation boundaries
      description: >-
        Polygon boundaries in long format — one row per vertex, ordered within each entity
        — over a `vertex` axis. Per-entity slices are addressed through sibling offset
        metadata-columns on the entity axis, so no ragged-array structure is required.
        Viz-only by contract: boundaries do not align to the measured-entity axis for
        masking purposes and are not an analysis input.
      is_abstract: false
      axes:
        - { name: vertex, key_label: vertex_index }
      # The sole axis, declared rather than left to a positional reading. `vertex_index`
      # is NOT an ingest-anchored axis identity, so this type is outside the model-coverage
      # guard's original-axis set and carries a STATED disposition in
      # `_lib/model_coverage_exempt.json` — the same treatment `graph/attributed`'s `node`
      # already has. Omitting `entity_axis` would have silenced that guard by hiding the
      # question it exists to pose; declaring it is the honest form.
      entity_axis: vertex
      storage:
        layout: { kind: columnar_table }
        format: zarr
        file_layout: single
      capabilities: [spatial-boundaries, spatial]
      arrays:
        - name: table
          kind: annotation-table
          dims: [{ axis: vertex }]
          attrs:
            # The row index into the ENTITY axis this vertex belongs to. Valid-only: a
            # negative sentinel is never stored (the tree refuses out-of-range codes and
            # the read side rejects a negative code for the whole column). A vertex with
            # no entity is not written.
            - { name: entity_index, dtype: i64 }
            - { name: x, dtype: f32 }
            - { name: y, dtype: f32 }
          layout: { kind: columnar_table }

    # ── spatial/visium-bundle — the vendor upload container ───────────────────────────
    #
    # Modelled exactly on `single-cell/matrix-mtx`, including the `|`-alternation, which
    # is the core's ONE matching sugar and exists for precisely this kind of vendor
    # rename: Space Ranger <=1.x wrote a headerless `tissue_positions_list.csv`, >=2.0
    # wrote `tissue_positions.csv` with a header.
    #
    # An opaque container DOES still declare its axis IDENTITY. That is not a structure
    # claim: `dataset/routes.rs` validates a SUPPORTING FILE's axis against
    # `reg.axes_for(dataset.datatype)`, and for an uploaded bundle that datatype IS this
    # container — with no axes, every axis is unknown and attaching a per-entity
    # annotation CSV 422s. Analysability is gated by `extends: data/opaque`, never by
    # withholding axes; conflating the two once cost a working feature.
    #
    # MEMBER MATCHING IS BY BASENAME and grouping returns nothing unless EXACTLY ONE file
    # matches each member. Two consequences, both deliberate:
    #   * the `.h5` is the declared member and the MEX directory is not — the filtered and
    #     raw `matrix.mtx.gz` collide on basename;
    #   * VISIUM HD CANNOT USE THIS PATH. Its `binned_outputs/square_002um|008um|016um/`
    #     directories each contain identically-named files, so every member has three
    #     candidates and grouping returns nothing. That needs either a per-bin upload or a
    #     directory-aware member matcher, and it is a shared platform item — NOT something
    #     to work around in this declaration or in the importer.
    - id: spatial/visium-bundle
      extends: data/opaque
      title: Visium (Space Ranger outs)
      description: >-
        A 10x Visium Space Ranger `outs/` bundle, where the filtered matrix, the tissue
        positions, the scale factors and the tissue image JOINTLY form one dataset. An
        opaque raw input; the spatial importer converts it into coordinates, an image and
        the expression matrix analysis runs on. The bundle is retained after import, so
        the vendor's own image files stay recoverable — note that Space Ranger ships no
        full-resolution image: `tissue_hires_image.png` is 10x's own downscale, so what is
        recoverable is the SOURCE the derivative was built from, not the instrument's
        pixels.
      is_abstract: false
      axes:
        - { name: cells, key_label: barcode }
        - { name: genes, key_label: gene_id }
      entity_axis: cells
      storage:
        layout: { kind: opaque_as_is }
        format: spaceranger
        file_layout: manifest
      input_requirements:
        requires: manifest
        members:
          - "filtered_feature_bc_matrix.h5"
          - "tissue_positions.csv|tissue_positions_list.csv"
          - "scalefactors_json.json"
          - "tissue_hires_image.png"
        allow_archive: true
      # TWO markers, and the second one is the one that WORKS.
      #
      # `mtx-trio-target` is the literal the CORE enumerates: the upload planner calls
      # `reg.types_with_capability(MANIFEST_GROUP_CAPABILITY)`
      # (`dataset/repository.rs::manifest_group_specs`), and that constant's VALUE is
      # `"mtx-trio-target"`. The core's own doc-comment says why the value looks
      # domain-specific and is not — *"a CAPABILITY name, not a datatype id — the
      # vocabulary of the declaration seam itself, which every contributed domain shares
      # … the Rust identifier is generic because nothing in the core is 10x-specific"* —
      # so a contributed domain opts into multi-member auto-grouping by declaring this
      # exact string. Declaring only a descriptively-named marker would have declared
      # nothing: the type is never enumerated, no `ManifestGroupSpec` is built, and a
      # Space Ranger `outs/` upload silently lands as four unrelated single-file datasets
      # with no error anywhere. Multiple carriers are explicitly supported —
      # `plan_upload_groups_by_name` takes a SLICE and picks the first carrier whose
      # members actually match, "instead of being the only one ever consulted" — so this
      # costs the existing 10x trio nothing.
      #
      # `spatial-bundle-target` stays as the descriptive dispatch marker for anything that
      # wants to find the spatial upload container by name rather than by the seam's
      # legacy spelling. It is not load-bearing on its own; the line above it is.
      #
      # (The VALUE is a legacy spelling of a generic seam and reads as domain-specific to
      # the next reader. Renaming it is a core change and therefore not this leaf's to
      # make — reported to the owner instead of worked around.)
      capabilities: [mtx-trio-target, spatial-bundle-target]

    # ── spatial/xenium-bundle — the SECOND vendor upload container (#162) ─────────────
    #
    # Modelled line-for-line on `spatial/visium-bundle` above, including BOTH capability
    # markers and the reasoning for them. It lives here rather than in the importer package
    # for one downstream reason: #163 (`cell_boundaries` -> `spatial/boundaries`) and #164
    # (`transcripts.parquet` -> `spatial/transcripts`) both operate on THIS SAME BUNDLE, so
    # the container must not be owned by the phase-1 importer or those items would inherit a
    # dependency on it.
    #
    # THREE MEMBERS, and the image is deliberately not among them. Member matching is by
    # BASENAME and grouping returns nothing unless EXACTLY ONE file matches each member —
    # and the morphology image's name MOVES between XOA versions
    # (`morphology_focus.ome.tif` -> `morphology_focus/morphology_focus_0000.ome.tif` ->
    # `morphology_focus/ch####_<stain>.ome.tif` on an XOA 4 protein run), so declaring it
    # would make the whole bundle ungroupable on exactly the versions it was added for.
    # `experiment.xenium` names its own images, so the importer follows the vendor's own
    # pointer instead. Verified: these three basenames each match EXACTLY ONE file in two
    # real bundles (XOA 3.0.0.15 and XOA 4.0.0.19).
    #
    # `cells.csv.gz` and NOT `cells.parquet`, which carries the identical values: no parquet
    # reader is pinned anywhere in this tree, and the CSV was verified BIT-EXACT to the
    # parquet at float32 on both real bundles because the vendor writes 17 significant
    # digits. #164 does NOT inherit that luxury — `transcripts.parquet` has no `.csv.gz`
    # sibling — and that is recorded rather than discovered later.
    #
    # `cell_boundaries.*` and `transcripts.*` are NOT members: they belong to #163/#164, and
    # a member nothing reads is a claim this container cannot honour. They stay in the
    # retained bundle either way.
    - id: spatial/xenium-bundle
      extends: data/opaque
      title: Xenium (Onboard Analysis outs)
      description: >-
        A 10x Xenium Onboard Analysis `outs/` bundle, where the cell-feature matrix, the
        per-cell table and the run manifest JOINTLY form one dataset. An opaque raw input;
        the spatial importer converts it into coordinates in micrometres, a morphology image
        and the expression matrix analysis runs on. The bundle is retained after import, so
        the vendor's own images, cell boundaries and transcript table stay recoverable —
        note that unlike Visium, the retained morphology image IS the instrument's own
        full-resolution pixels, and what the importer emits from it is a downsampled display
        derivative.
      is_abstract: false
      # `key_label: barcode`, NOT `cell_id`, and the vendor's own word is not lost — it is
      # the LABEL of the emitted axis-key column and it is in the report. Three reasons,
      # in increasing order of how much they cost to ignore:
      #
      # 1. §9 says it in as many words: "The entity axis must remain `cells` with
      #    `key_label: barcode` … the axis name is a JOIN KEY, not a biological claim."
      #    The rule is stated there for the OPPOSITE case (a Visium spot is not a cell and
      #    is still called `barcode`), which is exactly why it also binds here.
      # 2. `spatial/coordinates` and `spatial/visium-bundle` both already declare `barcode`,
      #    and this container's rows ARE the coordinates' rows. Declaring two labels for one
      #    axis is a fork of the vocabulary, not a vendor accommodation.
      # 3. It is what the lattice guard measures. An entity-axis key anchored by NO datatype
      #    declaring `ingest:` must carry a stated disposition in
      #    `_lib/model_coverage_exempt.json` — `cell_id` is anchored by nothing, so
      #    declaring it turned `spatial-types/tests` red and would have turned two Rust
      #    guards red with it. The design divergence and the gate failure were the same
      #    defect, which is the most useful kind of finding.
      axes:
        - { name: cells, key_label: barcode }
        - { name: genes, key_label: gene_id }
      entity_axis: cells
      storage:
        layout: { kind: opaque_as_is }
        format: xenium-onboard-analysis
        file_layout: manifest
      input_requirements:
        requires: manifest
        members:
          - "cell_feature_matrix.h5"
          - "cells.csv.gz"
          - "experiment.xenium"
        allow_archive: true
      # The SAME two markers as `spatial/visium-bundle`, for the same reasons recorded
      # there: `mtx-trio-target` is the literal the CORE enumerates
      # (`dataset/repository.rs::manifest_group_specs`), without which the type is never
      # enumerated, no `ManifestGroupSpec` is built, and a Xenium `outs/` upload silently
      # lands as N unrelated single-file datasets with no error anywhere;
      # `spatial-bundle-target` is the descriptive marker.
      #
      # A SECOND carrier costs the first one nothing: `plan_upload_groups_by_name` takes a
      # SLICE and "picks the first carrier whose members actually match, instead of being
      # the only one ever consulted". The two member sets are disjoint — no Space Ranger
      # `outs/` contains `experiment.xenium` and no Xenium bundle contains
      # `tissue_positions.csv` — so neither can match the other's files.
      capabilities: [mtx-trio-target, spatial-bundle-target]

    # ── spatial/visium-hd-bundle — the THIRD vendor upload container (#160) ───────────
    #
    # The one this platform could not express before. Visium HD writes
    # `outs/binned_outputs/square_002um|008um|016um/`, and **each of those mirrors a full
    # Visium `outs/`** (`docs/research/data-processing/01-file-formats.md:607-615`), so under
    # BASENAME-only member matching every member of `spatial/visium-bundle` above has three
    # candidates and `detect_manifest_group` returns nothing — the comment on that container
    # says exactly this, and says the fix is core, not a workaround here.
    #
    # #160 landed that core fix: **a declared member now matches on as many trailing path
    # segments as it declares** (`dataset/repository.rs::matches_member`). A member with no
    # separator still matches on the basename — which is why nothing above changes — and a
    # member with K separators matches the candidate's last K+1 segments. So this container
    # does not ask the core to learn anything about 10x; it declares its own depth, which is
    # pure DATA, and the next vendor that NESTS its bundle does the same.
    #
    # The scope of that claim, stated rather than implied: the rule generalizes over
    # DIRECTORY NESTING and over a closed set of directory literals. It does NOT generalize
    # over a varying LEAF name. Matching compares whole SEGMENTS for equality, after two
    # normalizations that are transport conventions rather than pattern syntax (per-segment
    # ASCII lowercase, and one compression suffix off the leaf — both pinned by the case
    # table beside the core), plus exactly one piece of pattern sugar: `|`-alternation over
    # literal spellings. There is no intra-segment wildcard, so a platform that names its
    # primary files
    # after the run (`<sample>_exprMat_file.csv`, `<puck>_BeadLocationsForR.csv`,
    # `<SN>.raw.gef`) cannot be declared with this mechanism at all, and neither can a
    # discriminating directory whose names are not literals (MERSCOPE's `region_N/`). Those
    # want an intra-segment wildcard with a capture that must AGREE ACROSS members, which is
    # a different rule rather than a bigger one and would land in four implementations.
    #
    # ONE DATASET, THREE RESOLUTIONS — and that is the design's answer, not a convenience.
    # §14's invariant line for #160 reads "a Visium HD `binned_outputs/` archive **groups
    # into one dataset**". §15.1 is why: the bins "coexist correctly already — each is a
    # distinct `key_sequence_digest`", and artifacts "sharing a run and differing only in
    # `measured_entity` form a **resolution group**". Three separate datasets would make
    # "sharing a run" unrepresentable at the upload boundary — nothing would stop the 8 um
    # bin of one run pairing with the 16 um bin of another — and 10x's own
    # `barcode_mappings.parquet`, the file that relates 2 um <-> 8/16 um <-> cell_id, is
    # emitted ONCE at the run root, outside every `square_NNNum/`.
    #
    # TWELVE MEMBERS: the four files that DIFFER per bin, for each of the three bins Space
    # Ranger writes by default. Note the two depths — the matrix sits directly under the bin
    # directory (K=2) while positions/scalefactors/image sit under its own `spatial/` (K=3) —
    # which is exactly why the rule is "the member's OWN segment count" and not a fixed depth.
    #
    # WHAT IS DELIBERATELY NOT A MEMBER, following the rule `spatial/xenium-bundle` records
    # above (a member whose presence or spelling MOVES makes the WHOLE bundle ungroupable,
    # and a member nothing reads is a claim the container cannot honour):
    #   * `barcode_mappings.parquet` and `feature_slice.h5` at the run root. They are the
    #     REASON this is one dataset and they are still not declared, because no real Visium
    #     HD bundle was available to verify their presence and spelling against, and an
    #     unverified member is a bundle-wide failure rather than a missing member. The HD
    #     importer item declares them once it can check them against real bytes.
    #
    #     WHAT THAT COSTS, STATED. The wizard's FOLDER arm uploads only the declared
    #     members, and the upload route refuses a declared bundle carrying anything else —
    #     so on that path these two files are not merely undeclared, they are structurally
    #     ABSENT from the stored dataset. That matters more for HD than the equivalent
    #     exclusions do elsewhere: `feature_slice.h5` carries HD's four named 3x3 transforms
    #     (`docs/research/spatial-platforms/03-output-matrix.md`, on the branch
    #     `origin/docs/research-spatial-platforms`, records the registration as "supplied,
    #     but buried" there,
    #     with a row flip and negative coordinates), and the per-bin `scalefactors_json.json`
    #     alone does not reconstruct it. A run whose registration must be preserved should be
    #     uploaded through the ARCHIVE arm, which retains the tree whole — the folder arm's
    #     hint says so. Closing this properly means declaring both files against a real
    #     bundle, which is a member-list change and a version bump, and it is the second
    #     thing the HD importer item owes after the sandbox-staging fix (the member ORDER is
    #     the sandbox slot contract until staging carries the path — pinned by
    #     `tests/test_hd_bundle_container.py::test_the_declared_member_ORDER_is_pinned`).
    #   * the MEX directories (`filtered_feature_bc_matrix/matrix.mtx.gz`) — the same
    #     basename collision that made `spatial/visium-bundle` declare the `.h5`, and the
    #     `.h5` carries the same values.
    #   * `analysis/`, `web_summary.html`, `molecule_info.h5` — nothing reads them.
    #
    # THE ONE ASSUMPTION, STATED: that a run writes all three default bins. If it does not,
    # every member of the absent bin has zero candidates and the upload is REFUSED by name
    # listing exactly those members (`MANIFEST_GROUP_INCOMPLETE`) — a loud, self-explaining
    # failure rather than a silent partial import. That is the correct failure mode for an
    # assumption that could not be checked against real bytes.
    #
    # THAT REFUSAL IS TRUE ONLY FOR A LOOSE-FILE (FOLDER-MODE) UPLOAD; that paragraph is
    # corrected rather than removed, because a disclosure of absence and its retirement
    # are the same claim in two directions. An ARCHIVE upload of this declared type takes
    # a different path: `dataset/routes.rs`'s `archives_only` escape (in the
    # `ManifestGroupOutcome::Gap` arm) fires when every declared member is missing and
    # every uploaded filename is an archive (`is_archive_name`), and when it fires the
    # `MANIFEST_GROUP_INCOMPLETE` refusal is SKIPPED — the archive is stored as-is
    # (`opaque_as_is`) and its contents are never expanded or re-checked against the
    # declared member list anywhere in the server (there is no archive expansion in
    # src-app/server at all). The server's own test
    # `several_archives_of_a_declared_manifest_type_still_upload`
    # (`tests/dataset/hd_bundle_group_test.rs`) proves the path exists and is exercised:
    # it asserts archives upload with HTTP 200 and never inspects their contents. So the
    # completeness guarantee above does NOT hold for an archive upload: a one-bin archive
    # can produce a dataset this declaration implies has three bins, and nothing in the
    # server refuses it or flags it. Whether the archive arm should validate contents on
    # expansion, or the declaration should instead record archives as unvalidated, is an
    # open owner decision — this comment records only the current fact, for #440.
    - id: spatial/visium-hd-bundle
      extends: data/opaque
      title: Visium HD (Space Ranger binned_outputs)
      description: >-
        A 10x Visium HD Space Ranger `binned_outputs/` bundle: the 2 um, 8 um and 16 um
        square-bin outputs of ONE run, which jointly form one dataset with three
        resolutions rather than three unrelated datasets. Each bin contributes its own
        matrix, tissue positions, scale factors and tissue image, and the declared members
        name their bin so the 8 um bin can never be mistaken for the 2 um one. An opaque raw
        input, retained after import.
      is_abstract: false
      # THE AXES ARE DECLARED, and the first cut of this container got that wrong.
      #
      # The tempting argument is that an HD bundle holds THREE row spaces (11.2M / 702k /
      # 176k rows), so a single `cells` axis asserts an identity it does not have, and
      # withholding axes is the honest refusal. It is not: the shipped rule
      # (`ui/src/modules/workbench/core/manifest/datatypeShape.test.ts`'s INV-7, and the
      # sibling containers' own comments) is that a container a USER HANDS OVER — one
      # declaring `input_requirements` — must declare the axis VOCABULARY a supporting file
      # aligns to, because `dataset/routes.rs` validates a supporting file's axis against
      # `reg.axes_for(dataset.datatype)` and with no axes every axis is unknown, so attaching
      # an annotation table to an upload is refused. The visium container above records that
      # "conflating the two once cost a working feature"; withholding them here reproduced
      # exactly that, and the shipped test caught it. `spatial/image` and `spatial/labels`
      # declare no axes because nobody HANDS THEM OVER — they have no `input_requirements` —
      # which is the distinction the first cut missed.
      #
      # Nor does declaring `cells` claim one row space: design SS9 — "the axis name is a JOIN
      # KEY, not a biological claim" — is the same rule that makes a Visium spot and a Xenium
      # cell both `barcode`. Which resolution a given emitted artifact describes is carried
      # by `measured_entity` at write time (SS15.1: bins differing only in `measured_entity`
      # form a resolution group), which is where that distinction belongs and where it is
      # readable.
      axes:
        - { name: cells, key_label: barcode }
        - { name: genes, key_label: gene_id }
      entity_axis: cells
      storage:
        layout: { kind: opaque_as_is }
        format: spaceranger-hd
        file_layout: manifest
      input_requirements:
        requires: manifest
        members:
          - "square_002um/filtered_feature_bc_matrix.h5"
          - "square_002um/spatial/tissue_positions.parquet"
          - "square_002um/spatial/scalefactors_json.json"
          - "square_002um/spatial/tissue_hires_image.png"
          - "square_008um/filtered_feature_bc_matrix.h5"
          - "square_008um/spatial/tissue_positions.parquet"
          - "square_008um/spatial/scalefactors_json.json"
          - "square_008um/spatial/tissue_hires_image.png"
          - "square_016um/filtered_feature_bc_matrix.h5"
          - "square_016um/spatial/tissue_positions.parquet"
          - "square_016um/spatial/scalefactors_json.json"
          - "square_016um/spatial/tissue_hires_image.png"
        allow_archive: true
      # The SAME two markers as the two containers above, for the reasons recorded there:
      # `mtx-trio-target` is the literal the CORE enumerates
      # (`dataset/repository.rs::manifest_group_specs`), without which this type is never
      # enumerated, no `ManifestGroupSpec` is built, and nothing groups; `spatial-bundle-target`
      # is the descriptive dispatch marker.
      #
      # A THIRD carrier costs the first two nothing, and here that is a fact about the member
      # sets rather than a hope: every member of this container carries a `square_NNNum/`
      # segment, which no plain-Visium and no Xenium bundle contains, and every member of
      # those two is a bare basename that an HD upload supplies three times over — so on an HD
      # upload the plain-Visium carrier still refuses (three candidates) instead of quietly
      # taking one bin, and on a plain-Visium upload this carrier finds nothing.
      capabilities: [mtx-trio-target, spatial-bundle-target]
