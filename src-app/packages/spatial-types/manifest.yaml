# spatial-types — the spatial storage vocabulary, as pure DATA (#152, epic #151).
#
# Realizes §6 + §15 of `docs/design/spatial-storage-layout.md` (branch
# `docs/spatial-design-revisions`; read §15 first — it is the owner-approved revision set
# applied after the 17-platform stress test, and it WINS where it disagrees with an
# earlier section).
#
# ── THE THESIS THIS PACKAGE RESTS ON ────────────────────────────────────────────────
# Modelled on `open-kinds`, which is the tree's proof that a new KIND costs ZERO core
# Rust: a datatype is a DECLARATION, and the byte plane serves it because it routes on
# LAYOUT, never on a domain kind. Adding this whole package is a new `packages/<id>/`
# folder (auto-baked by `extensions/embedded.rs`'s `include_dir!`, extracted per the
# per-file digest in `.seed-manifest.json`) and it touches ZERO app-core file. Nothing
# below introduces a fourth `structure.kind`: every declaration is `table` (a columnar
# or dense Zarr member) or `opaque` (bytes with a media type and no member structure).
#
# Datatypes-only, converter-less manifest — the loader tolerates a run-entry-free
# manifest, it only iterates converters. Parsed at boot by `extensions/loader.rs`, merged
# into the datatype registry by `datatype/mod.rs::init` via
# `DatatypeRegistry::build_from_embedded()`.
#
# ── WHAT IS DELIBERATELY ABSENT ─────────────────────────────────────────────────────
# * `spatial/transcripts` and the `transcript` axis. DEFERRED by owner decision (#164),
#   not overlooked: they buy exactly ONE analysis family (subcellular localization, the
#   one with zero benchmarks), they are by far the largest artifact (213M rows / 5.2 GB
#   for one section), they cannot be rendered (there is no server-side point-tile
#   protocol, #165), and they do not align to `cells`, so masks and virtual datasets
#   cannot touch them while a large fraction of detections are unassigned to any cell —
#   which would make "filter to these 500 cells" silently wrong over the point cloud.
#   The raw `transcripts.parquet` stays in the stored vendor bundle, so nothing is lost
#   permanently. §6.5 of the design stands as recorded intent. Re-open with a concrete
#   subcellular analysis, or once #165 exists.
# * A `spots` axis. REFUSED (#175 §5) — see the `cells` note under `axes` below.
# * A section→section transform. REFUSED (#175 §2): serial-section registration is
#   frequently NON-LINEAR (PASTE2, STalign), so recording an affine would encode a false
#   precision and mislead every consumer that trusted it. Better to record nothing than
#   to record a wrong shape. `compute/spatial_declarations.py` REFUSES a transform-shaped
#   key inside `section` so a producer cannot smuggle one in as a free-form extra.
# * Volumetric segmentation geometry. A `vertex` table encodes a 2-D polygon; a 3-D mesh
#   is not expressible in it — and SpatialData cannot express one either (`force_2d` is
#   public API, "3D polygons/meshes are not implemented", 3-D roadmap open since Jan
#   2023). A limit of the ecosystem, recorded (#175 §1), not a gap to close here.
#
# ── WHERE THE WRITE-TIME HALF LIVES ─────────────────────────────────────────────────
# Four fields are `[FIELD-NOW]` (owner-approved, #174) and are UNRECOVERABLE from the
# bytes once artifacts exist: `measured_entity`, the always-2-D rule, `positioning` and
# `section`. They are stamped into an artifact's output-entry `meta` at write time, so
# their contract is EXECUTABLE and lives in `compute/spatial_declarations.py` beside this
# file — NOT in `_lib`, which is framework code that must hold no domain vocabulary
# (`txr_columns.py`'s own INV-5, and the reason #80's merge was blocked once). The
# importer (#154) VENDORS that module verbatim, the way `embedding` vendors
# `cell-filter`'s predicate kernel, because `run.helpers` is confined to a package's own
# tree.
# ── KNOWN GAPS, RECORDED SO THEY ARE NOT RE-DISCOVERED (epic #151 reconciliation) ────
# The epic reconciliation matched every downstream item's assumed contract against what
# this leaf actually declares. Two gaps were epic-fatal and are CLOSED here — the upload
# container's grouping marker, and the micron scale of a pixel coordinate space (see
# `compute/spatial_declarations.py`, `require_micron_scale`). These four are real and
# deliberately NOT closed here, so the next reader finds them stated rather than absent:
#
#   * NOTHING REQUIRES A `spatial/image` TO DECLARE ITS COORDINATE SPACE. An image with no
#     placement writes green today and is simply un-overlayable — the failure surfaces as
#     a picture that will not line up, with nothing anywhere saying why. A manifest cannot
#     express "this output entry's `meta` must carry these keys"; closing it means a
#     write-time requirement in the producer (#154) or a conformance rule, not a
#     declaration here.
#   * THE PYRAMID AND ONE-BLOB RULES ARE ASSUMED BY THE READER AND UNSTATED ON THE KIND.
#     The viewer needs a pyramidal OME-TIFF and reads it by range from ONE blob; both are
#     conventions between the importer and the reader rather than declared facts. Note this
#     also settles the §6.3-vs-§15.5 tension about Xenium's multi-file `morphology_focus/`:
#     there is no member-listing API, so a multi-file image would be UNDISCOVERABLE — one
#     logical image must resolve to one blob, which is why `file_layout: single`.
#   * `geometry_role` — a boundary set does not say WHAT it bounds (a cell membrane, a
#     nucleus, a tissue region). One `spatial/boundaries` artifact per role is
#     distinguishable only by its sibling offset columns' names today. It is the same
#     class as `measured_entity` (identity, not shape) and it is the obvious next
#     `[FIELD-NOW]` candidate if a second boundary set ever ships from one run.
#
id: spatial-types
name: Spatial Types
publisher: txr
# 0.4.0 — #160 adds `spatial/visium-hd-bundle`, the third vendor upload container and the
# first whose members carry a path segment (the core now matches a member on as many
# trailing segments as it declares).
# 0.1.0 — the initial declaration set: four spatial kinds, one vendor upload container,
# one new axis (`vertex`), and the write-time contract for the four `[FIELD-NOW]` fields.
# Seed reconciliation is version-keyed; a change to any file in this package must move
# this number, so a provisioned deployment re-extracts onto the new lattice instead of
# keeping a stale one.
