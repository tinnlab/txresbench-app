#          AUDIT ROUND 2 — the `git diff` call moved out of both `test_*` functions into a
#          new `package_touched_since_origin_main()` helper in `xenium_fixtures.py` (mirroring
#          `origin_main_text`) so it no longer trips `_lib`'s branch-diff sweep; the
#          "package untouched" case now SKIPS instead of asserting `>=` — which could wrongly
#          redden a branch behind `origin/main` that never touched the package.
#          TEST-ONLY: no `compute/` file, no emitted artifact, no declaration, no manifest row
#          and no refusal message text moves; the version moves because
#          check-processor-seed-versions.sh is base-relative over the whole package directory,
#          tests/ included.
# 0.14.1 — #453: the vendored `tests/refusal_sites.py` AST guard is renamed to
#          `tests/xenium_refusal_sites.py` — TEST-ONLY, no `compute/` change. Three
#          packages each carried a copy of a test-support module with the SAME basename,
#          and a shared-process pytest run bound `sys.modules["refusal_sites"]` to
#          whichever copy imported FIRST, so this package's suite could be scanned with
#          visium's classifier (expecting `VisiumImportError`) and three tests went red.
#          Distinct basenames make the collision impossible. The constraint the module's
#          own old docstring cited — promoting to a shared module was blocked because
#          visium/visium-hd/xenium had live sibling branches — has now relaxed (all three
#          packages are idle as of `c8d9eb5e0`), but distinct names were chosen over
#          promotion: cheaper, needs no classifier change, cannot alter any rule table,
#          and the `REFUSAL` constant genuinely differs by package (this one is
#          `XeniumImportError`), so full byte-identity is not the goal. The version moves
#          because check-processor-seed-versions.sh is base-relative over the whole
#          package directory, tests/ included.
# 0.14.2 — #432: the two vendored shared modules' false registration-overlay claims are
#          corrected and RE-VENDORED byte-identically. The `ome_writer.py` and `spatial_declarations.py`
#          docstrings carried the #176-era sentences ("#156's registration overlay is the only
#          real check" and "`spatial-import-xenium` does that cross-check and refuses the image on a
#          disagreement") as LIVE claims; they are now quoted beside their retirement markers and
#          followed by the true statement: a registration overlay exists for ALL THREE producers (Visium
#          #156, this package #301 and Visium HD #313), each measuring a DIFFERENT platform referent
#          (this package's scores its cell centres through the declared `to_space` against the
#          morphology-pixel signal mask at `SIGNAL_LIFT_FLOOR = 0.4`, and scores both vendor-statement
#          placements side by side when they disagree). #269's posture is stated: `stated_scale_agreement`
#          measures the TWO vendor statements and returns `(stated_scales, warning_or_None)`, the call
#          site appends the warning to `pending_warnings`, and the image is emitted with both raw numbers
#          and `applied_source` recorded. The residue — a uniform error under about 2% wrong
#          the same way in both statements, which still passes every INTERNAL check — is
#          measured rather than closed: the overlay NARROWED the hole (a 2% misscale scores
#          signal-lift 0.303, BELOW the 0.4 floor, so about 2% is the boundary and the
#          unresolved band lies strictly under it), per this package's own
#          `tests/test_scale_referent.py` residue proof.
#          Docstring prose + re-vendor only: no emitted byte, no declaration, no computed number moves.
version: 0.14.2
apiVersion: "1.0"
contributes:
  analyses:
    - id: spatial.import-xenium
      category: data-io
      title: Import Xenium (Onboard Analysis)
      description: >-
        Read an uploaded 10x Xenium Onboard Analysis `outs/` bundle and emit the expression
        matrix, the per-cell tissue map in micrometres, and the morphology image — so an
        imaging-based single-cell dataset becomes an ordinary, analysable dataset with a
        place on a slide.
      whenHint: >-
        the user uploaded a Xenium Onboard Analysis output bundle (a cell-feature matrix,
        a cells table, an experiment manifest and a morphology image) and wants the cell
        positions, the counts and the tissue image imported
      examples:
        - import this Xenium bundle
        - load the xenium onboard analysis outputs
        - bring in the cell centroids and the counts
      safety: read-run
      # WHICH ANALYSIS ENVIRONMENT these pins must be satisfiable in. Required since E3
      # landed a SECOND recipe (`single-cell-r`): the #80 build gate resolves every declared
      # dependency against every recipe on disk, so an undeclared contribution would demand
      # that numpy/h5py/tifffile be installed in the deliberately-narrower R env too. The
      # gate's own doc-comment prescribes exactly this fix — "the right relaxation is for a
      # contribution to DECLARE the env it targets, not for this gate to guess".
      env: single-cell
      # ONE slot. The bundle is already ONE dataset by the time it reaches here —
      # `spatial/xenium-bundle` declares `mtx-trio-target`, so the upload planner
      # auto-groups the three members into a single dataset. Binding the members
      # individually here would re-open a grouping the container already did.
      appliesTo:
        - slot: bundle
          type_id: spatial/xenium-bundle
          auto_bind_sole_candidate: true
      # `single-cell/counts`, not the abstract `single-cell/expression`: a Xenium
      # `cell_feature_matrix.h5` holds INTEGER TRANSCRIPT COUNTS, which is what
      # `single-cell/counts` means and what `qc.10x` requires. It `extends:
      # single-cell/expression`, so every shipped `subtypes_of: single-cell/expression`
      # selector still resolves it — which is the whole basis of the backwards-compatibility
      # claim: nothing downstream needs to know it is spatial.
      produces:
        - single-cell/counts
        - spatial/coordinates
        - spatial/image
        # #163. Emitted only when the bundle carries a `cell_boundaries.parquet`; `produces`
        # is the set this analysis CAN emit, not the set every run does — the same reading
        # `spatial/image` already has (a bundle whose morphology image is unreadable emits
        # none, and the report says so).
        - spatial/boundaries
        - metadata-column
        - report/qc
        - report/html
      run:
        kind: sandbox
        runtime: python
        entry: compute/import_xenium.py
        # BOTH helpers are VENDORED VERBATIM from `spatial-types/compute/` and staged beside
        # the entry. The platform confines `run.helpers` to a package's OWN tree, so
        # vendoring is the idiom (`spatial-import-visium` vendors `spatial_declarations.py`
        # the same way), not an exception. `tests/test_vendored_contract.py` byte-compares
        # every copy against its source of truth — a vendored file that drifts is a second
        # implementation wearing the first one's name.
        helpers:
          - compute/spatial_declarations.py
          - compute/ome_writer.py
          # This package's OWN: the reduction of a Xenium morphology stack to the single
          # plane the shared writer accepts, with the selection declared. Not vendored —
          # nobody else has a copy.
          - compute/xenium_image.py
          # This package's OWN, and the one #163 adds: the `cell_boundaries.parquet` reader
          # and the ragged -> long-table-plus-offsets encoding. Not vendored — it is the
          # first implementation of design §6.4's encoding anywhere in the tree, and if a
          # second producer ever needs it (`spatial/transcripts`, #164) the promotion to
          # `spatial-types/compute/` is the same move `ome_writer.py` already made.
          - compute/boundaries.py
          # This package's OWN, and the one #301 adds: design §7.5's registration QC overlay.
          # Staged for the same reason every other helper is — the entry imports it by BARE
          # NAME, and in `/code` a bare name resolves to whatever `run.helpers` put beside the
          # entry. An undeclared helper is an ImportError inside a user's sandbox with no
          # build-time signal at all.
          #
          # NOT vendored, and not shared with the sibling that has a file of the same name.
          # `spatial-import-visium/compute/registration_qc.py` measures a Visium slide's
          # manufactured spot pitch and scores a tissue mask against the vendor's `in_tissue`
          # flag; Xenium has neither. The two are different checks that answer the same design
          # section, which is why each package owns its own — and why
          # `tests/test_vendored_contract.py` does NOT byte-compare them.
          - compute/registration_qc.py
        dependencies:
          - { library: numpy, version: ">=2.0,<3" }
          - { library: pandas, version: ">=2.2,<3" }
          - { library: scipy, version: ">=1.14,<2" }
          - { library: h5py, version: ">=3.10,<4" }
          - { library: tifffile, version: ">=2024.1.1" }
          # #163. The parquet reader `compute/boundaries.py` stands on. The range is open at
          # the top because pyarrow's parquet read API has been stable across majors and the
          # EXACT version is pinned in the recipe, which is the file that decides what is
          # installed; a tight range here would only add a second place to bump.
          - { library: pyarrow, version: ">=14,<26" }
          # THE ONE NEW DECLARATION, and it is not optional decoration: every Xenium
          # morphology OME-TIFF is JPEG-2000 compressed and `tifffile` raises
          # `ValueError: <COMPRESSION.JPEG2000: 34712> requires the 'imagecodecs' package`
          # without it. #155 deliberately declined this library for Visium ("it is the LZW
          # backend, and DEC-2 writes `deflate`"); that reasoning was correct for a vendor
          # that ships PNGs and does not survive one that ships JPEG-2000.
          #
          # A RANGE, not a pin, for the same reason #155 used ranges: the HOST that runs
          # `just check-py` carries an older build than the rootfs (2025.3.30 vs
          # 2025.11.11) and BOTH must satisfy the declaration — otherwise the gate that has
          # to run this code cannot.
          #
          - { library: imagecodecs, version: ">=2024.1.1" }
          # #301. DECLARED NOW, AND THIS INVERTS A STANDING REFUSAL rather than quietly
          # adding a line. Until this version the reasoning here read: "`pillow` is deliberately
          # NOT declared: it is the PNG reader Visium needs and no Xenium bundle ships a PNG.
          # Declaring a library no code path imports is the unconsumed-pin shape the
          # requirements file refuses." Both halves of that are still true about READING a PNG,
          # and both stop mattering: `compute/registration_qc.py` WRITES one, on the path every
          # run with a morphology image takes. The pin is consumed, so the refusal that rested
          # on it being unconsumed is gone — the same in-place inversion `pyarrow` got at
          # 0.3.0, with the old reasoning kept rather than deleted.
          #
          # A RANGE, not a pin, for the reason #155 used ranges: the HOST that runs
          # `just check-py` carries an older build than the rootfs (12.2.0 vs 12.3.0) and BOTH
          # must satisfy the declaration. Already pinned in
          # `env-rootfs/single-cell/requirements.txt` at 12.3.0 and already declared by
          # `spatial-import-visium`, so no content lock moves and no image republish follows.
          #
          # WHAT DOES NOT CHANGE: the vendored `ome_writer.py` still names `PIL` only inside
          # `read_image`'s PNG branch, as a LAZY import in a function this importer never calls
          # (it goes through `xenium_image.read_plane`, because every Xenium morphology image
          # is a TIFF whose axis order `read_image` refuses by design). A module-level import
          # there would make `pillow` a hard requirement of every consumer of the shared
          # helper, which it is not. `tests/test_package_registration.py` asserts that half
          # unchanged, and asserts the new half in both directions so neither can rot.
          - { library: pillow, version: ">=10,<14" }
      schedule:
        class: normal
      arch: [x86_64, aarch64]
      methodsText: >-
        Imported the 10x Xenium Onboard Analysis outputs: the cell-feature matrix was
        re-emitted as a cells x genes count matrix per feature class, per-cell centroids
        were recorded as coordinates in the micrometre frame of the imaged region, the
        segmentation that produced the cells was recorded, and the morphology image was
        placed into that same frame as a downsampled display derivative.
