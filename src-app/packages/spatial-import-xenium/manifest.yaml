# spatial-import-xenium — the Xenium bundle importer (#162, epic #151).
#
# THE SECOND IMPORTER, and that is its point. #154 shipped Visium and four items were built
# on top of it; this one exists to find out whether the spatial abstraction generalises past
# one vendor. Xenium is imaging-based single-molecule data, not spot-based capture, so it
# stresses exactly the assumptions a Visium-only design could have baked in.
#
# ── WHY THIS IS PURE DATA ────────────────────────────────────────────────────────────
#
# There is no package registry to edit. `extensions/embedded.rs` bakes the whole
# `src-app/packages` tree in with one `include_dir!`, extracts it to `<data_root>/
# processors/` on boot, and the loader SCANS the extracted folder. A directory that exists
# is a package that is registered. So this file plus `compute/` is the whole of the
# contribution, and `tests/test_zero_src_app_diff.py` is what holds that shut.
#
# The non-package edits this branch makes are the hand-maintained ENUMERATIONS the platform
# has no way to derive, each with a guard that fails loudly when it is not updated:
# `packages/pytest.ini` (`testpaths`), `_lib/model_coverage_exempt.json` (the producer
# register), and `_helpers`' spatial-arm set. Zero Rust, zero TypeScript, zero `ui/`.
#
# ── WHERE XENIUM GENUINELY DIVERGES FROM VISIUM ──────────────────────────────────────
#
# Each of these is a DECISION with a reason, not an accident. The full argument is in
# `.lifecycle/spatial-import-xenium/DECISIONS.md`; the short forms:
#
# * **The coordinates are already MICROMETRES** (DEC-4). Visium stores full-resolution
#   PIXELS and derives a `microns_per_pixel` from `spot_diameter_fullres`. Xenium's
#   `x_centroid`/`y_centroid` are microns, so the space declares `unit: "micrometre"` and NO
#   `microns_per_pixel` — `spatial_declarations.coordinate_space` REFUSES that field there,
#   and `require_micron_scale` answers 1.0 by definition. The class of defect that field
#   exists to prevent is STRUCTURALLY ABSENT on the coordinates rather than merely guarded.
#
# * **`cells.csv.gz`, not `cells.parquet`** (DEC-3). No parquet reader is pinned anywhere in
#   this tree, and pinning one moves the `env-rootfs` content lock and implies an image
#   republish. Measured: the CSV is BIT-EXACT to the parquet at float32 on two real bundles,
#   because the vendor writes 17 significant digits. So this costs no precision. **#164
#   inherits the unsolved half**: `transcripts.parquet` has no `.csv.gz` sibling.
#
# * **The image is a JPEG-2000 stack** (DEC-9/DEC-10/DEC-14). Every Xenium morphology
#   OME-TIFF is JPEG-2000 and is `YX`, `ZYX` or a 12-file `CYX`. `ome_writer.read_image`
#   refuses everything but a plain plane — correctly, and its comment names this exact
#   image as the case it guards against — so `compute/xenium_image.py` does the DECLARED
#   reduction to one plane before the shared writer is called. `imagecodecs` is required
#   (tifffile raises without it) and is ALREADY pinned in the rootfs, so no republish.
#
# * **Provenance is not in the matrix** (DEC-7/DEC-8). Xenium's h5 root attributes are
#   `{filetype, library_ids, original_gem_groups, version}` — no `software_version`, no
#   `chemistry_description`. Everything §7.4 wants is in `experiment.xenium`, which the
#   design's own table names for the Xenium row. And `library_ids` is the placeholder
#   `0000000_0000000` on real bundles, so deriving the coordinate-space id from it (the
#   Visium rule) would declare two unrelated experiments to share one frame. `roi_uuid` is
#   used instead — read through `vendor_statement` and #320's self-naming-field rule, so a
#   PLACEHOLDER `roi_uuid` is not an identity either (#323), and a run the vendor named nothing
#   usable in gets a frame derived from its own MEASUREMENT — the matrix's cell ids and the
#   centroids joined to them — and declared unverified, rather than one borrowed from the
#   directory it was mounted under.
#
# * **One row is a SEGMENTED CELL whose method can vary row by row** (DEC-12). `kind:
#   "cell"` requires a segmentation block, which is right — but XOA >= 3 mixes
#   boundary-stain, interior-stain and nucleus-expansion segmentation WITHIN ONE RUN
#   (measured: three methods across 358 cells in a real bundle) while
#   `measured_entity.segmentation.method` is a single string. The mixture is NAMED and the
#   per-cell truth is kept as a column. That the shared declaration cannot express it is a
#   finding against #152, reported upward rather than papered over.
#
# ── THE ONE SHARED-CODE DEFECT THIS BRANCH FIXES ─────────────────────────────────────
#
# `ome_writer._reconcile_scale` read `placement["microns_per_pixel"]` and REFUSED when it
# was absent, while `coordinate_space` REFUSES that same field for `unit: "micrometre"`.
# Two shared rules, mutually unsatisfiable — and since every Xenium image is 0.2125 um/pixel
# against the 0.5 um/pixel cap it is ALWAYS downsampled and therefore ALWAYS carries the
# provenance that triggers the refusal, so NO micron-space image could ever be emitted.
# Resolved through `SD.require_micron_scale`, the helper written for exactly that question.
# `ome_writer.py` moved to `spatial-types/compute/` in the same change, because a leaf
# importer should not be the source of truth for a sibling importer; both importers now
# vendor a byte-identical copy and `tests/test_vendored_contract.py` holds that shut.
#
# ── WHAT IS DELIBERATELY NOT HERE ────────────────────────────────────────────────────
#
# * NO `trigger: on-ingest` — #154's DEC-1 applies unchanged: an import that silently
#   REINTERPRETS an upload is not recoverable by undo, and this one mints a coordinate space
#   every later image and every later section places itself into. A user confirms it.
# * `spatial/boundaries` IS now emitted (#163) — the line above used to say it was not, and
#   this is that line advanced rather than deleted. What changed and what did NOT:
#     - `cell_boundaries.parquet` is READ when the bundle carries one, and turned into a
#       long `vertex`-axis table plus two sibling offset `metadata-column`s (design §6.4).
#       It is still NOT a declared member of `spatial/xenium-bundle` and must not become
#       one: grouping needs EXACTLY ONE file per member, so declaring it would make every
#       bundle without one ungroupable — and both real full-size Xenium bundles this was
#       verified against ship their boundaries only as `cell_boundaries.csv.gz`. It is
#       located by a 0-or-1 walk of the retained bundle, the way the morphology image is.
#     - a bundle with no `cell_boundaries.parquet` emits NO boundaries artifact and NO
#       offset columns — not empty ones — and says so in the report.
# * STILL NO `spatial/transcripts` (#164). `transcripts.*` stays in the retained bundle,
#   untouched, and so does `nucleus_boundaries.*`: a second boundary ROLE is not
#   distinguishable from the first in the declaration as it stands today (see the
#   `spatial/boundaries` comment in `spatial-types/manifest.yaml`), and emitting two
#   artifacts a consumer cannot tell apart is worse than emitting one.
# * NO `Protein Expression` matrix. Xenium protein is a MEAN_PER_CELL_STAIN metric scaled by
#   a root-attribute `protein_scaling_factor` (design §15.5: it "must be divided out"), not
#   integer UMI counts. Emitting it under `single-cell/counts` in either form would misstate
#   what it is. Named in the report with the reason and the feature count.
# * THE REGISTRATION OVERLAY IS NOW HERE (#301) — which retires the "NO registration overlay,
#   and NOTHING IS COMING" paragraph this line carried until now, and #291's disclosure with
#   it. Design §7.5 makes a rendered overlay in the `report/qc` "a required output of the
#   importer, not a nice-to-have ... the entire verification story for step 7.3"; #156 built
#   one for `spatial-import-visium` ONLY and closed, so until now this producer had none and
#   said so. `compute/registration_qc.py` is this package's own, staged in `run.helpers`
#   below, and every run that emits a morphology image now also emits
#   `spatial-image-morphology-registration-overlay.png` as a `report/qc` artifact.
#   WHAT IT ACTUALLY CHECKS, and it is not the same check the Visium sibling runs. Xenium has
#   no fixed-pitch capture slide and no vendor `in_tissue` flag, so neither of that module's
#   two referents transfers. What Xenium has instead is that the vendor SEGMENTED these cells
#   from this very image: so every cell centre is placed through the image's DECLARED
#   `to_space` — read back out of the emitted artifact's own OME-XML, not from the entry dict
#   — onto a signal mask derived from the emitted PIXELS, and scored as how far above CHANCE
#   the cells land on signal (`signal_lift`, 0 at chance and 1 at perfect, where chance is the
#   mask's own area fraction). The pixels and the cell table are two independent recordings
#   and neither is a function of the affine, which is what makes the referent EXTERNAL. On the
#   two real vendor bundles the declared placement scores 0.608 and 0.536; a 2x misscale, a
#   0.5x misscale and a transpose all score 0.000.
#   AND IT SAYS WHICH OF THE TWO VENDOR STATEMENTS PLACED THE IMAGE. A Xenium bundle states
#   its pixel size twice and they can disagree; `stated_scales` (#269) measures the
#   disagreement and says in its own warning that deciding it needs the control §7.5 asks for.
#   This is that control, so when the two DIFFER it scores the placement the OTHER statement
#   implies against the same pixels and reports both side by side — and the applied statement
#   is named in `placed_by`, in the report, and BURNED INTO THE OVERLAY'S OWN PIXELS, so the
#   provenance survives the picture being copied out of the report. Measured: with
#   `experiment.xenium` wrong by 5% the applied placement scores 0.041 and FAILS while the
#   image's own OME-XML statement scores 0.608 and passes, which is the overlay deciding.
#   WHAT IT STILL DOES NOT DECIDE, stated rather than implied — a disclosure that swapped
#   "judged by nothing" for "judged, fully" would be the same overstatement one sign flipped.
#   It cannot see a misregistration that moves the image and the cells TOGETHER (that is not a
#   misregistration, it is a different frame), and it does not resolve a scale error below
#   about 2%: measured, a 2% misscale scores 0.303 against a 0.4 floor. Every score is
#   therefore reported as a NUMBER beside its verdict rather than as a word, and a failing
#   verdict never refuses the import — the artifacts are all emitted and the report says what
#   happened, the same posture a damaged image already gets.
#   IT IS ALSO NOT A CONFORMANCE GATE, and §12.2 is why: "no gate can check a registration.
#   The compensating control is the rendered overlay (§7.5) — a human check, not a mechanical
#   one." The score is a diagnostic that makes the picture worth opening; the picture is the
#   control.
#   THE RESIDUE THIS PACKAGE CANNOT FIX FROM HERE: `spatial-types/compute/`'s shared modules
#   carry prose written when no overlay existed for this producer, and they are vendored
#   BYTE-IDENTICALLY into all three spatial packages — so correcting them there forces a
#   matching edit inside `spatial-import-visium`, which a concurrent branch owns. That is
#   tracked as #302 and is named here rather than left as a stale claim with no pointer.
#
# ── EVERY DECLARED DEPENDENCY IS ALREADY PINNED ──────────────────────────────────────
#
# `server/build_helper/processor_manifest.rs` resolves each `run.dependencies[]` against
# `env-rootfs/single-cell/requirements.txt` AT BUILD TIME, so a library that is absent there
# — or a range the pin falls outside — fails `cargo check` rather than a user's sandbox job.
# Measured against the pins on this branch: numpy 2.4.6, scipy 1.17.1, pandas 2.3.3, h5py
# 3.16.0, tifffile 2026.3.3, imagecodecs 2025.11.11, pyarrow 25.0.0.
#
# `env-rootfs/` IS touched by #163, and the paragraph here used to say it was not. The
# `(count, sha256)` content lock in `differential-expression/tests/test_rootfs_deps_r.py`
# MOVES, and is re-recorded in the same commit with the reason — which is the remedy that
# assertion's own message prescribes. What does NOT follow is the image republish #162
# predicted: `pyarrow` is already IN the shipped image at exactly the pinned version, as a
# hard transitive of the already-pinned `spatialdata==0.7.3`, so the pin freezes what ships.
# Verified by RUNNING `import pyarrow` inside the shipped rootfs under `bwrap`, not by
# reading a dependency graph.
id: spatial-import-xenium
name: Import Xenium (Onboard Analysis)
publisher: cyto
# Bump on ANY file change in this package — the seed reconciliation keys on it.
#
# 0.1.1 — #160, test-only: `tests/test_bundle_container.py`'s basename matcher was a FOURTH
# copy of the core's member-matching rule, and it had drifted — its docstring cited
# `normalize_member_name`, which #160 deleted; it folded full Unicode where the core folds
# ASCII; and it did not strip the compression suffix the core strips. It is corrected and
# pinned to `server/src/modules/dataset/member_match_cases.json`, the table the other three
# implementations already answer to. No compute, manifest surface or declaration changed.
#  0.2.0 — #211: the spatial declarations are MIRRORED into the coordinates store's own
#          `attributes.cyto` (`structure['cyto_spatial']`), so a SANDBOXED consumer can
#          read the coordinate space, the micron scale (and its provenance), the
#          measured entity, the positioning and the section. `meta` never crossed into
#          the sandbox; the store's own bytes do. Reader side: `require_spatial_declarations`,
#          which REFUSES rather than defaulting. `coordinate_space()` gains optional
#          `microns_per_pixel_source` / `coordinate_space_source` so a scale's provenance
#          travels with the scale (#222). The coordinates entry's `meta` key set is
#          UNCHANGED; a `spatial/image` entry gains `microns_per_pixel_source` in
#          both its `meta` and its OME payload, because a scale without the record
#          of which leg produced it is a number no consumer can audit. Additive and
#          safe for an old decoder, but not "unchanged" — an integrator trusts a
#          changelog line instead of re-reading the diff.
#  0.3.0 — #163: `spatial/boundaries`. The Xenium `cell_boundaries.parquet` becomes a long
#          `vertex`-axis table plus `boundary_vertex_start`/`boundary_vertex_count` offset
#          columns on the cells axis (design §6.4). Adds ONE dependency (`pyarrow`), ONE
#          helper (`compute/boundaries.py`), one datatype to `produces`, and moves the env
#          recipe's content lock. Additive: a bundle with no boundaries parquet produces
#          exactly the artifacts 0.2.0 produced, byte for byte.
#  0.4.0 — #247: A KEY IS REMOVED FROM THE EMITTED ARTIFACT. `meta.boundary_coverage` and
#          `report.boundaries.coverage` no longer carry `consistent` — the
#          `true|false|null` placement verdict 0.3.0 introduced, part of which was a
#          hard-coded `_SCALE_HINT_MAX = 5.0` this importer invented. Design §7.3
#          prescribes no coverage arithmetic (its rule is "declare the space, never the
#          scale factor alone") and §7.5 names the compensating control as the
#          registration QC overlay (#156), which compares against an EXTERNAL referent;
#          the bounded quantity (segmentation extent / centroid extent) is a function of
#          cell density and border margin, measured nowhere, with no published tolerance
#          to adopt. A decoder that read `consistent` gets a KeyError, not a default:
#          this is a removal, not an additive change, which is why it is a minor bump.
#          What remains is what the artifact supports — `overlaps`, `centroids_contained`
#          and the raw `extent_ratios`, now always a 2-element `[x, y]` with `None` for an
#          axis whose centroid extent is a point (0.3.0 DROPPED that axis, so a lone y
#          ratio sat in x's position).
#          THE CONSEQUENCE FOR A HUMAN: the import summary's `Segmentation boundaries`
#          section is now shown for the two FACT failures only — the extents do not
#          overlap, or the centroids are not inside the polygon extent on a set that
#          declares every cell has one — and never for a ratio. It gains a
#          `measured extents — polygon extent / centroid extent: x …, y …` line, because
#          the note points a reader at a number the page did not previously show. A
#          contained-but-grossly-misscaled pair (a uniform unit error) is therefore
#          reported to NOBODY by this importer; that judgement is #156's, and the raw
#          ratio is what a reader has until it lands.
#          No artifact already produced is re-imported, backfilled or flagged; a store
#          written by 0.3.0 keeps its `consistent` key and no consumer in this tree reads
#          it. The store's own bytes are unchanged — the declarations mirror is written
#          before this block is added to `meta`.
#  0.5.0 — #227: the vendored `compute/ome_writer.py` becomes the byte-identical copy of the
#          promoted file, which now writes TILED OME-TIFFs (`tile=(512, 512)`) at every
#          pyramid level instead of full-image-width strips. This package's own compute,
#          manifest surface and tests are UNCHANGED; what changes is the bytes every
#          `spatial/image` it emits are packed into. Pixels, extents, OME-XML and the
#          display-derivative provenance are identical — the layout tags are not. This is
#          the package whose multi-GB morphology image the tiling exists for.
#  0.6.0 — #269: AN IMAGE THAT USED TO BE REFUSED IS NOW EMITTED. `check_stated_scales`
#          compared `experiment.xenium:pixel_size` against the morphology OME-XML's
#          `PhysicalSizeX/Y` and, above a hard-coded `_STATED_SCALE_RTOL = 1e-6`, raised
#          `ImageConversionError` — the whole image became an `images_not_emitted` entry.
#          THE CONSEQUENCE, stated plainly: every bundle whose two stated pixel sizes
#          differ by more than one part in a million now KEEPS its `spatial/image`, placed
#          on `experiment.xenium:pixel_size`, where 0.4.0/0.5.0 dropped it. Nothing that was
#          emitted before stops being emitted; this only adds images back.
#          WHY. `1e-6` had no basis — no vendor statement on the two fields' precision, no
#          measurement, no design section. It was MEASURED on 10x's own published bundles:
#          eight of them, XOA 1.0.1 -> 3.0.0, all writing the identical decimal literal
#          `0.2125` in both files, relative difference exactly 0.0, SPREAD ZERO. A tolerance
#          is calibrated from the spread of a legitimate population and there is none, so no
#          band replaces it — the difference is measured and REPORTED. Design §12.2
#          corroborates: no mechanical test can decide placement, so an uncalibrated one
#          must not decide whether the user gets the image; §7.5 names the control that can,
#          and it needs the image. Same shape as 0.4.0/#247.
#          TWO CORRECTIONS TO #269's OWN TEXT, made rather than repeated. (1) It said 1e-6
#          was "tighter than a float32 round-trip in places". False: float32's worst
#          relative round-trip error is 2^-24 = 5.96e-08 and 0.2125 round-trips at 2.80e-08,
#          so the band was ~17x LOOSER than that population's worst case and no re-exported
#          bundle could have tripped it. The band's fault was never tightness; it was that nothing
#          measured said where it should sit. (2) §12.2 does not FORBID a producer-side
#          refusal — it is filed under "Known weaknesses" and says no gate CAN check a
#          registration. The measurement is the argument; §12.2 is corroboration.
#          AND ONE HONESTY NOTE THAT COST A HIGH AUDIT FINDING: §7.5's overlay is #156 and
#          IS NOT BUILT. This package emits none. So 0.6.0 does not hand a mechanical
#          control over to a human one — it reports the measurement and emits the artifact
#          the eventual control will need, and `report.scale_referent.compensating_control`
#          says so in the artifact rather than only in this comment.
#          `check_stated_scales` is GONE, replaced by `stated_scale_agreement`, which
#          returns facts and raises nothing — a stale caller gets an `AttributeError`
#          rather than a silently absent check.
#          A VALUE IN `meta` CHANGES, which is why this is a minor bump and not a patch:
#          `stated_scales.agreement` no longer takes the value `"checked"` (it meant
#          "compared and passed the band", and there is no band). It is now one of
#          `identical | differs | single-source | unreadable-unit` — four outcomes where
#          there were three, keeping the distinction between a check that STOPPED RUNNING
#          and one that was NEVER AVAILABLE. A decoder matching `"checked"` stops matching.
#          FIVE keys are ADDED to `stated_scales`: `relative_difference_x` /
#          `relative_difference_y` (the measured figure, present only for an axis that was
#          actually comparable — absent, never `0.0`, when there was nothing to compare),
#          `applied_source` / `applied_pixel_size_um` (WHICH of the two statements built the
#          affine, so a disagreeing bundle's placement is declared rather than picked
#          silently), and `unreadable_unit_axes` (an axis that DID state a size in a unit
#          this importer cannot convert, recorded even when the OTHER axis compared fine —
#          that mixed case used to leave no trace at all).
#          `report.scale_referent` gains a `reports` key and a `compensating_control` block,
#          and no longer claims to `close` a one-sided disagreement, because it no longer
#          does. `does_not_close` additionally names a gap this change makes reachable: a
#          disagreeing image now REACHES a sandboxed consumer, and `stated_scales` does not
#          ride the OME `Description` payload that carries the affine there, so that
#          consumer sees a placement with no record that its scale was contested. Filed as
#          #279, not fixed here — `_PLACEMENT_KEYS` lives in the triplicated
#          `spatial_declarations.py` and changing it means bumping three packages.
#          `agreement` is `identical` when the two parsed values differ by no more than the
#          float64 error THIS IMPORTER's own unit conversion can introduce
#          (`_CONVERSION_ULPS = 2`, enumerated in `_STATED_SCALE_ULP_STEPS` from the four
#          rounding steps this importer performs; measured worst case 2.0 ulp across every
#          unit in `_OME_LENGTH_UM`, attained by an ordinary four-digit pixel size restated
#          in angstrom — so the measured lower bound MEETS the enumerated upper bound and the
#          constant is determined to a single value rather than an interval. A test re-derives
#          the enumeration and re-measures the sweep, and refuses 1 or 3; a constant nothing
#          pins is the defect this branch is about. Earlier drafts of this line said 1.18 ulp
#          and then 1.0 ulp — the first was the relative difference divided by 2^-53, the
#          second a sweep whose quantities never reached the bound. Both corrected here.). It is not a vendor tolerance and it withholds no artifact: it
#          stops a bundle that restates 0.2125 um as `2.125e-05` cm being told the two
#          numbers disagree over a difference this importer created. The nearest real
#          population, a 32-bit-float re-export, sits at 2.1e8 ulp — eight orders above the
#          floor, and TEST-11 pins that it is still reported as `differs`.
#          THE CONSEQUENCE FOR A HUMAN: a disagreeing bundle produces an image plus a loud
#          `image_warnings` entry naming BOTH numbers, the measured relative difference per
#          axis, and the fact that only the registration overlay can say which is right —
#          where 0.4.0 produced no image and an `images_not_emitted` line.
#          No artifact already produced is re-imported, backfilled or flagged. A store
#          written by 0.4.0 keeps `agreement: "checked"`; no consumer in this tree reads it.
#          VERSION COLLISION, resolved rather than merged over: this branch chose 0.5.0 and
#          #227 landed on 0.5.0 first — two correct edits producing one identical line,
#          which is precisely what `tests/test_package_registration.py` records as having
#          happened once before and what `check-processor-seed-versions` exists to catch.
#          Renumbered to 0.6.0 on top of #227's entry; the floor in that test moves with it.
#  0.7.0 — #266: THE EMITTED OME-XML NOW DESCRIBES THE IMAGE THAT WAS ACTUALLY WRITTEN, and
#          an image it cannot describe that way is NAMED rather than half-written. The
#          vendored `compute/ome_writer.py` becomes the byte-identical copy of the promoted
#          file again; this package's own compute, manifest surface and tests are UNCHANGED.
#          WHAT MOVES. `write_ome_tiff` classified `photometric` with one equality on one
#          dimension (`arr.shape[2] == 3`), but `xenium_image.read_plane` returns `YXS` for
#          any sample count. For `S` != 3 the writer fell through to `minisblack` with no
#          `planarconfig`, and tifffile then read the SAMPLE AXIS AS X: a (900, 700, 4)
#          plane emitted `SizeX="4" SizeY="700" SizeC="900"`. The pixels round-tripped, so
#          nothing errored — but every OME-aware consumer read nonsense, and #227's tiling
#          padded each of those 900 mis-shaped 4x700 "planes" to a whole 512x512 tile.
#          `S == 1` was broken by the same expression and is fixed with it.
#          AN IMAGE THAT USED TO BE EMITTED IS NOW REFUSED, and the direction is deliberate.
#          `S` outside {1, 3, 4} is left out with a named reason instead of written. Not
#          because it cannot be described correctly — `minisblack` + `planarconfig="contig"`
#          describes any `S` truthfully — but because a CORRECT header is not sufficient:
#          `omeTiffPyramid.ts`'s two multi-plane refusals both PASS for such a file, its
#          interleave rule is `samples === 3 || samples === 4`, and it would render sample 0
#          as the whole image in silence. On 0.6.0 the same input emitted 300 top-level IFDs
#          and got a NAMED `MultiPlaneImageUnsupportedError`, so emitting the truthful file
#          would have traded a loud refusal for a silent partial render. Widening it is #288.
#          Also refused: a BILEVEL (bool) plane with more than one sample, which the pinned
#          tifffile cannot write losslessly (~46% of samples decode back changed, measured);
#          and an array whose `ndim` is not 2 or 3, which 0.6.0 wrote as a mis-headed
#          ZCYX/TZCYX file. All three raise `ImageConversionError`, which `emit_image`
#          already catches, so each costs ONE image and never the import.
#          UNCHANGED: a 2-D plane and an `(H, W, 3)` plane emit BYTE-IDENTICAL files, at a
#          flat and a pyramid size and across dtypes — asserted executably, not assumed.
#  0.9.0 — #291: THIS PACKAGE STOPS DEFERRING THE BOUNDARY-PLACEMENT JUDGEMENT TO A CONTROL
#          THAT, FOR THIS PRODUCER, DOES NOT EXIST. No CHECK is added or removed and no
#          refusal changes. What moves: THREE emitted strings, TWO new report keys, one new
#          rendered section, and six prose sites.
#          (0.8.0 carries no entry of its own — the number was taken by a renumber.)
#          THE REPORT GAINS KEYS, so a consumer reading this entry is told the shape moved:
#          `boundaries.placement_judgement` (a whole block, on every bundle with boundaries)
#          and `scale_referent.compensating_control.built_for` / `.tracked_as`. Nothing is
