# 0.12.0 — #452/#456: /MATRIX/SHAPE WITH A NON-NUMERIC DTYPE IS NOW A NAMED REFUSAL, AND THE
#          H5 ROOT ATTRIBUTE WALK IS BOUNDED IN WORK — 1 MiB, THE VISIUM SIBLING'S OWN CAP —
#          INSTEAD OF AN UNCAUGHT TRACEBACK OR AN OOM SIGKILL. The presence check above the
#          dtype check proved the dataset existed but never its dtype, so a fixed-length-S /
#          vlen-string / float-NaN / 2-D / scalar /matrix/shape, a /matrix/shape that is a
#          GROUP rather than a dataset, and an ExternalLink to a missing file all escaped as
#          tracebacks. The refusal names the dataset, what was found there (dtype and shape),
#          and that a 10x feature-barcode matrix stores /matrix/shape as two integers; the
#          existing len(shape) != 2 arity refusal is unchanged.
#          WHAT AN OPERATOR SEES: bundles that previously died with a traceback and exit 1
#          now stop with a named refusal naming the offending member. The #452 half is on
#          paths that previously crashed, so nothing that imported before stops importing.
#          The #456 half is NOT: a non-numeric root attribute over 1 MiB imported before
#          (slowly) and now refuses, and the new np.void arm refuses compound/opaque scalar
#          attributes carrying invalid UTF-8 that previously imported. Both are intended.
#          HOW LARGE THAT HALF CAN BE: HDF5's default (non-`latest`) object header caps a
#          single attribute at 64 KiB, so no vendor-written bundle can exceed the 1 MiB cap —
#          this branch's own test has to rebuild the file with `libver="latest"` to construct
#          one at all. That assumption is explicit: it breaks the day 10x ships latest-format
#          files, and the refusal is what an operator sees then.
#          WHY: #456 — the h5 root attribute walk is now BOUNDED in work and not only in
#          message length. A numeric root attribute is skipped by dtype (it cannot contain
#          unwritable text, so walking it does the work the check exists to bound and returns
#          nothing every time); a non-numeric root attribute above a 1 MiB cap is refused by
#          name. Previously .tolist() was called on any ndarray, so a large vendor-written
#          root attribute was unbounded work — an OOM SIGKILL with no refusal, no message,
#          and no exit code this module chose, which is strictly worse than a long line on
#          stderr. The bound follows the spatial-import-visium sibling's
#          _MAX_WALKED_ATTRIBUTE_BYTES (1 MiB) rather than inventing a different one.
#          WHAT DOES NOT MOVE: no emitted artifact, no declaration, no computed number, no
#          manifest row, and no existing refusal message text.
