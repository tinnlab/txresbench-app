# § Features — the entries of the row space's sibling axis (visualize-pane ITEM-46 … ITEM-60).
#
# ── WHY THIS IS A SEPARATE SECTION AND NOT A THIRD BLOCK OF § Colour by (ITEM-46) ─────
#
# It is the same ACT as colouring — press ▶, get a picture — over a genuinely different
# OBJECT. A row space's columns are a closed set of a few dozen, listed in full and scanned;
# an entry axis is an OPEN set of tens of thousands that is SEARCHED, whose rows carry
# sub-lines and per-source affordances. That does not fit in a dropdown, and folding it into
# the colouring section would make one section answer two questions. A section is also the
# drag-reorder unit (ITEM-3/ITEM-9), so a user who works feature-first can raise this one
# above the others and keep it there.
#
# `collapsed: true` in the manifest: it is the section a project may have no axis for at all,
# and the two sections above it are the frame everything else is read against.
#
# ── AN ANNOTATION IS A COLUMN ON THE ENTRY AXIS (ITEM-47) ─────────────────────────────
#
# Gene symbol, Ensembl id, modality, `is_isotype_control` — every one of them is an ordinary
# `metadata-column` artifact emitted with `axis: genes`, exactly as `cell_type` is emitted
# with `axis: cells`. So the `Show:` header enumerates them with the rule §6 already defines,
# and the viewer needs no concept of an annotation at all. THIS FILE is the only place the
# word `genes` appears in the whole feature: the mechanism is generic and the declaration is
# single-cell (INV-14).
#
# ── EVERY ROW IS A VERB (ITEM-34, DEC-10) ─────────────────────────────────────────────
#
# No radio and no checkbox: each row carries a ▶ and pressing it twice asks for two pictures
# (DEC-9). § Coordinates is the radio, because it is the FRAME.
id: sc.viz.entries.section
title: Features
permission: projects::use
# R6 (ITEM-64) — what this section is HOLDING, so its host frame can mark it when COLLAPSED.
badge: "$state.plots.length"
state:
  # THE EMITTED PLOTS this section owns (ITEM-31). Its `canvas:` block below is a `for_each`
  # over this list; the canvas COMPOSES the sections' contributions rather than any of them
  # appending to a shared one.
  plots: { type: array, default: [] }
  # ITEM-60 — the displayed-annotation choice lives in SECTION state, never pane state. It is
  # a display preference of ONE section, and pane state is closed at two values (INV-13); a
  # third shared value here is exactly what that invariant exists to prevent.
  #
  # `null`, not `""` (R1/INV-2): unset is the absence of a choice, and the engine answers it
  # with the axis KEY and SAYS so. `""` would be a chosen member of a set that offers no such
  # member.
  show: { type: string, default: null }
const:
  # `count_by`'s hidden mask, which this use has no notion of — every emitted plot counts.
  none_hidden: []
derived:
  # ITEM-33 — THE COUNT BADGE, derived from the SAME list the canvas renders, keyed by the
  # ENTRY (not the artifact): two entries of one matrix are two different pictures, and keying
  # by artifact would show every row of a modality the same numeral.
  plot_counts:
    count_by: { group: "$state.plots[*].entry", hidden: "$const.none_hidden" }
data:
  # WHAT THE FRAME IS CALLED (ITEM-35) — the same resolver § Colour by reads, so a plot from
  # this section and a plot from that one name one row space one way.
  frame:
    source: pane_frame
    args: { axis: "$scope.axis", coordinate: "$scope.coordinate" }
  # THE LIST. `axis_entry_rows` resolves the sibling axis WITHIN the anchored row space, reads
  # its keys under the engine's own browse bound (refused above it, never truncated — ITEM-25),
  # and describes each entry: its displayed name, the group it declares, the qualifier a
  # CONTESTED name carries, and every annotation's value so a search can match all of them.
  entries:
    source: axis_entry_rows
    args:
      axis_of: "$scope.axis"
      # The one domain word in this feature. The section declares WHICH sibling axis it lists;
      # the engine resolves it within the anchored row space and refuses an ambiguous label
      # rather than taking the first (INV-3).
      axis: genes
      show: "$state.show"
      # what may be DISPLAYED — the annotation columns.
      datatype: metadata-column
      # what may be PLOTTED — the artifacts indexed by this axis that carry per-row values.
      values_datatype: single-cell/expression
      # THE FRAME (ITEM-39). An entry's ▶ emits a plot drawn in the pane's frame, so the row
      # cannot decide whether it may emit without knowing whether one has been chosen. Passed
      # exactly as § Colour by passes it, so both sections refuse for one reason in one
      # sentence — and neither can emit a cell whose `coordinate` is null.
      coordinate: "$scope.coordinate"
  # THE ONE SLICE THAT READS BODIES, and it reads exactly the entries the user asked for
  # pictures of — one frame per emitted plot, never a merged one.
  plotted:
    source: column_values
    args: { of: "$state.plots" }
widgets:
  # ── A0: no row space anchored. The FIRST emptiness, and it must not be confused with the
  # ones below — nothing is broken and nothing is missing from the project.
  - id: noAnchorAlert
    kind: alert
    tone: info
    when: "$data.entries.anchored == false"
    text: Pick a coordinate set above and this lists the features of those rows.

  # ── The axis itself could not be offered — no such axis, an ambiguous label, or too many
  # entries to browse. The ENGINE wrote the sentence, because it is the only party that knows
  # WHICH of them it is; the section renders it rather than guessing between them (ITEM-63).
  - id: axisRefusalAlert
    kind: alert
    tone: info
    # `$data.entries.resolved` FIRST, and it is not belt-and-braces: `evalWhen`'s `!=` arm is a
    # strict `!==`, so `refusal != null` is TRUE for a slice that never answered — and the alert
    # then renders with an undefined `text`, i.e. an empty info box as this section's only
    # surface (widgets are kept mounted in the terminal `error`/`empty` region arms). Gate on a
    # RESOLVED FACT, never on the absence of a value.
    when: "$data.entries.resolved && $data.entries.refusal != null"
    text: "$data.entries.refusal"

  # ── NOTHING IN THIS PANE TELLS ANYONE ABOUT ALIGNMENT ANY MORE (owner, ledger #28 + #29)
  #
  # This section's alert went on 2026-08-13 (it was the third copy of one sentence on one
  # screen). § Coordinates' alert and the per-source mark and the per-plot note went with
  # ledger #28 + #29. The OFFER is unchanged: every source that could supply values still can.

  - id: entries
    kind: entry_list
    # INV-19 — an entry resolves to N columns and the ENGINE never decides what happens to
    # them. `each` is this section's answer: N columns are N pictures, so a press on a row with
    # two sources opens two plots and each source additionally carries its own ▶ (ITEM-59).
    disposition: each
    entries: "$data.entries.rows"
    # The value candidates for the WHOLE axis — one list, not one per entry. An artifact that
    # declares this axis is indexed by its keys, so it carries every entry of it.
    sources: "$data.entries.sources"
    groups: "$data.entries.groups"
    grouped: "$data.entries.grouped"
    # ITEM-63 — WAS THE LIST ACTUALLY LISTED? An empty `rows` is three different facts (the axis
    # resolved and holds nothing · the axis was refused as over-budget · nothing is anchored
    # yet), and `empty_text` below is a claim about only the first of them. Without this the
    # over-budget state printed the axisRefusalAlert's "4,100,000 entries" and the widget's
    # "lists no entries" side by side — two sentences, one of them false.
    browsable: "$data.entries.browsable"
    counts: "$derived.plot_counts"
    search: { placeholder: Find a feature… }
    # INV-5 — the view's own sentence for "nothing to offer", because a view cannot observe
    # candidate availability at all. This one is the anchored-and-empty case: the axis resolved
    # and holds no entries, which is not the same as "no results" (no search has happened).
    empty_text: This feature axis lists no entries.
    show:
      label: "Show:"
      options: "$data.entries.annotations"
      value: "$data.entries.show"
      onChange: sc.viz.showAnnotation
      # ITEM-56 — one declared annotation is nothing to distinguish, so the control does not
      # RENDER at all rather than rendering with one option.
      when: "$data.entries.show_select"
      note: "$data.entries.show_note"
    # ITEM-30 — THE ▶. Icon-only; its accessible name NAMES THE ROW, composed by the renderer
    # from this label plus the row's own name, because forty rows called "Plot" would be forty
    # identical accessible names.
    # NO `args:`. The action used to forward `note: "$source.plot_note"` — the alignment mark an
    # emitted plot was born carrying. *"remove the alignment not declared in the plot too"*
    # (owner, ledger #29), so the engine no longer computes it and nothing forwards it.
    action:
      label: Plot
      icon: plot
      onClick: sc.viz.plotEntry
actions:
  # ITEM-48 — DISPLAY only. It changes which annotation renders as each row's name; it changes
  # nothing about what is searched, emitted or plotted, and no other declaration reads it.
  - id: sc.viz.showAnnotation
    title: Show this annotation
    permission: projects::use
    mutating: false
    stateful: true
    params: { value: string }
    body:
      - set: { show: "$params.value" }

  # ITEM-36 / DEC-9 — a second click on the SAME row opens a SECOND plot. It does not toggle
  # the first off and it does not replace it. `listAppend` is the whole of that rule, and it is
  # why a row carries no selected state (ITEM-34): "on" and "off" cannot describe two.
  - id: sc.viz.plotEntry
    title: Plot this entry
    permission: projects::use
    mutating: false
    stateful: true
    params: { entry: string, title: string, position: number, artifact: string }
    body:
      - listAppend:
          path: plots
          value:
            # ITEM-57 — the plot stores the KEY and never the label. Names are deprecated and
            # reused, so a plot storing a name would silently change meaning on re-annotation.
            entry: "$params.entry"
            artifact: "$params.artifact"
            selector: "$params.entry"
            # The entry's index on its own axis — what a column-indexed encoding is addressed
            # by. Captured at emit, from the axis's own order.
            position: "$params.position"
            # ITEM-58 — the ALWAYS-qualified title, captured at emit: a plot keeps the name it
            # was born with, so changing the header afterwards does not retitle open figures.
            name: "$params.title"
            rows: "$data.frame.row_space_length"
            coordinate: "$data.frame.coordinate"
            row_space: "$data.frame.row_space"
            coordinate_name: "$data.frame.coordinate_name"

  # ITEM-32 — the close is routed to THIS section's declared action, which removes the entry
  # from THIS section's list. One owner, one path, and the `for_each` cannot re-create what the
  # state no longer holds (the reopen-loop guard).
  - id: sc.viz.unplotEntry
    title: Close this plot
    permission: projects::use
    mutating: false
    stateful: true
    params: { index: number }
    body:
      - listRemove: { path: plots, index: "$params.index" }

# ── THE PROJECTION ──────────────────────────────────────────────────────────────────────
#
# One dataset base and one scatter PER EMITTED PLOT, over this section's OWN list — the same
# shape § Colour by uses, so the canvas composes the two sections' contributions without either
# of them knowing the other exists.
#
# This section deliberately carries NO canvas-level `controls`/`selection`/`filters`/`mask`:
# those keys are LAST-WRITER-WINS across contributors (ITEM-31c), so at most one section on the
# pane may carry them, and none does.
canvas:
  grid: []
  datasets:
    - id: "plotted.$i"
      for_each: "$state.plots as $c, $i"
      coords: { artifact: "$c.coordinate" }
  series:
    - id: "s-entry-$i"
      for_each: "$state.plots as $c, $i"
      type: scatter
      coordId: "entry-$i"
      datasetId: "plotted.$i"
      controlled: true
      # ITEM-35 + ITEM-58 — the plot says WHOSE row space it is, in the frame it was born in,
      # and its entry name always carries its qualifier.
      title: "$c.row_space · $c.coordinate_name · $c.name"
      encode: { colorBy: { mode: continuous, key: "$c.name" } }
      close: { action: sc.viz.unplotEntry, args: { index: "$i" } }
