# single-cell-viz — the shipping Visualize-pane package (visualize-pane ITEM-65).
#
# ── The point of this package is what it does NOT declare ──────────────────────────────
#
# It contributes NO analysis, NO datatype and NO converter. It is the first CONTRIBUTING
# package of that shape (`_lib`/`_helpers` declare `contributes: {}` but are `_`-prefixed
# and skipped from contribution entirely; `annotation-integrate` contributes converters
# only), and it exists in this shape deliberately: it is the demonstration that the
# Visualize pane's mechanism is GENERIC.
#
# INV-14: *"No code. Nothing in any of the three sections is single-cell, and that is the
# result, not a gap … the mechanism is generic, the declaration is single-cell, and there is
# no single-cell code anywhere in the viewer … the whole pane could be contributed by a
# package that produces nothing, against datatypes contributed by another package
# entirely."* That last clause is literally true here: every datatype these sections apply
# to is contributed by `single-cell-types`, and this package produces nothing at all.
#
# What it supplies is DECLARATIONS — the section order and categorical-before-continuous.
# Each of those is a domain judgement, and each lives here rather than in the app for
# exactly that reason.
#
# ── `ui/`, not `visualize/` ────────────────────────────────────────────────────────────
#
# The view files live in `ui/`, the same directory an analysis' view specs use. That is a
# CONSTRAINT and not a convention: three independent discovery surfaces hardcode it (the
# build-time vite glob in `loadProcessors.ts::discoverProcessorPackages`, the runtime asset
# server in `extensions/routes.rs::read_package_assets`, and the build lint in
# `build_helper/processor_manifest.rs`), so a path under any other folder resolves to
# nothing and the loader reports *"declared in `ui:` … but no such view file"*. The
# directory carries no meaning — this manifest names the files.
id: single-cell-viz
name: Single-cell Visualize sections
publisher: cyto
version: 0.2.0
apiVersion: "1.0"
contributes:
  # Ascending `order` is the PACKAGE's default arrangement; a user's own saved section order
  # wins wherever it names a section (ITEM-7/ITEM-8), and a section installed after they last
  # dragged still lands where its author said.
  sections:
    # ── THE FRAME ──────────────────────────────────────────────────────────────────────
    # Positioned first because it is what the other two are read against: "which cells am I
    # looking at, positioned how" precedes "coloured by what".
    - id: sc.viz.coordinates
      title: Coordinates
      pane: visualize
      order: 10
      collapsed: false
      # A CAPABILITY-only selector (ITEM-61) — the section applies to anything DECLARED
      # plottable as x/y, whoever contributed it. Not `type_id: embedding`: naming the
      # datatype would tie this section to one package's vocabulary, and the capability is
      # exactly the declaration `embedding` already carries for this purpose. It is also
      # the first capability-only selector any shipped manifest uses.
      #
      # It states a KIND of data and never a producer (INV-18) — both Rust parsers refuse a
      # selector naming an analysis / package / slot, so that rule cannot be broken here by
      # declaration.
      applies_to: [{ capabilities: [plottable-xy] }]
      ui: [ui/coordinates.yaml]

    # ── THE COLOURING ─────────────────────────────────────────────────────────────────
    - id: sc.viz.colour-by
      title: Color by
      pane: visualize
      order: 20
      collapsed: false
      applies_to: [{ type_id: metadata-column }]
      ui: [ui/colour-by.yaml]

    # ── THE OPEN SET ──────────────────────────────────────────────────────────────────
    #
    # `collapsed: false` — it opens with the other two (owner, 2026-08-13).
    #
    # It shipped `collapsed: true`, and the rationale recorded here was that this is the section
    # a project may legitimately have NO axis for, so an open one "would greet most projects
    # with an emptiness". That rationale is DELETED rather than left standing beside the
    # opposite value, and it was wrong twice over:
    #
    #   · it contradicted the BINDING REFERENCE. `docs/design/visualize-pane-mockup.html`
    #     renders this section OPEN, with its annotation select, its search box, its group
    #     headings and its entries. The mockup is the binding reference where it and prose
    #     disagree, and nothing in the tree read it until a gate was written for it.
    #   · it overstated its own case. `applies_to: [{ type_id: metadata-column }]` already
    #     removes this section ENTIRELY from a project that holds no metadata columns, so the
    #     emptiness it was defending against is only "has metadata columns but no entry axis" —
    #     far narrower than "most projects", and that case is ACCEPTED: an open-but-empty
    #     section states its own emptiness (ITEM-63) and costs one line.
    #
    # A section is still the drag-reorder unit, so a user who wants it closed collapses it once
    # (ITEM-46). What is not the package's to decide is that everybody starts closed.
    #
    # It applies to `metadata-column` for the same reason § Colour by does: what it LISTS are
    # the annotation columns of the entry axis, which are ordinary metadata columns emitted
    # with `axis: genes` (ITEM-47). Nothing in that selector names an axis, a modality or a
    # producer — the axis it lists is declared in `ui/features.yaml`, in one word.
    - id: sc.viz.entries
      title: Features
      pane: visualize
      order: 30
      collapsed: false
      applies_to: [{ type_id: metadata-column }]
      ui: [ui/features.yaml]
