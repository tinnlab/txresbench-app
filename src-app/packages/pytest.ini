# Canonical runner for the whole processor test tree:
#
#     cd src-app/packages && python3 -m pytest -q
#
# Anchoring the rootdir here is what makes `conftest.py` (the `/code` staging mirror)
# load for every package's suite. `_lib` and `_helpers` also carry their own ini so
# they can still be run standalone from inside their own folder.
#
# `testpaths` is an ENUMERATION, so a package whose suite is not listed here is collected
# by NOTHING — `just check-py` runs bare `python3 -m pytest` from this directory, which
# honours this line. `annotation-integrate/tests` was the case in point: the package's
# only coverage lived in `_helpers/tests/test_integrate.py` (the pure core), so its I/O
# contract had no suite at all and artifact-model ITEM-26 broke the live integrate job
# with every gate green. A new `<package>/tests/` directory must be added here in the
# same commit that creates it.
#
# `--import-mode=importlib` (in `addopts`, #198) is what lets the SHARED-GUARD naming
# convention exist at all. [TEST-6 exercises this line, twice over and for real: `trajectory`
# (a FOURTH package shipping the same `test_zero_src_app_diff.py` basename) and then
# `spatial-types` (a FIFTH) each landed on main while #198 was open, and each joined collection
# with ZERO edits here — the only `testpaths` change is the one line their own commit added.]
# Several guards are deliberately the SAME guard shipped per
# package under the SAME basename — `test_zero_src_app_diff.py`, `test_manifest_shape.py`,
# `test_view_shape.py`, `test_producer_end_to_end.py`, `test_package_registration.py`,
# `test_inputs_contract.py`, `test_ceiling_refusal.py`. Under pytest's default `prepend`
# import mode a test module's name is just its BASENAME (no `__init__.py` anywhere in this
# tree), so the second package's copy collided with the first's already in `sys.modules`
# and pytest raised `import file mismatch`. Collection errors ABORT the run, so `just
# check-py` failed with 11 collection errors before EXECUTING ANYTHING — 2092 tests under
# no gate at all, and a gate that cannot run is indistinguishable from a gate that passes.
# [TEST-2 reproduces that baseline on clean `origin/main`; TEST-1 is the positive control on
# this line — collection reaching 0 errors and the run EXECUTING a real, non-zero count;
# TEST-3 is the mutation proof that the executing gate can go RED and name the failure.]
#
# `importlib` mode derives a unique module name from the full path, so identical basenames
# in sibling directories no longer collide, and stale `__pycache__`/`.pyc` can no longer
# fake or mask the mismatch either. It is pytest's own documented answer to exactly this.
#
# Two alternatives were rejected — see `.lifecycle/check-py-collection/DECISIONS.md` DEC-1:
#   * [TEST-8 falsifies this bullet by RUNNING it, rather than by reasoning about it.]
#     `__init__.py` in the test dirs only MOVES the collision up one level (`tests.conftest`
#     vs `tests.conftest`) and fails EARLIER, at conftest load. Making it work needs an
#     `__init__.py` in EVERY package dir too — including the hyphenated ones, whose names
#     are not valid Python identifiers — and re-creates the same "a new package silently
#     joins nothing" footgun this file's `testpaths` header already documents.
#   * Renaming to unique basenames destroys the shared-guard convention, which is a feature.
#
# It MUST live in `addopts` [TEST-9]: pytest has NO `importmode`/`import_mode` ini key, so writing one
# as a bare key under `[pytest]` is IGNORED and the 11 collection errors persist unchanged —
# a fake fix that changes nothing. It is not quite silent: pytest emits
# `PytestConfigWarning: Unknown config option: importmode`, and `--strict-config` turns that
# into `ERROR: Unknown config option` (exit 4). But this suite runs at `-q` and its output is
# routinely tailed, which is exactly where a single warning line goes unread — so treat the
# warning as a courtesy, not a guard. Keeping it here
# rather than in the `just check-py` recipe is also deliberate: every entry point that
# resolves THIS ini (the justfile recipe, a bare `python3 -m pytest`, `pytest src-app/
# packages` from the repo root, an IDE runner) gets the fix, not just the one runner.
# [TEST-10 is the second entry point: `python3 -m pytest src-app/packages` from the REPO ROOT,
# not via `just` and not from inside this directory, resolving this same configfile.]
# Note the
# emphasis: `_lib/pytest.ini` and `_helpers/pytest.ini` anchor their OWN rootdir and are
# deliberately NOT changed — each covers a single directory, where a basename collision is
# impossible, and `_lib`'s suite would BREAK under importlib because it imports its siblings
# by bare name off prepend's implicit `sys.path` entry. See DECISIONS DEC-3. [TEST-11 asserts
# those two standalone runners are UNCHANGED by this branch, NOT that either is green: both are
# red on main and identically red here — `_helpers` for the pre-existing `h5ad_import` sys.path
# reason, `_lib` for the newer `test_zero_core_guard` failures. See HIDDEN_FAILURES F4 and F7.]
[pytest]
testpaths = _lib _helpers/tests qc/tests cell-filter/tests anndata-import/tests annotation-integrate/tests embedding-integrate/tests embedding/tests clustering/tests differential-expression/tests differential-abundance/tests geneset/tests r-skeleton/tests spatial-import-visium/tests spatial-import-visium-hd/tests spatial-import-xenium/tests spatial-types/tests trajectory/tests doublet/tests
python_files = test_*.py
python_functions = test_*
addopts = -q --import-mode=importlib
