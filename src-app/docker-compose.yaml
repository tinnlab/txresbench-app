# CytoAnalyst build + test database cluster.
#
# A dockerized PostgreSQL used ONLY for the build/test toolchain — NOT the app's
# runtime store (that is the embedded PostgreSQL the binary bundles + manages
# itself). sqlx compile-time `query!`/`query_as!` verification needs a migrated
# database reachable at `cargo check` time, and the integration harness clones
# per-test template databases; both hit THIS cluster.
#
#   * `build.rs` (SDK `provision_build_db`) provisions a per-worktree database
#     `cytoanalyst_build_<key>` here and sets DATABASE_URL for the query macros.
#   * the harness creates `cytoanalyst_test_template_<key>` + per-test UUID DBs.
#
# Port 54321 is the SDK's committed build-DB sentinel, so per-worktree isolation
# works out of the box AND ziee-auth's own build DB shares this one cluster.
# If a cluster is ALREADY running on :54321 (e.g. ziee's pgvector container),
# just reuse it — `docker compose up` will no-op/fail on the port and that's the
# signal there's already one. pgvector is a superset of plain Postgres, so
# CytoAnalyst's vector-free schema works on either image.

name: cytoanalyst

services:
  postgres-build:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "54321:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    shm_size: 2gb
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=128MB"
      # Test-workload tuning — unsafe for production, fine for an ephemeral build DB.
      - "-c"
      - "fsync=off"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "full_page_writes=off"
