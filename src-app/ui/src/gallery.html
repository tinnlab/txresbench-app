<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>txresbench — component gallery</title>
  <!-- pre-paint theme from ?theme= so the first frame is the right mode -->
  <script>
    (function () {
      try {
        var q = new URLSearchParams(location.search)
        var dark = q.get('theme') === 'dark'
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.classList.toggle('light', !dark)
        document.documentElement.dir = q.get('dir') === 'rtl' ? 'rtl' : 'ltr'
      } catch (e) {}
    })()
  </script>
</head>
<body>
<div id="root"></div>
<script type="module" src="./dev/gallery/main.tsx"></script>
</body>
</html>
