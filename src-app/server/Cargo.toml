[package]
name = "cytoanalyst"
version = "0.0.0"
edition.workspace = true

[lib]
name = "cytoanalyst"
path = "src/lib.rs"

[[bin]]
name = "cytoanalyst"
path = "src/main.rs"

[features]
# Opt-in seccomp for the sandbox module. OFF by default so the base build needs
# no libseccomp at link time; with the feature the BPF filter from the SDK
# `sandbox-seccomp` crate is compiled once at boot and piped to bwrap
# (`--seccomp <fd>`). See DEC-7.
sandbox_seccomp = ["dep:sandbox-seccomp"]

# TxResBench: the `saas` cloud feature (S3/GCS ObjectStore, k8s compute backend,
# Stripe billing/metering) was REMOVED with the billing module — this is a
# single-user local app with no cloud code in any build.
#
# NOTE (artifact-model ITEM-13): the opt-in `tiledb_serve` feature — which linked a
# prebuilt core `libtiledb` from the `CYTO_TILEDB_LIB` env var to drive a native
# in-process array reader — was DELETED with its module. INV-1: the server links no
# format-parsing library at all, so there is no feature that could turn one on. Do
# not reintroduce one here; `scripts/check-no-format-crates.sh` denies the whole
# `tiledb`/`tiledbsoma`/`soma` family in the resolved dependency graph.

[build-dependencies]
# SDK build.rs support: composes migrations-merged + provisions/migrates the
# per-worktree build DB on :54321 and sets DATABASE_URL for sqlx compile-time
# query!/query_as! verification (provision_build_db, SDK gap G4 resolved).
ziee-build-support = { path = "../../sdk/crates/ziee-build-support" }
# Hashing the docker-built rootfs squashfs for the `.version` sidecar (embed
# skip-if-fresh). Docker itself is invoked via std::process::Command (no crate).
sha2 = "0.10"
# The BUILD-TIME processor-manifest syntax gate (build_helper/processor_manifest.rs,
# ITEM-8/DEC-5): parse + `deny_unknown_fields`-lint every `packages/*/manifest.yaml`
# at `cargo check` time. `serde_norway` matches the runtime loader's YAML parser
# (no `serde_yaml`, CODING_GUIDELINES §17).
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
serde_norway = "0.9"

[dependencies]
# --- SDK platform crates (path-deps into the pinned submodule) ---------------
# Dual-driver SDK selection (sqlite-store DEC-1): the app builds the SDK's
# SQLite variant — `sqlite-backend` ON makes `DbPool` = `SqlitePool`, so the
# framework seam this app wires (`ModuleContext.db_pool`,
# `build_api_router`'s pool extension, `Transaction<'_, Db>`) carries the
# app's sqlite store, and `embedded_pg` is not this app's driver. Every edge
# below is `default-features = false` + the driver feature: the framework's
# `embedded-pg` (the postgresql_embedded downloader) enters the resolved
# graph only through a crate that still default-features it — the remaining
# schema-bound crate (ziee-notification) flips at ITEM-16, completing
# TEST-1(a)'s lock prune (DRIFT-1 ITEM-12 #3).
ziee-core = { path = "../../sdk/crates/ziee-core", default-features = false, features = ["sqlite-backend"] }
ziee-framework = { path = "../../sdk/crates/ziee-framework", default-features = false, features = ["sqlite-backend"] }
# AI-controllable-actions MCP surface: the DB-free OpenAPI→capability catalog +
# deployment policy + static tool descriptors. `modules/mcp` is the thin
# app-side glue (JSON-RPC handler, agent channel, pairing) built on top.
ziee-control-mcp = { path = "../../sdk/crates/ziee-control-mcp" }
# Auth: the default schema-bound auth module + its mountable routes bundle
# (`module` implies `routes`) + the identity abstractions. `sqlite-backend`
# selects the cfg-gated sqlite query sets + migrations-sqlite chain (ITEM-14).
ziee-auth = { path = "../../sdk/crates/ziee-auth", default-features = false, features = ["module", "sqlite-backend"] }
ziee-identity = { path = "../../sdk/crates/ziee-identity" }
# Notification inbox: the SDK notification feature promoted to a self-registering
# module (generic `payload` schema + per-module kind registry + pluggable sync
# emitter). PROPOSED SDK contribution — see SDK_GAPS.
ziee-notification = { path = "../../sdk/crates/ziee-notification", features = ["module"] }
# Liveness/readiness surface: the DB-free `GET /health` route (no auth, no DB).
ziee-health = { path = "../../sdk/crates/ziee-health" }
# File STORE: the generic, domain-agnostic multi-derivative blob store + its
# mountable `file_routes` HTTP surface (`routes` feature default-on). Backs the
# dataset upload path (INPUT uploads only — see docs/DATA_STORAGE_REDESIGN.md).
# `sqlite-backend` selects the cfg-gated sqlite query sets + the
# migrations-sqlite chain (ITEM-15).
ziee-file = { path = "../../sdk/crates/ziee-file", default-features = false, features = ["routes", "sqlite-backend"] }

# --- Third-party (versions matched to the SDK crates so the single Cargo.lock
#     unifies them without a duplicate build) -------------------------------
aide = { version = "0.15", features = ["axum", "axum-json", "axum-query", "axum-multipart", "macros"] }
axum = { version = "0.8.4", features = ["macros", "multipart"] }
# The SAME multer axum's `Multipart` extractor uses (axum 0.8.9 -> multer 3.1.0; it is
# the only version in the tree, so this unifies rather than pinning a second copy).
# `upload_guard` calls `multer::parse_boundary` directly instead of imitating it: the
# guard is only a bound while it frames a request exactly as the parser that actually
# reads it does, and three separate blind-audit rounds each found a NEW way a
# hand-rolled equivalent diverged. See the module doc in `modules/file/upload_guard.rs`.
multer = "3.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal"] }
sqlx = { version = "0.8.6", features = ["postgres", "sqlite", "runtime-tokio-rustls", "uuid", "chrono", "macros", "migrate", "json"] }
linkme = "0.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
# YAML config loader (matches the SDK's `serde_norway` choice — see SDK_GAPS G2).
serde_norway = "0.9"
# Bakes the `src-app/packages/` manifest tree into the binary (the extensions
# module `include_dir!`s it + parses each `manifest.yaml` at boot). NEW dep — no
# prior embed precedent in this crate (see PLAN_AUDIT ITEM-2).
include_dir = "0.7"
# Hot-swappable process-wide registry holders (extensions + datatype) so a rescan
# (S6 watcher / S7 reload) can atomically re-publish without a restart (INV-2, S2).
# NEW dep. There is no `[workspace.dependencies]` table here, so pin directly.
arc-swap = "1.7"
# Live, cross-platform, debounced filesystem watcher on `<data_root>/processors/`
# (ITEM-13, INV-10, S6): a dropped/edited/removed processor package auto-reflects
# through the SAME rescan+republish path with no rebuild + no manual reload.
# `notify-debouncer-full` coalesces an editor's multi-write burst into one rescan
# (WATCH_DEBOUNCE=500ms, DEC-14) and re-exports `notify` (RecommendedWatcher /
# RecursiveMode). NEW deps — pin directly (no `[workspace.dependencies]` table).
notify = "8"
notify-debouncer-full = "0.5"
schemars = { version = "0.9.0", features = ["chrono04", "uuid1"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
# artifact-model ITEM-37 — the `/data` byte plane STREAMS from disk instead of
# buffering the whole blob per request (`File` → seek → `.take(len)` →
# `ReaderStream` → `Body::from_stream`). `bytes::Bytes` is the stream item type
# named by `ObjectStore::get_stream`; `tokio-util`'s `io` feature is
# `ReaderStream`. Both were already resolved transitively — they are pinned here
# because the workstore now depends on them DIRECTLY, and neither is a
# format-parsing crate (see the INV-1 note below / `check-no-format-crates.sh`).
bytes = "1"
memchr = "2"
tokio-util = { version = "0.7", features = ["io"] }
# Per-process CPU% + RSS sampling for the per-job resource charts (cross-platform;
# version matched to ziee-hardware so the single Cargo.lock unifies it).
sysinfo = "0.37.2"
# Per-job SSE stream (log/metric/status frames) — same primitives the SDK sync
# stream uses; already in the workspace Cargo.lock.
async-stream = "0.3"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
# `mcp`'s REST-kind `invoke_capability` loopback dispatch (forwards the
# caller's JWT to the real route, mirrors ziee `control_mcp`). Version matched
# to the dev-dependency below so the single Cargo.lock unifies them.
reqwest = { version = "0.12", features = ["json"] }

# NOTE (artifact-model ITEM-12 / ITEM-20): `arrow` + `arrow-ipc` are GONE. They
# existed for the Selection→Arrow serve wire (`workstore::serve_core`) and for the
# generic TileDB `ArraySource` (ITEM-13); both surfaces are deleted, and with them
# every reason for this crate to link a format-parsing library. This is INV-1 made
# mechanical: `scripts/check-no-format-crates.sh` fails the build if `arrow`,
# `parquet`, `zarr`, `hdf5`, `tiledb`, `csv`, … reappears in the resolved graph.
# You cannot decode what you cannot link. Do not add one back to "just decode the
# first chunk server-side" — decoding happens in the processor (writing) and in the
# browser (reading), never in Rust.

# --- sandbox + rootfs modules ------------------------------------------------
once_cell = "1"
sha2 = "0.10"
hex = "0.4"
# #145 account invitations: the invitation token is 256 bits from a CSPRNG, base64url,
# and is stored ONLY as its SHA-256 (see
# `modules/account/migrations/202609040002_account_invitations.sql` for why this one
# token diverges from the tree's plaintext convention). The server crate had no CSPRNG
# and no base64 of its own — its only random-token idiom was `Uuid::new_v4()` (122 bits),
# which does not satisfy the ratified 256-bit requirement. Both are pinned to the SAME
# versions `sdk/crates/ziee-auth/Cargo.toml` uses, so the single `Cargo.lock` unifies
# them onto entries that are ALREADY there (`rand 0.9.5`, `base64 0.22.1`) and the lock
# gains only this crate's dependency edges. There is no `[workspace.dependencies]` table
# in this repo, so the pin is direct — the convention the rest of this file follows.
rand = "0.9.2"
base64 = "0.22"
# #182 streaming upload: `modules::file::stream::ingest_staged` must derive
# `mime_type` with the IDENTICAL expression `ziee_file::ingest::ingest_bytes` uses
# (`mime_guess::from_ext(&ext).first()`), because it REPLACES that function on the
# upload path and the stored row has to stay byte-identical. This is a
# correctness pin, not a convenience: a different mime derivation would silently
# change every newly-uploaded file's `mime_type`. Already in `Cargo.lock` at 2.0.5
# via `ziee-file`, so it resolves to the same entry with no lockfile churn. It maps
# extensions to MIME strings and parses no array/table format, so it is outside
# `scripts/check-no-format-crates.sh`'s denylist.
mime_guess = "2.0"

# --- the ONE decode allowance (INV-1 as amended, DEC-23) ----------------------
# `flate2` inflates the gzip member of the writer's chunk chain, in
# `workstore/gather_decode.rs` and nowhere else. It was already a dev-dependency and
# already LEGAL under `check-no-format-crates.sh` ("a general byte-stream codec ... is
# not reading an array"); what bounds the amendment is not the crate but the SCOPE, which
# that guard now enforces by refusing a decompressor in any other server source file.
# The shard index (u64 pairs) and the un-shuffle (index arithmetic) need no crate at all,
# which is exactly why a crate-graph check alone could not have held this line.
flate2 = "1"
# bwrap/seccomp/PDEATHSIG/pipe primitives — Linux-only (the sandbox is
# Linux-first, DEC-3). Gated so macOS/Windows still compile.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dependencies.sandbox-seccomp]
path = "../../sdk/crates/sandbox-seccomp"
optional = true

[dev-dependencies]
# SDK integration-test harness (app-neutral `HarnessApp` seam) — per-worktree
# template DBs cloned per test + a spawned-server-per-test. CytoAnalyst impls
# `HarnessApp` once in `tests/common`. Needs a reachable Postgres (DATABASE_URL
# or the shared cluster default 127.0.0.1:54321).
ziee-test-harness = { path = "../../sdk/crates/ziee-test-harness", features = ["sync-probe"] }
# TEST-14 (the SQLite chain-apply harness): composes the ported chain through
# the REAL SDK composer `build.rs` uses (via the `#[path]`-included
# `build_helper::migration_chain` driver lists). The crate already sits in this
# package's build-dependency graph, so no new package enters `Cargo.lock`.
ziee-build-support = { path = "../../sdk/crates/ziee-build-support" }
# `stream` (#182, DEC-16): the measured-RSS upload tests send a 256 MiB body that
# is GENERATED as it is sent, so the test process never buffers the payload either
# (this box has ~3 GB of RAM). Dev-dependency only — Cargo unifies features per
# package, and the only crate `stream` needs (`futures-util`) is already a direct
# server dependency, so no new entry enters `Cargo.lock` and nothing changes in the
# shipped binary.
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
# DB-layer assertions in integration tests (e.g. the boot-crash-safety reset):
# a test connects its own pool to `TestServer::database_url()`.
sqlx = { version = "0.8.6", features = ["postgres", "sqlite", "runtime-tokio-rustls", "uuid", "chrono"] }
# TEST-8: the `sqlite3_libversion*` probe that pins the bundled SQLite version
# floor at test time. The `bundled` feature here is the SAME feature sqlx's
# `sqlite` feature enables on the shared libsqlite3-sys, so no second build of
# the amalgamation is introduced; the dev-dep exists only so the test can name
# the C symbols directly.
libsqlite3-sys = { version = "0.30.1", features = ["bundled"] }
uuid = { version = "1.18", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# B0 (billing epic) local Stripe sim — the test-only signed-webhook injector
# (`tests/common/stripe_sim.rs`) + the L2 full-flow tier (`tests/billing/`). These
# are TEST deps only: no Stripe symbol enters the server/desktop binary (INV-4).
# hmac+sha2+hex implement Stripe's real `t=,v1=` HMAC-SHA256 signature scheme;
# serde_json builds the event envelope; axum+bytes host the placeholder webhook
# consumer + meter-capture routers (driven via the existing `tower`/`http-body-util`
# oneshot deps — no port bind).
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
serde_json = "1.0.141"
axum = { version = "0.8.4", features = ["macros"] }
bytes = "1"
# TEST-13 (INV-4 separability drop-in): parse a REAL out-of-tree processor
# package's `manifest.yaml` with the SAME parser the runtime loader uses.
serde_norway = "0.9"
# TEST-17: bundle the committed 10x trio fixture into a REAL `.zip` so the
# converter's ARCHIVE path runs on real bytes. `default-features = false` keeps it
# to the STORED method (the trio members are already gzipped) — no codec deps.
zip = { version = "6", default-features = false }
# The suite's own reader for what a processor emitted (`tests/common/zarr.rs`).
# A TEST dependency, never a server one: INV-1 is about what the SERVER can link,
# and `scripts/check-no-format-crates.sh` states the boundary in its own words —
# a general byte-stream codec is legal, a crate whose reason to exist is decoding
# scientific array codecs is not. Decompressing one transport frame so a test can
# assert on the values a processor wrote is the former.
flate2 = "1"
# Drive the harness-sentinel router directly (`ServiceExt::oneshot`) so the route's
# PRESENCE is asserted against a real axum service rather than against source text.
# Both are already in the lockfile as transitive axum deps.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# Unix SIGTERM for graceful job stop (SIGTERM -> SIGKILL); cfg-gated at use so the
# non-unix build (which falls back to Child::start_kill) never links it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
