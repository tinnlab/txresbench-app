# TxResBench dev config (per-machine).
#
# Copy to `config/dev.yaml` and set `jwt.secret` to `openssl rand -base64 48`.
# The server refuses to boot on a weak/placeholder secret (see src/config.rs).
#
# No database cluster and no docker compose: the store is ONE embedded SQLite
# file (see `database:` below) — created on first boot, migrated by the server,
# deleted to reset. The only thing to copy is this file + the JWT secret.
#
# Ports are chosen distinct from txresbench (app #1) so both apps can run side-by-side:
#   - HTTP server       :3100    (txresbench dev uses :3000)

# SQLite database — the app's embedded store: one local file, no server process,
# no network access, no binary download. The default location is
# <app-data-dir>/txresbench.db (app data dir: TXR_APP_DATA_DIR when set, else
# the app data dir — the desktop's ~/.txresbench). To relocate it, set `path`
# (a plain filesystem path) or `url` (a `sqlite://` URL — wins over `path` when
# both are set); the TXR_DATABASE_URL env var wins over both. The pool knobs
# default to the framework profile (10 connections / 1 minimum / 5 s acquire
# timeout / 5000 ms busy timeout); WAL, synchronous=NORMAL and foreign_keys=ON
# are engine correctness properties, not knobs.
database:
  path: null   # e.g. "/home/you/TxResBench/txresbench.db"
  # pool:
  #   max_connections: 10
  #   min_connections: 1
  #   acquire_timeout_secs: 5
  #   busy_timeout_ms: 5000

server:
  host: "127.0.0.1"
  port: 3100
  api_prefix: "/api"
  trust_forwarded_headers: true
  rate_limit:
    # Disabled by default for local dev + iterative testing — rapid manual
    # clicking and e2e runs would otherwise trip the limiter. Re-enable and
    # tune per_second/burst_size for any shared/production deployment.
    enabled: false
    per_second: 50
    burst_size: 500

logging:
  level: "info"
  format: "pretty"

jwt:
  secret: "CHANGE_ME_run_openssl_rand_base64_48"
  issuer: "txresbench"
  audience: "txresbench-api"
  access_token_expiry_hours: 24
  refresh_token_expiry_days: 30

# At-rest secret encryption (#60). `storage_key` is the symmetric key for the
# framework's secret-encryption layer (SDK `txresbench_framework::secret`). The
# desktop build's shipped surfaces do not use it and no key is configured by
# default (`null`). It is a DEPLOYMENT secret like `jwt.secret` — set it to a
# random >=32-char string (`openssl rand -base64 48`) and keep it stable
# (rotating it makes previously-encrypted secrets undecryptable).
#
# UNSET (this block absent, or storage_key blank) => NO at-rest secret storage.
# An override env var `TXR_SECRET_STORAGE_KEY` takes precedence over this
# value.
secrets:
  storage_key: null   # e.g. "CHANGE_ME_run_openssl_rand_base64_48"
