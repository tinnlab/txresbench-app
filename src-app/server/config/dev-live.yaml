# CytoAnalyst dev config (per-machine).
#
# Copy to `config/dev.yaml` and set `jwt.secret` to `openssl rand -base64 48`.
# The server refuses to boot on a weak/placeholder secret (see src/config.rs).
#
# Ports are chosen distinct from ziee (app #1) so both apps can run side-by-side:
#   - embedded Postgres :54341   (ziee dev uses :54323)
#   - HTTP server       :3100    (ziee dev uses :3000)

postgresql:
  use_embedded: true
  embedded:
    version: "18.3.0"
    port: 54341
    bind_address: "127.0.0.1"
    username: "postgres"
    password: "password"
    database: "postgres"
    # SDK_GAPS G3: the SDK ships no `resolve_paths`, and embedded_pg hard-requires
    # these two paths (it `.expect()`s them). So we set them explicitly here
    # rather than deriving from an app.data_dir the SDK config has no field for.
    installation_dir: "../../cytoanalyst-data/dev/postgres"
    data_dir: "/data/pbya/ziee/tmp/cytoanalyst/cytoanalyst-data/dev/postgres-data"
    timezone: "UTC"
    log_timezone: "UTC"
    logging:
      collector: true
      directory: "log"
      filename: "postgresql-%Y-%m-%d_%H%M%S.log"
      statement: "all"
  pool:
    max_connections: 10
    min_connections: 1
    acquire_timeout_secs: 5
    idle_timeout_secs: 30
    max_lifetime_secs: 300

# SQLite database — the app's embedded store: one local file, no server process,
# no network access. Default location <app-data-dir>/txresbench.db; `path` (a
# plain filesystem path) or `url` (a `sqlite://` URL, wins over `path`) relocate
# it, and the CYTO_DATABASE_URL env var wins over both. Pool defaults: 10 / 1 /
# 5 s / 5000 ms.
database:
  path: null

server:
  host: "127.0.0.1"
  port: 3180
  api_prefix: "/api"
  trust_forwarded_headers: true
  rate_limit:
    enabled: false
    per_second: 50
    burst_size: 500

logging:
  level: "info"
  format: "pretty"

jwt:
  secret: "vP5UY5eLa1AZenKcnL8rr4iX9o19W/rUyKkP7xXgHdAXaVG6X37+QYMdu5UcPrqY"
  issuer: "cytoanalyst"
  audience: "cytoanalyst-api"
  access_token_expiry_hours: 24
  refresh_token_expiry_days: 30
