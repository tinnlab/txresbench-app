# TEST-E1-1 fixture (#189) — a MALFORMED `env:` on an analysis.
#
# `Repo/Name` violates the OCI repository path-component grammar three ways at once
# (uppercase, and a `/` that would make it a SECOND path component). The lint must
# refuse it naming the key and the value, rather than passing a value that would go
# on to build a broken pull ref — or, worse, smuggle an extra reference component
# into the ref the provider pulls.
id: envpkg
name: Env Package
publisher: txr
version: 0.1.0
apiVersion: "1.0"
contributes:
  analyses:
    - id: envpkg.bad
      category: demo
      title: Analysis declaring a malformed env
      env: Repo/Name
      appliesTo: []
      produces: [demo/widget]
      run: { kind: sandbox, runtime: python, entry: compute/demo.py }
  datatypes:
    - id: demo/widget
      extends: data
      title: Demo widget
      storage:
        layout: { kind: opaque_as_is }
        format: json
