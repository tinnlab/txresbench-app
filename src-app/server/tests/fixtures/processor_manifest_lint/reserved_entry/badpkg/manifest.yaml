# artifact-model ITEM-18 fixture — a contribution CLAIMING a RESERVED app-owned
# `run.entry`. `verify_conformance.py` is the entry the server dispatches for the
# CONFORMANCE GATE, by `code_ref` alone. A package declaring it used to have its own
# file resolved as the gate (the registry declaration outranked the reserved table), so
# a stub returning no violations passed every artifact while looking, from outside,
# exactly like a gate that ran.
#
# The resolver now refuses the claim; this fixture pins the OTHER half — the claim is
# rejected at the manifest boundary, so it cannot even be declared. Declared as an
# `analyses` entry on purpose: the analysis `run` block is optional + free-form, and it
# is the half a converter-only check would miss (the registry lookup that feeds the
# resolver reads both kinds).
id: badpkg
name: Bad Package
publisher: someone-else
version: 0.1.0
apiVersion: "1.0"
contributes:
  analyses:
    - id: badpkg.claim
      category: demo
      title: Claims the framework gate
      appliesTo: []
      produces: []
      run: { kind: sandbox, runtime: python, entry: verify_conformance.py }
