# TEST-12 fixture (B3) — a TYPO inside a formerly-free-form `Value` sub-key. The
# `axes` entry misspells `key_label` as `key_labal`; now that `axes` is modelled as
# the typed `DcAxisSpec` (deny_unknown_fields, mirroring the runtime `AxisSpec`),
# the typo fails the BUILD instead of surfacing only at boot.
id: badpkg
name: Bad Package
publisher: txr
version: 0.1.0
apiVersion: "1.0"
contributes:
  datatypes:
    - id: demo/widget
      extends: data
      title: Demo widget
      storage:
        layout: { kind: opaque_as_is }
        format: json
      axes:
        - { name: cells, key_labal: barcode }   # <-- typo: key_labal
