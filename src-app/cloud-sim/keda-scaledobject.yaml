# KEDA queue-depth ScaledObject — CytoAnalyst compute worker (epic T1 scaffold).
#
# Realizes design §6/§10/§13a.3: KEDA's `postgresql` scaler reads the DEPTH of
# the SKIP-LOCKED `jobs` queue and scales the worker Deployment to demand,
# INCLUDING scale-to-zero (minReplicaCount: 0) with a 0→1 wake governed by
# `activationTargetQueryValue`. The query targets TODAY's schema
# (`jobs.status='queued'`, `jobs.priority_class`) — no migration (DEC-5). The
# multi-worker claim columns (`claimed_by`/`claim_heartbeat`) are T4's, not read
# here.
#
# The Postgres connection is supplied out-of-band via a Secret the tier/T4
# creates (`cyto-pg-conn`, key `connection` = a libpq URL). This scaffold is
# what T4 validates real 0→N scaling against; T3 deploys the real worker into
# the Deployment this targets (worker-deployment.scaffold.yaml).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: cyto-sim-worker
spec:
  scaleTargetRef:
    name: cyto-sim-worker            # the worker Deployment (scaffold)
  pollingInterval: 5                 # seconds between queue-depth checks
  cooldownPeriod: 30
  minReplicaCount: 0                 # scale-to-zero when the queue is empty
  maxReplicaCount: 5
  triggers:
    - type: postgresql
      metadata:
        # Depth of the queued backlog. `priority_class` may be appended to scale
        # a per-class worker pool: "... AND priority_class = 'batch'".
        query: "SELECT count(*)::int FROM jobs WHERE status = 'queued'"
        targetQueryValue: "1"        # ~1 queued job per replica
        activationTargetQueryValue: "0"  # >0 queued wakes the pool from zero
      authenticationRef:
        name: cyto-sim-pg-auth
---
# TriggerAuthentication → the libpq connection string lives in a Secret, never
# inline in the manifest (no credential baked into a committed manifest).
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: cyto-sim-pg-auth
spec:
  secretTargetRef:
    - parameter: connection
      name: cyto-pg-conn
      key: connection
