# Worker boot config — mounted into the worker pod as a file (deploy-hardening gap #2).
#
# The `cytoanalyst worker` binary loads ONE YAML via the `CONFIG_FILE` env var
# (ServerConfig::load — the SDK discovers `$CONFIG_FILE`, then config/dev.yaml). It does
# NOT read a `DATABASE_URL`/`AWS_*` env for the Postgres + jwt + at-rest-secret key, so the
# scaffold's env alone left the worker exiting "no config file found". This file supplies them.
#
# It is shipped as a **Secret**, not a ConfigMap: it necessarily carries the PG password +
# jwt.secret + secrets.storage_key, so it belongs in a Secret (mounting a config file from a
# Secret is the standard k8s idiom when the file holds credentials). The worker-deployment
# scaffold mounts this Secret's `config.yaml` key (under `stringData`) at
# /etc/cytoanalyst/config.yaml and sets
# CONFIG_FILE to it. Fill in the CHANGE_ME values ONCE; the worker then boots with no hand-editing.
#
# Apply:  kubectl apply -f worker-config.example.yaml   (after editing the CHANGE_ME values)
apiVersion: v1
kind: Secret
metadata:
  name: cyto-worker-config
  labels: { app: cyto-sim-worker }
type: Opaque
stringData:
  # The whole file the worker's CONFIG_FILE points at. External Postgres (the SAME cluster the
  # API pod uses) — `use_embedded:false` so the worker connects out, never spawns an embedded PG.
  config.yaml: |
    postgresql:
      use_embedded: false
      external:
        host: "CHANGE_ME_pg_host"          # e.g. the in-cluster Postgres Service DNS name
        port: 5432
        username: "CHANGE_ME_pg_user"
        password: "CHANGE_ME_pg_password"
        database: "cytoanalyst"
      pool:
        max_connections: 10
        min_connections: 1
        acquire_timeout_secs: 5
        idle_timeout_secs: 30
        max_lifetime_secs: 300
    server:
      # The worker runs no public router, but ServerConfig requires the block; bind loopback.
      host: "127.0.0.1"
      port: 3100
      api_prefix: "/api"
    logging:
      level: "info"
      format: "json"
    jwt:
      # A deployment secret — generate with `openssl rand -base64 48`. Must match the API pod's.
      secret: "CHANGE_ME_run_openssl_rand_base64_48_min_32_chars"
      issuer: "cytoanalyst"
      audience: "cytoanalyst-api"
      access_token_expiry_hours: 24
      refresh_token_expiry_days: 30
    secrets:
      # At-rest encryption key for admin-configured credentials (incl. the object-store creds
      # set via the #63 infra_object_store admin API). Required to store the object-store
      # secret via the DB path; keep it STABLE (rotating it makes stored secrets undecryptable).
      # `openssl rand -base64 48`. May instead be supplied via the CYTO_SECRET_STORAGE_KEY env.
      storage_key: "CHANGE_ME_run_openssl_rand_base64_48_min_32_chars"
