# Worker Deployment — CytoAnalyst compute worker (epic T3 / ITEM-7 / PROV-T3-4).
#
# FILLED by T3 + deploy-hardening: the real `cytoanalyst worker` container (built by
# worker.Dockerfile, loaded via `just cloud-sim-load-image`) running the claim loop. It reads:
#   • its Postgres + jwt + at-rest-secret config from a mounted YAML the CONFIG_FILE env points
#     at (the `cyto-worker-config` Secret, worker-config.example.yaml) — deploy-hardening gap #2;
#   • object-store selection + static creds from env (a Secret) — release-safe;
#   • a CUSTOM S3 endpoint (floci / private store) from the DB infra_object_store row (#63,
#     release-safe), configured via the admin API — NOT the debug S3_ENDPOINT env — gap #3;
#   • its sandbox env-rootfs squashfs from a shared volume an initContainer populates — gap #5.
#
# This is the deployable unit T4 scales 0→N via the KEDA queue-depth ScaledObject
# (keda-scaledobject.yaml targets `cyto-sim-worker`) and hardens with the reaper/heartbeat.
# minReplicaCount:0 lives on the ScaledObject, so this Deployment starts at 0 replicas
# (KEDA owns the replica count).
#
# What a deployment MUST supply (there is no hidden config beyond these — the CONFIG/wiring is
# fixed):
#   1. the two Secrets (fill the CHANGE_ME values):
#        kubectl apply -f worker-config.example.yaml        # the CONFIG_FILE Secret
#        kubectl create secret generic cyto-worker-env ...  # object-store env (see README)
#   2. the WORKER image tag (REPLACE_WITH_WORKER_IMAGE) — done automatically by
#      `just cloud-sim-load-image`/the tier's sed, no manual edit;
#   3. the env-rootfs DELIVERY — pick ONE: replace the `fetch-env-rootfs` initContainer's
#      REPLACE_WITH_ROOTFS_FETCHER_IMAGE + fetch body with your real pull, OR bake the squashfs
#      into the worker image (README gap #6) and DELETE the initContainer + the `env-rootfs`
#      volume + its worker volumeMount. The shipped initContainer is a deliberately-failing
#      placeholder (it exits 1 until it delivers the file), so the pod stays in Init until (3)
#      is chosen — that is the one required decision, called out here and in README gap #6.
#   Then:  kubectl apply -f worker-deployment.scaffold.yaml
#
# NETWORKING (gap #5 note): a pod reaching an object store / DB that runs on the HOST must use
# the CNI bridge IP (e.g. the cluster node/bridge address), NEVER 127.0.0.1 — loopback inside a
# pod is the pod itself. See the README "pod→S3 networking" note.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyto-sim-worker
  labels: { app: cyto-sim-worker }
spec:
  replicas: 0                        # KEDA drives this (scale-to-zero baseline)
  selector:
    matchLabels: { app: cyto-sim-worker }
  template:
    metadata:
      labels: { app: cyto-sim-worker }
    spec:
      restartPolicy: Always
      volumes:
        # The mounted worker config (Postgres + jwt + secrets) — CONFIG_FILE points into this.
        - name: worker-config
          secret:
            secretName: cyto-worker-config
        # The sandbox env-rootfs squashfs, shared between the initContainer (writer) and the
        # worker (reader). emptyDir here (re-populated per pod); use a PVC for a shared cache.
        - name: env-rootfs
          emptyDir: {}
      # ── env-rootfs delivery (gap #5) ────────────────────────────────────────────────────
      # The image ships no oras/cosign and GHCR is private, so the rootfs squashfs cannot be
      # pulled by the worker itself. This initContainer delivers it into the shared `env-rootfs`
      # volume BEFORE the worker starts, writing exactly the file the worker's
      # CYTO_ENV_ROOTFS_SQUASHFS path expects. Point `image` at a tool image that can fetch your
      # rootfs (an oras/cosign image with the read:packages token from the Secret, an internal
      # mirror, or a curl from a private URL). The placeholder command documents the contract; a
      # deployment MUST replace it with the real fetch. (Alternative: bake the squashfs into the
      # worker image — see worker.Dockerfile + README — then this initContainer can be removed.)
      initContainers:
        - name: fetch-env-rootfs
          image: REPLACE_WITH_ROOTFS_FETCHER_IMAGE   # e.g. an oras CLI image
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # Deliver the canonical rootfs squashfs into the shared volume. Replace the body
              # with your real pull, e.g.:
              #   oras pull "$ROOTFS_OCI_REF" -o /env-rootfs
              # (with ORAS_REGISTRY creds from the cyto-worker-env Secret), leaving the file at:
              test -f /env-rootfs/rootfs.squashfs || {
                echo "initContainer must deliver /env-rootfs/rootfs.squashfs (see README gap #5)"; exit 1; }
          env:
            - name: ROOTFS_OCI_REF
              valueFrom: { secretKeyRef: { name: cyto-worker-env, key: ROOTFS_OCI_REF, optional: true } }
          volumeMounts:
            - name: env-rootfs
              mountPath: /env-rootfs
      containers:
        - name: worker
          # Replaced with the loaded local image tag by the tier (sed placeholder kept so a
          # driver-abstracted `cloud-sim-load-image <img>` can wire an arbitrary tag).
          image: REPLACE_WITH_WORKER_IMAGE
          imagePullPolicy: IfNotPresent   # find the locally-loaded image, no registry
          command: ["cytoanalyst", "worker"]
          # ── securityContext (gap #4) ─────────────────────────────────────────────────────
          # squashfuse (the env-rootfs mount) needs /dev/fuse. CELL-1 proved privileged:true
          # works — the simple, documented path. bwrap's UNPRIVILEGED user namespaces need NO
          # privilege; only fuse does. For least-privilege prod, drop privileged and instead
          # expose /dev/fuse via a fuse-device-plugin (request `github.com/fuse: 1` under
          # resources) — see the README "securityContext" section.
          securityContext:
            privileged: true
          env:
            # The mounted config file the worker reads its PG + jwt + secrets from (gap #2).
            - name: CONFIG_FILE
              value: "/etc/cytoanalyst/config.yaml"
            # T2 backend selection (PROV-T2-3): build the S3 ObjectStore in-pod.
            - name: CYTO_WORKSTORE_BACKEND
              value: "s3"
            - name: CYTO_WORKSTORE_S3_BUCKET
              valueFrom: { secretKeyRef: { name: cyto-worker-env, key: CYTO_WORKSTORE_S3_BUCKET } }
            # Static S3 creds (release-safe: read ungated by S3ConnConfig::from_env). A CUSTOM
            # endpoint is NOT set here for a release worker — configure it via the DB
            # infra_object_store row (#63, admin API). S3_ENDPOINT env is a DEBUG-only seam.
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: cyto-worker-env, key: AWS_ACCESS_KEY_ID } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: cyto-worker-env, key: AWS_SECRET_ACCESS_KEY } }
            - name: AWS_REGION
              valueFrom: { secretKeyRef: { name: cyto-worker-env, key: AWS_REGION } }
            # env-rootfs (gap #5): the worker reads the squashfs the initContainer delivered.
            # These mirror the image ENV defaults; set explicitly for clarity + overridability.
            - name: CYTO_ENV_ROOTFS_SQUASHFS
              value: "/var/lib/cytoanalyst/env-rootfs/rootfs.squashfs"
            - name: CYTO_SANDBOX_ENV_ID
              valueFrom: { secretKeyRef: { name: cyto-worker-env, key: CYTO_SANDBOX_ENV_ID, optional: true } }
            # A worker ALWAYS runs the scheduler loop (G2), independent of this flag; set
            # explicitly for clarity/parity with the enqueue-only API pod (which sets it off).
            - name: CYTO_SCHEDULER_ENABLED
              value: "1"
          volumeMounts:
            - name: worker-config
              mountPath: /etc/cytoanalyst
              readOnly: true
            - name: env-rootfs
              mountPath: /var/lib/cytoanalyst/env-rootfs
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
