[package]
name = "cytoanalyst-desktop"
version = "0.0.0"
edition.workspace = true

[lib]
name = "cytoanalyst_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "cytoanalyst-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
# The CytoAnalyst server, embedded via its reusable `boot_in_background`.
cytoanalyst = { path = "../../server" }
# The reusable SDK desktop shell (window + boot→window + single-user).
# `default-features = false` + `sqlite-backend`: the harness's driver variant is
# selected by THIS edge (DEC-1) — the downloader (`embedded-pg`) is not linked
# by the desktop build (TEST-1(a), DRIFT-1 ITEM-24).
ziee-desktop-harness = { path = "../../../sdk/desktop/harness", default-features = false, features = ["sqlite-backend"] }
ziee-core = { path = "../../../sdk/crates/ziee-core", default-features = false, features = ["sqlite-backend"] }
# `module` implies `routes`; `sqlite-backend` selects the cfg-gated sqlite
# query sets + the sqlite `migrations/` chain (ITEM-14/ITEM-26).
ziee-auth = { path = "../../../sdk/crates/ziee-auth", default-features = false, features = ["module", "sqlite-backend"] }

# Versions match the harness so the single Cargo.lock unifies onto one Tauri.
tauri = { version = "2.8", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0.219", features = ["derive"] }
# The Tauri config codegen emits `::serde_json` literals for the app's
# `plugins` map (tauri-utils' `PluginConfig` ToTokens) and the literal must
# resolve in THIS crate — the config's non-empty `plugins.updater` block
# activates that codegen path. serde_json is already in the lockfile as a
# transitive Tauri dependency; this is only the direct edge.
serde_json = "1.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "sqlite", "uuid"] }
uuid = { version = "1.18", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# TEST-31 (sqlite-store ITEM-24): the desktop `ensure_owner` test provisions
# an ISOLATED SQLITE FILE (the node's store — the baseline test's cluster DB is
# gone) and applies the merged migrations at runtime, so it needs sqlx's
# `sqlite` + `migrate` features (the runtime dep omits `migrate`).
sqlx = { version = "0.8.6", features = [
    "runtime-tokio-rustls",
    "postgres",
    "sqlite",
    "uuid",
    "migrate",
] }
