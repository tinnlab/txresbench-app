# CytoAnalyst Rust workspace (app #2 on the ziee SDK).
#
# The SDK is a nested workspace at `sdk/` (its own `[workspace]` root acts as a
# boundary); we reference its crates as path-deps from `src-app/server`, and
# `exclude = ["sdk"]` makes the boundary explicit so cargo never tries to claim
# the SDK crates as members of THIS workspace.
[workspace]
resolver = "2"
members = ["src-app/server", "src-app/desktop/tauri"]
exclude = ["sdk"]

[workspace.package]
edition = "2021"

# Shared dependency pins for THIS (repo-root) workspace.
#
# It held `arrow`/`arrow-ipc` for the universal-tiledb-serving Arrow wire. artifact-model
# ITEM-12 deleted the Selection→Arrow serve core and ITEM-13 the TileDB `ArraySource`, so
# nothing links a format-parsing crate any more — the table is empty rather than carrying
# an unused pin, because a pin left behind is an invitation to re-add the dependency.
# `scripts/check-no-format-crates.sh` (ITEM-20) asserts the resolved graph stays free of
# the whole family set; that guard, not this comment, is the enforcement.
#
# `object_store` (Arrow) is the S3/GCS/Azure object-store client (epic compute-storage,
# T2 / DEC-1). It is NOT a format-parsing crate (it moves opaque bytes; it never parses
# array/tabular formats), so it is outside `check-no-format-crates.sh`'s family set. It is
# pulled ONLY by the `saas` feature of `cytoanalyst` (server), so the desktop/default build
# never links it (INV-4). Features `aws` + `gcp` = native S3 + native GCS (DEC-7: no Azure).
#
# `kube` + `k8s-openapi` (epic compute-storage, T3 / DEC-5) are the Kubernetes client the
# `saas`-gated `ComputeBackend::Kubernetes` (job-per-run fallback) uses to mint + watch a
# k8s Job. Like `object_store`, they are pulled ONLY by the `saas` feature of `cytoanalyst`
# (server), so the desktop/default build links neither (INV-3). Not format-parsing crates
# (they speak the k8s API), so outside `check-no-format-crates.sh`'s family set. The two
# versions are a matched pair (kube 0.96 ⇄ k8s-openapi 0.23); bump them together.
[workspace.dependencies]
object_store = { version = "0.13.2", features = ["aws", "gcp"] }
kube = { version = "0.96.0", default-features = false, features = ["client", "runtime", "openssl-tls"] }
k8s-openapi = { version = "0.23.0", features = ["latest"] }
