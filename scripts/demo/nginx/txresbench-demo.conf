# txresbench-demo.conf — sample reverse-proxy snippet for the TxResBench demo.
#
# NOT CONFIGURED: the TLS certificate and the server_names are placeholders
# — this is the SAMPLE the deployment copies and edits. The proxy terminates
# TLS; the demo server binds 127.0.0.1 and never sees plaintext on the wire.
#
# The X-Forwarded-* headers are what the demo server's
# server.trust_forwarded_headers: true consumes (run-demo.sh writes it into
# the generated config): without them the server sees the proxy's peer IP for
# the rate limits and cannot tell a request arrived over TLS. Send all three
# (Host, Proto, For) — HSTS belongs at or above this layer, not here.
#
# The two proxy directives that matter for the app:
#   proxy_buffering off — GET /api/txr/runs/{id}/stream is a server-sent-
#     events stream; buffering would deliver it in one chunk at the end.
#   proxy_read_timeout  — long-lived streams + the replay's slow logs; the
#     demo replays in seconds, but a paused tab still holds the stream open.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name demo.example.com;          # edit me

    # TLS: the deployment's own certificate (certbot/Let's Encrypt or the
    # org CA). Certificates are never configured by this repo.
    ssl_certificate     /etc/letsencrypt/live/demo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

# The plaintext side: redirect everything to HTTPS (the demo is a public
# web service; the only private data is the single shared workspace).
server {
    listen 80;
    listen [::]:80;
    server_name demo.example.com;          # edit me
    return 301 https://$host$request_uri;
}
