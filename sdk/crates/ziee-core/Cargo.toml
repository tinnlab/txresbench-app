[package]
name = "ziee-core"
version = "0.0.0"
edition.workspace = true

[dependencies]
# Versions match the ziee server crate's [workspace.dependencies] catalog
# (src-app/Cargo.toml) so the single src-app/Cargo.lock unifies them without a
# duplicate build when ziee consumes ziee-core by path.
axum = { version = "0.8.4" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
uuid = { version = "1.18", features = ["serde", "v4"] }
# sqlx is a TYPES-only dependency here (the `From<sqlx::Error>` conversion). No
# `query!` macros are used in ziee-core, so it stays build-DB-free (plan §7);
# BOTH driver feature sets are enabled so the crate's dual-driver surface
# (`DbPool` / `Db` in `db_pool.rs`) can name `SqlitePool` + `Sqlite` when an
# app builds the SDK with the `sqlite-backend` feature on, and `PgPool` +
# `Postgres` with the default (PG) build. Neither driver adds a `macros`
# dependency, so the build-DB-free property holds on either side.
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "sqlite"] }
tracing = "0.1"
once_cell = "1.21.3"
dirs = "6.0.0"
# YAML parser for `ServerConfig::load_from` (chunk sdk-batteries / G2). Matches
# ziee's `serde_norway` so the single src-app/Cargo.lock unifies them.
serde_norway = "0.9"

# Dual-driver selection. OFF (default) = the PG variant: `DbPool` is
# `sqlx::PgPool` and ziee's behavior is byte-identical to the pre-seam build.
# ON = the SQLite variant: `DbPool` is `sqlx::SqlitePool`. The switch is a
# COMPILE-TIME feature, never a runtime config toggle (matching the SDK's
# `set_app_name`/`get_app_data_dir` parameterization precedent — an app picks
# its driver when it declares its dependencies).
[features]
sqlite-backend = []

[dev-dependencies]
tempfile = "3.15"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
