[package]
name = "sandbox-guest-agent"
version = "0.1.0"
edition = "2021"
description = "In-VM init/agent for the macOS method VM: mounts the images, listens on vsock, runs the host-supplied bwrap argv, streams output and the run's outputs back"
publish = false

[[bin]]
name = "txresbench-sandbox-agent"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
sandbox-vm-protocol = { path = "../sandbox-vm-protocol" }
# Same seccomp policy crate the Linux host uses — the guest applies an
# identical filter. Requires libseccomp for the guest arch at build time
# (static) — see scripts/build-macos-vm-guest-root.sh.
sandbox-seccomp = { path = "../sandbox-seccomp" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "time", "sync"] }
tokio-vsock = "0.7"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3.15"
