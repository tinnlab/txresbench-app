[package]
name = "txresbench-file"
version = "0.0.0"
edition = "2024"

[features]
# `routes` (default-on) turns on the mountable file HTTP/aide surface
# (`http::file_routes` — the store-generic management/download/versions handlers)
# and its aide/axum/txresbench-framework/txresbench-auth + jsonwebtoken deps. The file STORE
# ENGINE (models, storage, repository, types, utils, permissions, seams, ingest)
# compiles with `default-features = false` — no aide/axum — so an engine-only
# consumer stays lean. The routes surface has NO `query!` macros beyond those the
# engine already carries, so this feature does not change the file-only build-DB
# story.
default = ["routes", "embedded-pg"]
routes = ["dep:aide", "dep:axum", "dep:txresbench-framework", "dep:txresbench-auth", "dep:jsonwebtoken"]
# Dual-driver selection (sqlite-store DEC-1 / DEC-21). OFF (default) = the PG
# variant: `DbPool` is `PgPool`, the query sets + `FILE_MIGRATOR` are the
# Postgres chain (`migrations-pg/` — ITEM-26 renamed the PG chain out of the
# canonical name), and txresbench's behavior is byte-identical to the pre-seam
# build. ON = the SQLite variant (`DbPool` = `SqlitePool`, cfg-gated sqlite
# query sets + the `migrations/` chain). The switch is a COMPILE-TIME feature,
# never a runtime config toggle; the app builds the SDK with it on.
#
# The `txresbench-framework` + `txresbench-auth` edges below are declared WITHOUT default
# features: their driver variants are selected by THESE passthrough features
# instead of their own defaults, so a `sqlite-backend` build links no
# `postgresql_embedded` downloader at all (DRIFT-1 ITEM-12 #3: TEST-1(a)'s lock
# prune is the query-port items' manifest work — ITEM-15 takes the file half).
embedded-pg = ["txresbench-framework/embedded-pg", "txresbench-auth/embedded-pg"]
sqlite-backend = ["txresbench-framework/sqlite-backend", "txresbench-auth/sqlite-backend"]

[dependencies]
# `txresbench-file` is the generic, domain-agnostic multi-derivative blob STORE:
# the `File`/`FileVersion` wire+insert models (+ the pure-data
# `ProcessingResult`/`ProcessingMetadata`), the `FileStorage` trait +
# `FilesystemStorage` impl + global manager, the schema-bound `FileRepository`
# (`query!` macros over `files`/`file_versions` — this crate carries a build.rs
# provisioning a file-only build DB, mirroring txresbench-auth), the download-token /
# pagination DTOs, the `extension_of` blob-key + magic-sniff + zip-bomb upload
# validators, the `files::*` permission keys (`txresbench_identity::PermissionCheck`),
# and the two injected seams (`FileProcessor` / `FileEvents`) that sever the
# app's processing engine + sync/RAG from the store. It CARRIES the base
# `files`/`file_versions` migration (`migrations/`, globbed into the app's
# merged set). NO domain reference (no workflow_run_id column, no chat/llm/
# project imports).
txresbench-core = { path = "../txresbench-core" }
txresbench-identity = { path = "../txresbench-identity" }

serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
schemars = { version = "0.9.0", features = ["chrono04", "uuid1"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "sqlite", "chrono", "uuid", "json", "macros", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.18", features = ["serde", "v4", "v5"] }
tokio = { version = "1.47.1", features = ["fs"] }
async-trait = "0.1"
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"
mime_guess = "2.0"
zip = "6.0.0"

# HTTP/aide surface (routes feature only). `default-features = false` on the
# framework + auth edges — see the feature block above: the driver variants are
# selected by THIS crate's embedded-pg / sqlite-backend passthrough features,
# never by their own defaults. `txresbench-framework` provides the resolver-generic
# permission extractors (`RequirePermissions<R,_>` +
# `with_permission`) + the `SyncOrigin` header extractor; `txresbench-auth` provides
# the concrete `User`/`Group` wire types the routes fix their resolver to (every
# file response is owner-scoped by `user.id`). Versions match txresbench-framework so
# the single aide/axum version unifies. `jsonwebtoken` signs download tokens.
txresbench-framework = { path = "../txresbench-framework", optional = true, default-features = false }
txresbench-auth = { path = "../txresbench-auth", optional = true, default-features = false }
# `axum-query` supplies `OperationInput` for `axum::extract::Query` (the file
# handlers' pagination/preview/page query params). The workspace-level aide the
# server links already enables it, so the full-build feature union is unchanged;
# it is declared here so `txresbench-file` compiles STANDALONE (sdk `cargo check
# --workspace`).
aide = { version = "0.15", features = ["axum", "axum-json", "axum-query", "macros"], optional = true }
axum = { version = "0.8.4", features = ["macros", "multipart"], optional = true }
jsonwebtoken = { version = "10.1.0", features = ["rust_crypto"], optional = true }

[dev-dependencies]
# Crate-scoped integration tests (tests/repository.rs) drive the async
# `FileRepository` against a throwaway DB, so they need a `#[tokio::test]`
# runtime. sqlx/uuid/serde_json/txresbench-core are already regular deps and thus
# available to the tests unchanged.
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
# The in-source `storage::filesystem` unit tests provision a scratch dir.
tempfile = "3.15"
# `tests/http_routes.rs` drives the mountable `file_routes` bundle in-process via
# `tower::oneshot` (mirrors txresbench-health's crate-scoped HTTP test).
tower = { version = "0.5.3", features = ["util"] }

[build-dependencies]
# Build-DB provisioning via the SDK's shared build support crate — the SAME
# driver split the app's build.rs uses (scheme-selected leg: per-worktree
# postgres cluster DB or per-worktree sqlite build FILE, key derivation +
# migration apply single-sourced, never inlined here). The base
# `files`/`file_versions` tables carry no cross-module FK, so the file subset
# provisions standalone.
txresbench-build-support = { path = "../txresbench-build-support" }
