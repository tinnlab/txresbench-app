[package]
name = "txresbench-desktop-harness"
version = "0.0.0"
edition.workspace = true

# `txresbench-desktop-harness` — the REUSABLE desktop shell for an SDK app.
#
# It depends ONLY on the SDK crates (never on `txresbench`/the app), so a second app
# (TxResBench) gets the desktop experience for free. What lives here today:
#   - the FOUR-part capability manifest keyed by deployment mode (`manifest`),
#   - the single-user auto-login strategy + owner-`*` model (`single_user`),
#   - the `ServerBoot` seam (`boot`) the app implements to hand the harness a
#     booted server's {addr, pool, jwt}.
#
# Chunk D-full: the reusable window shell (`window` module) now lives here —
# the per-OS main-window construction + the boot→window spawn skeleton, generic
# over the `ServerBoot` seam. `tauri` is therefore a dependency now (it was
# deferred through Chunk D so the earlier `cargo check --workspace` stayed
# fast). It still names ONLY the `ServerBoot` seam, never `txresbench::`.

[dependencies]
# SDK crates only — NEVER the `txresbench` app crate (reusability contract).
# The crate edges are `default-features = false` for the SAME reason as
# txresbench-auth's framework edge (sqlite-store DEC-1): the driver selection must be
# THIS manifest's passthrough features, never a dependency default, so a
# `sqlite-backend` build does not link the `postgresql_embedded` downloader at
# all (TEST-1(a), DRIFT-1 ITEM-24). The `default` feature set below reproduces
# the driver+routes set the default features of the underlying crates implied
# before this split, so txresbench's (app #1) build stays byte-identical.
txresbench-core = { path = "../../crates/txresbench-core", default-features = false }
txresbench-identity = { path = "../../crates/txresbench-identity" }
txresbench-auth = { path = "../../crates/txresbench-auth", default-features = false }

# Tauri — for the window shell (`window::create_main_window` +
# `spawn_boot_then_window`). Version matches `txresbench-desktop` so the single
# `src-app/Cargo.lock` unifies onto one tauri build when txresbench-desktop consumes
# the harness by path. The Windows and Linux windows keep their native title
# bar (`create_main_window`), so no title-bar plugin is needed.
tauri = { version = "2.8", features = ["tray-icon"] }

# Versions match the txresbench server crate + txresbench-auth so the single
# src-app/Cargo.lock unifies them (no duplicate build when txresbench consumes the
# harness by path).
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0.219", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "sqlite", "uuid"] }
uuid = { version = "1.18", features = ["v4"] }
tracing = "0.1"

# Linux/WebKitGTK: enable programmatic window.open for the portal pop-out (with_webview setting).
[target."cfg(target_os = \"linux\")".dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

# Dual-driver selection — `BootHandle.pool` + the single-user strategy hold
# `txresbench_core::DbPool`, so these features only flip which concrete type that
# alias names (and which query set txresbench-auth compiles). A sqlite-desktop app
# enables `sqlite-backend` (together with the same feature on the
# schema-bound SDK crates it builds against); the DEFAULT set keeps the
# pre-split implied features (auth `routes` + `embedded-pg`) so txresbench's build
# is byte-identical to before the passthrough split (sqlite-store ITEM-24).
[features]
default = ["routes", "embedded-pg"]
routes = ["txresbench-auth/routes"]
embedded-pg = ["txresbench-auth/embedded-pg"]
sqlite-backend = ["txresbench-core/sqlite-backend", "txresbench-auth/sqlite-backend"]
