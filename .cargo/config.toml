# CytoAnalyst Cargo build configuration.
#
# Cargo config lookup walks up from the INVOCATION dir, so this applies whether
# you run from the repo root or from src-app/server.
[env]
# The committed SQLite build-DB sentinel (sqlite-store DEC-14). It is only a
# MARKER — see `ziee_build_support::worktree_db`: the relative path is never
# opened as-is; a `sqlite:` URL equal to this sentinel makes every build script
# auto-isolate into a per-worktree file under `<worktree>/target/sqlx-build/`
# (the `cytoanalyst_build_<key>.sqlite` wipe + re-migrate per build). An
# operator override with any OTHER `sqlite:` (or `postgres:`) URL is honored
# byte-for-byte; a `postgres:` value re-selects the SDK's PG build-DB leg,
# which stays supported for ziee and for the transition window.
#
# The sqlx compile-time `query!` verification reads this value through
# `build.rs`'s `cargo:rustc-env=DATABASE_URL`, so the macros verify against
# the SQLite chain — the port's per-build check (INV-4: no SQLX_OFFLINE, no
# macro→dynamic downgrade).
DATABASE_URL = "sqlite://target/sqlx-build/cytoanalyst_build.sqlite"
